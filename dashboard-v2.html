<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱 · 满意解研究所</title>
<link rel="stylesheet" href="vi_quick_ref.css">
<style>
:root{--sr:#C23B22;--sg:#B8860B;--sb:#F5F0E6;--st:#4A4A4A;--sh:#2A2A2A;--gr:#3D7A4F}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:#F5F0E6;color:#4A4A4A;min-height:100vh}
.lo{position:fixed;top:0;left:0;width:100%;height:100%;background:#F5F0E6;z-index:9999;display:flex;align-items:center;justify-content:center}
.lo-box{background:#fff;border-radius:20px;padding:40px 28px;max-width:360px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);border:2px solid #C23B22}
.lo-box h2{font-size:18px;color:#2A2A2A;margin-bottom:4px}
.lo-box p{font-size:12px;color:#6E6E6E;margin-bottom:16px}
.lo-box input{width:42px;height:52px;border:2px solid #D4C5A0;border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:monospace;background:#F5F0E6}
.lo-d{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.lo-error{color:#C23B22;font-size:12px;min-height:18px;margin:4px 0}
.lo-btn{width:100%;padding:12px;border:none;border-radius:12px;background:#C23B22;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.lo-link{font-size:11px;margin-top:12px;opacity:0.5}
/* Toolbar */
.tb{background:#fff;border-bottom:1px solid #e0d5c8;padding:8px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.tb-search{flex:1;min-width:200px;padding:8px 12px;border:1.5px solid #D4C5A0;border-radius:10px;font-size:13px;background:#F5F0E6;outline:none}
.tb-search:focus{border-color:#C23B22}
.tb-title{font-weight:700;color:#2A2A2A;font-size:16px;white-space:nowrap}
.tb-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600}
.bg-red{background:rgba(194,59,34,0.12);color:#C23B22}
.bg-amber{background:rgba(184,134,11,0.12);color:#B8860B}
.bg-green{background:rgba(61,122,79,0.12);color:#3D7A4F}
/* Summary */
.su{max-width:1200px;margin:0 auto;padding:16px 16px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kv-i{background:#fff;border-radius:10px;padding:14px;text-align:center;border:1px solid #e0d5c8;cursor:pointer;transition:0.15s}
.kv-i:hover{border-color:#C23B22;box-shadow:0 2px 8px rgba(194,59,34,0.1)}
.kv-i .v{font-size:26px;font-weight:800;color:#C23B22}
.kv-i .vl{font-size:10px;color:#6E6E6E;margin-top:2px}
.kv-i .vs{font-size:10px;color:#B8860B;margin-top:2px}
/* Layout */
.mn{max-width:1200px;margin:0 auto;padding:0 16px 60px}
/* Tabs */
.tbs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.tb-btn{padding:7px 14px;border-radius:16px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:12px;font-weight:600;transition:0.12s}
.tb-btn:hover{border-color:#C23B22}
.tb-btn.on{background:#C23B22;color:#fff;border-color:#C23B22}
/* Panels */
.pn{background:#fff;border-radius:12px;padding:20px;margin:8px 0;border:1px solid #e0d5c8;animation:fadeIn 0.2s}
.pn-h{font-size:15px;color:#2A2A2A;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0e8d8}
.pn-sub{font-size:13px;color:#C23B22;margin:14px 0 8px}
/* Stats grid */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.sg-i{background:#F5F0E6;border-radius:8px;padding:12px;text-align:center}
.sg-i .sv{font-size:22px;font-weight:700;color:#2A2A2A}
.sg-i .sl{font-size:10px;color:#6E6E6E;margin-top:2px}
.sg-i .ss{font-size:9px;color:#B8860B}
/* Risk / Block card */
.blk{border-left:3px solid #C23B22;background:rgba(194,59,34,0.03)}
.blk-amber{border-left:3px solid #B8860B;background:rgba(184,134,11,0.03)}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:#F5F0E6;color:#2A2A2A;padding:7px 6px;text-align:left;font-size:10px;font-weight:600;border-bottom:2px solid #C23B22}
.tbl td{padding:7px 6px;border-bottom:1px solid #f0e8d8;vertical-align:middle}
.tbl tr:hover{background:rgba(194,59,34,0.03)}
.tbl tr.hi{background:rgba(194,59,34,0.06)}
/* Dots */
.dd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dr{background:#C23B22}.da{background:#B8860B}.dg{background:#3D7A4F}
/* Tags */
.tg{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin:1px 2px}
.tg-r{background:rgba(194,59,34,0.12);color:#C23B22}
.tg-a{background:rgba(184,134,11,0.12);color:#B8860B}
.tg-g{background:rgba(61,122,79,0.12);color:#3D7A4F}
/* Progress bar */
.pb{height:6px;background:#f0e8d8;border-radius:3px;overflow:hidden;margin:4px 0}
.pb-f{height:100%;background:#C23B22;border-radius:3px;transition:width 0.3s}
/* Forms */
.fr{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.fr input,.fr select{flex:1;padding:7px 10px;border:1.5px solid #D4C5A0;border-radius:8px;font-size:12px;min-width:80px;background:#fff}
.btn{padding:7px 16px;border-radius:14px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:#C23B22;color:#fff}
.btn-sm{padding:4px 10px;font-size:10px}
.btn-out{background:#fff;color:#C23B22;border:1.5px solid #C23B22}
.btn-gold{background:#B8860B}
.btn-gray{background:#999}
.empty{text-align:center;padding:40px;color:#6E6E6E;opacity:0.5;font-size:13px}
.hidden{display:none}
/* Avatar cards */
.ac{background:#fff;border-radius:10px;padding:14px 16px;margin:6px 0;border:1px solid #e0d5c8;display:flex;justify-content:space-between;align-items:flex-start}
.ac:hover{border-color:#C23B22}
.ac-l{flex:1}
.ac-r{text-align:right;min-width:48px}
.ac-name{font-weight:600;color:#2A2A2A;font-size:14px}
.ac-q{font-size:11px;color:#6E6E6E;font-style:italic;margin-top:3px}
.ac-meta{font-size:10px;color:#B8860B;margin-top:3px}
.ac-score{font-size:20px;font-weight:700;color:#C23B22}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Responsive */
@media(max-width:640px){.kv{grid-template-columns:repeat(3,1fr)}.su{padding:12px 8px 0}.mn{padding:0 8px 60px}.pn{padding:14px}.tb{flex-wrap:wrap;gap:8px}}
</style>
</head>
<body>
<h1 style="font-size:1.5em;padding:16px">dashboard-v2</h1>

<!-- Password Gate -->
<div class="lo" id="gate">
<div class="lo-box">
<div style="font-size:32px;margin-bottom:8px;">🔐</div>
<h2>驾驶舱 · 授权访问</h2>
<p>请输入6位数字密码</p>
<div class="lo-d" id="gateDigits">
<input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="g0">
<input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="g1">
<input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="g2">
<input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="g3">
<input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="g4">
<input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]" id="g5">
</div>
<div class="lo-error" id="gateError"></div>
<button class="lo-btn" onclick="gateVerify()">验证 →</button>
<div class="lo-link"><a href="javascript:void(0)" onclick="gateForgot()" style="color:#6E6E6E;">忘记密码？</a></div>
</div></div>

<!-- Toolbar -->
<div class="tb hidden" id="toolbar">
<span class="tb-title">📊 驾驶舱</span>
<input class="tb-search" id="globalSearch" placeholder="🔍 搜索任务、客户、产品、里程碑…（支持模糊匹配）" oninput="globalSearch()">
<span style="font-size:11px;color:#6E6E6E;white-space:nowrap">夏至倒计时 <b style="color:#C23B22" id="cdDays">—</b></span>
<a href="index.html" style="font-size:11px;color:#B8860B">← 首页</a>
</div>

<!-- KPI Summary -->
<div class="su hidden" id="summary">
<div class="kv" id="kpiBar"></div>
<div class="tbs" id="tabBar"></div>
<div id="mainContent"></div>
</div>

<script>
// ============ GATE ============
var GATE_HASH='6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
(function gateInit(){
  var cur=localStorage.getItem('sri_dash_hash')||GATE_HASH;
  var saved=localStorage.getItem('sri_dash_auth_hash');
  if(localStorage.getItem('sri_dashboard_auth')==='true' && saved===cur){
    document.getElementById('gate').style.display='none';
    showMain();
    return;
  }
  localStorage.removeItem('sri_dashboard_auth');
  document.getElementById('g0').focus();
  
  var fails=parseInt(localStorage.getItem('sri_gate_fails')||'0');
  var lock=parseInt(localStorage.getItem('sri_gate_lock')||'0');
  
  window.gateNext=function(el){
    el.value=el.value.replace(/[^0-9]/g,'');
    if(el.value&&el.nextElementSibling&&el.nextElementSibling.tagName==='INPUT')el.nextElementSibling.focus();
    document.getElementById('gateError').textContent='';
  };
  window.gatePrev=function(e,el){
    if(e.key==='Backspace'&&!el.value&&el.previousElementSibling&&el.previousElementSibling.tagName==='INPUT')el.previousElementSibling.focus();
  };
  window.gateVerify=async function(){
    var now=Date.now();
    if(lock>now){document.getElementById('gateError').textContent='已锁定·请等待'+Math.ceil((lock-now)/1000)+'秒';return;}
    var code='';
    for(var i=0;i<6;i++){var v=document.getElementById('g'+i).value;if(!v){document.getElementById('gateError').textContent='请输入完整6位密码';return;}code+=v;}
    var h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code)))).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(h===cur){
      localStorage.setItem('sri_gate_fails','0');
      localStorage.setItem('sri_dashboard_auth','true');
      localStorage.setItem('sri_dash_auth_hash',cur);
      document.getElementById('gate').style.display='none';
      showMain();
    } else {
      fails++;localStorage.setItem('sri_gate_fails',fails);
      if(fails>=3){localStorage.setItem('sri_gate_lock',Date.now()+300000);document.getElementById('gateError').textContent='已锁定5分钟';localStorage.setItem('sri_gate_fails','0');}
      else document.getElementById('gateError').textContent='密码错误('+fails+'/3)';
      document.querySelectorAll('#gateDigits input').forEach(function(d){d.classList.add('error');setTimeout(function(){d.value='';d.classList.remove('error')},600)});
      document.getElementById('g0').focus();
    }
  };
  window.gateForgot=function(){document.getElementById('gateError').textContent='请联系Egbertie重置密码';};
  
  document.addEventListener('input',function(e){if(e.target.closest('#gateDigits'))window.gateNext(e.target)});
  document.addEventListener('keydown',function(e){if(e.target.closest('#gateDigits'))window.gatePrev(e,e.target)});
  document.addEventListener('paste',function(e){
    if(document.getElementById('gate').style.display==='none')return;
    var p=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'');
    if(p.length===6){e.preventDefault();for(var i=0;i<6;i++)document.getElementById('g'+i).value=p[i];window.gateVerify();}
  });
})();

// ============ DATA ENGINE ============
var DB={
  _api:'http://localhost:8765/api',
  async _fetch(url,opt){
    try{var r=await fetch(this._api+url,opt||{});return await r.json()}catch(e){return null}
  },
  get(k){try{return JSON.parse(localStorage.getItem('sri_db_'+k))||[]}catch(e){return[]}},
  set(k,v){localStorage.setItem('sri_db_'+k,JSON.stringify(v))},
  async tasks(){var d=await this._fetch('/tasks');return Array.isArray(d)&&d.length?d:this.get('tasks')},
  async customers(){var d=await this._fetch('/customers');return Array.isArray(d)&&d.length?d:this.get('customers')},
  async passwords(){var d=await this._fetch('/passwords');return Array.isArray(d)&&d.length?d:this.get('passwords')},
  quality(){return this.get('quality')},
  products(){return this.get('products')},
  growth(){return this.get('growth')},
  async stats(){
    try{var d=await this._fetch('/stats');if(d)return{tasks:d.tasks||0,customers:d.customers||0,passwords:d.passwords||0,quality:this.quality().length,products:this.products().length,usage:d.usage_today||0}}
    catch(e){}
    return{tasks:this.get('tasks').length,customers:this.get('customers').length,passwords:this.get('passwords').length,quality:this.quality().length,products:this.products().length,usage:0}
  },
  seed(){
    if(this.get('passwords').length===0)this.set('passwords',[{id:1,code:'123654',products:'all',customer:'内测',max_uses:9999,used:0,status:'启用',created:new Date().toISOString()}]);
    if(this.get('quality').length===0){
      this.set('quality',[
        {qm_id:'QM-001',standard:'L0 提案审核',status:'待执行',assignee:'满意解研究所',deadline:'2026-06-07',priority:'P0'},
        {qm_id:'QM-002',standard:'L1 方法论审核',status:'55%通过率',assignee:'满意解研究所(cron)',deadline:'2026-06-07',priority:'P0'},
        {qm_id:'QM-003',standard:'L2 内容审核',status:'105个缺来源',assignee:'满意解研究所',deadline:'2026-06-14',priority:'P1'},
        {qm_id:'QM-009',standard:'四关通过率≥80%',status:'96%(已达标)',assignee:'满意解研究所(cron)',deadline:'2026-07-01',priority:'P0'},
        {qm_id:'QM-026',standard:'商标注册',status:'未申请',assignee:'Egbertie',deadline:'2026-07-31',priority:'P0'}
      ]);
    }
    if(!localStorage.getItem('sri_db_seeded')){
      this.set('growth',[
        {metric:'飞轮循环',current:0,target:100,trend:'↑'},
        {metric:'线上产品总数',current:233,target:250,trend:'→'},
        {metric:'活跃客户(30d)',current:0,target:10,trend:'—'},
        {metric:'NPS基线',current:'—',target:'≥50',trend:'—'},
        {metric:'公众号粉丝',current:0,target:500,trend:'—'},
        {metric:'公开课报名',current:0,target:10,trend:'—'}
      ]);
      localStorage.setItem('sri_db_seeded','true');
    }
  }
};

// ============ APP STATE ============
var state={tab:'overview',search:'',data:{tasks:[],customers:[],passwords:[],quality:[],products:[],growth:[]}};

var TABS=[
  {id:'overview',label:'🏠 概览',desc:'整体状态一览'},
  {id:'tasks',label:'📋 任务',desc:'任务驾驶舱·里程碑·卡点'},
  {id:'project',label:'🗓️ 项目',desc:'里程碑·风险·时间线'},
  {id:'customers',label:'👤 客户',desc:'客户档案库'},
  {id:'products',label:'📦 产品',desc:'产品库与族谱'},
  {id:'quality',label:'✅ 质量',desc:'QM质量标准'},
  {id:'finance',label:'💰 财务',desc:'成本·收入·定价'},
  {id:'growth',label:'📈 增长',desc:'增长飞轮·资产'},
  {id:'marketing',label:'📢 宣发',desc:'营销日历·KPI'},
  {id:'system',label:'⚡ 系统',desc:'Cron·脚本·服务'},
  {id:'avatars',label:'🎭 替身',desc:'23替身·贡献追踪'},
  {id:'glossary',label:'📖 术语',desc:'命名规范'},
  {id:'import',label:'📥 数据',desc:'导入导出'}
];

function showMain(){
  document.getElementById('toolbar').classList.remove('hidden');
  document.getElementById('summary').classList.remove('hidden');
  initApp();
}

async function initApp(){
  DB.seed();
  var s=null;
  try{
    s=await DB._fetch('/stats');
    if(s){
      var t=await DB._fetch('/tasks');if(Array.isArray(t)&&t.length)DB.set('tasks',t.slice(0,500));
      var c=await DB._fetch('/customers');if(Array.isArray(c)&&c.length)DB.set('customers',c.slice(0,500));
      var p=await DB._fetch('/passwords');if(Array.isArray(p)&&p.length)DB.set('passwords',p.slice(0,200));
    }
  }catch(e){}
  // Load all data
  state.data.tasks=(await DB.tasks())||[];
  state.data.customers=(await DB.customers())||[];
  state.data.passwords=(await DB.passwords())||[];
  state.data.quality=DB.quality()||[];
  state.data.products=DB.products()||[];
  state.data.growth=DB.growth()||[];
  renderTabs();
  renderKPIs();
  renderContent();
  updateCountdown();
}

function renderTabs(){
  var h='';
  TABS.forEach(function(t){
    h+='<button class="tb-btn'+(state.tab===t.id?' on':'')+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</button>';
  });
  document.getElementById('tabBar').innerHTML=h;
}

function switchTab(id){
  state.tab=id;state.search='';
  document.getElementById('globalSearch').value='';
  renderTabs();renderContent();
}

function renderKPIs(){
  var s=state.data;
  var tasks=s.tasks||[];
  var done=tasks.filter(function(t){return t.status==='完成'}).length;
  var inProgress=tasks.filter(function(t){return t.status==='进行中'}).length;
  var p0=tasks.filter(function(t){return t.priority==='P0'&&t.status!=='完成'}).length;
  var h='';
  h+='<div class="kv-i" onclick="switchTab(\'tasks\')"><div class="v">'+tasks.length+'</div><div class="vl">📋 任务</div><div class="vs">✅'+done+' 🔄'+inProgress+'</div></div>';
  h+='<div class="kv-i" onclick="switchTab(\'tasks\')"><div class="v" style="color:'+(p0>0?'#C23B22':'#3D7A4F')+'">'+p0+'</div><div class="vl">🔴 P0待办</div><div class="vs">阻塞项</div></div>';
  h+='<div class="kv-i" onclick="switchTab(\'customers\')"><div class="v">'+(s.customers||[]).length+'</div><div class="vl">👤 客户</div></div>';
  h+='<div class="kv-i" onclick="switchTab(\'products\')"><div class="v">'+(s.products||[]).length+'</div><div class="vl">📦 产品</div></div>';
  h+='<div class="kv-i" onclick="switchTab(\'quality\')"><div class="v">'+(s.quality||[]).length+'</div><div class="vl">✅ 质量项</div></div>';
  h+='<div class="kv-i"><div class="v">233</div><div class="vl">🌐 线上产品</div><div class="vs">200 OK</div></div>';
  h+='<div class="kv-i"><div class="v">23</div><div class="vl">🎭 替身</div><div class="vs">5层激活</div></div>';
  h+='<div class="kv-i" onclick="switchTab(\'passwords\')"><div class="v">'+(s.passwords||[]).length+'</div><div class="vl">🔐 密码</div></div>';
  document.getElementById('kpiBar').innerHTML=h;
}

function updateCountdown(){
  var solstice=new Date(2026,5,21);
  var days=Math.ceil((solstice-new Date())/86400000);
  document.getElementById('cdDays')&&(document.getElementById('cdDays').textContent=days+'天');
}

// ============ GLOBAL SEARCH ============
function globalSearch(){
  state.search=document.getElementById('globalSearch').value.trim().toLowerCase();
  renderContent();
}

function filter(list,fields,q){
  if(!q)return list;
  return (list||[]).filter(function(item){
    return fields.some(function(f){
      var v=item[f];
      return v&&String(v).toLowerCase().indexOf(q)>=0;
    });
  });
}

// ============ RENDER ============
function renderContent(){
  updateCountdown();
  var q=state.search;
  var h='';
  var s=state.data;
  
  if(q){
    // Global search mode
    h+='<div class="pn"><div class="pn-h">🔍 搜索结果: "'+q+'"</div>';
    var results=[];
    
    filter(s.tasks,['task','priority','status','assignee','deadline'],q).forEach(function(t){
      results.push({type:'📋 任务',text:t.task+' ['+t.priority+'] '+t.status,tab:'tasks'});
    });
    filter(s.customers,['name','company','email','role'],q).forEach(function(c){
      results.push({type:'👤 客户',text:c.name+' · '+c.company,tab:'customers'});
    });
    filter(s.products,['name','family'],q).forEach(function(p){
      results.push({type:'📦 产品',text:p.name+' · '+p.family,tab:'products'});
    });
    filter(s.quality,['standard','status','assignee','qm_id'],q).forEach(function(qm){
      results.push({type:'✅ 质量',text:qm.qm_id+' '+qm.standard+' '+qm.status,tab:'quality'});
    });
    filter(s.passwords,['code','customer','products'],q).forEach(function(p){
      results.push({type:'🔐 密码',text:p.code+' · '+p.customer+' · '+p.products,tab:'passwords'});
    });
    
    // Also search hardcoded data
    MILESTONES.forEach(function(m,i){
      if(m.name.indexOf(q)>=0||m.deliverable.indexOf(q)>=0||m.status.indexOf(q)>=0)
        results.push({type:'🎯 里程碑',text:m.name+' '+m.status+' · '+m.deadline,tab:'overview'});
    });
    RISKS.forEach(function(r,i){
      if(r.risk.indexOf(q)>=0||r.mitigation.indexOf(q)>=0)
        results.push({type:'⚠️ 风险',text:r.risk+' ['+r.level+']',tab:'project'});
    });
    
    if(results.length===0)h+='<div class="empty">未找到匹配结果·换个关键词试试</div>';
    else{
      results.forEach(function(r){
        h+='<div style="padding:8px 12px;border-bottom:1px solid #f0e8d8;cursor:pointer;display:flex;gap:8px;align-items:center" onclick="switchTab(\''+r.tab+'\')"><span style="font-size:11px;opacity:0.5;white-space:nowrap">'+r.type+'</span><span style="font-size:12px">'+r.text+'</span><span style="font-size:10px;color:#B8860B;margin-left:auto">点击查看 →</span></div>';
      });
    }
    h+='</div>';
  } else {
    // Normal tab rendering
    switch(state.tab){
      case 'overview':h=renderOverview(s);break;
      case 'tasks':h=renderTasks(s);break;
      case 'project':h=renderProject();break;
      case 'customers':h=renderCustomers(s);break;
      case 'products':h=renderProducts(s);break;
      case 'quality':h=renderQuality(s);break;
      case 'finance':h=renderFinance();break;
      case 'growth':h=renderGrowth(s);break;
      case 'marketing':h=renderMarketing();break;
      case 'system':h=renderSystem();break;
      case 'avatars':h=renderAvatars();break;
      case 'glossary':h=renderGlossary();break;
      case 'passwords':h=renderPasswords(s);break;
      case 'import':h=renderImport();break;
    }
  }
  document.getElementById('mainContent').innerHTML=h;
}
