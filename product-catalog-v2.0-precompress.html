table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:11px}

td{padding:6px 4px;border-bottom:1px solid #f0e8d8;font-size:10px}

.badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px}
.badge-green{background:rgba(74,140,92,.12);color:#4A8C5C}
.badge-red{background:rgba(194,59,34,.12);color:var(--sri-red)}
.badge-gold{background:rgba(184,134,11,.12);color:var(--sri-gold)}
.badge-gray{background:rgba(0,0,0,.05);color:#999}

.search{width:100%;padding:8px 12px;border:1.5px solid #D4C5A0;border-radius:10px;margin-bottom:12px;font-size:13px}
.footer{text-align:center;padding:20px;font-size:10px;opacity:.4}
.loading{text-align:center;padding:40px;color:var(--sri-red)}

    var statusBadge = p.status === '精品' ? '<span class="badge badge-red">⭐ 精品</span>' : '<span class="badge badge-green">🟢 线上</span>';
    var matBadge = p.maturity === 'M3_成熟' ? '<span class="badge badge-gold">M3 成熟</span>' : '<span class="badge badge-green">M2 成型</span>';
    var qColor = (p.quality_score || 0) >= 90 ? 'color:var(--green);font-weight:700' : ((p.quality_score || 0) >= 80 ? 'color:var(--sri-gold)' : '');
    var url = p.url || '';
    var linkHtml = '';
    if (url) {
      var filename = url.split('/').pop();
      linkHtml = '<a href="https://egbertie.github.io/satisficing-lab/' + filename + '" target="_blank">→</a>';
    }
    html += '<tr>' +
      '<td>' + (p.id || '') + '</td>' +
      '<td><b>' + (p.name || '') + '</b></td>' +
      '<td>' + (p.family || '') + '</td>' +
      '<td>' + statusBadge + '</td>' +
      '<td>' + matBadge + '</td>' +
      '<td style="' + qColor + '">' + (p.quality_score || '') + '</td>' +
      '<td>' + (p.target_user || '') + '</td>' +
      '<td>' + tags + '</td>' +
      '<td>' + linkHtml + '</td>' +
      '</tr>';
  });
  
  document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="9" style="text-align:center;padding:20px">无匹配产品</td></tr>';
  document.getElementById('tableCount').innerHTML = '显示 ' + filtered.length + ' / ' + allProducts.length + ' 件产品';
}

init();
</script>
</body>
</html>
