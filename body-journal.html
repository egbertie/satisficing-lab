<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>身体日记 · 决策前的身体在说什么</title>
<meta name="description" content="不只是记录数据——是让身体信号和决策之间，浮现出你自己都未曾注意的模式。满意解研究所出品。">
<style>
:root{--red:#C23B22;--gold:#B8860B;--bg:#FAF7F2;--white:#fff;--text:#2D2D2D;--text2:#5C5C5C;--border:#E8E0D5;--green:#3D7A4F}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.v5-badge{background:linear-gradient(135deg,var(--gold),var(--red));color:#fff;padding:8px 18px;text-align:center;font-size:10px;letter-spacing:.5px}

.main{max-width:440px;margin:0 auto;padding:24px 16px 60px}

/* 叙事卡 */
.story-card{background:var(--white);border-radius:14px;padding:24px 20px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.03)}
.story-card .sc-date{font-size:11px;color:var(--gold);margin-bottom:8px;font-weight:600}
.story-card .sc-decision{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text);cursor:pointer}
.story-card .sc-decision:hover{color:var(--red)}
.story-card .sc-body{font-size:13px;color:var(--text2);line-height:1.8;display:none}
.story-card .sc-body.open{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.story-card .sc-body .signal-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin:2px 4px 2px 0}
.tag-tense{background:rgba(194,59,34,.08);color:var(--red)}
.tag-calm{background:rgba(112,160,96,.08);color:var(--green)}
.tag-neutral{background:rgba(184,134,11,.08);color:var(--gold)}

/* 书写卡 */
.write-card{background:var(--white);border-radius:14px;padding:20px;border:2px solid var(--gold);box-shadow:0 4px 16px rgba(184,134,11,.06);margin-bottom:16px}
.write-card h3{font-size:15px;margin-bottom:8px;color:var(--text)}
.write-card .w-prompt{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6}

.write-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:var(--white);color:var(--text);resize:none;transition:border-color .3s}
.write-input:focus{outline:none;border-color:var(--gold)}
.write-input::placeholder{color:#CCC}

.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag-chip{padding:6px 12px;border-radius:14px;font-size:11px;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text2);transition:all .2s}
.tag-chip.selected{border-color:var(--red);background:rgba(194,59,34,.04);color:var(--red);font-weight:600}

.btn{display:inline-block;padding:12px 24px;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s;margin:4px}
.btn-primary{background:var(--red);color:#fff;width:100%;text-align:center;margin-top:12px}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1.5px solid var(--red);color:var(--red)}
.btn-outline:hover{background:rgba(194,59,34,.04)}

.empty{text-align:center;padding:32px 16px;color:var(--text2);font-size:13px;line-height:1.8}
.empty .e-icon{font-size:36px;margin-bottom:8px}

/* 模式浮现 */
.pattern-card{background:var(--bg);border-radius:12px;padding:14px 18px;margin:16px 0;border:1px dashed var(--border);text-align:center;display:none}
.pattern-card.active{display:block}
.pattern-card .p-title{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:6px}
.pattern-card .p-insight{font-size:13px;color:var(--text);line-height:1.8}

.footer{text-align:center;padding:20px;font-size:11px;color:var(--text2);max-width:440px;margin:0 auto}
.footer a{color:var(--red);text-decoration:none}
</style>
<script src="sri-track.js"></script>
<script src="sri-api.js"></script>
</head>
<body>

<div class="v5-badge">⭐ 优质 · 水L5💧火L4🔥 · v5.0统一框架 · 身体-决策叙事</div>

<div class="main">

  <!-- 书写卡 -->
  <div class="write-card">
    <h3>📝 记一次决策前后的身体感受</h3>
    <div class="w-prompt">
      不是记录"做了什么决定"。<br>
      是记录：<strong style="color:var(--red)">"当我想到要____的时候，我的身体感到____。"</strong>
    </div>
    <input type="text" class="write-input" id="decisionName" placeholder="那个决定是……" maxlength="80" style="min-height:40px;margin-bottom:8px" oninput="checkWrite()">
    <textarea class="write-input" id="bodyFeel" placeholder="当我想到它的时候，我的身体感到……&#10;（用心说出来——不用专业术语）" maxlength="200" style="min-height:64px" oninput="checkWrite()"></textarea>
    <div class="tag-row" id="tagRow">
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="紧张">紧张</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="放松">放松</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="沉重">沉重</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="轻盈">轻盈</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="胃里有东西">胃里有东西</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="心跳变了">心跳变了</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="手心有反应">手心有反应</span>
      <span class="tag-chip" onclick="toggleTag(this)" data-tag="说不清">说不清</span>
    </div>
    <button class="btn btn-primary" id="btnSave" disabled onclick="saveEntry()">💾 记入身体日记</button>
  </div>

  <!-- 模式浮现 -->
  <div class="pattern-card" id="patternCard">
    <div class="p-title">🔍 浮现的模式</div>
    <div class="p-insight" id="patternInsight"></div>
  </div>

  <!-- 历史 -->
  <div id="journalList">
    <div class="empty" id="emptyState">
      <div class="e-icon">📖</div>
      <p>身体日记还是空的。<br>下次做一个重要决定之前——<br>先来这里记下身体在说什么。<br>几次之后，你会发现——<br><strong>你的身体有它自己的智慧。</strong></p>
    </div>
  </div>

  <div style="text-align:center;margin-top:16px">
    <a class="btn btn-outline" href="go.html">← 返回通道</a>
  </div>

</div>

<div class="footer">
  <p>身体日记 · 决策-身体叙事 · 满意解研究所 · v5.0统一框架</p>
</div>

<script>
var STORAGE = 'sri_body_journal_v2';
var entries = JSON.parse(localStorage.getItem(STORAGE) || '[]');
var selectedTags = [];

function toggleTag(chip) {
  chip.classList.toggle('selected');
  selectedTags = [];
  document.querySelectorAll('.tag-chip.selected').forEach(function(c){selectedTags.push(c.getAttribute('data-tag'))});
}

function checkWrite() {
  var d = document.getElementById('decisionName').value.trim();
  var b = document.getElementById('bodyFeel').value.trim();
  document.getElementById('btnSave').disabled = d.length < 3 || b.length < 5;
}

function saveEntry() {
  var d = document.getElementById('decisionName').value.trim();
  var b = document.getElementById('bodyFeel').value.trim();
  
  entries.unshift({
    date: new Date().toLocaleDateString('zh-CN'),
    decision: d,
    body: b,
    tags: selectedTags.slice(),
    time: new Date().toISOString()
  });
  if(entries.length > 20) entries.length = 20;
  localStorage.setItem(STORAGE, JSON.stringify(entries));
  
  document.getElementById('decisionName').value = '';
  document.getElementById('bodyFeel').value = '';
  document.querySelectorAll('.tag-chip.selected').forEach(function(c){c.classList.remove('selected')});
  selectedTags = [];
  document.getElementById('btnSave').disabled = true;
  
  renderJournal();
  detectPatterns();
}

function renderJournal() {
  if(entries.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  
  var listHtml = '';
  for(var i=0;i<Math.min(entries.length, 10);i++){
    var e = entries[i];
    listHtml += '<div class="story-card">';
    listHtml += '<div class="sc-date">'+e.date+'</div>';
    listHtml += '<div class="sc-decision" onclick="this.nextElementSibling.classList.toggle(\'open\')">"'+escHtml(e.decision)+'"</div>';
    listHtml += '<div class="sc-body">';
    listHtml += '<p style="margin-bottom:6px">💬 '+escHtml(e.body)+'</p>';
    for(var j=0;j<(e.tags||[]).length;j++){
      var cls = e.tags[j].includes('紧张')||e.tags[j].includes('沉重')||e.tags[j].includes('胃里')||e.tags[j].includes('心跳')?'tag-tense':
                (e.tags[j].includes('放松')||e.tags[j].includes('轻盈')?'tag-calm':'tag-neutral');
      listHtml += '<span class="signal-tag '+cls+'">'+escHtml(e.tags[j])+'</span>';
    }
    listHtml += '</div></div>';
  }
  
  // 保留已有的story-card之外的元素
  var existing = document.querySelectorAll('.story-card');
  existing.forEach(function(el){el.remove()});
  var emptyEl = document.getElementById('emptyState');
  emptyEl.insertAdjacentHTML('afterend', listHtml);
}

function detectPatterns() {
  if(entries.length < 3) return;
  
  var card = document.getElementById('patternCard');
  var insight = document.getElementById('patternInsight');
  
  // 简单的模式检测：最近3次的身体信号趋势
  var recent = entries.slice(0,3);
  var allTags = [];
  recent.forEach(function(e){allTags = allTags.concat(e.tags||[])});
  
  var tagCounts = {};
  allTags.forEach(function(t){tagCounts[t] = (tagCounts[t]||0)+1});
  var top = Object.entries(tagCounts).sort(function(a,b){return b[1]-a[1]});
  
  if(top.length > 0 && top[0][1] >= 2) {
    card.classList.add('active');
    insight.innerHTML = '最近三次决策中，"<strong style="color:var(--red)">'+top[0][0]+'</strong>"出现了'+top[0][1]+'次。<br><br>这不是巧合。<br>你的身体在告诉你一些模式。<br>下次遇到类似情境时，先做一次PRE-0。';
  } else if(recent.length >= 3) {
    card.classList.add('active');
    insight.innerHTML = '三次记录，不同信号。你的身体在变化。<br>这是好事——说明你已经开始听见它了。<br>继续记录，模式会在更多数据中浮现。';
  }
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

renderJournal();
detectPatterns();
</script>
</body>
</html>
