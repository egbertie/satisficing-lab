<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>章·案例·海柔|海柔创新股权重谈|满意解研究所</title><style>:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}.article{max-width:600px;margin:0 auto;padding:24px 16px 40px;font-size:15px;line-height:2}.article h2{font-size:18px;color:var(--title-color);margin:24px 0 10px}.article h3{font-size:15px;color:var(--sri-red);margin:20px 0 8px}.article p{margin:8px 0}.article .quote{padding:12px 16px;margin:12px 0;border-left:3px solid var(--sri-red);font-style:italic;color:var(--sri-red);background:rgba(194,59,34,0.04);border-radius:0 8px 8px 0}.article .highlight{color:var(--sri-red);font-weight:600}li{margin:6px 0;font-size:14px}ul{padding-left:20px}table{width:100%;font-size:12px;border-collapse:collapse;margin:12px 0}th{padding:6px;border-bottom:1px solid #D4C5A0;color:var(--sri-gold);text-align:left}td{padding:6px;border-bottom:1px solid #f0e8d8}</style></head><body><div class="hero"><h1>🤖 章·案例·海柔</h1><p>满意姐·案例脚本·海柔创新股权重谈</p></div><div class="article"><h2>海柔创新·五位联创·股权重谈</h2><p>五位联创——一位在产品验证后提出"我的贡献被低估了，应该多拿10%"。融资窗口只有一个月。CEO选择先把钱拿进来——然后召开董事会重谈股权。</p><p><strong>三问诊断</strong>：<br>一、在融资窗口中重谈股权是"核选项"——CEO的选择是正确的：先把融资关掉。<br>二、Moyer: 股权不是激励——是记账。如果真的贡献了更多——重算就是。<br>三、但"贡献被低估"不是用嘴巴说的——用SlicingPie框架算出来。</p></div><p style="text-align:center;padding:20px;font-size:11px;color:#999"><a href="go.html" style="color:#C23B22;text-decoration:none">← 返回决策通道</a></p></body></html>
