var GH="6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493";
(function(){var c=localStorage.getItem("sri_dash_hash")||GH,s=localStorage.getItem("sri_dash_auth_hash");
if(localStorage.getItem("sri_dashboard_auth")==="true"&&s===c){document.getElementById("gateLayer").style.display="none";return}
document.getElementById("g0").focus();
document.addEventListener("input",function(e){if(!e.target.closest("#gd"))return;e.target.value=e.target.value.replace(/[^0-9]/g,"");if(e.target.value&&e.target.nextElementSibling&&e.target.nextElementSibling.tagName==="INPUT")e.target.nextElementSibling.focus()});
document.addEventListener("keydown",function(e){if(!e.target.closest("#gd"))return;if(e.key==="Backspace"&&!e.target.value&&e.target.previousElementSibling&&e.target.previousElementSibling.tagName==="INPUT")e.target.previousElementSibling.focus()});
window.gv=async function(){var cd="";for(var i=0;i<6;i++){var v=document.getElementById("g"+i).value;if(!v){document.getElementById("ge").textContent="请输入完整6位密码";return}cd+=v}
var h=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(cd)))).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
if(h===c){localStorage.setItem("sri_dashboard_auth","true");localStorage.setItem("sri_dash_auth_hash",c);document.getElementById("gateLayer").style.display="none"
if(typeof loadKPI==="function")loadKPI();if(typeof render==="function")render().catch(function(e){console.error(e)})}
else{document.getElementById("ge").textContent="密码错误"}};
if(document.getElementById("gateLayer").style.display==="none"&&typeof loadKPI==="function"){loadKPI()}
})();

<script>
// ===== localStorage 数据引擎 =====

// ===== 双数据源引擎: API优先 + localStorage降级 =====
var DB = {
  _api: 'http://localhost:8765/api',
  _local: true, // fallback to localStorage if API not available
  
  async _fetch(endpoint, method, body) {
    try {
      var ctrl = new AbortController();
      var to = setTimeout(function(){ctrl.abort()},3000);
      var opts = {method:method||'GET', headers:{'Content-Type':'application/json'}, signal:ctrl.signal};
      if(body) opts.body = JSON.stringify(body);
      var r = await fetch(this._api + endpoint, opts);
      clearTimeout(to);
      return await r.json();
    } catch(e) {
      return null;
    }
  },
  
  get(key) {
    try { return JSON.parse(localStorage.getItem('sri_db_'+key)) || []; }
    catch { return []; }
  },
  set(key, data) { localStorage.setItem('sri_db_'+key, JSON.stringify(data)); },
  
  async tasks() {
    var d = await this._fetch('/tasks');
    return Array.isArray(d) ? d : this.get('tasks');
  },
  async addTask(t) {
    await this._fetch('/tasks','POST',t);
    var d = this.get('tasks'); d.unshift({...t, id:Date.now(), created:new Date().toISOString()}); this.set('tasks',d.slice(0,500));
  },
  async updateTask(id, status) {
    await this._fetch('/tasks/update','POST',{id:id, status:status});
    var d = this.get('tasks'); var item = d.find(x=>x.id===id); if(item) {item.status=status; this.set('tasks',d);}
  },
  
  async customers() {
    var d = await this._fetch('/customers');
    return Array.isArray(d) ? d : this.get('customers');
  },
  async addCustomer(cust) {
    await this._fetch('/customers','POST',cust);
    var d = this.get('customers'); d.unshift({...cust, id:Date.now(), created:new Date().toISOString()}); this.set('customers',d.slice(0,500));
  },
  
  async passwords() {
    var d = await this._fetch('/passwords');
    return Array.isArray(d) ? d : this.get('passwords');
  },
  async addPassword(p) {
    await this._fetch('/passwords','POST',p);
    var d = this.get('passwords'); d.unshift({...p, id:Date.now(), created:new Date().toISOString()}); this.set('passwords',d.slice(0,200));
  },
  
  quality() { return this.get('quality') },
  addQuality(q) { var d=this.quality(); d.push({...q,id:Date.now()}); this.set('quality',d) },
  
  products() { return this.get('products') },
  addProduct(p) { var d=this.products(); d.push({...p,id:Date.now()}); this.set('products',d.slice(0,500)) },
  
  growth() { return this.get('growth') },
  usage() { var log=JSON.parse(localStorage.getItem('sri_usage_log')||'[]'); return log.filter(x=>new Date(x.time).toDateString()===new Date().toDateString()); },
  flywheel() { return JSON.parse(localStorage.getItem('sri_flywheel_reports')||'[]'); },
  
  async stats() {
    try {
      var d = await this._fetch('/stats');
      if (d) return { tasks:d.tasks||0, customers:d.customers||0, passwords:d.passwords||0, quality:this.quality().length, products:this.products().length, usage:d.usage_today||0, flywheel:this.flywheel().length };
    } catch(e) {}
    return { tasks:this.get('tasks').length, customers:this.get('customers').length, passwords:this.get('passwords').length, quality:this.quality().length, products:this.products().length, usage:this.usage().length, flywheel:this.flywheel().length };
  },
  
  seed() {
    if (this.get('passwords').length===0) this.set('passwords',[{id:1,code:'123654',products:'all',customer:'内测',max_uses:9999,used:0,status:'启用',created:new Date().toISOString()}]);
    if (this.get('quality').length===0) {
      this.addQuality({qm_id:'QM-001',standard:'L0 提案审核',status:'待执行',assignee:'满意红',deadline:'2026-06-07',priority:'P0'});
      this.addQuality({qm_id:'QM-002',standard:'L1 方法论审核',status:'55%通过率',assignee:'满意红(cron)',deadline:'2026-06-07',priority:'P0'});
      this.addQuality({qm_id:'QM-003',standard:'L2 内容审核',status:'105个缺来源',assignee:'满意红',deadline:'2026-06-14',priority:'P1'});
      this.addQuality({qm_id:'QM-009',standard:'四关通过率≥80%',status:'96%(已达标)',assignee:'满意红(cron)',deadline:'2026-07-01',priority:'P0'});
      this.addQuality({qm_id:'QM-026',standard:'商标注册',status:'未申请',assignee:'Egbertie',deadline:'2026-07-31',priority:'P0'});
    }
  }
};

let currentTab = 'tasks';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
  var btns = document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute('onclick') && btns[i].getAttribute('onclick').indexOf("'"+tab+"'")>=0){
      btns[i].classList.add('active');break;
    }
  }
  render().catch(function(e){console.error('render error:',e)});
}

function doGlobalSearch(){
  var q = document.getElementById('globalSearchBox').value.trim().toLowerCase();
  if(!q){ render(); return; }
  var rs = [];
  // Search tasks
  DB.tasks().then(function(ts){
    ts.filter(function(t){return (t.task||'').toLowerCase().indexOf(q)>=0||(t.priority||'').toLowerCase().indexOf(q)>=0}).forEach(function(t){rs.push({ty:'📋 任务',tx:t.task+' ['+t.priority+'] '+t.status,tab:'tasks'});});
    // Search customers
    var cs = DB.get('customers');
    cs.filter(function(c){return (c.name||'').toLowerCase().indexOf(q)>=0||(c.company||'').toLowerCase().indexOf(q)>=0}).forEach(function(c){rs.push({ty:'👤 客户',tx:c.name+' · '+(c.company||''),tab:'customers'});});
    // Render
    var h = '<div class="panel"><h3>🔍 搜索: <b>'+q+'</b></h3>';
    if(rs.length===0) h += '<div class="empty">未找到匹配结果</div>';
    else rs.forEach(function(r){h += '<div style="padding:8px 12px;border-bottom:1px solid #f0e8d8;cursor:pointer;font-size:11px" onclick="currentTab=\''+r.tab+'\';render()">'+r.ty+' <b>'+r.tx+'</b> <span style="color:#B8860B;float:right">查看 →</span></div>';});
    h += '</div>';
    document.getElementById('content').innerHTML = h;
  });
}

function renderNorthstar(){
  let d=DB.get('growth');
  let html='';
  d.forEach(g => {
    html+='<div style="background:#F5F0E6;border-radius:8px;padding:8px;"><div style="font-size:11px;color:#6E6E6E;">'+g.metric+'</div><div style="font-size:18px;font-weight:700;color:#C23B22;">'+g.current+'</div><div style="font-size:9px;color:#6E6E6E;">目标: '+g.target+' '+g.trend+'</div></div>';
  });
  document.getElementById('northstar').innerHTML=html;
  
  // 倒计时
  var today=new Date();
  var solstice=new Date(2026,5,21); // 6月21日(JS月份0-11)
  var days=Math.ceil((solstice-today)/86400000);
  document.getElementById('countdownDays').textContent=days+'天';
  var mktEl=document.getElementById('mktCountdown');
  if(mktEl) mktEl.textContent=days+'天';
}

// 自动同步飞轮数据
function syncFlywheelData(){
  var reports=JSON.parse(localStorage.getItem('sri_flywheel_reports')||'[]');
  var usage=JSON.parse(localStorage.getItem('sri_usage_log')||'[]');
  var profile=JSON.parse(localStorage.getItem('sri_profile')||'{}');
  var nps=localStorage.getItem('sri_nps_score');
  
  var g=DB.get('growth');
  g.find(x=>x.metric==='飞轮循环').current=reports.length;
  g.find(x=>x.metric==='活跃客户(30d)').current=profile.name?1:0;
  if(nps) g.find(x=>x.metric==='NPS基线').current=nps+'/10';
  DB.set('growth',g);
}
syncFlywheelData();

function addTask() {
  let t = document.getElementById('taskName').value.trim();
  if(!t) return;
  DB.addTask({task:t, priority:document.getElementById('taskPri').value, deadline:document.getElementById('taskDeadline').value, assignee:document.getElementById('taskAssignee').value, status:'待开始'});
  document.getElementById('taskName').value=''; render();
}

async function updateTask(id,status) { await DB.updateTask(id,status); render(); }

function deleteItem(table,id) {
  let d = DB.get(table);
  d = d.filter(x=>x.id!==id);
  DB.set(table, d);
  render();
}

function addCustomer() {
  let n=document.getElementById('custName').value.trim();
  if(!n) return;
  DB.addCustomer({name:n, company:document.getElementById('custCompany').value, email:document.getElementById('custEmail').value, role:document.getElementById('custRole').value});
  document.getElementById('custName').value=''; render();
}

function addPassword() {
  let c=document.getElementById('pwdCode').value.trim();
  if(!c||c.length!==8) return alert('密码必须8位数字');
  DB.addPassword({code:c, customer:document.getElementById('pwdCustomer').value, products:document.getElementById('pwdProd').value, max_uses:parseInt(document.getElementById('pwdMaxUses').value)||9999, used:0, status:'启用'});
  document.getElementById('pwdCode').value=''; render();
}

function addProduct() {
  let n=document.getElementById('prodName').value.trim();
  if(!n) return;
  DB.addProduct({name:n, family:document.getElementById('prodFamily').value});
  document.getElementById('prodName').value=''; render();
}

function importJSON() {
  try {
    let d=JSON.parse(document.getElementById('importData').value);
    for(let [table,items] of Object.entries(d)) {
      let existing = DB.get(table);
      items.forEach(item => { item.id = Date.now()+Math.random(); item.created = new Date().toISOString(); existing.unshift(item); });
      DB.set(table, existing.slice(0,500));
    }
    render(); alert('导入成功！');
  } catch(e) { alert('JSON格式错误: '+e.message); }
}

async function importFromFile() {
  let s=document.getElementById('importStatus');
  s.textContent='加载中...';
  try {
    let r=await fetch('import_data.json');
    let d=await r.json();
    let count=0;
    let mapping={'任务驾驶舱':'tasks','客户档案库':'customers','决策日志':'decisions','北极星指标':'growth','五维测评记录':'assessments','知识资产库':'knowledge','内容资产':'content','案例库':'cases'};
    for(let [table,items] of Object.entries(d)){
      let key=mapping[table]||table;
      let existing=DB.get(key);
      items.forEach(item=>{item._id=Date.now()+Math.random();existing.unshift(item)});
      DB.set(key,existing.slice(0,500));
      count+=items.length;
    }
    s.textContent='✅ 已导入 '+count+' 条！' + (d['任务驾驶舱']?'含任务'+d['任务驾驶舱'].length+'条':'');
    render();
  } catch(e){s.textContent='❌ 加载失败: '+e.message;}
}

function exportAll() {
  let data = {};
  ['tasks','customers','passwords','quality','products','growth'].forEach(t => { data[t] = DB.get(t) });
  let blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '驾驶舱备份_'+new Date().toISOString().substring(0,10)+'.json';
  a.click();
}

      var g=DB.get('growth');

      DB.set('growth',g);

  // 同步使用日志到驾驶舱

  var todayLog=usage.filter(x=>new Date(x.time).toDateString()===new Date().toDateString());
  document.getElementById('kv_usage')&&(document.getElementById('kv_usage').textContent=todayLog.length||0);
})();
 render();
}
