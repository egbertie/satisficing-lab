<script>
// 验证哈希一致性——如果密码被其他设备变更了，这边的免登也会失效
var currentHash=localStorage.getItem('sri_dash_hash')||'6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
var savedHash=localStorage.getItem('sri_dash_auth_hash');
if(localStorage.getItem('sri_dashboard_auth')==='true' && savedHash===currentHash){
  document.getElementById('gateLayer').style.display='none';
} else {
  localStorage.removeItem('sri_dashboard_auth');
  document.getElementById('gd0').focus();
}

function gateNext(el){
  el.value=el.value.replace(/[^0-9]/g,'');
  if(el.value&&el.nextElementSibling&&el.nextElementSibling.classList.contains('gateDigit')) el.nextElementSibling.focus();
  document.getElementById('gateError').textContent='';
}

function gatePrev(e,el){
  if(e.key==='Backspace'&&!el.value&&el.previousElementSibling&&el.previousElementSibling.classList.contains('gateDigit')) el.previousElementSibling.focus();
}

var gateFailCount=parseInt(localStorage.getItem('sri_gate_fails')||'0');
var gateLockUntil=parseInt(localStorage.getItem('sri_gate_lock')||'0');

async function gateVerify(){
  var now=Date.now();
  if(gateLockUntil>now){
    var sec=Math.ceil((gateLockUntil-now)/1000);
    document.getElementById('gateError').textContent='已锁定·请等待'+sec+'秒';
    return;
  }
  let code='';
  for(let i=0;i<6;i++){ let v=document.getElementById('gd'+i).value; if(!v){document.getElementById('gateError').textContent='请输入完整6位密码';return;} code+=v; }
  let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));
  let h=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  // 密码123654的哈希
  let valid='6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
  if(h===valid){
    localStorage.setItem('sri_gate_fails','0');
    localStorage.setItem('sri_dashboard_auth','true');
    localStorage.setItem('sri_dash_auth_hash',valid);
    document.getElementById('gateLayer').style.display='none';
  } else {
    gateFailCount++;
    localStorage.setItem('sri_gate_fails',gateFailCount);
    if(gateFailCount>=3){
      var lockSec=300; // 5分钟锁定
      localStorage.setItem('sri_gate_lock',Date.now()+lockSec*1000);
      document.getElementById('gateError').textContent='已锁定5分钟·连续3次错误';
      localStorage.setItem('sri_gate_fails','0');
    } else {
      document.getElementById('gateError').textContent='密码错误('+gateFailCount+'/3)';
    }
    document.querySelectorAll('.gateDigit').forEach(d=>{d.classList.add('error');setTimeout(()=>{d.value='';d.classList.remove('error')},600)});
    document.getElementById('gd0').focus();
  }
}

async function gateChange(){
  // 检查是否已获取邮箱验证码
  var verifiedEmail=localStorage.getItem('sri_gate_email_verified');
  if(!verifiedEmail){
    document.getElementById('gateError').textContent='请先获取邮箱验证码';
    return;
  }
  // 读旧密码
  let oldDigits=document.getElementById('oldDigits').querySelectorAll('input');
  let newDigits=document.getElementById('newDigits').querySelectorAll('input');
  let old=''; for(let i=0;i<6;i++){if(!oldDigits[i].value){document.getElementById('gateError').textContent='请输入当前密码';return;} old+=oldDigits[i].value;}
  let np=''; for(let i=0;i<6;i++){if(!newDigits[i].value){document.getElementById('gateError').textContent='请输入新密码';return;} np+=newDigits[i].value;}
  if(np===old){document.getElementById('gateError').textContent='新密码不能与当前密码相同';return;}
  
  let oh=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(old));
  let ohash=Array.from(new Uint8Array(oh)).map(b=>b.toString(16).padStart(2,'0')).join('');
  
  // 验证旧密码
  let stored=localStorage.getItem('sri_dash_hash')||'6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
  if(ohash!==stored){document.getElementById('gateError').textContent='当前密码错误';return;}
  
  // 保存新密码
  let nh=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(np));
  let nhash=Array.from(new Uint8Array(nh)).map(b=>b.toString(16).padStart(2,'0')).join('');
  localStorage.setItem('sri_dash_hash',nhash);
  localStorage.setItem('sri_gate_fails','0');

async function sendEmailCode(){
  var email=document.getElementById('verifyEmail').value.trim();
  if(!email){document.getElementById('emailCodeMsg').textContent='请输入邮箱';return;}
  document.getElementById('emailCodeMsg').textContent='发送中...';
  try{
    var r=await fetch('http://localhost:8766/api/send_code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    var d=await r.json();
    if(d.ok){document.getElementById('emailCodeMsg').textContent='✅ 验证码已发送·5分钟有效';document.getElementById('emailCodeMsg').style.color='#3D7A4F';}
    else{document.getElementById('emailCodeMsg').textContent='发送失败: '+d.error;}
  }catch(e){document.getElementById('emailCodeMsg').textContent='发送失败·检查是否在本机访问';}
}

async function verifyEmailCode(){
  var email=document.getElementById('verifyEmail').value.trim();
  var code=document.getElementById('emailCode').value.trim();
  if(!code){document.getElementById('emailCodeMsg').textContent='请输入验证码';return;}
  try{
    var r=await fetch('http://localhost:8766/api/verify_code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,code:code})});
    var d=await r.json();
    if(d.ok){
      localStorage.setItem('sri_gate_email_verified','true');
      document.getElementById('emailCodeMsg').textContent='✅ 邮箱验证通过·可以变更密码了';
      document.getElementById('emailCodeMsg').style.color='#3D7A4F';
    }else{
      document.getElementById('emailCodeMsg').textContent='验证码错误或过期';
    }
  }catch(e){document.getElementById('emailCodeMsg').textContent='验证失败·检查是否在本机访问';}
}

// ===== 双数据源引擎: API优先 + localStorage降级 =====
var DB = {
  _api: 'http://localhost:8765/api',
  _local: true, // fallback to localStorage if API not available
  
  async _fetch(endpoint, method, body) {
    try {
      var opts = {method:method||'GET', headers:{'Content-Type':'application/json'}};
      if(body) opts.body = JSON.stringify(body);
      var r = await fetch(this._api + endpoint, opts);
      return await r.json();
    } catch(e) {
      return null;
    }
  },
  
  get(key) {
    try { return JSON.parse(localStorage.getItem('sri_db_'+key)) || []; }
    catch { return []; }
  },
  set(key, data) { localStorage.setItem('sri_db_'+key, JSON.stringify(data)); },
  
  async tasks() {
    var d = await this._fetch('/tasks');
    return Array.isArray(d) ? d : this.get('tasks');
  },
  async addTask(t) {
    await this._fetch('/tasks','POST',t);
    var d = this.get('tasks'); d.unshift({...t, id:Date.now(), created:new Date().toISOString()}); this.set('tasks',d.slice(0,500));
  },
  async updateTask(id, status) {
    await this._fetch('/tasks/update','POST',{id:id, status:status});
    var d = this.get('tasks'); var item = d.find(x=>x.id===id); if(item) {item.status=status; this.set('tasks',d);}
  },
  
  async customers() {
    var d = await this._fetch('/customers');
    return Array.isArray(d) ? d : this.get('customers');
  },
  async addCustomer(cust) {
    await this._fetch('/customers','POST',cust);
    var d = this.get('customers'); d.unshift({...cust, id:Date.now(), created:new Date().toISOString()}); this.set('customers',d.slice(0,500));
  },
  
  async passwords() {
    var d = await this._fetch('/passwords');
    return Array.isArray(d) ? d : this.get('passwords');
  },
  async addPassword(p) {
    await this._fetch('/passwords','POST',p);
    var d = this.get('passwords'); d.unshift({...p, id:Date.now(), created:new Date().toISOString()}); this.set('passwords',d.slice(0,200));
  },
  
  quality() { return this.get('quality') },
  addQuality(q) { var d=this.quality(); d.push({...q,id:Date.now()}); this.set('quality',d) },
  
  products() { return this.get('products') },
  addProduct(p) { var d=this.products(); d.push({...p,id:Date.now()}); this.set('products',d.slice(0,500)) },
  
  growth() { return this.get('growth') },
  usage() { var log=JSON.parse(localStorage.getItem('sri_usage_log')||'[]'); return log.filter(x=>new Date(x.time).toDateString()===new Date().toDateString()); },
  flywheel() { return JSON.parse(localStorage.getItem('sri_flywheel_reports')||'[]'); },
  
  async stats() {
    try {
      var d = await this._fetch('/stats');
      if (d) return { tasks:d.tasks||0, customers:d.customers||0, passwords:d.passwords||0, quality:this.quality().length, products:this.products().length, usage:d.usage_today||0, flywheel:this.flywheel().length };
    } catch(e) {}
    return { tasks:this.get('tasks').length, customers:this.get('customers').length, passwords:this.get('passwords').length, quality:this.quality().length, products:this.products().length, usage:this.usage().length, flywheel:this.flywheel().length };
  },
  
  seed() {
    if (this.get('passwords').length===0) this.set('passwords',[{id:1,code:'123654',products:'all',customer:'内测',max_uses:9999,used:0,status:'启用',created:new Date().toISOString()}]);

    }
  }
};

function renderNorthstar(){
  let d=DB.get('growth');
  let html='';
  d.forEach(g => {
    html+='<div style="background:#F5F0E6;border-radius:8px;padding:8px;"><div style="font-size:11px;color:#6E6E6E;">'+g.metric+'</div><div style="font-size:18px;font-weight:700;color:#C23B22;">'+g.current+'</div><div style="font-size:9px;color:#6E6E6E;">目标: '+g.target+' '+g.trend+'</div></div>';
  });
  document.getElementById('northstar').innerHTML=html;
  
  // 倒计时
  var today=new Date();
  var solstice=new Date(2026,5,21); // 6月21日(JS月份0-11)
  var days=Math.ceil((solstice-today)/86400000);
  document.getElementById('countdownDays').textContent=days+'天';
  var mktEl=document.getElementById('mktCountdown');
  if(mktEl) mktEl.textContent=days+'天';
}

// 自动同步飞轮数据
function syncFlywheelData(){
  var reports=JSON.parse(localStorage.getItem('sri_flywheel_reports')||'[]');
  var usage=JSON.parse(localStorage.getItem('sri_usage_log')||'[]');
  var profile=JSON.parse(localStorage.getItem('sri_profile')||'{}');
  var nps=localStorage.getItem('sri_nps_score');
  
  var g=DB.get('growth');
  g.find(x=>x.metric==='飞轮循环').current=reports.length;
  g.find(x=>x.metric==='活跃客户(30d)').current=profile.name?1:0;
  if(nps) g.find(x=>x.metric==='NPS基线').current=nps+'/10';
  DB.set('growth',g);
}

function deleteItem(table,id) {
  let d = DB.get(table);
  d = d.filter(x=>x.id!==id);
  DB.set(table, d);
  render();
}

function addCustomer() {

  DB.addPassword({code:c, customer:document.getElementById('pwdCustomer').value, products:document.getElementById('pwdProd').value, max_uses:parseInt(document.getElementById('pwdMaxUses').value)||9999, used:0, status:'启用'});
  document.getElementById('pwdCode').value=''; render();

function addProduct() {
  let n=document.getElementById('prodName').value.trim();

  DB.addProduct({name:n, family:document.getElementById('prodFamily').value});
  document.getElementById('prodName').value=''; render();
}

function importJSON() {
  try {
    let d=JSON.parse(document.getElementById('importData').value);
    for(let [table,items] of Object.entries(d)) {
      let existing = DB.get(table);
      items.forEach(item => { item.id = Date.now()+Math.random(); item.created = new Date().toISOString(); existing.unshift(item); });
      DB.set(table, existing.slice(0,500));
    }
    render(); alert('导入成功！');
  } catch(e) { alert('JSON格式错误: '+e.message); }
}

async function importFromFile() {
  let s=document.getElementById('importStatus');
  s.textContent='加载中...';
  try {
    let r=await fetch('import_data.json');
    let d=await r.json();
    let count=0;
    let mapping={'任务驾驶舱':'tasks','客户档案库':'customers','决策日志':'decisions','北极星指标':'growth','五维测评记录':'assessments','知识资产库':'knowledge','内容资产':'content','案例库':'cases'};
    for(let [table,items] of Object.entries(d)){
      let key=mapping[table]||table;
      let existing=DB.get(key);
      items.forEach(item=>{item._id=Date.now()+Math.random();existing.unshift(item)});
      DB.set(key,existing.slice(0,500));
      count+=items.length;
    }
    s.textContent='✅ 已导入 '+count+' 条！' + (d['任务驾驶舱']?'含任务'+d['任务驾驶舱'].length+'条':'');
    render();
  } catch(e){s.textContent='❌ 加载失败: '+e.message;}
}

}
