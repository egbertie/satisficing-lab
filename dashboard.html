<script>
// 验证哈希一致性——如果密码被其他设备变更了，这边的免登也会失效
var currentHash=localStorage.getItem('sri_dash_hash')||'6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
var savedHash=localStorage.getItem('sri_dash_auth_hash');
if(localStorage.getItem('sri_dashboard_auth')==='true' && savedHash===currentHash){
  document.getElementById('gateLayer').style.display='none';
} else {
  localStorage.removeItem('sri_dashboard_auth');
  document.getElementById('gd0').focus();
}

function gateNext(el){
  el.value=el.value.replace(/[^0-9]/g,'');
  if(el.value&&el.nextElementSibling&&el.nextElementSibling.classList.contains('gateDigit')) el.nextElementSibling.focus();
  document.getElementById('gateError').textContent='';
}

function gatePrev(e,el){
  if(e.key==='Backspace'&&!el.value&&el.previousElementSibling&&el.previousElementSibling.classList.contains('gateDigit')) el.previousElementSibling.focus();
}

var gateFailCount=parseInt(localStorage.getItem('sri_gate_fails')||'0');
var gateLockUntil=parseInt(localStorage.getItem('sri_gate_lock')||'0');

async function gateVerify(){
  var now=Date.now();
  if(gateLockUntil>now){
    var sec=Math.ceil((gateLockUntil-now)/1000);
    document.getElementById('gateError').textContent='已锁定·请等待'+sec+'秒';
    return;
  }
  let code='';
  for(let i=0;i<6;i++){ let v=document.getElementById('gd'+i).value; if(!v){document.getElementById('gateError').textContent='请输入完整6位密码';return;} code+=v; }
  let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));
  let h=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  // 密码123654的哈希
  let valid='6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
  if(h===valid){
    localStorage.setItem('sri_gate_fails','0');
    localStorage.setItem('sri_dashboard_auth','true');
    localStorage.setItem('sri_dash_auth_hash',valid);
    document.getElementById('gateLayer').style.display='none';
  } else {
    gateFailCount++;
    localStorage.setItem('sri_gate_fails',gateFailCount);
    if(gateFailCount>=3){
      var lockSec=300; // 5分钟锁定
      localStorage.setItem('sri_gate_lock',Date.now()+lockSec*1000);
      document.getElementById('gateError').textContent='已锁定5分钟·连续3次错误';
      localStorage.setItem('sri_gate_fails','0');
    } else {
      document.getElementById('gateError').textContent='密码错误('+gateFailCount+'/3)';
    }
    document.querySelectorAll('.gateDigit').forEach(d=>{d.classList.add('error');setTimeout(()=>{d.value='';d.classList.remove('error')},600)});
    document.getElementById('gd0').focus();
  }
}

async function gateChange(){
  // 检查是否已获取邮箱验证码
  var verifiedEmail=localStorage.getItem('sri_gate_email_verified');
  if(!verifiedEmail){
    document.getElementById('gateError').textContent='请先获取邮箱验证码';
    return;
  }
  // 读旧密码
  let oldDigits=document.getElementById('oldDigits').querySelectorAll('input');
  let newDigits=document.getElementById('newDigits').querySelectorAll('input');
  let old=''; for(let i=0;i<6;i++){if(!oldDigits[i].value){document.getElementById('gateError').textContent='请输入当前密码';return;} old+=oldDigits[i].value;}
  let np=''; for(let i=0;i<6;i++){if(!newDigits[i].value){document.getElementById('gateError').textContent='请输入新密码';return;} np+=newDigits[i].value;}
  if(np===old){document.getElementById('gateError').textContent='新密码不能与当前密码相同';return;}
  
  let oh=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(old));
  let ohash=Array.from(new Uint8Array(oh)).map(b=>b.toString(16).padStart(2,'0')).join('');
  
  // 验证旧密码
  let stored=localStorage.getItem('sri_dash_hash')||'6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
  if(ohash!==stored){document.getElementById('gateError').textContent='当前密码错误';return;}
  
  // 保存新密码
  let nh=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(np));
  let nhash=Array.from(new Uint8Array(nh)).map(b=>b.toString(16).padStart(2,'0')).join('');
  localStorage.setItem('sri_dash_hash',nhash);
  localStorage.setItem('sri_gate_fails','0');

async function sendEmailCode(){
  var email=document.getElementById('verifyEmail').value.trim();
  if(!email){document.getElementById('emailCodeMsg').textContent='请输入邮箱';return;}
  document.getElementById('emailCodeMsg').textContent='发送中...';
  try{
    var r=await fetch('http://localhost:8766/api/send_code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    var d=await r.json();
    if(d.ok){document.getElementById('emailCodeMsg').textContent='✅ 验证码已发送·5分钟有效';document.getElementById('emailCodeMsg').style.color='#3D7A4F';}
    else{document.getElementById('emailCodeMsg').textContent='发送失败: '+d.error;}
  }catch(e){document.getElementById('emailCodeMsg').textContent='发送失败·检查是否在本机访问';}
}

async function verifyEmailCode(){
  var email=document.getElementById('verifyEmail').value.trim();
  var code=document.getElementById('emailCode').value.trim();
  if(!code){document.getElementById('emailCodeMsg').textContent='请输入验证码';return;}
  try{
    var r=await fetch('http://localhost:8766/api/verify_code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,code:code})});
    var d=await r.json();
    if(d.ok){
      localStorage.setItem('sri_gate_email_verified','true');
      document.getElementById('emailCodeMsg').textContent='✅ 邮箱验证通过·可以变更密码了';
      document.getElementById('emailCodeMsg').style.color='#3D7A4F';
    }else{
      document.getElementById('emailCodeMsg').textContent='验证码错误或过期';
    }
  }catch(e){document.getElementById('emailCodeMsg').textContent='验证失败·检查是否在本机访问';}
}

<div class="main">

  <div class="kpi" id="kpiBar">
    <div class="kpi-card"><div class="v" id="kv_tasks">0</div><div class="l">任务</div></div>
    <div class="kpi-card"><div class="v" id="kv_customers">0</div><div class="l">客户</div></div>
    <div class="kpi-card"><div class="v" id="kv_passwords">0</div><div class="l">密码</div></div>
    <div class="kpi-card"><div class="v" id="kv_quality">0</div><div class="l">质量标准</div></div>
    <div class="kpi-card"><div class="v" id="kv_products">0</div><div class="l">产品</div></div>
    <div class="kpi-card"><div class="v" id="kv_usage">0</div><div class="l">今日使用</div></div>
    <div class="kpi-card"><div class="v" id="kv_flywheel">0</div><div class="l">飞轮循环</div></div>
    <div class="kpi-card" onclick="exportAll()" style="cursor:pointer"><div class="v">💾</div><div class="l">导出数据</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tasks')">📋 任务</button>
    <button class="tab-btn" onclick="switchTab('customers')">👤 客户</button>
    <button class="tab-btn" onclick="switchTab('passwords')">🔐 密码</button>
    <button class="tab-btn" onclick="switchTab('quality')">✅ 质量</button>
    <button class="tab-btn" onclick="switchTab('growth')">📈 增长</button>
    <button class="tab-btn" onclick="switchTab('products')">📦 产品</button>
    <button class="tab-btn" onclick="switchTab('import')">📥 导入</button>
  </div>

  <div id="content"></div>
</div>

<script>
// ===== localStorage 数据引擎 =====
const DB = {
  get(key) { try{return JSON.parse(localStorage.getItem('sri_db_'+key))||[]}catch{return[]} },
  set(key,data) { localStorage.setItem('sri_db_'+key, JSON.stringify(data)) },
  
  tasks() { return this.get('tasks') },
  addTask(t) { let d=this.tasks(); d.unshift({...t,id:Date.now(),created:new Date().toISOString()}); this.set('tasks',d.slice(0,500)) },
  updateTask(id,status) { let d=this.tasks(); let item=d.find(x=>x.id===id); if(item){item.status=status;item.updated=new Date().toISOString();this.set('tasks',d)} },
  
  customers() { return this.get('customers') },
  addCustomer(c) { let d=this.customers(); d.unshift({...c,id:Date.now(),created:new Date().toISOString()}); this.set('customers',d.slice(0,500)) },
  
  passwords() { return this.get('passwords') },
  addPassword(p) { let d=this.passwords(); d.unshift({...p,id:Date.now(),created:new Date().toISOString()}); this.set('passwords',d.slice(0,200)) },
  
  quality() { return this.get('quality') },
  addQuality(q) { let d=this.quality(); d.push({...q,id:Date.now()}); this.set('quality',d) },
  
  products() { return this.get('products') },
  addProduct(p) { let d=this.products(); d.push({...p,id:Date.now()}); this.set('products',d.slice(0,500)) },
  
  growth() { return this.get('growth') },
  usage() { let log=JSON.parse(localStorage.getItem('sri_usage_log')||'[]'); return log.filter(x=>new Date(x.time).toDateString()===new Date().toDateString()) },
  flywheel() { return JSON.parse(localStorage.getItem('sri_flywheel_reports')||'[]') },
  
  stats() {
    return {
      tasks: this.tasks().length,
      customers: this.customers().length,
      passwords: this.passwords().length,
      quality: this.quality().length,
      products: this.products().length,
      usage: this.usage().length,
      flywheel: this.flywheel().length
    }
  },
  
  seed() {
    if (this.passwords().length===0) this.addPassword({code:'***',products:'all',customer:'内测用户',max_uses:9999,used:0,status:'启用'});
    if (this.quality().length===0) {
      this.addQuality({qm_id:'QM-001',standard:'L0 提案审核',status:'待执行',assignee:'满意红',deadline:'2026-06-07',priority:'P0'});
      this.addQuality({qm_id:'QM-002',standard:'L1 方法论审核',status:'55%通过率',assignee:'满意红(cron)',deadline:'2026-06-07',priority:'P0'});
      this.addQuality({qm_id:'QM-003',standard:'L2 内容审核',status:'105个缺来源',assignee:'满意红',deadline:'2026-06-14',priority:'P1'});
      this.addQuality({qm_id:'QM-009',standard:'四关通过率≥80%',status:'96%(已达标)',assignee:'满意红(cron)',deadline:'2026-07-01',priority:'P0'});
      this.addQuality({qm_id:'QM-026',standard:'商标注册',status:'未申请',assignee:'Egbertie',deadline:'2026-07-31',priority:'P0'});
    }
    if (this.get('growth').length===0) {
      this.set('growth',[
        {metric:'线上产品总数',current:'233',target:'250',trend:'→'},
        {metric:'四关通过率',current:'96%',target:'100%',trend:'↑'},
        {metric:'NPS基线',current:'待收集',target:'≥50',trend:'—'},
        {metric:'飞轮循环',current:this.flywheel().length,target:'50',trend:'—'},
        {metric:'活跃客户(30d)',current:'0',target:'30',trend:'—'},
      ]);
    }
  }
};

DB.seed();

// ===== UI渲染 =====
let currentTab = 'tasks';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  loadKPI();
  let html = '';
  
  if (currentTab === 'tasks') {
    let data = DB.tasks();
    html = `<div class="panel"><h3>📋 任务驾驶舱</h3>
      <div class="form-row">
        <input id="taskName" placeholder="任务名称">
        <select id="taskPri"><option>P0</option><option selected>P1</option><option>P2</option><option>P3</option></select>
        <input id="taskDeadline" type="date" style="max-width:130px">
        <select id="taskAssignee"><option>Egbertie</option><option>满意红</option></select>
        <button class="btn" onclick="addTask()">+</button>
      </div>`;
    if (data.length === 0) html += '<div class="empty">暂无任务·添一个吧</div>';
    else {
      html += '<table><tr><th>任务</th><th>优先级</th><th>状态</th><th>截止</th><th>负责</th><th>操作</th></tr>';
      data.forEach(t => {
        html += `<tr><td>${t.task||''}</td><td>${t.priority||''}</td><td><span class="status-dot ${t.status==='完成'?'dot-green':t.status==='进行中'?'dot-amber':'dot-red'}"></span>${t.status||'待开始'}</td><td>${t.deadline||''}</td><td>${t.assignee||''}</td><td>`;
        if (t.status !== '完成') html += `<button class="btn btn-sm" onclick="updateTask(${t.id},'完成')">✓</button>`;
        html += `<button class="btn btn-sm" style="background:#999" onclick="deleteItem('tasks',${t.id})">✕</button></td></tr>`;
      });
      html += '</table>';
    }
    html += '</div>';
  } else if (currentTab === 'customers') {
    let data = DB.customers();
    html = `<div class="panel"><h3>👤 客户档案库</h3>
      <div class="form-row">
        <input id="custName" placeholder="姓名*"><input id="custCompany" placeholder="企业">
        <input id="custEmail" placeholder="邮箱"><input id="custRole" placeholder="身份">
        <button class="btn" onclick="addCustomer()">+</button>
      </div>`;
    if (data.length===0) html += '<div class="empty">暂无客户</div>';
    else {
      html += '<table><tr><th>姓名</th><th>企业</th><th>邮箱</th><th>身份</th><th>时间</th></tr>';
      data.forEach(c => {
        html += `<tr><td>${c.name||''}</td><td>${c.company||''}</td><td>${c.email||''}</td><td>${c.role||''}</td><td>${(c.created||'').substring(0,10)}</td></tr>`;
      });
      html += '</table>';
    }
    html += '</div>';
  } else if (currentTab === 'passwords') {
    let data = DB.passwords();
    html = `<div class="panel"><h3>🔐 授权密码管理</h3>
      <div class="form-row">
        <input id="pwdCode" placeholder="8位密码" maxlength="8" type="password">
        <input id="pwdCustomer" placeholder="绑定客户">
        <select id="pwdProd"><option value="all">全部产品</option><option value="assessment">衡·观局</option><option value="thermometer">镜·触温</option><option value="knights">镜·警兆</option><option value="crisis-sim">觉·淬火</option></select>
        <input id="pwdMaxUses" type="number" value="9999" style="max-width:70px" title="最大次数">
        <button class="btn" onclick="addPassword()">生成</button>
      </div>`;
    if (data.length===0) html += '<div class="empty">暂无密码</div>';
    else {
      html += '<table><tr><th>密码</th><th>产品</th><th>客户</th><th>次数</th><th>状态</th><th>时间</th></tr>';
      data.forEach(p => {
        html += `<tr><td><b>${p.code||'***'}</b></td><td>${p.products||''}</td><td>${p.customer||''}</td><td>${p.used||0}/${p.max_uses||9999}</td><td>${p.status||''}</td><td>${(p.created||'').substring(0,10)}</td></tr>`;
      });
      html += '</table>';
    }
    html += '</div>';
  } else if (currentTab === 'quality') {
    let data = DB.quality();
    html = `<div class="panel"><h3>✅ 质量仪表盘 · QM质量标准</h3>`;
    if (data.length===0) html += '<div class="empty">暂无</div>';
    else {
      html += '<table><tr><th>编号</th><th>标准项</th><th>状态</th><th>负责</th><th>截止</th><th>优先级</th></tr>';
      data.forEach(q => {
        html += `<tr><td>${q.qm_id||''}</td><td>${q.standard||''}</td><td>${q.status||''}</td><td>${q.assignee||''}</td><td>${q.deadline||''}</td><td>${q.priority||''}</td></tr>`;
      });
      html += '</table>';
    }
    html += '</div>';
  } else if (currentTab === 'growth') {
    let data = DB.get('growth');
    html = `<div class="panel"><h3>📈 增长飞轮</h3><table><tr><th>指标</th><th>当前值</th><th>目标值</th><th>趋势</th></tr>`;
    data.forEach(g => {
      html += `<tr><td>${g.metric||''}</td><td><b>${g.current||''}</b></td><td>${g.target||''}</td><td>${g.trend||'—'}</td></tr>`;
    });
    html += '</table></div>';
  } else if (currentTab === 'products') {
    let data = DB.products();
    html = `<div class="panel"><h3>📦 产品库</h3>
      <div class="form-row">
        <input id="prodName" placeholder="产品名称"><input id="prodFamily" placeholder="五族(章衡镜契觉)">
        <button class="btn" onclick="addProduct()">+</button>
      </div>`;
    if (data.length===0) html += '<div class="empty">暂无产品记录</div>';
    else {
      html += '<table><tr><th>名称</th><th>五族</th></tr>';
      data.forEach(p => {
        html += `<tr><td>${p.name||''}</td><td>${p.family||''}</td></tr>`;
      });
      html += '</table>';
    }
    html += '</div>';
  } else if (currentTab === 'import') {
    html = `<div class="panel"><h3>📥 导入历史数据</h3>
      <p style="font-size:12px;opacity:0.6;margin-bottom:12px;">从旧飞书驾驶舱拉取的498条历史记录</p>
      <button class="btn" onclick="importFromFile()">📥 一键导入498条历史数据</button>
      <span id="importStatus" style="font-size:11px;margin-left:8px;"></span>
      <hr style="margin:12px 0;border-color:#D4C5A0">
      <button class="btn" style="background:var(--sri-gold)" onclick="exportAll()">💾 导出全部数据</button>
      <button class="btn" style="background:#999" onclick="clearAll()">🗑️ 清空数据</button>
      <p style="font-size:10px;opacity:0.4;margin-top:8px;">数据仅存在于本浏览器的localStorage中·清空不可恢复·建议定期导出备份</p>
    </div>`;
  }
  
  document.getElementById('content').innerHTML = html;
}

function loadKPI() {
  let s = DB.stats();
  document.getElementById('kv_tasks').textContent = s.tasks;
  document.getElementById('kv_customers').textContent = s.customers;
  document.getElementById('kv_passwords').textContent = s.passwords;
  document.getElementById('kv_quality').textContent = s.quality;
  document.getElementById('kv_products').textContent = s.products;
  document.getElementById('kv_usage').textContent = s.usage;
  document.getElementById('kv_flywheel').textContent = s.flywheel;
}

function addTask() {
  let t = document.getElementById('taskName').value.trim();
  if(!t) return;
  DB.addTask({task:t, priority:document.getElementById('taskPri').value, deadline:document.getElementById('taskDeadline').value, assignee:document.getElementById('taskAssignee').value, status:'待开始'});
  document.getElementById('taskName').value=''; render();
}

function updateTask(id,status) { DB.updateTask(id,status); render(); }

function deleteItem(table,id) {
  let d = DB.get(table);
  d = d.filter(x=>x.id!==id);
  DB.set(table, d);
  render();
}

function addCustomer() {
  let n=document.getElementById('custName').value.trim();
  if(!n) return;
  DB.addCustomer({name:n, company:document.getElementById('custCompany').value, email:document.getElementById('custEmail').value, role:document.getElementById('custRole').value});
  document.getElementById('custName').value=''; render();
}

function addPassword() {
  let c=document.getElementById('pwdCode').value.trim();
  if(!c||c.length!==8) return alert('密码必须8位数字');
  DB.addPassword({code:c, customer:document.getElementById('pwdCustomer').value, products:document.getElementById('pwdProd').value, max_uses:parseInt(document.getElementById('pwdMaxUses').value)||9999, used:0, status:'启用'});
  document.getElementById('pwdCode').value=''; render();
}

function addProduct() {
  let n=document.getElementById('prodName').value.trim();
  if(!n) return;
  DB.addProduct({name:n, family:document.getElementById('prodFamily').value});
  document.getElementById('prodName').value=''; render();
}

function importJSON() {
  try {
    let d=JSON.parse(document.getElementById('importData').value);
    for(let [table,items] of Object.entries(d)) {
      let existing = DB.get(table);
      items.forEach(item => { item.id = Date.now()+Math.random(); item.created = new Date().toISOString(); existing.unshift(item); });
      DB.set(table, existing.slice(0,500));
    }
    render(); alert('导入成功！');
  } catch(e) { alert('JSON格式错误: '+e.message); }
}

async function importFromFile() {
  let s=document.getElementById('importStatus');
  s.textContent='加载中...';
  try {
    let r=await fetch('import_data.json');
    let d=await r.json();
    let count=0;
    let mapping={'任务驾驶舱':'tasks','客户档案库':'customers','决策日志':'decisions','北极星指标':'growth','五维测评记录':'assessments','知识资产库':'knowledge','内容资产':'content','案例库':'cases'};
    for(let [table,items] of Object.entries(d)){
      let key=mapping[table]||table;
      let existing=DB.get(key);
      items.forEach(item=>{item._id=Date.now()+Math.random();existing.unshift(item)});
      DB.set(key,existing.slice(0,500));
      count+=items.length;
    }
    s.textContent='✅ 已导入 '+count+' 条！' + (d['任务驾驶舱']?'含任务'+d['任务驾驶舱'].length+'条':'');
    render();
  } catch(e){s.textContent='❌ 加载失败: '+e.message;}
}

function exportAll() {
  let data = {};
  ['tasks','customers','passwords','quality','products','growth'].forEach(t => { data[t] = DB.get(t) });
  let blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '驾驶舱备份_'+new Date().toISOString().substring(0,10)+'.json';
  a.click();
}

function clearAll() {
  if(!confirm('确定清空所有本地数据？此操作不可恢复！建议先导出备份。')) return;
  ['tasks','customers','passwords','quality','products','growth'].forEach(t => localStorage.removeItem('sri_db_'+t));
  DB.seed(); render();
}

render();
</script>
</body>
</html>
