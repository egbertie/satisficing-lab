<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>满意解研究所 · 驾驶舱</title>
  <style>
    /* ===== VI配色变量 ===== */
    :root {
      --primary: #C23B22;
      --bg: #F5F0E6;
      --accent: #B8860B;
      --text: #4A4A4A;
      --title: #2A2A2A;
      --border: #E0D8C8;
      --card-bg: #FFFCF7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(194,59,34,0.15);
      max-width: 400px;
      width: 90%;
    }

    .login-box h1 {
      color: var(--title);
      font-size: 24px;
      margin-bottom: 8px;
    }

    .login-box p {
      color: var(--text);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      text-align: center;
    }

    .login-box input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-box button:hover {
      background: #A63220;
    }

    .login-error {
      color: var(--primary);
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }

    #main-screen { display: none; }

    .header {
      background: var(--card-bg);
      border-bottom: 3px solid var(--primary);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .countdown {
      background: var(--primary);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box input {
      padding: 8px 16px;
      border: 2px solid var(--border);
      border-radius: 20px;
      width: 280px;
      font-size: 14px;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: var(--primary);
      color: white;
    }

    .kpi-bar {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 12px;
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .kpi-card {
      text-align: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .kpi-card .value {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
    }

    .kpi-card .label {
      font-size: 12px;
      color: var(--text);
      margin-top: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 12px 24px;
      background: white;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: var(--bg);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .content {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--title);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .data-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--title);
    }

    .data-table tr:hover {
      background: var(--bg);
    }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .form-row input,
    .form-row select {
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    .form-row input:focus,
    .form-row select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #A63220;
    }

    .btn-danger {
      background: #DC3545;
      color: white;
    }

    .btn-danger:hover {
      background: #C82333;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
    }

    .tag-p0 { background: #FFEBEE; color: #C62828; }
    .tag-p1 { background: #FFF3E0; color: #E65100; }
    .tag-p2 { background: #E3F2FD; color: #1565C0; }
    .tag-p3 { background: #E8F5E9; color: #2E7D32; }

    .highlight {
      background: #FFEB3B;
      padding: 0 2px;
      border-radius: 2px;
    }

    .glossary-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .glossary-item:last-child {
      border-bottom: none;
    }

    .glossary-term {
      font-weight: bold;
      color: var(--primary);
      font-size: 16px;
    }

    .glossary-def {
      margin-top: 6px;
      color: var(--text);
    }

    .timeline {
      position: relative;
      padding-left: 24px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      padding-bottom: 20px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      border: 3px solid var(--bg);
    }

    .timeline-date {
      font-size: 13px;
      color: var(--accent);
      font-weight: bold;
    }

    .timeline-title {
      font-size: 15px;
      color: var(--title);
      margin-top: 4px;
    }

    @media (max-width: 1024px) {
      .kpi-bar { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 768px) {
      .kpi-bar { grid-template-columns: repeat(2, 1fr); }
      .header { flex-direction: column; gap: 12px; }
      .search-box input { width: 200px; }
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>满意解研究所</h1>
    <p>满天星光 · 驾驶舱</p>
    <input type="password" id="password-input" placeholder="输入访问密码">
    <button id="login-btn">进入驾驶舱</button>
    <p class="login-error" id="login-error">密码错误，请重试</p>
  </div>
</div>

<div id="main-screen">
  <div class="header">
    <div class="header-left">
      <span class="logo">满意解研究所</span>
      <span class="countdown" id="countdown">夏至官宣倒计时</span>
    </div>
    <div class="search-box">
      <input type="text" id="global-search" placeholder="搜索任务/客户/产品...">
    </div>
    <button class="logout-btn" id="logout-btn">退出</button>
  </div>

  <div class="kpi-bar" id="kpi-bar"></div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ===== 1. 配置 =====
var CONFIG = {
  PASSWORD: '123654',  // 直接明文存储，简化验证
  STORAGE_KEYS: {
    tasks: 'skylab_tasks',
    customers: 'skylab_customers',
    products: 'skylab_products',
    loggedIn: 'skylab_logged_in'
  },
  TABS: [
    { id: 'overview', label: '概览' },
    { id: 'tasks', label: '任务' },
    { id: 'milestones', label: '里程碑' },
    { id: 'customers', label: '客户' },
    { id: 'products', label: '产品' },
    { id: 'quality', label: '质量' },
    { id: 'financial', label: '财务' },
    { id: 'growth', label: '增长' },
    { id: 'system', label: '系统' },
    { id: 'placeholders', label: '替身' },
    { id: 'glossary', label: '术语表' }
  ],
  XZ_DATE: new Date('2026-06-21')
};

// ===== 2. Store =====
var Store = {
  state: {
    currentTab: 'overview',
    searchQuery: '',
    searchResults: null,
    tasks: [],
    customers: [],
    products: []
  },

  init: function() {
    var tasks = localStorage.getItem(CONFIG.STORAGE_KEYS.tasks);
    var customers = localStorage.getItem(CONFIG.STORAGE_KEYS.customers);
    var products = localStorage.getItem(CONFIG.STORAGE_KEYS.products);

    this.state.tasks = tasks ? JSON.parse(tasks) : this.getDefaultTasks();
    this.state.customers = customers ? JSON.parse(customers) : this.getDefaultCustomers();
    this.state.products = products ? JSON.parse(products) : this.getDefaultProducts();

    if (!tasks && !customers && !products) {
      this.saveAll();
    }
  },

  saveAll: function() {
    localStorage.setItem(CONFIG.STORAGE_KEYS.tasks, JSON.stringify(this.state.tasks));
    localStorage.setItem(CONFIG.STORAGE_KEYS.customers, JSON.stringify(this.state.customers));
    localStorage.setItem(CONFIG.STORAGE_KEYS.products, JSON.stringify(this.state.products));
  },

  setState: function(key, value) {
    this.state[key] = value;
    this.render();
  },

  switchTab: function(tabId) {
    this.state.currentTab = tabId;
    this.state.searchResults = null;
    this.state.searchQuery = '';
    document.getElementById('global-search').value = '';
    this.render();
  },

  search: function(query) {
    this.state.searchQuery = query;
    if (!query.trim()) {
      this.state.searchResults = null;
      this.render();
      return;
    }

    var q = query.toLowerCase();
    var results = { tasks: [], customers: [], products: [] };

    this.state.tasks.forEach(function(t) {
      if ((t.title + '').toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q)) {
        results.tasks.push(t);
      }
    });

    this.state.customers.forEach(function(c) {
      if ((c.name + '').toLowerCase().includes(q) || (c.industry || '').toLowerCase().includes(q)) {
        results.customers.push(c);
      }
    });

    this.state.products.forEach(function(p) {
      if ((p.name + '').toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q)) {
        results.products.push(p);
      }
    });

    this.state.searchResults = results;
    this.render();
  },

  addTask: function(task) {
    task.id = Date.now();
    task.createdAt = new Date().toISOString();
    this.state.tasks.unshift(task);
    this.saveAll();
    this.render();
  },

  addCustomer: function(customer) {
    customer.id = Date.now();
    customer.createdAt = new Date().toISOString();
    this.state.customers.unshift(customer);
    this.saveAll();
    this.render();
  },

  addProduct: function(product) {
    product.id = Date.now();
    product.createdAt = new Date().toISOString();
    this.state.products.unshift(product);
    this.saveAll();
    this.render();
  },

  deleteTask: function(id) {
    this.state.tasks = this.state.tasks.filter(function(t) { return t.id !== id; });
    this.saveAll();
    this.render();
  },

  deleteCustomer: function(id) {
    this.state.customers = this.state.customers.filter(function(c) { return c.id !== id; });
    this.saveAll();
    this.render();
  },

  deleteProduct: function(id) {
    this.state.products = this.state.products.filter(function(p) { return p.id !== id; });
    this.saveAll();
    this.render();
  },

  getDefaultTasks: function() {
    return [
      { id: 1, title: '公众号文章排期', priority: 'P1', status: '进行中', dueDate: '2026-06-01' },
      { id: 2, title: '夏至官宣准备', priority: 'P0', status: '待启动', dueDate: '2026-06-15' },
      { id: 3, title: '决策工具内测', priority: 'P1', status: '已完成', dueDate: '2026-05-28' },
      { id: 4, title: '飞书知识库同步', priority: 'P2', status: '进行中', dueDate: '2026-06-05' },
      { id: 5, title: '客户案例整理', priority: 'P2', status: '待启动', dueDate: '2026-06-10' }
    ];
  },

  getDefaultCustomers: function() {
    return [
      { id: 1, name: '人形机器人创始人A', industry: '人形机器人', status: '潜在客户' },
      { id: 2, name: 'AI芯片创始人B', industry: 'AI芯片/半导体', status: '深入沟通' },
      { id: 3, name: '智能汽车创始人C', industry: '智能汽车', status: '已完成咨询' }
    ];
  },

  getDefaultProducts: function() {
    return [
      { id: 1, name: '决策教练服务', desc: '一对一硬科技创业陪跑', status: '设计完成' },
      { id: 2, name: '公众号内容', desc: '满天星光决策方法论输出', status: '持续更新' },
      { id: 3, name: '决策工具箱', desc: '在线决策评估工具集', status: '开发中' }
    ];
  }
};

// ===== 3. 渲染 =====
Store.render = function() {
  this.renderKPI();
  this.renderTabBar();
  this.renderContent();
  this.updateCountdown();
};

Store.renderKPI = function() {
  var tasks = this.state.tasks;
  var p0 = tasks.filter(function(t) { return t.priority === 'P0'; }).length;
  var p1 = tasks.filter(function(t) { return t.priority === 'P1'; }).length;
  var doing = tasks.filter(function(t) { return t.status === '进行中'; }).length;

  document.getElementById('kpi-bar').innerHTML =
    '<div class="kpi-card"><div class="value">' + tasks.length + '</div><div class="label">任务总数</div></div>' +
    '<div class="kpi-card"><div class="value" style="color:#C62828">' + p0 + '</div><div class="label">P0待办</div></div>' +
    '<div class="kpi-card"><div class="value" style="color:#E65100">' + p1 + '</div><div class="label">P1优先</div></div>' +
    '<div class="kpi-card"><div class="value" style="color:#1565C0">' + doing + '</div><div class="label">进行中</div></div>' +
    '<div class="kpi-card"><div class="value">' + this.state.customers.length + '</div><div class="label">客户数</div></div>' +
    '<div class="kpi-card"><div class="value">' + this.state.products.length + '</div><div class="label">产品数</div></div>' +
    '<div class="kpi-card"><div class="value">233</div><div class="label">线上产品</div></div>' +
    '<div class="kpi-card"><div class="value">12</div><div class="label">Cron任务</div></div>';
};

Store.renderTabBar = function() {
  var self = this;
  document.getElementById('tab-bar').innerHTML = CONFIG.TABS.map(function(tab) {
    return '<button class="tab-btn' + (self.state.currentTab === tab.id ? ' active' : '') + '" data-tab="' + tab.id + '">' + tab.label + '</button>';
  }).join('');

  // 事件绑定
  var btns = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = (function(tabId) {
      return function() { self.switchTab(tabId); };
    })(tab.id);
  }
};

Store.renderContent = function() {
  var tab = this.state.currentTab;
  var renderers = {
    'overview': this.renderOverview,
    'tasks': this.renderTasks,
    'milestones': this.renderMilestones,
    'customers': this.renderCustomers,
    'products': this.renderProducts,
    'quality': this.renderQuality,
    'financial': this.renderFinancial,
    'growth': this.renderGrowth,
    'system': this.renderSystem,
    'placeholders': this.renderPlaceholders,
    'glossary': this.renderGlossary
  };

  if (renderers[tab]) {
    renderers[tab].call(this);
  }
};

Store.renderOverview = function() {
  var tasks = this.state.tasks.slice(0, 5);
  var html = '<div class="card"><div class="card-title">本周待办</div><table class="data-table"><thead><tr><th>任务</th><th>优先级</th><th>状态</th><th>截止</th></tr></thead><tbody>';
  tasks.forEach(function(t) {
    html += '<tr><td>' + t.title + '</td><td><span class="tag tag-' + t.priority.toLowerCase() + '">' + t.priority + '</span></td><td>' + t.status + '</td><td>' + (t.dueDate || '-') + '</td></tr>';
  });
  html += '</tbody></table></div><div class="card"><div class="card-title">最新动态</div><p>暂无动态</p></div>';
  document.getElementById('content').innerHTML = html;
};

Store.renderTasks = function() {
  var self = this;
  if (this.state.searchResults) {
    return this.renderSearchResults(this.state.searchResults.tasks, ['title', 'priority', 'status']);
  }

  var tasks = this.state.tasks;
  var html = '<div class="card"><div class="card-title">添加新任务</div><div class="form-row">' +
    '<input type="text" id="task-title" placeholder="任务标题">' +
    '<select id="task-priority"><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option></select>' +
    '<select id="task-status"><option value="待启动">待启动</option><option value="进行中">进行中</option><option value="已完成">已完成</option></select>' +
    '<input type="date" id="task-due"></div>' +
    '<button class="btn btn-primary" id="add-task-btn">添加任务</button></div>' +

    '<div class="card"><div class="card-title">任务列表 (' + tasks.length + ')</div><table class="data-table"><thead><tr><th>任务</th><th>优先级</th><th>状态</th><th>截止</th><th>操作</th></tr></thead><tbody>';

  tasks.forEach(function(t) {
    html += '<tr><td>' + t.title + '</td><td><span class="tag tag-' + t.priority.toLowerCase() + '">' + t.priority + '</span></td><td>' + t.status + '</td><td>' + (t.dueDate || '-') + '</td><td><button class="btn btn-danger btn-sm" data-delete="task" data-id="' + t.id + '">删除</button></td></tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;

  // 绑定事件
  document.getElementById('add-task-btn').onclick = function() {
    var title = document.getElementById('task-title').value.trim();
    var priority = document.getElementById('task-priority').value;
    var status = document.getElementById('task-status').value;
    var dueDate = document.getElementById('task-due').value;
    if (!title) { alert('请输入任务标题'); return; }
    self.addTask({ title: title, priority: priority, status: status, dueDate: dueDate });
  };

  document.querySelectorAll('[data-delete="task"]').forEach(function(btn) {
    btn.onclick = function() { self.deleteTask(parseInt(this.dataset.id)); };
  });
};

Store.renderMilestones = function() {
  var milestones = [
    { date: '2026-06-01', title: '公众号正式上线' },
    { date: '2026-06-15', title: '夏至官宣内容定稿' },
    { date: '2026-06-21', title: '夏至官宣发布' },
    { date: '2026-07-01', title: '首期训练营开营' },
    { date: '2026-09-22', title: '秋分里程碑复盘' }
  ];

  var html = '<div class="card"><div class="card-title">项目里程碑</div><div class="timeline">';
  milestones.forEach(function(m) {
    html += '<div class="timeline-item"><div class="timeline-date">' + m.date + '</div><div class="timeline-title">' + m.title + '</div></div>';
  });
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
};

Store.renderCustomers = function() {
  var self = this;
  if (this.state.searchResults) {
    return this.renderSearchResults(this.state.searchResults.customers, ['name', 'industry', 'status']);
  }

  var customers = this.state.customers;
  var html = '<div class="card"><div class="card-title">添加新客户</div><div class="form-row">' +

Store.renderSearchResults = function(items, columns) {
  if (!items || items.length === 0) {
    document.getElementById('content').innerHTML = '<div class="card"><p>未找到匹配结果</p></div>';
    return;
  }

  var html = '<div class="card"><div class="card-title">搜索结果 (' + items.length + ')</div><table class="data-table"><thead><tr>';
  columns.forEach(function(c) { html += '<th>' + c + '</th>'; });
  html += '</tr></thead><tbody>';

  var q = this.state.searchQuery || '';
  items.forEach(function(item) {
    html += '<tr>';
    columns.forEach(function(c) {
      var val = item[c] || '-';
      if (q && typeof val === 'string') {
        val = val.replace(new RegExp('(' + q + ')', 'gi'), '<span class="highlight">$1</span>');
      }
      html += '<td>' + val + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
};

Store.updateCountdown = function() {
  var diff = CONFIG.XZ_DATE - new Date();
  var days = Math.floor(diff / (1000 * 60 * 60 * 24));
  var el = document.getElementById('countdown');
  if (el) el.textContent = '夏至官宣倒计时 ' + days + ' 天';
};

// ===== 4. 事件绑定 =====
function initEvents() {
  // 登录
  document.getElementById('login-btn').onclick = function() {
    var password = document.getElementById('password-input').value;
    if (password === CONFIG.PASSWORD) {
      localStorage.setItem(CONFIG.STORAGE_KEYS.loggedIn, 'true');
      showMain();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('password-input').value = '';
      document.getElementById('password-input').focus();
    }
  };

  // 回车登录
  document.getElementById('password-input').onkeypress = function(e) {
    if (e.key === 'Enter') {
      document.getElementById('login-btn').click();
    }
  };

  // 搜索
  document.getElementById('global-search').oninput = function() {
    Store.search(this.value);
  };

  // 登出
  document.getElementById('logout-btn').onclick = function() {
    localStorage.removeItem(CONFIG.STORAGE_KEYS.loggedIn);
    location.reload();
  };
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  Store.init();
  Store.render();
  setInterval(function() { Store.updateCountdown(); }, 1000);
}

// ===== 5. 启动 =====
(function() {
  initEvents();
  if (localStorage.getItem(CONFIG.STORAGE_KEYS.loggedIn) === 'true') {
    showMain();
  }
})();
</script>
