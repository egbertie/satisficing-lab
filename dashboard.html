<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#F5F0E6;color:#4A4A4A;min-height:100vh;padding:20px}
.gate{position:fixed;top:0;left:0;width:100%;height:100%;background:#F5F0E6;z-index:9999;display:flex;align-items:center;justify-content:center}
.gb{background:#fff;border-radius:20px;padding:36px 28px;max-width:360px;width:90%;text-align:center;border:2px solid #C23B22}
.gb input{width:42px;height:52px;border:2px solid #D4C5A0;border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:monospace;background:#F5F0E6}

.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#C23B22;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.app{display:none;max-width:600px;margin:0 auto}
.tab{display:flex;gap:4px;margin:10px 0}
.tab button{padding:8px 16px;border-radius:16px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px}
.tab button.on{background:#C23B22;color:#fff;border-color:#C23B22}
.panel{background:#fff;border-radius:12px;padding:16px;margin:8px 0;border:1px solid #e0d5c8}

.ki{background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid #e0d5c8;cursor:pointer}
.ki:hover{border-color:#C23B22}.ki .v{font-size:22px;font-weight:800;color:#C23B22}.ki .l{font-size:9px;color:#6E6E6E;margin-top:2px}.ki .s{font-size:8px;color:#B8860B}
.tc-btn{padding:6px 11px;border-radius:14px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.tc-btn.on{background:#C23B22;color:#fff;border-color:#C23B22}
.pn{background:#fff;border-radius:12px;padding:14px;margin:8px 0;border:1px solid #e0d5c8}
.pn-h{font-size:14px;color:#2A2A2A;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #f0e8d8}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:10px}
.si{background:#F5F0E6;border-radius:8px;padding:10px;text-align:center}.si .v{font-size:20px;font-weight:700;color:#2A2A2A}.si .l{font-size:9px;color:#6E6E6E}
.pbar{height:6px;background:#f0e8d8;border-radius:3px;overflow:hidden;flex:1}.pfill{height:100%;background:#C23B22}
.tbl{width:100%;border-collapse:collapse;font-size:10px}.tbl th{background:#F5F0E6;color:#2A2A2A;padding:5px 4px;text-align:left;font-size:9px;font-weight:600;border-bottom:2px solid #C23B22}.tbl td{padding:5px 4px;border-bottom:1px solid #f0e8d8;font-size:9px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}.dr{background:#C23B22}.da{background:#B8860B}.dg{background:#3D7A4F}

.fr{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}.fr input,.fr select{flex:1;padding:5px 7px;border:1.5px solid #D4C5A0;border-radius:8px;font-size:10px;min-width:70px;background:#fff}
.btn{padding:5px 12px;border-radius:10px;border:none;cursor:pointer;font-size:10px;font-weight:600;background:#C23B22;color:#fff}
.emp{text-align:center;padding:30px;color:#6E6E6E;opacity:0.5;font-size:12px}
.bl{border-left:3px solid #C23B22}
.sr{padding:7px 10px;border-bottom:1px solid #f0e8d8;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:11px}.sr .st{font-size:10px;opacity:0.5;min-width:30px}.sr .sa{font-size:9px;color:#B8860B;margin-left:auto}

</style>
</head>

      c += v;
    }
    if (c === '123654') {
      localStorage.setItem('sri_dashboard_auth', 'true');

      document.getElementById('gate').style.display = 'none';

      openApp();
    } else {
      document.getElementById('ge').textContent = '密码错误';

  btns.forEach(function(b) { b.classList.remove('on'); });

// 打开应用

// ===== DATA ENGINE =====
var DB={
