<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱最小验证版</title>
<link rel="stylesheet" href="vi_quick_ref.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#F5F0E6;color:#4A4A4A;min-height:100vh;padding:20px}
.gate{position:fixed;top:0;left:0;width:100%;height:100%;background:#F5F0E6;z-index:9999;display:flex;align-items:center;justify-content:center}
.gb{background:#fff;border-radius:20px;padding:36px 28px;max-width:360px;width:90%;text-align:center;border:2px solid #C23B22}
.gb input{width:42px;height:52px;border:2px solid #D4C5A0;border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:monospace;background:#F5F0E6}
.gd{display:flex;gap:6px;justify-content:center;margin:12px 0}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#C23B22;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.app{display:none;max-width:600px;margin:0 auto}
.tab{display:flex;gap:4px;margin:10px 0}
.tab button{padding:8px 16px;border-radius:16px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px}
.tab button.on{background:#C23B22;color:#fff;border-color:#C23B22}
.panel{background:#fff;border-radius:12px;padding:16px;margin:8px 0;border:1px solid #e0d5c8}

/* Cockpit */
.ki{background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid #e0d5c8;cursor:pointer}
.ki:hover{border-color:#C23B22}.ki .v{font-size:22px;font-weight:800;color:#C23B22}.ki .l{font-size:9px;color:#6E6E6E;margin-top:2px}.ki .s{font-size:8px;color:#B8860B}
.tc-btn{padding:5px 10px;border-radius:14px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.tc-btn.on{background:#C23B22;color:#fff;border-color:#C23B22}
.pn{background:#fff;border-radius:12px;padding:14px;margin:8px 0;border:1px solid #e0d5c8}
.pn-h{font-size:14px;color:#2A2A2A;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #f0e8d8}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:10px}
.si{background:#F5F0E6;border-radius:8px;padding:12px;text-align:center}.si .v{font-size:20px;font-weight:700;color:#2A2A2A}.si .l{font-size:9px;color:#6E6E6E}.si .s{font-size:8px;color:#B8860B}
.pbar{height:6px;background:#f0e8d8;border-radius:3px;overflow:hidden;flex:1}.pfill{height:100%;background:#C23B22}
.tbl{width:100%;border-collapse:collapse;font-size:10px}.tbl th{background:#F5F0E6;color:#2A2A2A;padding:5px 4px;text-align:left;font-size:9px;font-weight:600;border-bottom:2px solid #C23B22}.tbl td{padding:5px 4px;border-bottom:1px solid #f0e8d8;font-size:9px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}.dr{background:#C23B22}.da{background:#B8860B}.dg{background:#3D7A4F}
.tg{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600;margin:1px}.tgr{background:rgba(194,59,34,0.12);color:#C23B22}.tga{background:rgba(184,134,11,0.12);color:#B8860B}.tgg{background:rgba(61,122,79,0.12);color:#3D7A4F}
.fr{display:flex;gap:5px;margin:6px 0;flex-wrap:wrap}.fr input,.fr select{flex:1;padding:5px 7px;border:1.5px solid #D4C5A0;border-radius:8px;font-size:10px;min-width:70px;background:#fff}
.emp{text-align:center;padding:30px;color:#6E6E6E;opacity:0.5;font-size:12px}
.sr{padding:8px 12px;border-bottom:1px solid #f0e8d8;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:11px}
.sr:hover{background:rgba(194,59,34,0.03)}.sr .ty{font-size:10px;opacity:0.5;min-width:30px}.sr .ar{font-size:9px;color:#B8860B;margin-left:auto}
.ac{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;margin:5px 0;border:1px solid #e0d5c8;background:#fff;border-radius:10px}
.ac .l{flex:1}.ac .r{text-align:right;min-width:36px}.ac .n{font-weight:600;color:#2A2A2A;font-size:13px}.ac .m{font-size:9px;color:#B8860B;margin-top:2px}.ac .q{font-size:10px;color:#6E6E6E;font-style:italic;margin-top:2px}.ac .sc{font-size:18px;font-weight:700;color:#C23B22}
.bl{border-left:3px solid #C23B22}

</style>
</head>
<body>

<div class="gate" id="gate">
<div class="gb">
<h2 style="font-size:18px;color:#2A2A2A;margin-bottom:8px">驾驶舱 · 最小验证</h2>
<p style="font-size:12px;color:#6E6E6E;margin-bottom:14px">输入密码 123654</p>
<div class="gd">
<input type="password" maxlength="1" id="g0"><input type="password" maxlength="1" id="g1">
<input type="password" maxlength="1" id="g2"><input type="password" maxlength="1" id="g3">
<input type="password" maxlength="1" id="g4"><input type="password" maxlength="1" id="g5">
</div>
<p id="ge" style="color:#C23B22;font-size:12px;min-height:18px"></p>
<button class="btn" onclick="gv()">验证</button>
</div></div>

<div class="app" id="app">
<script>
// 诊断记录
var diag = [];
function log(msg) { diag.push(new Date().toLocaleTimeString() + ' ' + msg); document.getElementById('diag').textContent = diag.join(' | '); }

log('JS引擎启动');

// localStorage 测试
try { localStorage.setItem('_dash_test_', 'ok'); document.getElementById('lsWrite').textContent = '✅ 可写'; log('LS写入OK'); }
catch(e) { document.getElementById('lsWrite').textContent = '❌ 不可写: '+e.message; log('LS写入FAIL'); }

try { var v = localStorage.getItem('_dash_test_'); document.getElementById('lsRead').textContent = v==='ok'?'✅ 可读':'❌ 值不匹配'; log('LS读取: '+v); }
catch(e) { document.getElementById('lsRead').textContent = '❌ 不可读'; log('LS读取FAIL'); }

document.getElementById('loadTime').textContent = new Date().toLocaleTimeString();

// 密码逻辑
var GH = '6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
(function() {
  var sv = localStorage.getItem('sri_dash_auth_hash');
  if (localStorage.getItem('sri_dashboard_auth') === 'true') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('authStatus').textContent = '✅ 已验证（免登）';
    openApp();
    return;
  }
  document.getElementById('authStatus').textContent = '⏳ 未验证';
  document.getElementById('g0').focus();

  // 键盘导航
  document.addEventListener('input', function(e) {
    if (!e.target.closest('.gd')) return;
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value && e.target.nextElementSibling && e.target.nextElementSibling.tagName === 'INPUT')
      e.target.nextElementSibling.focus();
  });
  document.addEventListener('keydown', function(e) {
    if (!e.target.closest('.gd')) return;
    if (e.key === 'Backspace' && !e.target.value && e.target.previousElementSibling && e.target.previousElementSibling.tagName === 'INPUT')
      e.target.previousElementSibling.focus();
  });

  window.gv = function() {
    var c = '';
    for (var i = 0; i < 6; i++) {
      var v = document.getElementById('g' + i).value;
      if (!v) { document.getElementById('ge').textContent = '请输入完整6位密码'; return; }
      c += v;
    }
    // Simple verify: plaintext compare (hash=False mode for now)
    if (c === '123654') {
      localStorage.setItem('sri_dashboard_auth', 'true');
      localStorage.setItem('sri_dash_auth_hash', GH);
      document.getElementById('gate').style.display = 'none';
      openApp();
    } else {
      document.getElementById('ge').textContent = '密码错误';
    }
  };
})();

// Tab切换
function st(id) {
  log('Tab切换: ' + id);
  var btns = document.querySelectorAll('.tab button');
  btns.forEach(function(b) { b.classList.remove('on'); });
  // 找对应按钮
  var map = { a: 0, b: 1, c: 2 };
  if (btns[map[id]]) btns[map[id]].classList.add('on');
  document.getElementById('content').innerHTML = '<h3 style="font-size:15px;color:#2A2A2A">✅ Tab ' + id.toUpperCase() + ' 已切换</h3><p style="font-size:12px;color:#6E6E6E;margin-top:8px">时间戳: ' + new Date().toLocaleTimeString() + '</p><p style="font-size:12px;color:#C23B22;margin-top:4px">切换成功！JS和DOM都正常工作。</p>';
}

// 打开应用

// ===== DATA ENGINE =====
function DBG(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d||[]}catch(e){return d||[]}}
function DBS(k,v){localStorage.setItem(k,JSON.stringify(v))}
var DB={
  ts:function(){return DBG("sri_db_tasks")},
  cs:function(){return DBG("sri_db_customers")},
  pw:function(){return DBG("sri_db_passwords")},
  qu:function(){return DBG("sri_db_quality")},
  pr:function(){return DBG("sri_db_products")},
  gr:function(){return DBG("sri_db_gr")},
  seed:function(){
    if(!this.pw().length)DBS("sri_db_passwords",[{id:1,code:"123654",products:"all",customer:"内测",status:"启用"}]);
    if(!this.qu().length)DBS("sri_db_quality",[{qm_id:"QM-001",standard:"L0提案审核",status:"待执行",priority:"P0"},{qm_id:"QM-002",standard:"L1方法论审核",status:"55%",priority:"P0"},{qm_id:"QM-009",standard:"四关通过率>=80%",status:"96%",priority:"P0"},{qm_id:"QM-026",standard:"商标注册",status:"未申请",priority:"P0"}]);
    if(!this.gr().length)DBS("sri_db_gr",[{m:"飞轮循环",c:0,t:100},{m:"线上产品",c:233,t:250},{m:"活跃客户30d",c:0,t:10},{m:"NPS",c:"—",t:">=50"}]);
  }
};

var S={tab:"overview",q:""};
var TABS=[
  {id:"overview",l:"🏠 概览"},{id:"tasks",l:"📋 任务"},{id:"project",l:"🗓️ 项目"},
  {id:"customers",l:"👤 客户"},{id:"products",l:"📦 产品"},{id:"quality",l:"✅ 质量"},
  {id:"finance",l:"💰 财务"},{id:"growth",l:"📈 增长"},{id:"system",l:"⚡ 系统"},
  {id:"avatars",l:"🎭 替身"},{id:"glossary",l:"📖 术语"}
];
var MLS=[{n:"产品命名体系",d:"05-28",s:"完成"},{n:"233产品上线",d:"05-28",s:"完成"},{n:"产品标准体系",d:"05-28",s:"完成"},{n:"驾驶舱中枢",d:"05-29",s:"完成"},{n:"增长飞轮引擎",d:"05-28",s:"完成"},{n:"密码门控体系",d:"05-28",s:"完成"},{n:"内容弹药就绪",d:"05-28",s:"完成"},{n:"飞书驾驶舱精简",d:"05-29",s:"完成"},{n:"资产飞轮运转",d:"05-29",s:"完成"},{n:"来源标注补齐",d:"06-07",s:"进行中"},{n:"产品星级评定",d:"06-14",s:"待开始"},{n:"夏至路演准备",d:"06-21",s:"进行中"}];
var RSK=[{r:"商标未注册",pr:"中",im:"高",lv:"🔴",m:"QM-026尽快申请",o:"Egbertie"},{r:"公开课无人报名",pr:"中",im:"中",lv:"🟡",m:"公众号预热",o:"Egbertie"},{r:"测评信效度未验证",pr:"低",im:"中",lv:"🟡",m:">=100样本",o:"满意红"},{r:"GitHub宕机",pr:"低",im:"高",lv:"🟡",m:"本地备份",o:"满意红"},{r:"公众号未认证",pr:"高",im:"中",lv:"🟡",m:"阅读原文替代",o:"Egbertie"}];

function rt(){var h="";TABS.forEach(function(t){h+='<button class="tc-btn'+(S.tab===t.id?' on':'')+'" onclick="st(\''+t.id+'\')">'+t.l+'</button>'});var el=document.getElementById("tabs");if(el)el.innerHTML=h}
function st(id){S.tab=id;S.q="";var gs=document.getElementById("gs");if(gs)gs.value="";rt();rk();rc()}
function rk(){
  var ts=DB.ts(),dn=ts.filter(function(t){return(t.status||"").indexOf("完成")>=0}).length;
  var p0=ts.filter(function(t){return(t.priority||"").indexOf("P0")>=0&&(t.status||"").indexOf("完成")<0}).length;
  var h='<div class="ki" onclick="st(\'tasks\')"><div class="v">'+ts.length+'</div><div class="l">📋 任务</div><div class="s">✅'+dn+'</div></div>';
  h+='<div class="ki" onclick="st(\'tasks\')"><div class="v" style="color:'+(p0>0?'#C23B22':'#3D7A4F')+'">'+p0+'</div><div class="l">🔴 P0</div></div>';
  h+='<div class="ki" onclick="st(\'customers\')"><div class="v">'+DB.cs().length+'</div><div class="l">👤 客户</div></div>';
  h+='<div class="ki" onclick="st(\'products\')"><div class="v">'+DB.pr().length+'</div><div class="l">📦 产品</div></div>';
  h+='<div class="ki" onclick="st(\'quality\')"><div class="v">'+DB.qu().length+'</div><div class="l">✅ 质量</div></div>';
  h+='<div class="ki"><div class="v">233</div><div class="l">🌐 线上</div></div>';
  h+='<div class="ki"><div class="v">12</div><div class="l">⚡ Cron</div></div>';
  h+='<div class="ki" onclick="st(\'avatars\')"><div class="v">23</div><div class="l">🎭 替身</div></div>';
  var el=document.getElementById("kpi");if(el)el.innerHTML=h;
}

function sch(){var gs=document.getElementById("gs");S.q=gs?gs.value.trim().toLowerCase():"";rt();rc()}
function flt(arr,fs,q){if(!q)return arr;return(arr||[]).filter(function(i){return fs.some(function(f){var v=i[f];return v&&String(v).toLowerCase().indexOf(q)>=0})})}

function P(t){return '<div class="pn">'+t+'</div>'}
function PH(t){return '<div class="pn-h">'+t+'</div>'}

function rc(){
  var h="",ts=DB.ts(),dn=ts.filter(function(t){return(t.status||"").indexOf("完成")>=0}).length;
  var p0=ts.filter(function(t){return(t.priority||"").indexOf("P0")>=0&&(t.status||"").indexOf("完成")<0});
  var d=Math.ceil((new Date(2026,5,21)-new Date())/86400000);
  
  if(S.q){
    h+=PH("🔍 搜索: <b>"+S.q+"</b>");
    var rs=[];
    flt(DB.ts(),["task","priority","status"],S.q).forEach(function(t){rs.push({ty:"📋",tx:t.task+" ["+t.priority+"] "+t.status,tb:"tasks"})});
    flt(DB.cs(),["name","company"],S.q).forEach(function(c){rs.push({ty:"👤",tx:c.name+" "+(c.company||""),tb:"customers"})});
    flt(DB.pr(),["name","family"],S.q).forEach(function(p){rs.push({ty:"📦",tx:p.name,tb:"products"})});
    flt(DB.qu(),["standard","qm_id"],S.q).forEach(function(q){rs.push({ty:"✅",tx:q.qm_id+" "+q.standard,tb:"quality"})});
    MLS.forEach(function(m){if(m.n.indexOf(S.q)>=0)rs.push({ty:"🎯",tx:m.n+" "+m.s,tb:"overview"})});
    RSK.forEach(function(r){if(r.r.indexOf(S.q)>=0)rs.push({ty:"⚠️",tx:r.r,tb:"project"})});
    if(rs.length===0)h+='<div class="emp">未找到匹配</div>';
    else rs.forEach(function(r){h+='<div class="sr" onclick="st(\''+r.tb+'\')"><span class="ty">'+r.ty+'</span><span>'+r.tx+'</span><span class="ar">查看 →</span></div>'});
    h='<div class="pn">'+h+'</div>';
  } else if(S.tab==="overview"){
    var pct=ts.length>0?Math.round(dn/ts.length*100):0;
    h+=P(PH("📊 概览 · 夏至 <b style=\"color:#C23B22;font-size:18px\">"+d+"天</b>")+
      '<div class="sg">'+
      '<div class="si"><div class="v">'+pct+'%</div><div class="l">完成率</div></div>'+
      '<div class="si"><div class="v" style="color:'+(p0.length>0?'#C23B22':'#3D7A4F')+'">'+p0.length+'</div><div class="l">🔴 P0</div></div>'+
      '<div class="si"><div class="v">233</div><div class="l">线上产品</div></div>'+
      '<div class="si"><div class="v">12</div><div class="l">Cron健康</div></div>'+
      '<div class="si"><div class="v">23</div><div class="l">替身就绪</div></div>'+
      '</div>');
    if(p0.length>0){h+=P('<div style="color:#C23B22;font-weight:600;margin-bottom:6px;font-size:12px">🔴 P0 紧急 ('+p0.length+'项)</div>'+p0.slice(0,8).map(function(t){return '<div style="padding:4px 0;border-bottom:1px solid #f0e8d8;font-size:11px">'+t.task+'</div>'}).join(''));}
    var md=MLS.filter(function(m){return m.s==="完成"}).length;
    h+=P(PH("🎯 里程碑 ("+md+"/"+MLS.length+")")+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:10px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'%</span></div>'+
      MLS.filter(function(m){return m.s!=="完成"}).map(function(m){return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px solid #f0e8d8"><span>'+m.n+'</span><span><span class="tg '+(m.s==="进行中"?"tga":"tgr")+'">'+m.s+'</span> '+m.d+'</span></div>'}).join(''));
    var g=DB.gr();if(g.length>0){h+=P(PH("📈 关键指标")+g.map(function(x){return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px"><span>'+x.m+'</span><span><b>'+x.c+'</b> /'+x.t+'</span></div>'}).join(''));}
  } else if(S.tab==="tasks"){
    h+=P(PH("📋 任务 ("+ts.length+")")+'<div class="fr"><input id="tn" placeholder="任务名"><select id="tp"><option>P0</option><option selected>P1</option><option>P2</option></select><button class="btn" onclick="addT()">+</button></div>');
    if(ts.length===0)h='<div class="emp">暂无任务</div>';
    else{h+='<table class="tbl"><tr><th>任务</th><th>P</th><th>状态</th></tr>';ts.forEach(function(t){h+='<tr><td>'+t.task+'</td><td>'+t.priority+'</td><td><span class="dot '+(t.status.indexOf("完成")>=0?"dg":t.status.indexOf("进行")>=0?"da":"dr")+'"></span>'+t.status+'</td></tr>'});h+='</table>';}
  } else if(S.tab==="project"){
    var md=MLS.filter(function(m){return m.s==="完成"}).length;
    h+=P(PH("🗓️ 项目 · 里程碑"));h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:10px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'%</span></div>';
    h+='<table class="tbl"><tr><th>里程碑</th><th>截止</th><th>状态</th></tr>'+MLS.map(function(m){return '<tr><td>'+m.n+'</td><td>'+m.d+'</td><td><span class="tg '+(m.s==="完成"?"tgg":m.s==="进行中"?"tga":"tgr")+'">'+m.s+'</span></td></tr>'}).join('')+'</table>';
    h+=P(PH('⚠️ 风险')+'<table class="tbl"><tr><th>风险</th><th>概率</th><th>缓解</th></tr>'+RSK.map(function(r){return '<tr><td>'+r.lv+' '+r.r+'</td><td>'+r.pr+'</td><td>'+r.m+'</td></tr>'}).join('')+'</table>');
    h='<div class="pn">'+h+'</div>';
  } else if(S.tab==="customers"){
    var cs=DB.cs();h+=P(PH("👤 客户 ("+cs.length+")")+'<div class="fr"><input id="cn" placeholder="姓名"><input id="cc" placeholder="企业"><button class="btn" onclick="addC()">+</button></div>');
    if(cs.length===0)h='<div class="emp">暂无客户</div>';else{h+='<table class="tbl"><tr><th>姓名</th><th>企业</th></tr>'+cs.map(function(c){return '<tr><td>'+c.name+'</td><td>'+(c.company||"")+'</td></tr>'}).join('')+'</table>';}
  } else if(S.tab==="products"){
    var pr=DB.pr();h+=P(PH("📦 产品 ("+pr.length+")")+'<div class="fr"><input id="pn" placeholder="产品名"><input id="pf" placeholder="五族"><button class="btn" onclick="addP()">+</button></div>');
    if(pr.length===0)h='<div class="emp">暂无产品</div>';else{h+='<table class="tbl"><tr><th>名称</th><th>五族</th></tr>'+pr.map(function(p){return '<tr><td>'+p.name+'</td><td>'+(p.family||"")+'</td></tr>'}).join('')+'</table>';}
  } else if(S.tab==="quality"){
    var qu=DB.qu();h+=P(PH("✅ 质量 ("+qu.length+")"));
