<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱最小验证版</title>
<link rel="stylesheet" href="vi_quick_ref.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#F5F0E6;color:#4A4A4A;min-height:100vh;padding:20px}
.gate{position:fixed;top:0;left:0;width:100%;height:100%;background:#F5F0E6;z-index:9999;display:flex;align-items:center;justify-content:center}
.gb{background:#fff;border-radius:20px;padding:36px 28px;max-width:360px;width:90%;text-align:center;border:2px solid #C23B22}
.gb input{width:42px;height:52px;border:2px solid #D4C5A0;border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:monospace;background:#F5F0E6}
.gd{display:flex;gap:6px;justify-content:center;margin:12px 0}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#C23B22;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.app{display:none;max-width:600px;margin:0 auto}
.tab{display:flex;gap:4px;margin:10px 0}
.tab button{padding:8px 16px;border-radius:16px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px}
.tab button.on{background:#C23B22;color:#fff;border-color:#C23B22}
.panel{background:#fff;border-radius:12px;padding:16px;margin:8px 0;border:1px solid #e0d5c8}
</style>
</head>
<body>

<div class="gate" id="gate">
<div class="gb">
<h2 style="font-size:18px;color:#2A2A2A;margin-bottom:8px">驾驶舱 · 最小验证</h2>
<p style="font-size:12px;color:#6E6E6E;margin-bottom:14px">输入密码 123654</p>
<div class="gd">
<input type="password" maxlength="1" id="g0"><input type="password" maxlength="1" id="g1">
<input type="password" maxlength="1" id="g2"><input type="password" maxlength="1" id="g3">
<input type="password" maxlength="1" id="g4"><input type="password" maxlength="1" id="g5">
</div>
<p id="ge" style="color:#C23B22;font-size:12px;min-height:18px"></p>
<button class="btn" onclick="gv()">验证</button>
</div></div>


<div class="app" id="app" style="max-width:1100px;margin:0 auto;padding:4px 14px 60px">
<div class="kv" id="kpi" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:10px"></div>
<div class="tab" id="tabs" style="display:flex;gap:4px;flex-wrap:wrap;margin:10px 0"></div>
<div class="panel" id="mc" style="min-height:300px"></div>
</div>

<script>
// ===== DATA ENGINE (verified from dashboard-vfy.html) =====
function dbs(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d||[]}catch(e){return d||[]}}
function dbsv(k,v){localStorage.setItem(k,JSON.stringify(v))}
var DB={
  ts:function(){return dbs("sri_db_tasks")},cs:function(){return dbs("sri_db_customers")},
  pw:function(){return dbs("sri_db_passwords")},qu:function(){return dbs("sri_db_quality")},
  pr:function(){return dbs("sri_db_products")},gr:function(){return dbs("sri_db_gr")},
  seed:function(){
    if(!this.pw().length)dbsv("sri_db_passwords",[{id:1,code:"123654",products:"all",customer:"内测",status:"启用"}]);
    if(!this.qu().length)dbsv("sri_db_quality",[{qm_id:"QM-001",standard:"L0提案审核",status:"待执行",priority:"P0"},{qm_id:"QM-002",standard:"L1方法论审核",status:"55%",priority:"P0"},{qm_id:"QM-009",standard:"四关通过率≥80%",status:"96%",priority:"P0"},{qm_id:"QM-026",standard:"商标注册",status:"未申请",priority:"P0"}]);
    if(!this.gr().length)dbsv("sri_db_gr",[{m:"飞轮循环",c:0,t:100},{m:"线上产品",c:233,t:250},{m:"活跃客户30d",c:0,t:10}]);
  }
};

// ===== STATE =====
var TAB=[
  {id:"overview",l:"🏠 概览"},{id:"tasks",l:"📋 任务"},{id:"project",l:"🗓️ 项目"},
  {id:"customers",l:"👤 客户"},{id:"products",l:"📦 产品"},{id:"quality",l:"✅ 质量"},
  {id:"finance",l:"💰 财务"},{id:"growth",l:"📈 增长"},{id:"system",l:"⚡ 系统"},
  {id:"avatars",l:"🎭 替身"},{id:"glossary",l:"📖 术语"}
];
var S={tab:"overview",q:""};

// ===== INIT =====
function init2(){
  DB.seed();
  document.getElementById("tbar").classList.remove("hid");
  document.getElementById("app").style.display="block";
  var d=Math.ceil((new Date(2026,5,21)-new Date())/86400000);
  document.getElementById("cd").innerHTML="夏至 <b>"+d+"天</b>";
  rt(); rk(); rc();
}
// Hook into gate (the gate script calls init() — we rename to init2 and add bridge)
var origInit = window.init;
window.init = function(){ init2(); };

function rt(){
  var h=""; TAB.forEach(function(t){h+='<button class="tc-btn'+(S.tab===t.id?' on':'')+'" onclick="st(\''+t.id+'\')">'+t.l+'</button>'});
  document.getElementById("tabs").innerHTML=h;
}
function st(id){S.tab=id;S.q="";document.getElementById("gs").value="";rt();rk();rc()}

function rk(){
  var ts=DB.ts(),dn=ts.filter(function(t){return(t.status||"").indexOf("完成")>=0}).length;
  var ip=ts.filter(function(t){return(t.status||"").indexOf("进行")>=0}).length;
  var p0=ts.filter(function(t){return(t.priority||"").indexOf("P0")>=0&&(t.status||"").indexOf("完成")<0}).length;
  var h="";
  h+='<div class="ki" onclick="st(\'tasks\')"><div class="v">'+ts.length+'</div><div class="l">📋 任务</div><div class="s">✅'+dn+' 🔄'+ip+'</div></div>';
  h+='<div class="ki" onclick="st(\'tasks\')"><div class="v" style="color:'+(p0>0?"#C23B22":"#3D7A4F")+'">'+p0+'</div><div class="l">🔴 P0</div></div>';
  h+='<div class="ki" onclick="st(\'customers\')"><div class="v">'+DB.cs().length+'</div><div class="l">👤 客户</div></div>';
  h+='<div class="ki" onclick="st(\'products\')"><div class="v">'+DB.pr().length+'</div><div class="l">📦 产品</div></div>';
  h+='<div class="ki"><div class="v">233</div><div class="l">🌐 线上</div></div>';
  h+='<div class="ki"><div class="v">12</div><div class="l">⚡ Cron</div></div>';
  h+='<div class="ki"><div class="v">23</div><div class="l">🎭 替身</div></div>';
  document.getElementById("kpi").innerHTML=h;
}

function sch(){
  S.q=document.getElementById("gs").value.trim().toLowerCase();
  rt(); rc();
}

function flt(arr,fs,q){if(!q)return arr;return(arr||[]).filter(function(i){return fs.some(function(f){var v=i[f];return v&&String(v).toLowerCase().indexOf(q)>=0})})}

function rc(){
  var h="";
  if(S.q){
    h+='<div class="pn"><div class="pn-h">🔍 搜索: <b>'+S.q+'</b></div>';
    var rs=[];
    flt(DB.ts(),["task","priority","status"],S.q).forEach(function(t){rs.push({ty:"📋 任务",tx:t.task+" ["+t.priority+"] "+t.status,tb:"tasks"})});
    flt(DB.cs(),["name","company","email"],S.q).forEach(function(c){rs.push({ty:"👤 客户",tx:c.name+" · "+(c.company||""),tb:"customers"})});
    flt(DB.pr(),["name","family"],S.q).forEach(function(p){rs.push({ty:"📦 产品",tx:p.name,tb:"products"})});
    flt(DB.qu(),["standard","qm_id"],S.q).forEach(function(q){rs.push({ty:"✅ 质量",tx:q.qm_id+" "+q.standard,tb:"quality"})});
    if(rs.length===0)h+='<div class="emp">未找到匹配</div>';
    else rs.forEach(function(r){h+='<div style="padding:8px 12px;border-bottom:1px solid #f0e8d8;cursor:pointer;font-size:11px" onclick="st(\''+r.tb+'\')">'+r.ty+' <b>'+r.tx+'</b> <span style="color:#B8860B;float:right">查看 →</span></div>'});
    h+='</div>';
  } else {
    var ts=DB.ts(),dn=ts.filter(function(t){return(t.status||"").indexOf("完成")>=0}).length;
    var p0=ts.filter(function(t){return(t.priority||"").indexOf("P0")>=0&&(t.status||"").indexOf("完成")<0});
    var d=Math.ceil((new Date(2026,5,21)-new Date())/86400000);
    
    if(S.tab==="overview"){
      h+='<div class="pn"><div class="pn-h">📊 概览 · 夏至 <b style="color:#C23B22;font-size:18px">'+d+'天</b></div>';
      h+='<div class="sg">';
      h+='<div class="si"><div class="v">'+(ts.length>0?Math.round(dn/ts.length*100):0)+'%</div><div class="l">完成率</div></div>';
      h+='<div class="si"><div class="v" style="color:'+(p0.length>0?"#C23B22":"#3D7A4F")+'">'+p0.length+'</div><div class="l">🔴 P0</div></div>';
      h+='<div class="si"><div class="v">233</div><div class="l">线上产品</div></div>';
      h+='<div class="si"><div class="v">12</div><div class="l">Cron健康</div></div>';
      h+='<div class="si"><div class="v">23</div><div class="l">替身就绪</div></div>';
      h+='</div></div>';
      if(p0.length>0){
        h+='<div class="pn bl"><div class="pn-h" style="color:#C23B22">🔴 P0 紧急 ('+p0.length+'项)</div>';
        p0.slice(0,10).forEach(function(t){h+='<div style="padding:4px 0;border-bottom:1px solid #f0e8d8;font-size:11px">'+t.task+' <span class="tg tgr">P0</span></div>'});
        h+='</div>';
      }
      var g=DB.gr();if(g.length>0){h+='<div class="pn"><div class="pn-h">📈 关键指标</div>';g.forEach(function(x){h+='<div style="padding:3px 0;font-size:11px">'+x.m+': <b>'+x.c+'</b> /目标'+x.t+'</div>'});h+='</div>'}
    } else if(S.tab==="tasks"){
      h+='<div class="pn"><div class="pn-h">📋 任务 ('+ts.length+')</div><div class="fr"><input id="tn" placeholder="任务名"><select id="tp"><option>P0</option><option selected>P1</option><option>P2</option></select><button class="btn" onclick="addT()">+</button></div>';
      if(ts.length===0)h+='<div class="emp">暂无任务</div>';
      else{h+='<table class="tbl"><tr><th>任务</th><th>P</th><th>状态</th><th>截止</th></tr>';ts.forEach(function(t){h+='<tr><td>'+t.task+'</td><td>'+t.priority+'</td><td><span class="dot '+(t.status.indexOf("完成")>=0?"dg":t.status.indexOf("进行")>=0?"da":"dr")+'"></span>'+t.status+'</td><td>'+(t.deadline||"")+'</td></tr>'});h+='</table>'}h+='</div>';
    } else if(S.tab==="project"){
      h+='<div class="pn"><div class="pn-h">🗓️ 项目 · 三阶段里程碑</div>';
      var MLS=[{n:"产品命名体系",d:"05-28",s:"完成"},{n:"233产品上线",d:"05-28",s:"完成"},{n:"驾驶舱中枢",d:"05-29",s:"完成"},{n:"增长飞轮引擎",d:"05-28",s:"完成"},{n:"密码门控体系",d:"05-28",s:"完成"},{n:"来源标注补齐",d:"06-07",s:"进行中"},{n:"产品星级评定",d:"06-14",s:"待开始"},{n:"夏至路演准备",d:"06-21",s:"进行中"}];
      var md=MLS.filter(function(m){return m.s==="完成"}).length;
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:10px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'% ('+md+'/'+MLS.length+')</span></div>';
      h+='<table class="tbl"><tr><th>里程碑</th><th>截止</th><th>状态</th></tr>';
      MLS.forEach(function(m){h+='<tr><td>'+m.n+'</td><td>'+m.d+'</td><td><span class="tg '+(m.s==="完成"?"tgg":m.s==="进行中"?"tga":"tgr")+'">'+m.s+'</span></td></tr>'});
      h+='</table></div>';
    } else if(S.tab==="customers"){
      var cs=DB.cs();
      h+='<div class="pn"><div class="pn-h">👤 客户 ('+cs.length+')</div><div class="fr"><input id="cn" placeholder="姓名"><input id="cc" placeholder="企业"><button class="btn" onclick="addC()">+</button></div>';
      if(cs.length===0)h+='<div class="emp">暂无客户</div>';
      else{h+='<table class="tbl"><tr><th>姓名</th><th>企业</th><th>邮箱</th></tr>';cs.forEach(function(c){h+='<tr><td>'+c.name+'</td><td>'+(c.company||"")+'</td><td>'+(c.email||"")+'</td></tr>'});h+='</table>'}h+='</div>';
    } else if(S.tab==="products"){
      var pr=DB.pr();
      h+='<div class="pn"><div class="pn-h">📦 产品 ('+pr.length+')</div><div class="fr"><input id="pn" placeholder="产品名"><input id="pf" placeholder="五族"><button class="btn" onclick="addP()">+</button></div>';
      if(pr.length===0)h+='<div class="emp">暂无产品</div>';
      else{h+='<table class="tbl"><tr><th>名称</th><th>五族</th></tr>';pr.forEach(function(p){h+='<tr><td>'+p.name+'</td><td>'+(p.family||"")+'</td></tr>'});h+='</table>'}h+='</div>';
    } else if(S.tab==="quality"){
      var qu=DB.qu();
      h+='<div class="pn"><div class="pn-h">✅ 质量标准 ('+qu.length+')</div>';
      if(qu.length===0)h+='<div class="emp">暂无</div>';
      else{h+='<table class="tbl"><tr><th>编号</th><th>标准</th><th>状态</th></tr>';qu.forEach(function(q){h+='<tr><td>'+q.qm_id+'</td><td>'+q.standard+'</td><td>'+q.status+'</td></tr>'});h+='</table>'}h+='</div>';
    } else if(S.tab==="finance"){
      h+='<div class="pn"><div class="pn-h">💰 财务</div><div class="sg"><div class="si"><div class="v">~¥0</div><div class="l">月运营成本</div></div><div class="si"><div class="v">∞</div><div class="l">现金跑道</div></div><div class="si"><div class="v">¥10K-30K</div><div class="l">里程碑成本</div></div></div><h3 style="font-size:12px;color:#C23B22;margin:10px 0 6px">成本结构</h3><table class="tbl"><tr><th>项目</th><th>年成本</th><th>状态</th></tr><tr><td>GitHub Pages</td><td>¥0</td><td>✅ 免费</td></tr><tr><td>域名</td><td>~¥100</td><td>⏳</td></tr><tr><td>商标注册</td><td>~¥3K</td><td>🔴 QM-026</td></tr><tr><td>飞书认证</td><td>¥300</td><td>⏳</td></tr></table></div>';
    } else if(S.tab==="growth"){
      var g=DB.gr();
      h+='<div class="pn"><div class="pn-h">📈 增长飞轮</div>';
      if(g.length===0)h+='<div class="emp">暂无指标</div>';
      else{h+='<table class="tbl"><tr><th>指标</th><th>当前</th><th>目标</th></tr>';g.forEach(function(x){h+='<tr><td>'+x.m+'</td><td><b>'+x.c+'</b></td><td>'+x.t+'</td></tr>'});h+='</table>'}h+='</div>';
    } else if(S.tab==="system"){
      h+='<div class="pn"><div class="pn-h">⚡ 系统运行状态</div><div class="sg"><div class="si"><div class="v">12</div><div class="l">Cron任务</div></div><div class="si"><div class="v">6</div><div class="l">自动化脚本</div></div><div class="si"><div class="v">233</div><div class="l">线上产品</div></div><div class="si"><div class="v">2</div><div class="l">后台服务</div></div></div><h3 style="font-size:12px;color:#C23B22;margin:10px 0 6px">Cron机制</h3><table class="tbl"><tr><th>时间</th><th>任务</th><th>状态</th></tr><tr><td>00:10</td><td>下载扣子对话</td><td><span class="dot dg"></span>运行中</td></tr><tr><td>04:00</td><td>梦境保存</td><td><span class="dot dg"></span>运行中</td></tr><tr><td>06:00</td><td>日起课</td><td><span class="dot dg"></span>运行中</td></tr><tr><td>22:00</td><td>日毕课</td><td><span class="dot dg"></span>运行中</td></tr></table></div>';
    } else if(S.tab==="avatars"){
      h+='<div class="pn"><div class="pn-h">🎭 数字替身</div><div class="sg"><div class="si"><div class="v">23</div><div class="l">总替身数</div></div><div class="si"><div class="v">5</div><div class="l">激活层级</div></div></div>';
      var avs=[{n:"🪨 刘禹锡",d:"土·时间轴",q:"五年后回头看？",s:8},{n:"🪙 司马贺",d:"金·可行域",q:"够用就好的线？",s:8},{n:"💧 水月观音",d:"水·身心流",q:"状态适合吗？",s:10},{n:"🪵 孔子",d:"木·信义观",q:"钱和原则？",s:12},{n:"🔥 六祖慧能",d:"火·直觉阈",q:"直觉在说什么？",s:7}];
      avs.forEach(function(a){h+='<div class="pn" style="margin:4px 0;padding:10px 14px"><div style="display:flex;justify-content:space-between"><div><b>'+a.n+'</b> <span style="font-size:10px;color:#6E6E6E">'+a.d+'</span><div style="font-size:10px;color:#B8860B;font-style:italic;margin-top:2px">"'+a.q+'"</div></div><div style="font-size:18px;font-weight:700;color:#C23B22">'+a.s+'</div></div></div>'});
    } else if(S.tab==="glossary"){
      h+='<div class="pn"><div class="pn-h">📖 术语表</div><table class="tbl"><tr><th>概念</th><th>术语</th><th>禁止</th></tr><tr><td>产品体系</td><td>章·衡·镜·契·觉</td><td>—</td></tr><tr><td>品牌名</td><td>满意解研究所</td><td>—</td></tr><tr><td>创始人</td><td>Egbertie</td><td>❌主人</td></tr><tr><td>AI助手</td><td>满意姐/扣子/满意红</td><td>❌Kimi/Coze</td></tr><tr><td>决策框架</td><td>五维决策罗盘</td><td>❌五步法</td></tr><tr><td>核心理论</td><td>满意解(Satisficing)</td><td>❌妥协</td></tr></table></div>';
    }
  }
  document.getElementById("mc").innerHTML=h;
}

// ===== CRUD =====
function addT(){
  var n=document.getElementById("tn").value.trim();if(!n)return;
  var ts=DB.ts();ts.unshift({id:Date.now(),task:n,priority:document.getElementById("tp").value,status:"待开始",deadline:""});
  dbsv("sri_db_tasks",ts.slice(0,500));rt();rk();rc();
}
function addC(){
  var n=document.getElementById("cn").value.trim();if(!n)return;
  var cs=DB.cs();cs.unshift({id:Date.now(),name:n,company:document.getElementById("cc").value});
  dbsv("sri_db_customers",cs.slice(0,500));rt();rk();rc();
}
function addP(){
  var n=document.getElementById("pn").value.trim();if(!n)return;
  var pr=DB.pr();pr.unshift({id:Date.now(),name:n,family:document.getElementById("pf").value});
  dbsv("sri_db_products",pr.slice(0,500));rt();rk();rc();
}

// Auto-init on load
setTimeout(function(){if(document.getElementById("gate").style.display==="none")init2()},100);
</script>

</body>
</html>
