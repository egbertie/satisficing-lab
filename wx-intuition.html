<h3>信任到了临界点</h3>
<p>六祖慧能说：<span class="highlight">"前念迷即凡夫，后念悟即佛。"</span>决策的最后一关——不是数据够不够，是你敢不敢听心里的声音。</p>
<h3>在合伙人关系中</h3>
<p>你做了所有的分析。五维都过了。但你就是有一种说不清的感觉——"好像哪里不对"。那不是你的错觉。<span class="highlight">直觉不是无知的猜测——是大脑在潜意识中整合了百倍于意识的信息。</span></p>
