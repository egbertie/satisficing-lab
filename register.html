<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>客户注册 · 满意解研究所</title>
<style>
  :root { --sri-red:#C23B22; --sri-gold:#B8860B; --sri-bg:#F5F0E6; --text:#4A4A4A; --title:#2A2A2A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:var(--sri-bg); color:var(--text); min-height:100vh; }
  
  .container { max-width:420px; margin:0 auto; padding:40px 20px; }
  .header { text-align:center; margin-bottom:28px; }
  .header .icon { font-size:44px; }
  .header h1 { font-size:21px; color:var(--title); margin:8px 0 4px; }
  .header p { font-size:12px; opacity:0.6; }

  .form-card { background:#fff; border-radius:16px; padding:24px; border:2px solid var(--sri-red); }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; font-weight:700; color:var(--title); margin-bottom:4px; }
  .field label .required { color:var(--sri-red); }
  .field input,.field select,.field textarea { width:100%; padding:10px 12px; border:1.5px solid #D4C5A0; border-radius:10px; font-size:14px; font-family:inherit; }
  .field input:focus,.field select:focus,.field textarea:focus { border-color:var(--sri-red); outline:none; }
  .field textarea { height:70px; resize:vertical; }
  .field .hint { font-size:10px; opacity:0.5; margin-top:2px; }
  
  .btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; margin:8px 0; }
  .btn-primary { background:var(--sri-red); color:#F5F0E6; }
  .btn-ghost { background:transparent; color:var(--text); font-size:12px; font-weight:400; opacity:0.5; margin-top:12px; }
  
  .privacy-note { font-size:10px; opacity:0.5; text-align:center; margin-top:12px; line-height:1.6; }
  .success { display:none; text-align:center; padding:20px 0; }
  .success.show { display:block; }
  .success .icon { font-size:60px; }
  .success h2 { font-size:20px; color:#4A8C5C; margin:12px 0 8px; }
  .success p { font-size:13px; opacity:0.7; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="icon">📋</div>
    <h1>完善信息</h1>
    <p>帮助我们更好地理解你的需求</p>
  </div>

  <div class="form-card" id="formCard">
    <div class="field">
      <label>姓名 <span class="required">*</span></label>
      <input type="text" id="name" placeholder="你的姓名">
    </div>
    <div class="field">
      <label>企业/机构 <span class="required">*</span></label>
      <input type="text" id="company" placeholder="你所在的企业或机构">
    </div>
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="your@email.com">
      <div class="hint">用于发送测评报告和后续跟进</div>
    </div>
    <div class="field">
      <label>身份</label>
      <select id="role">
        <option value="">请选择...</option>
        <option>创始人/CEO</option>
        <option>联合创始人/CTO</option>
        <option>联合创始人/COO</option>
        <option>合伙人</option>
        <option>投资人/VC</option>
        <option>其他</option>
      </select>
    </div>
    <div class="field">
      <label>行业赛道</label>
      <select id="industry">
        <option value="">请选择...</option>
        <option>硬科技（半导体/量子/芯片）</option>
        <option>人工智能/机器人</option>
        <option>新能源/储能</option>
        <option>精密制造</option>
        <option>生物医药/脑机</option>
        <option>eVTOL/航空航天</option>
        <option>SaaS/软件</option>
        <option>消费品牌</option>
        <option>咨询服务</option>
        <option>其他</option>
      </select>
    </div>
    <div class="field">
      <label>融资阶段</label>
      <select id="stage">
        <option value="">请选择...</option>
        <option>未融资</option>
        <option>天使轮</option>
        <option>A轮</option>
        <option>B轮</option>
        <option>C轮及以上</option>
        <option>已上市</option>
      </select>
    </div>
    <div class="field">
      <label>一句话：你最关心合伙人决策的哪个方面？</label>
      <textarea id="concern" placeholder="例：股权分配 / 退出机制 / 信任问题..."></textarea>
    </div>
    
    <button class="btn btn-primary" onclick="register()">提交 · 开始使用 →</button>
    <button class="btn btn-ghost" onclick="skipRegister()">跳过·以后再说</button>

    <div class="privacy-note">
      你的信息仅供满意解研究所内部使用，不会分享给第三方。<br>
      <a href="privacy.html">隐私政策</a>
    </div>
  </div>

  <div class="success" id="successBox">
    <div class="icon">✅</div>
    <h2>注册完成</h2>
    <p>感谢！即将进入工具页面...</p>
  </div>
</div>

<script>
// Get redirect target from URL
const params = new URLSearchParams(window.location.search);
const target = params.get('to') || 'go.html';

function register() {
  let name = document.getElementById('name').value.trim();
  let company = document.getElementById('company').value.trim();
  
  if (!name || !company) {
    alert('请至少填写姓名和企业/机构');
    return;
  }

  // Auto-generate customer tags
  let tags = [];
  let role = document.getElementById('role').value;
  let industry = document.getElementById('industry').value;
  let stage = document.getElementById('stage').value;
  let concern = document.getElementById('concern').value.trim();
  
  if (role.includes('CEO') || role.includes('创始人')) tags.push('决策者');
  if (role.includes('CTO') || role.includes('技术')) tags.push('技术背景');
  if (role.includes('投资人')) tags.push('投资方');
  if (industry.includes('硬科技') || industry.includes('半导体')) tags.push('硬科技赛道');
  if (industry.includes('AI') || industry.includes('智能') || industry.includes('机器人')) tags.push('AI赛道');
  if (industry.includes('新能源') || industry.includes('储能')) tags.push('新能源赛道');
  if (stage.includes('天使') || stage.includes('未融资')) tags.push('早期项目');
  if (stage.includes('A轮') || stage.includes('B轮')) tags.push('成长期');
  if (concern.includes('股权')) tags.push('关注股权');
  if (concern.includes('退出')) tags.push('关注退出');
  if (concern.includes('信任')) tags.push('关注信任');

  let profile = {
    name: name,
    company: company,
    email: document.getElementById('email').value.trim(),
    role: role,
    industry: industry,
    stage: stage,
    concern: concern,
    tags: tags,
    registered: new Date().toISOString(),
    source: 'web_gate',
    page: target,
    customerId: 'WEB-' + Date.now().toString(36).toUpperCase()
  };

  // Save profile
  localStorage.setItem('sri_profile', JSON.stringify(profile));
  
  // Log customer acquisition
  let customers = JSON.parse(localStorage.getItem('sri_customers') || '[]');
  customers.push({ id: profile.customerId, name: name, company: company, time: new Date().toISOString(), tags: tags });
  localStorage.setItem('sri_customers', JSON.stringify(customers.slice(-200)));

  // Also save to customer-db in a structured way
  let db = JSON.parse(localStorage.getItem('sri_customer_db') || '{}');
  db[profile.customerId] = profile;
  localStorage.setItem('sri_customer_db', JSON.stringify(db));
  
  // Show success
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('successBox').classList.add('show');
  
  setTimeout(() => { window.location.href = target; }, 1500);
}

function skipRegister() {
  localStorage.setItem('sri_profile', JSON.stringify({skipped:true, time:new Date().toISOString()}));
  window.location.href = target;
}
</script>

<div style="text-align:center;padding:24px 16px 40px;font-size:11px;color:#999;">
  <p><a href="go.html" style="color:#C23B22;text-decoration:none;">← 返回决策通道</a></p>
  <p style="margin-top:4px;">满意解研究所 · 硬科技创始人的决策教练</p>
</div>
</body>

</html>
