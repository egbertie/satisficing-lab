<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>觉·密室|合伙人密室|满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A;--border:#D4C5A0;--sri-green:#4A8C5C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}
.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}
.main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
.intro{text-align:center;font-size:14px;line-height:2;margin-bottom:20px}

.room-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.room-card{background:#fff;border-radius:14px;padding:20px;cursor:pointer;border:2px solid #f0e8d8;transition:all 0.25s;text-align:center;position:relative;overflow:hidden}
.room-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.room-card.locked{opacity:0.7;cursor:default}
.room-card.locked:hover{transform:none;box-shadow:none}
.room-card.unlocked{border-color:var(--sri-gold)}
.room-card.unlocked:hover{border-color:var(--sri-red)}
.room-card .r-icon{font-size:36px;margin-bottom:6px}
.room-card .r-name{font-size:16px;font-weight:700;color:var(--title-color);margin-bottom:4px}
.room-card .r-hint{font-size:12px;color:#999}

.challenge-panel{display:none;background:#fff;border-radius:14px;padding:24px;border:2px solid var(--sri-gold);margin-bottom:16px;animation:fadeIn 0.4s}
.challenge-panel.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.challenge-panel .c-title{font-size:16px;font-weight:700;color:var(--title-color);margin-bottom:12px}
.challenge-panel .c-desc{font-size:14px;line-height:2;margin-bottom:16px}
.challenge-panel .c-choices{display:flex;flex-direction:column;gap:8px}
.c-choice{padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;text-align:center;transition:all 0.2s;font-family:inherit}
.c-choice:hover{background:rgba(194,59,34,0.04);border-color:var(--sri-red)}
.c-choice.chosen{background:rgba(194,59,34,0.06);border-color:var(--sri-red);font-weight:600}
.c-feedback{padding:14px;margin-top:12px;border-radius:10px;font-size:14px;line-height:2;display:none;animation:fadeIn 0.3s}
.c-feedback.show{display:block}

.badge-row{display:flex;justify-content:center;gap:12px;margin-top:20px}
.badge{padding:8px 16px;border-radius:12px;font-size:13px;font-weight:600;background:#f0e8d8;color:#999}
.badge.earned{background:rgba(74,140,92,0.1);color:var(--sri-green)}
.btn-reset{padding:8px 20px;border-radius:18px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;margin-top:12px}

.back-link{text-align:center;padding:20px;font-size:11px;color:#999}
.back-link a{color:var(--sri-red);text-decoration:none}
.feedback-zone{max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px}
@media(max-width:480px){body{font-size:14px}}
</style>

<script src="sri-track.js"></script>
<script src="sri-api.js"></script>
</head>
<body>
<div class="hero"><h1>🔐 觉·密室</h1><p>合伙人密室 · 三间密室·每次进入都有新发现</p></div>
<div class="main">
  <p class="intro">三间密室——股权分配·退出条款·危机时刻。<br><span style="color:var(--sri-red);font-weight:600">每一间只有一个问题，但这个问题可能会改变一切。</span></p>

  <div class="room-grid" id="roomGrid"></div>
  <div class="challenge-panel" id="challengePanel"></div>

  <div class="badge-row" id="badgeRow"></div>
  <div style="text-align:center"><button class="btn-reset" onclick="resetRooms()">🔄 重置密室</button></div>
</div>
<div class="back-link"><a href="go.html">← 返回决策通道</a></div>
<div class="feedback-zone">
  <div id="fbQuestion" style="color:#4A4A4A;font-weight:600;margin-bottom:10px;">这个工具对你有用吗？</div>
  <div id="fbActions" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px;">
    <button onclick="submitFeedback('up')" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">👍</span>有用</button>
    <button onclick="showFeedbackText()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">💬</span>有建议</button>
  </div>
  <textarea id="fbText" style="display:none;width:100%;max-width:400px;height:60px;border:1.5px solid #D4C5A0;border-radius:10px;padding:10px;font-size:13px;font-family:inherit;background:#fff;margin:8px auto;resize:vertical;" placeholder="你的建议会帮我们改进..."></textarea>
  <button id="fbSubmit" style="display:none;padding:8px 18px;border-radius:20px;border:1.5px solid #C23B22;background:#fff;cursor:pointer;font-size:13px;color:#C23B22;font-weight:600;margin:4px auto;" onclick="submitFeedbackText()">发送反馈 →</button>
  <div id="fbThanks" style="display:none;color:var(--sri-green);font-weight:600;padding:8px;">收到！感谢你的反馈。</div>
  <div id="fbTally" style="font-size:11px;color:#999;margin-top:4px;"></div>
</div>

<script>
var ROOMS = [
  {id:'equity', icon:'💰', name:'股权分配密室', lock:'先思考：你和合伙人谈过股权吗？<br>如果答案是"谈过但没写下来"——那你需要这间密室。',
    q:'你们最初的股权比例——如果回到第一天，你会怎么分？',
    choices:['按出钱比例','按出力时间','各一半·公平最重要','5:3:2·留期权池'],
    feedbacks:['钱会花完，但人在继续——贡献会变，比例不能不变。','出力的人往往低估了自己。你出的力可能比你以为的更多。','公平是一种感觉，不是数字。各一半不一定公平——取决于谁做了什么。','你已经在为未来考虑了。期权池是给还没来的人留的位置——说明你相信团队会变大。']},
  {id:'exit', icon:'🚪', name:'退出条款密室', lock:'先思考：如果明天你的合伙人说"我累了，想走"——你们有规则吗？',
    q:'合伙人想退出——你怎么办？',
    choices:['按原始出价回购','按当前估值回购','分期回购+竞业','让他留股·只退出管理'],
    feedbacks:['公平，但对方可能觉得亏了——公司已经比当初值钱了。','对方高兴，但团队现金流可能扛不住。','折中方案——既公平又不会一次压垮公司。','保留了老朋友的体面，但他不会再为公司拼命了。']},
  {id:'crisis', icon:'⚡', name:'危机时刻密室', lock:'先思考：如果公司账上只剩3个月的钱——谁来做那个最难的决定？',
    q:'公司面临裁员——你必须在两个核心员工中选择一个留下。你选谁？',
    choices:['技术最强的那个','跟你最久的那个','最能带团队的那个','让团队投票决定'],
    feedbacks:['技术是硬实力，但危机关头最需要的常常不是技术。','忠诚不会背叛你——但忠诚不等于能力。危机关头你需要两种都有的那个人。','危机时刻=领导力时刻。能带人的那个人会帮你扛过最难的部分。','把决定权交给团队——这是一个勇敢的选择。但注意：投票的结果你要能接受。']}
];

var ESC_KEY = '***';
var cleared = {};

function loadState(){try{cleared=JSON.parse(localStorage.getItem(ESC_KEY))||{};}catch(e){}}

function renderRooms(){
  var html = '';
  ROOMS.forEach(function(r){
    var done = !!cleared[r.id];
    var cls = done ? 'locked' : 'unlocked';
    html += '<div class="room-card '+cls+'" onclick="'+(done?'':'enterRoom(\''+r.id+'\')')+'">';
    html += '<div class="r-icon">'+r.icon+(done?' ✅':'')+'</div>';
    html += '<div class="r-name">'+r.name+'</div>';
    html += '<div class="r-hint">'+(done?'✅ 已通关':r.lock)+'</div>';
    html += '</div>';
  });
  document.getElementById('roomGrid').innerHTML = html;
  renderBadges();
}

function enterRoom(id){
  var r = ROOMS.find(function(x){return x.id===id});
  if(!r) return;
  var panel = document.getElementById('challengePanel');
  var html = '<div class="c-title">'+r.icon+' '+r.name+'</div>';
  html += '<div class="c-desc">'+r.q+'</div>';
  html += '<div class="c-choices">';
  r.choices.forEach(function(c,i){
    html += '<button class="c-choice" onclick="chooseAnswer(\''+id+'\','+i+')">'+c+'</button>';
  });
  html += '</div>';
  html += '<div class="c-feedback" id="cFeedback"></div>';
  panel.innerHTML = html;
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth',block:'center'});
}

function chooseAnswer(roomId, choiceIdx){
  var r = ROOMS.find(function(x){return x.id===roomId});
  var fb = document.getElementById('cFeedback');
  fb.innerHTML = '💬 '+r.feedbacks[choiceIdx];
  fb.classList.add('show');

  cleared[roomId] = choiceIdx;
  localStorage.setItem(ESC_KEY, JSON.stringify(cleared));

  // 1.5秒后自动关闭面板
  setTimeout(function(){
    document.getElementById('challengePanel').classList.remove('show');
    renderRooms();
  }, 2000);
}

function renderBadges(){
  var html = '';
  ROOMS.forEach(function(r){
    html += '<div class="badge'+(cleared[r.id]?' earned':'')+'">'+(cleared[r.id]?'✅':'🔒')+' '+r.name+'</div>';
  });
  document.getElementById('badgeRow').innerHTML = html;
}

function resetRooms(){
  if(!confirm('重置所有密室进度？')) return;
  cleared = {};
  localStorage.removeItem(ESC_KEY);
  renderRooms();
}

loadState();
renderRooms();

(function(){
  let page=location.pathname.split('/').pop()||'index';
  let key='sri_fb_'+page;
  let data=JSON.parse(localStorage.getItem(key)||'{}');
  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>

<div style="text-align:center;padding:8px 0;font-size:10px;opacity:0.25;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</div>
</body>
</html>
