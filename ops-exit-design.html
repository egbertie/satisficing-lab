<h3>退出四步</h3><p>第一步：诊断——是"可修复的冲突"还是"不可逆转的分歧"？<br>第二步：评估——财务(股权/债务)·法律(协议条款)·关系(团队影响)<br>第三步：方案——A方案(缓退)·B方案(快退)·C方案(转角色)<br>第四步：执行——时间线·沟通计划·对外口径·后续安排</p>
<h3>退出原则</h3><p>1. 不撕破脸——今天的对手可能是明天的合作伙伴<br>2. 不拖泥带水——决定了就不反复<br>3. 不让团队承担后果——退出是创始人的事，不影响团队稳定性</p></div><p style="text-align:center;padding:20px;font-size:11px;color:#999"><a href="go.html" style="color:#C23B22;text-decoration:none">← 返回决策通道</a></p></body></html>
