<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SlicingPie贡献量化计算器 | 满意解研究所</title>
<style>
  :root { --sri-red:#C23B22; --sri-gold:#B8860B; --sri-bg:#F5F0E6; --text:#4A4A4A; --title:#2A2A2A; --border:#D4C5A0; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:var(--sri-bg); color:var(--text); min-height:100vh; }
  .hero { background:linear-gradient(135deg,var(--sri-red),var(--sri-gold)); color:#F5F0E6; padding:32px 20px 24px; text-align:center; }
  .hero h1 { font-size:21px; font-weight:700; }
  .hero p { font-size:12px; opacity:0.85; }
  .main { max-width:520px; margin:0 auto; padding:16px; }
  
  .explain { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; font-size:13px; line-height:1.8; }
  .explain .formula { display:block; text-align:center; padding:10px; background:rgba(194,59,34,0.06); border-radius:8px; font-weight:600; color:var(--sri-red); margin:8px 0; font-size:14px; }

  .partner-box { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; border:1px solid var(--border); }
  .partner-box h3 { font-size:15px; color:var(--title); margin-bottom:8px; }
  .row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .row label { min-width:80px; font-size:12px; font-weight:600; }
  .row input,.row select { flex:1; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; background:#fff; }
  .row input:focus { border-color:var(--sri-red); outline:none; }

  .result-box { display:none; background:#fff; border-radius:14px; padding:24px; border:2px solid var(--sri-red); margin-top:16px; text-align:center; }
  .result-box.show { display:block; }
  .pie-visual { display:flex; gap:0; height:24px; border-radius:12px; overflow:hidden; margin:12px 0; }
  .pie-slice { transition:flex 0.5s; }
  .legend { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:8px 0; font-size:12px; }
  .legend-item { display:flex; align-items:center; gap:4px; }
  .legend-dot { width:10px; height:10px; border-radius:50%; }

  .btn { display:inline-block; padding:12px 28px; border-radius:20px; font-size:14px; font-weight:600; cursor:pointer; border:none; text-decoration:none; }
  .btn-primary { background:var(--sri-red); color:#F5F0E6; }
  .btn-outline { background:transparent; border:1.5px solid var(--sri-red); color:var(--sri-red); }
  .footer { text-align:center; padding:24px 16px 40px; font-size:11px; color:#999; }
  .footer a { color:var(--sri-red); text-decoration:none; }
</style>
</head>
<body>

<div class="hero">
  <h1>🥧 SlicingPie 贡献量化</h1>
  <p>股权不是分出来的——是记账记出来的</p>
</div>

<div class="main">
  <div class="explain">
    <strong>Moyer的SlicingPie公式：</strong>
    <span class="formula">你的股权 = 你的贡献(公平市价 - 已获报酬) ÷ 所有合伙人的总贡献</span>
    <p style="margin-top:8px;">核心思想：股权应该动态反映实际贡献——不是"一开始说好多少就永远多少"。</p>
    <p style="margin-top:4px;font-size:11px;opacity:0.7;">Moyer·Slicing Pie: "股权不是激励——是记账。"</p>
  </div>

  <!-- Partner A -->
  <div class="partner-box">
    <h3>👤 合伙人A（你）</h3>
    <div class="row"><label>投入时间</label><select id="aTime"><option value="1">全职(100%)</option><option value="0.75">大部分(75%)</option><option value="0.5">一半(50%)</option><option value="0.25">兼职(25%)</option></select></div>
    <div class="row"><label>投入月数</label><input type="number" id="aMonths" value="12" min="1" max="60"></div>
    <div class="row"><label>放弃年薪(万)</label><input type="number" id="aSalary" value="60" min="0" step="1"></div>
    <div class="row"><label>已获报酬(万)</label><input type="number" id="aPaid" value="0" min="0" step="1"></div>
    <div class="row"><label>现金投入(万)</label><input type="number" id="aCash" value="10" min="0" step="1"></div>
    <div class="row"><label>额外价值</label><input type="text" id="aExtra" placeholder="专利/客户/品牌...（可估算为万）" value=""></div>
    <div class="row"><label>额外估值(万)</label><input type="number" id="aExtraVal" value="0" min="0" step="1"></div>
  </div>

  <!-- Partner B -->
  <div class="partner-box">
    <h3>👤 合伙人B</h3>
    <div class="row"><label>投入时间</label><select id="bTime"><option value="1">全职(100%)</option><option value="0.75">大部分(75%)</option><option value="0.5">一半(50%)</option><option value="0.25">兼职(25%)</option></select></div>
    <div class="row"><label>投入月数</label><input type="number" id="bMonths" value="12" min="1" max="60"></div>
    <div class="row"><label>放弃年薪(万)</label><input type="number" id="bSalary" value="50" min="0" step="1"></div>
    <div class="row"><label>已获报酬(万)</label><input type="number" id="bPaid" value="0" min="0" step="1"></div>
    <div class="row"><label>现金投入(万)</label><input type="number" id="bCash" value="5" min="0" step="1"></div>
    <div class="row"><label>额外价值</label><input type="text" id="bExtra" placeholder="专利/客户/品牌..." value=""></div>
    <div class="row"><label>额外估值(万)</label><input type="number" id="bExtraVal" value="0" min="0" step="1"></div>
  </div>

  <div style="text-align:center;padding:12px;">
    <button class="btn btn-primary" onclick="calculate()">🥧 计算动态股权</button>
    <button class="btn btn-outline" onclick="location.href='assessment.html'">去五维测评</button>
  </div>

  <div class="result-box" id="resultBox">
    <h2>🥧 贡献分布</h2>
    <div class="pie-visual" id="pieVisual"></div>
    <div class="legend" id="legend"></div>
    <div id="analysis" style="font-size:13px;line-height:1.7;margin-top:12px;"></div>
    <p style="margin-top:16px;font-size:11px;opacity:0.6;">SlicingPie · Moyer · 动态股权工具</p>
  </div>
</div>

<div class="footer">
  <p><a href="go.html">← 返回产品中心</a></p>
  <p style="margin-top:6px;font-size:10px;color:var(--sri-red);">⚠️ 本工具仅供估算参考·不构成法律或财务建议</p>
</div>

<script>
function calculate() {
  // Calculate fair contribution for each partner
  function contribution(id) {
    let timeF = parseFloat(document.getElementById(id+'Time').value);
    let months = parseInt(document.getElementById(id+'Months').value) || 0;
    let salary = parseFloat(document.getElementById(id+'Salary').value) || 0;
    let paid = parseFloat(document.getElementById(id+'Paid').value) || 0;
    let cash = parseFloat(document.getElementById(id+'Cash').value) || 0;
    let extraVal = parseFloat(document.getElementById(id+'ExtraVal').value) || 0;
    
    // Time contribution = (monthly salary * time factor * months)
    let timeContrib = (salary / 12) * timeF * months;
    // Net contribution = time + cash + extra - paid
    let net = timeContrib + cash + extraVal - paid;
    return Math.max(0, net);
  }

  let aContrib = contribution('a');
  let bContrib = contribution('b');
  let total = aContrib + bContrib;
  
  if (total === 0) { alert('请输入至少一个合伙人的贡献数据'); return; }

  let aPct = (aContrib / total * 100).toFixed(1);
  let bPct = (bContrib / total * 100).toFixed(1);

  let colors = ['var(--sri-red)', 'var(--sri-gold)'];
  document.getElementById('pieVisual').innerHTML = 
    `<div class="pie-slice" style="flex:${aPct};background:${colors[0]}"></div>` +
    `<div class="pie-slice" style="flex:${bPct};background:${colors[1]}"></div>`;
  
  document.getElementById('legend').innerHTML = 
    `<span class="legend-item"><span class="legend-dot" style="background:${colors[0]}"></span> 合伙人A: ${aPct}%</span>` +
    `<span class="legend-item"><span class="legend-dot" style="background:${colors[1]}"></span> 合伙人B: ${bPct}%</span>`;

  let gap = Math.abs(parseFloat(aPct) - parseFloat(bPct));
  let analysis = `<p>贡献差距: <strong>${gap.toFixed(1)}%</strong></p>`;
  if (gap > 30) {
    analysis += '<p style="color:var(--sri-red)">⚠️ 差距大于30%——如果你们现在是50/50或类似固定分配，当前分配与贡献严重不匹配。</p>';
  } else if (gap > 15) {
    analysis += '<p style="color:var(--sri-gold)">🟡 有一定差距——可能需要重新讨论分配。建议每6个月用SlicingPie重新算一次。</p>';
  } else {
    analysis += '<p style="color:#4A8C5C">🟢 贡献与分配基本匹配——你们的分配相对公平。</p>';
  }
  analysis += '<p style="margin-top:8px;font-size:12px;opacity:0.7;">Moyer: SlicingPie不是为了"重新分配"——是为了让每个人看到自己的贡献被计数。</p>';
  
  document.getElementById('analysis').innerHTML = analysis;
  document.getElementById('resultBox').classList.add('show');
}
</script>
</body>
</html>
