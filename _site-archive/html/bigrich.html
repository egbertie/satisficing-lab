<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>觉·大富翁|满意解大富翁|满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A;--border:#D4C5A0;--sri-green:#4A8C5C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}
.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}

.game-zone{max-width:560px;margin:0 auto;padding:24px 16px 40px;text-align:center}
.game-zone .intro{font-size:14px;line-height:2;margin-bottom:24px}
.game-zone .intro em{color:var(--sri-red);font-style:normal;font-weight:600}

/* 棋盘 */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 auto 24px;max-width:420px}
.board .cell{padding:10px 4px;border-radius:8px;font-size:11px;font-weight:600;text-align:center;border:2px solid #f0e8d8;background:#fff;transition:all 0.3s;min-height:48px;display:flex;align-items:center;justify-content:center}
.board .cell.active{border-color:var(--sri-red);box-shadow:0 0 0 3px rgba(194,59,34,0.12);transform:scale(1.1);background:rgba(194,59,34,0.04)}
.board .cell.passed{opacity:0.4}

/* 控制区 */
.control-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.btn-roll{padding:14px 40px;border-radius:28px;border:none;background:var(--title-color);color:#fff;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-roll:hover{background:var(--sri-gold)}
.btn-roll:active{transform:scale(0.95)}
.btn-roll:disabled{background:#ccc;cursor:not-allowed}

.dice{font-size:36px;transition:transform 0.3s}
.dice.rolling{animation:diceShake 0.6s ease-out}
@keyframes diceShake{0%{transform:rotate(0)}25%{transform:rotate(30deg) scale(1.2)}50%{transform:rotate(-20deg) scale(0.9)}75%{transform:rotate(10deg)}100%{transform:rotate(0)}}

.event-popup{display:none;padding:20px;background:#fff;border-radius:14px;border:2px solid var(--sri-gold);margin:16px 0;text-align:left;animation:fadeIn 0.4s}
.event-popup.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.event-popup .event-title{font-size:15px;font-weight:700;color:var(--title-color);margin-bottom:8px}
.event-popup .event-text{font-size:14px;line-height:2;color:var(--text)}
.event-popup .event-choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.event-popup .event-choice{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.event-popup .event-choice:hover{background:rgba(194,59,34,0.04);border-color:var(--sri-red)}

.log-row{text-align:left;max-width:400px;margin:0 auto;font-size:12px;color:#999}
.log-row .log-item{padding:4px 0;border-bottom:1px solid #f0e8d8}

.back-link{text-align:center;padding:20px;font-size:11px;color:#999}
.back-link a{color:var(--sri-red);text-decoration:none}
.feedback-zone{max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px}
@media(max-width:480px){body{font-size:14px}}
</style>
</head>
<body>
<div class="hero"><h1>🎲 觉·大富翁</h1><p>游戏工厂 · 满意解大富翁</p></div>

<div class="game-zone">
  <div class="intro"><p>掷骰前进，每格一个<em>合伙人决策情境</em>。<br>不是传统大富翁——是让棋盘替你提问。</p></div>

  <div class="board" id="board"></div>

  <div class="control-row">
    <div class="dice" id="dice">🎲</div>
    <button class="btn-roll" id="rollBtn" onclick="rollDice()">掷骰</button>
  </div>

  <div class="event-popup" id="eventPopup"></div>

  <div class="log-row" id="logRow"></div>
</div>

<div class="back-link"><a href="go.html">← 返回决策通道</a></div>

<div class="feedback-zone">
  <div id="fbQuestion" style="color:#4A4A4A;font-weight:600;margin-bottom:10px;">这个工具对你有用吗？</div>
  <div id="fbActions" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px;">
    <button onclick="submitFeedback('up')" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">👍</span>有用</button>
    <button onclick="showFeedbackText()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">💬</span>有建议</button>
  </div>
  <textarea id="fbText" style="display:none;width:100%;max-width:400px;height:60px;border:1.5px solid #D4C5A0;border-radius:10px;padding:10px;font-size:13px;font-family:inherit;background:#fff;margin:8px auto;resize:vertical;" placeholder="你的建议会帮我们改进..."></textarea>
  <button id="fbSubmit" style="display:none;padding:8px 18px;border-radius:20px;border:1.5px solid #C23B22;background:#fff;cursor:pointer;font-size:13px;color:#C23B22;font-weight:600;margin:4px auto;" onclick="submitFeedbackText()">发送反馈 →</button>
  <div id="fbThanks" style="display:none;color:var(--sri-green);font-weight:600;padding:8px;">收到！感谢你的反馈。</div>
  <div id="fbTally" style="font-size:11px;color:#999;margin-top:4px;"></div>
</div>

<script>
var CELLS = [
  {emoji:'🚀', name:'起跑线'},
  {emoji:'💰', name:'融资抉择', event:'投资人要求对赌——签不签？', choices:['签·赌一把','不签·宁慢','谈条件']},
  {emoji:'⚡', name:'技术分歧', event:'技术派要深耕，市场派要速推——你站哪边？', choices:['站技术','站市场','拉到一起谈']},
  {emoji:'🤝', name:'信任测试', event:'你发现合伙人悄悄在接触竞品——怎么办？', choices:['直接问','先观察','找第三方介入']},
  {emoji:'📈', name:'增长瓶颈', event:'增长停滞了——是继续投钱还是收缩？', choices:['继续投','收缩·先活下来','换方向']},
  {emoji:'🔮', name:'命运轮盘', event:'意外的好运——大客户主动找上门。但你产能不够。', choices:['想办法接下来','先稳住·不贪','让给竞争对手']},
  {emoji:'💼', name:'人才流失', event:'核心员工要走——去竞品。你脑子里最好的技术路线在他脑子里。', choices:['加薪留人','签竞业·让他走','聊一聊·到底为什么']},
  {emoji:'🏛️', name:'董事会风暴', event:'董事会要求换CEO——你觉得不合适但需要投票。', choices:['战斗·说服董事会','接受·找个新角色','辞职·不如自己走']},
  {emoji:'🎯', name:'估值压力', event:'下一轮估值谈不拢——投资人给的价格比预期低40%。', choices:['接受·先拿钱','拒绝·再找别家','延迟·等业绩起来']},
  {emoji:'💔', name:'合伙人退出', event:'你的合伙人说：我累了，想走。你怎么办？', choices:['挽留·不管代价','尊重·好聚好散','给他放假·让他想想']},
  {emoji:'🌟', name:'上市之路', event:'上市前的最后一道坎——路演被质疑商业模式，股价预期砍半。', choices:['坚持上市·讲好故事','撤回·再熬一年','卖掉·及时退出']},
  {emoji:'🏆', name:'终局', event:'你走到了终局。回头看看——哪些格子让你想了最久？'}
];

var pos = 0;
var log = [];
var rolling = false;

function renderBoard(){
  var board = document.getElementById('board');
  var html = '';
  CELLS.forEach(function(c,i){
    var cls = i===pos?'active':(i<pos?'passed':'');
    html += '<div class="cell '+cls+'">'+c.emoji+'<br>'+c.name+'</div>';
  });
  board.innerHTML = html;
}

function rollDice(){
  if(rolling) return;
  rolling = true;
  var dice = document.getElementById('dice');
  dice.classList.add('rolling');
  document.getElementById('rollBtn').disabled = true;

  setTimeout(function(){
    var n = Math.floor(Math.random()*6)+1;
    dice.textContent = ['','⚀','⚁','⚂','⚃','⚄','⚅'][n];
    dice.classList.remove('rolling');

    pos = Math.min(pos+n, CELLS.length-1);
    renderBoard();

    var cell = CELLS[pos];
    var popup = document.getElementById('eventPopup');
    if(cell.event){
      var html = '<div class="event-title">'+cell.emoji+' '+cell.name+'</div>';
      html += '<div class="event-text">'+cell.event+'</div>';
      if(cell.choices){
        html += '<div class="event-choices">';
        cell.choices.forEach(function(ch,i){
          html += '<button class="event-choice" onclick="chooseOption(\''+cell.name+'\',\''+ch.replace(/'/g,"\\'")+'\')">'+ch+'</button>';
        });
        html += '</div>';
      }
      popup.innerHTML = html;
      popup.classList.add('show');
      popup.scrollIntoView({behavior:'smooth'});
    } else {
      popup.classList.remove('show');
    }

    log.unshift('🎲 '+n+'步 → '+cell.emoji+' '+cell.name);
    if(log.length>10) log.pop();
    renderLog();

    if(pos >= CELLS.length-1){
      document.getElementById('rollBtn').textContent = '🔄 重新开始';
      document.getElementById('rollBtn').onclick = resetGame;
      document.getElementById('rollBtn').disabled = false;
      rolling = false;
      return;
    }

    document.getElementById('rollBtn').disabled = false;
    rolling = false;
  }, 600);
}

function chooseOption(cellName, choice){
  log.unshift('💬 '+cellName+' → 选了「'+choice+'」');
  if(log.length>10) log.pop();
  renderLog();
  document.getElementById('eventPopup').classList.remove('show');
}

function renderLog(){
  var row = document.getElementById('logRow');
  row.innerHTML = log.map(function(l){return '<div class="log-item">'+l+'</div>';}).join('');
}

function resetGame(){
  pos = 0;
  log = [];
  document.getElementById('eventPopup').classList.remove('show');
  document.getElementById('rollBtn').textContent = '掷骰';
  document.getElementById('rollBtn').onclick = rollDice;
  document.getElementById('rollBtn').disabled = false;
  document.getElementById('dice').textContent = '🎲';
  renderBoard();
  renderLog();
}

renderBoard();

// ===== 反馈组件 =====
(function(){
  let page=location.pathname.split('/').pop()||'index';
  let key='sri_fb_'+page;
  let data=JSON.parse(localStorage.getItem(key)||'{}');
  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>

<div style="text-align:center;padding:8px 0;font-size:10px;opacity:0.25;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</div>
</body>
</html>
