<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>章·案例·云鲸|云鲸智能少年创业|满意解研究所</title><style>:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}.article{max-width:600px;margin:0 auto;padding:24px 16px 40px;font-size:15px;line-height:2}.article h2{font-size:18px;color:var(--title-color);margin:24px 0 10px}.article h3{font-size:15px;color:var(--sri-red);margin:20px 0 8px}.article p{margin:8px 0}.article .quote{padding:12px 16px;margin:12px 0;border-left:3px solid var(--sri-red);font-style:italic;color:var(--sri-red);background:rgba(194,59,34,0.04);border-radius:0 8px 8px 0}.article .highlight{color:var(--sri-red);font-weight:600}li{margin:6px 0;font-size:14px}ul{padding-left:20px}table{width:100%;font-size:12px;border-collapse:collapse;margin:12px 0}th{padding:6px;border-bottom:1px solid #D4C5A0;color:var(--sri-gold);text-align:left}td{padding:6px;border-bottom:1px solid #f0e8d8}</style></head><body><div class="hero"><h1>🐋 章·案例·云鲸</h1><p>满意姐·案例脚本·云鲸智能</p></div><div class="article"><h2>云鲸智能·26岁被diss"书生懂什么供应链"</h2><p>26岁的张峻彬，第一次见供应链工厂老板——对方上下打量了他一眼说："你一个书生，懂什么供应链？"他没有反驳。他回去画了<span class="highlight">300张图纸</span>。</p><p>李泽湘给了他第一笔钱——不是因为BP有多好，是因为他说了一句："我不想做贴牌。我想做中国人自己的扫地机器人品牌。"</p><p>当全世界都在说"你太年轻"的时候——你需要的是一个说"我相信你"的人。李泽湘对云鲸=李泽湘对大疆。两盏灯。</p></div><p style="text-align:center;padding:20px;font-size:11px;color:#999"><a href="go.html" style="color:#C23B22;text-decoration:none">← 返回决策通道</a></p></body></html>
