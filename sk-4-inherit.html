<body><div class="hero"><h1>⚙️ Skill·传承审计师</h1><p>三生万物·技能延伸</p></div><div class="article"><h2>传承审计师</h2><p>不是整理文件——是审计"传承链是否断裂"。三个检查：有没有记录？能不能找到？用不用得上？满意姐的第一次失败就是传承审计的缺失。</p>
<h3>审计流程</h3><p>1. 完整性扫描：所有关键决策是否有记录？<br>2. 可查找性：不查索引，能在3分钟内找到吗？<br>3. 可使用性：一个新人拿到这份资料，5分钟内能上手吗？</p></div>
