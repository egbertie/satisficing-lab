<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>线上产品库 · 满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:var(--title-color);color:#F5F0E6;padding:32px 20px 24px;text-align:center}
.hero h1{font-size:20px;font-weight:700}
.main{max-width:960px;margin:0 auto;padding:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:12px;text-align:center;border:1px solid #D4C5A0}
.stat .num{font-size:22px;font-weight:700;color:var(--sri-red)}
.stat .label{font-size:10px;opacity:.6}

.filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.fbtn{padding:5px 12px;border-radius:12px;font-size:10px;cursor:pointer;border:1px solid #D4C5A0;background:#fff}
.fbtn.active{background:var(--sri-red);color:#fff;border-color:var(--sri-red)}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:11px}
th{background:var(--sri-red);color:#fff;padding:8px 4px;text-align:left;font-size:10px}
td{padding:6px 4px;border-bottom:1px solid #f0e8d8;font-size:10px}
tr:hover td{background:rgba(194,59,34,0.03)}
td a{color:var(--sri-red);text-decoration:none}
.badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px}
.badge-green{background:rgba(74,140,92,.12);color:#4A8C5C}
.badge-amber{background:rgba(184,134,11,.12);color:var(--sri-gold)}

.search{width:100%;padding:8px 12px;border:1.5px solid #D4C5A0;border-radius:10px;margin-bottom:12px;font-size:13px}
.footer{text-align:center;padding:20px;font-size:10px;opacity:.4}
</style>
</head>

<div class="hero"><h1>📦 线上产品库</h1><p>满意解研究所 · 全要素记录 · 全生命周期管理</p></div>
<div class="main">
  <div class="stats">

  </div>
  <input class="search" id="searchInput" placeholder="🔍 搜索产品名称/文件名..." oninput="filterTable()">
  <div class="filter-bar">
    <button class="fbtn active" onclick="filterFam('all',this)">全部</button>
    <button class="fbtn" onclick="filterFam('衡',this)">🪙 衡·量化</button>
    <button class="fbtn" onclick="filterFam('镜',this)">🪞 镜·觉察</button>
    <button class="fbtn" onclick="filterFam('觉',this)">🔥 觉·淬炼</button>

    <button class="fbtn" onclick="filterFam('章',this)">📜 章·传承</button>

  <table id="productTable">

  <div id="tableCount" style="text-align:center;font-size:11px;opacity:.5;padding:8px;"></div>
</div>
<div class="footer">满意解研究所 · 线上产品库 · 全生命周期管理 · 第一次全面审核记录</div>

let famFilter = 'all';

const famMap = {
  'assessment':'衡','fulldiag':'衡','rps':'衡','slicing-pie':'衡','checklist':'衡',
  'thermometer':'镜','knights':'镜','pre0':'镜',
  'crisis-sim':'觉','decision-theatre':'觉','cards-play':'觉','cards':'觉',
  'match':'契','metapartner':'契','exit-guide':'契',
  'duanwei':'觉','bigrich':'觉','game-':'觉','quotes':'章',
  'creation':'章','stars':'章','54days':'章','fails':'章','treasure':'章','farewell':'章',
  'eyes':'章','wings':'章','qijin':'章','wulu':'章','roots':'章','whitepaper':'章',
  'cases':'章','tracks':'章','lineage':'章',
  'deep-':'章','sk-':'衡','blood-':'衡','fw-':'章','media-':'章',
  'ops-':'章','dialogue-':'章','kouyan-':'章','case-':'章','wx-':'章',
  'track-':'章','teach-':'衡','test-':'衡','prod-':'章',
  'partner-protocol':'契','psycho':'衡','competitor':'衡','sales':'衡','crisis-pr':'衡',
  'lessons':'衡','university':'衡','maturity':'衡',
  'maps':'章','knowledge':'章','crisis-warning':'章',
  'bluearmy':'章','opensource':'章','hibernate':'章','life':'章','newcomer':'章',
  'liang':'章','deep-lencioni':'契','deep-duke':'衡',
};

function getFam(name) {
  for (let [k,v] of Object.entries(famMap)) {
    if (name.startsWith(k)) return v;
  }
  return '章';
}

function getForm(name) {
  if (['assessment','fulldiag','rps','slicing-pie','checklist','thermometer','knights','pre0','crisis-sim','match','metapartner','exit-guide'].some(p=>name===p)) return '⚙️工具';
  if (name==='decision-theatre') return '🎭剧场';
  if (name.startsWith('cards')) return '🎴卡片';
  if (name.startsWith('teach')||name.startsWith('test')) return '🧭向导';
  return '📖文章';
}

function renderTable() {
  let filtered = data;
  if (famFilter !== 'all') {
    filtered = data.filter(p => getFam(p.name) === famFilter);
  }
  let search = document.getElementById('searchInput').value.toLowerCase();
  if (search) {
    filtered = filtered.filter(p => p.name.toLowerCase().includes(search) || p.file.toLowerCase().includes(search));
  }
  
  let html = '';
  filtered.forEach(p => {
    let fam = getFam(p.name);
    let form = getForm(p.name);
    html += `<tr>
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td>${fam}</td>
      <td>${form}</td>
      <td><span class="badge badge-green">${p.audit}</span></td>
      <td>${['assessment','fulldiag','rps','slicing-pie','checklist','thermometer','knights','pre0','crisis-sim','decision-theatre','cards-play','match','metapartner','exit-guide'].some(x=>p.name===x) ? '🔐' : '🟢'}</td>
      <td><span class="badge badge-amber">${p.stage}</span></td><td>${p.access||'🟢'}</td><td>${p.depth||'L1'}</td>
      <td><a href="${p.url}" target="_blank">→</a></td>
    </tr>`;
  });
  document.getElementById('tableBody').innerHTML = html;
  document.getElementById('tableCount').textContent = `显示 ${filtered.length} / ${data.length} 个产品`;
}

function filterFam(fam, btn) {
  famFilter = fam;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function filterTable() { renderTable(); }
