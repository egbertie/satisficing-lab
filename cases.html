<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>案例库诊断</title>
<style>
body{font-family:-apple-system,sans-serif;padding:20px;background:#F5F0E6}
button{padding:10px 20px;margin:4px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer;font-size:14px}
button.on{background:#C23B22;color:#fff}
.test{background:#fff;border-radius:12px;padding:16px;margin:12px 0;border:1px solid #e0d5c8}
.pass{color:green}.fail{color:red}
</style>
</head>
<body>
<div style="max-width:800px;margin:0 auto;padding:24px 16px 60px">
<div style="text-align:center;padding:24px 0"><h1 style="font-size:24px;color:#C23B22">传灯 · 84案例精选</h1><p style="font-size:13px;color:#6E6E6E;margin-top:4px">每个结论有真实案例</p></div>

<div style="display:flex;gap:4px;flex-wrap:wrap;margin:16px 0;justify-content:center" id="bar">
<button class="fbtn on" onclick="fil('all',this)">全部</button>
<button class="fbtn" onclick="fil('股权',this)">股权分配</button>
<button class="fbtn" onclick="fil('退出',this)">退出与清算</button>
<button class="fbtn" onclick="fil('控制权',this)">控制权争夺</button>
<button class="fbtn" onclick="fil('家族',this)">家族传承</button>
<button class="fbtn" onclick="fil('信任',this)">信任破裂</button>
<button class="fbtn" onclick="fil('价值观',this)">价值冲突</button>
<button class="fbtn" onclick="fil('涅槃',this)">至暗重生</button>
</div>

<div id="list"></div>
<div id="detail" style="display:none;animation:fi 0.2s"></div>
</div>

<script>
var CASES=[{id:1,name:'大疆2007·全员离职',type:'涅槃',industry:'硬科技',stage:'天使轮',narrative:'2007年·账面几万·全员离职·只剩出纳。出纳走之前把所有账目整得清清楚楚。李泽湘五层介入：情感→资金→团队→治理→网络。CI从0.72→0.55→0.35。',lesson:'至暗时刻不致命——导师介入+价值坚持=凤凰涅槃。',source:'满意姐·V1.5案例脚本'},{id:2,name:'比锐精密·对赌清算',type:'退出',industry:'精密制造',stage:'B轮',narrative:'创始人签了对赌——如果明年收入不达预期80%——两人共同承担无限连带责任。清算前一天才第一次认真看条款。三个月后——对赌触发。五个月后——公司清算。',lesson:'Feld: 估值越高条款越危险。',source:'满意姐·V1.5案例脚本'},{id:3,name:'云鲸智能·少年的蔑视',type:'信任',industry:'消费硬件',stage:'天使轮',narrative:'26岁·供应链工厂老板当他面说"你一个书生，懂什么供应链？"。300张图纸。李泽湘第一笔钱。拒绝贴牌——最终百亿独角兽。',lesson:'年轻不是弱点。被人否定的时候——需要一个说"我相信你"的人。',source:'满意姐·V1.5案例脚本'},{id:4,name:'固高科技·教授创业',type:'控制权',industry:'智能制造',stage:'创立期',narrative:'三位港科大教授联合创业。22年——从实验室到上市。没有内斗、没有退出、没有撕破脸。秘诀：学术治理结构直接平移到了公司治理。',lesson:'最稳定的创始团队是"多年的同事关系"——不是"刚认识的朋友"。',source:'满意姐·V1.5案例脚本'},{id:5,name:'海柔创新·仓储机器人',type:'控制权',industry:'机器人',stage:'A轮',narrative:'五位联创——一位在产品验证后提出"我的贡献被低估了，应该多拿10%"。融资窗口只有一个月。CEO选择先把钱拿进来——然后召开董事会重谈股权。',lesson:'股权不是激励——是记账。融资窗口中重谈股权是核选项。',source:'满意姐·V1.5案例脚本'},{id:6,name:'68Entry·踩雷全景',type:'退出',industry:'跨境电商',stage:'B轮',narrative:'从股权分配到退出——踩了所有的雷。静态50/50→贡献不均→沉默怨恨→危机中互相指责→清算。',lesson:'所有合伙人的失败模式都一样——不是突然崩的，是一步一步——每次都选了"先不管"。',source:'满意姐·V1.5案例脚本'},{id:7,name:'Zipcar·股权教训',type:'股权',industry:'共享出行',stage:'创立期',narrative:'一人全职·一人兼职。50/50股权。三年后——全职那位崩溃了——"为什么我天天加班、他周末来看看——股份一样多？"',lesson:'静态分配+贡献不均=定时炸弹。73%的创始人在首月选择静态分配。',source:'Wasserman·HBS研究'},{id:8,name:'Gottman·四骑士',type:'信任',industry:'通用',stage:'全阶段',narrative:'650对夫妻16年研究。四个信号——批评、蔑视、防御、冷漠——预测91%关系破裂。合伙人关系遵循完全相同模式。',lesson:'蔑视是头号杀手——不是"不喜欢"，是"看不起"。',source:'Gottman·华盛顿大学'},{id:9,name:'Dunford·定位四象限',type:'价值观',industry:'通用',stage:'全阶段',narrative:'"你在哪个世界里是最好的？"——定位不是口号。硬科技+中国+供应链=只有你能占的空位。',lesson:'定位不是口号——是"你在哪个世界里是最好的"。',source:'Dunford·Obviously Awesome'},{id:10,name:'Kahneman·噪声',type:'控制权',industry:'通用',stage:'决策中',narrative:'让法官在不同日子里对同一个案件量刑——相差3-8年。不是因为案件不同——是法官状态不同。创始人的决策噪声比法官更大。',lesson:'同一个人对同一个问题——不同日子里答案可能差30%。延时24小时。',source:'Kahneman·2021'},{id:11,name:'Simon·满意解',type:'控制权',industry:'通用',stage:'创立期',narrative:'Herbert Simon 1978年诺贝尔奖——证明最优解不存在。人的认知有限、信息有限、时间有限——需要"够好"，不是"完美"。',lesson:'满意解不是妥协——是智慧。有限理性是人类的出厂设置。',source:'Simon·1978诺贝尔奖'},{id:12,name:'比锐精密·条款缺失',type:'退出',industry:'精密制造',stage:'B轮',narrative:'两位创始人持股约各半。并购谈判中——一位想卖、一位不想卖。没有退出条款——僵持14个月。并购方撤回offer。',lesson:'没有退出条款的合伙——就是把"怎么分手"推到情绪最高点去解决。',source:'满意姐·V2案例补充'}];
var AF='all';

function fil(type,btn){
  AF=type;
  var bs=document.querySelectorAll('.fbtn');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');
  btn.classList.add('on');
  renderList();
}
function renderList(){
  var f=AF==='all'?CASES:CASES.filter(function(c){return c.type===AF});
  var h='';
  f.forEach(function(c){
    h+='<div class="case-card" onclick="show('+c.id+')" style="background:#fff;border-radius:12px;padding:16px 18px;margin:8px 0;border:1px solid #e0d5c8;cursor:pointer"><div style="font-size:15px;font-weight:600;color:#2A2A2A">'+c.name+'</div><div style="font-size:11px;color:#6E6E6E;margin-top:2px">'+c.industry+' · '+c.stage+'</div><div style="margin-top:6px"><span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;background:rgba(194,59,34,0.1);color:#C23B22">'+c.type+'</span><span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;background:rgba(184,134,11,0.1);color:#B8860B;margin-left:4px">'+c.industry+'</span></div></div>';
  });
  document.getElementById('list').innerHTML=h||'<p style="text-align:center;color:#6E6E6E;padding:40px">暂无此类案例</p>';
  document.getElementById('detail').style.display='none';
}
function show(id){
  var c=CASES.find(function(x){return x.id===id});if(!c)return;
  document.getElementById('list').style.display='none';
  document.getElementById('detail').innerHTML='<button onclick="back()" style="padding:6px 14px;border-radius:12px;border:1px solid #C23B22;background:#fff;color:#C23B22;cursor:pointer;font-size:12px;margin-bottom:12px">← 返回列表</button><h2 style="font-size:18px;color:#C23B22;margin-bottom:8px">'+c.name+'</h2><div style="font-size:11px;color:#6E6E6E">'+c.industry+' · '+c.stage+'</div><div style="font-size:14px;line-height:1.8;margin:12px 0;padding:12px 16px;background:rgba(194,59,34,0.03);border-radius:10px;border-left:3px solid #C23B22">'+c.narrative+'</div><div style="font-size:13px;color:#B8860B;margin:8px 0">💡 '+c.lesson+'</div><div style="font-size:11px;color:#6E6E6E">📚 '+c.source+'</div>';
  document.getElementById('detail').style.display='block';
}
function back(){
  document.getElementById('list').style.display='block';
  document.getElementById('detail').style.display='none';
}
renderList();
</script></body>
</html>
