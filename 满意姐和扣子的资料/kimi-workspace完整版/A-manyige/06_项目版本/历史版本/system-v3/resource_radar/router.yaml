# Resource Arbitrage Router 配置
# 资源套利路由 — 免费资源自动选择
# 命名空间: NGT-ARBITRAGE-v1.0-FIN-260327

version: "1.0"
description: "基于可用性和成本的资源自动路由"

router:
  # 路由策略
  strategies:
    # 策略1: 成本优先（默认）
    cost_first:
      description: "优先使用免费资源"
      priority:
        - "kimi"           # 无限额度
        - "github_models"  # 免费额度
        - "groq"           # 有限免费
      
    # 策略2: 质量优先
    quality_first:
      description: "优先使用高质量模型"
      priority:
        - "kimi-k2p5"      # 最高质量
        - "gpt-4o"         # 高质量
        - "gpt-4o-mini"    # 性价比
        
    # 策略3: 速度优先
    speed_first:
      description: "优先使用低延迟服务"
      priority:
        - "groq"           # 极速推理
        - "kimi"           # 标准速度
        - "github_models"  # 普通速度

  # 决策矩阵
  decision_matrix:
    # 任务类型 → 策略
    task_routing:
      "deep_research": "quality_first"
      "quick_query": "speed_first"
      "batch_processing": "cost_first"
      "code_generation": "quality_first"
      "data_extraction": "cost_first"
      
  # 限额监控
  quota_monitor:
    github_models:
      gpt4o_daily: 50
      gpt4o_mini_daily: 150
      tracker: "memory/quota_tracker.json"
      alert_threshold: 20  # 20%剩余时告警
      
  # 故障转移
  failover:
    enabled: true
    retry_count: 3
    circuit_breaker:
      failure_threshold: 5
      timeout: 60
      recovery_time: 300
      
  # 监控指标
  metrics:
    - "requests_per_source"
    - "cost_per_request"
    - "latency_per_source"
    - "error_rate_per_source"
    - "quota_remaining"
