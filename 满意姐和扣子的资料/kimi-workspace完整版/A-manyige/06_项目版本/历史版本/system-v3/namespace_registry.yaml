  - "NGT-CONFIG-v1.0-FIN-260327-GitOpsTruth"
  - "NGT-CONFIG-v1.0-FIN-260327-MetaAgent"
  - "NGT-CONFIG-v1.0-FIN-260327-Topology3D"
  - "NGT-CONFIG-v1.0-FIN-260327-SecureDefense"
  - "NGT-CONFIG-v1.0-FIN-260327-EvolutionEngine"
  
  # Personas
  - "PERS-DNA-v1.0-FIN-260327-LiuHonglei"
  
  # Knowledge
  - "KNL-INDEX-v1.0-FIN-260327-KnowledgeBase"
  - "KNL-SCHEMA-v1.0-FIN-260327-TopologyAnnotations"
