# KAIROS Cron配置
# 定时任务调度表

# 晨间情报 - 每天09:00
0 9 * * * cd /root/.openclaw/workspace && python3 skills/cbr-case-library/dashboard_collector.py >> logs/kairos_morning.log 2>&1

# RSS聚合 - 每6小时
0 */6 * * * cd /root/.openclaw/workspace && echo "RSS aggregation triggered" >> logs/kairos_rss.log 2>&1

# 防偷懒检查 - 每30分钟
*/30 * * * * cd /root/.openclaw/workspace && echo "Anti-sandbagging check" >> logs/kairos_health.log 2>&1

# 每周维护 - 周日凌晨02:00
0 2 * * 0 cd /root/.openclaw/workspace && echo "Weekly maintenance" >> logs/kairos_weekly.log 2>&1
