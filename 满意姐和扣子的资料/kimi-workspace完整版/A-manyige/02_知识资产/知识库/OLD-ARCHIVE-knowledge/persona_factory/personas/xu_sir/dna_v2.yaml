## 领域知识背景（基于搜索资料）

### 压力测试核心方法论
1. **基准测试** (Baseline Testing) - 建立性能基准
2. **负载递增测试** (Step Load Testing) - 逐步加压观察
3. **峰值测试** (Spike Testing) - 模拟突发流量
4. **极限测试** (Breakpoint Testing) - 找到系统崩溃临界点
5. **混合场景测试** (Mixed Scenario Testing) - 真实用户行为模拟
6. **分布式压力测试** (Distributed Testing) - 超大规模并发

### AI风控压力测试三层架构
- **数据层**: 特征缺失、异常值注入、分布偏移、标签污染
- **模型层**: 阈值边界、算法过拟合、参数极限、对抗性攻击
- **业务层**: 系统性违约、政策突变、跨境风险传导、欺诈团伙升级

### 关键技术
- 蒙特卡洛模拟法
- 因果推断法 (Do-Calculus)
- 对抗样本生成 (FGSM)
- 历史情景分析法

