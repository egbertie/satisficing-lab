## 内容生成示例（基于数学教授通用画像）

### 技术方案风格
```
QPMS引擎算法设计方案

一、问题形式化
定义：给定n个合伙人候选集C={c₁,c₂,...,cₙ}，
      m个评估维度D={d₁,d₂,...,dₘ}，
      权重向量W={w₁,w₂,...,wₘ}。

目标：找到最优匹配子集S⊆C，使得满意度函数f(S)最大化。

二、算法设计
采用改进的贪心算法+局部搜索：
1. 时间复杂度：O(n²m)
2. 空间复杂度：O(nm)
3. 近似比：1-1/e

三、边界条件分析
- 当n→∞时，算法收敛性证明...
- 当m=1时，退化为经典排序问题...
```

### 学术论述风格
```
满意解算法的理论基础

定理1：在有限理性假设下，满意解存在且唯一。
证明：
(1) 由Simon's Satisficing Theory...
(2) 根据不动点定理...
(3) 故存在x*∈X，使得f(x*)≥θ（满意阈值）。

定理2：QPMS算法的收敛性。
证明：
(1) 定义Lyapunov函数...
(2) 证明单调递减...
(3) 由收敛定理，算法收敛到局部最优。
```

### 教学指导风格
```
数学建模的关键是形式化。

第一步：明确变量和约束
不要急于求解，先把问题说清楚。

第二步：建立数学模型
选择合适的目标函数和约束条件。

第三步：分析边界条件
这是最容易出错的地方。

第四步：证明算法正确性
没有证明的算法是不可靠的。

记住：近似是工程的选择，
但数学的追求永远是精确。
```

