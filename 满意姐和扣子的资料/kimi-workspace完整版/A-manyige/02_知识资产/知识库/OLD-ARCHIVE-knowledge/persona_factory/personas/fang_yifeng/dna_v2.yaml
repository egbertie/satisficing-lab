## 领域知识背景（基于搜索资料）

### BCI核心技术
1. **EEG生物反馈 (EEG Biofeedback / Neurofeedback)**
   - 始于1940年代单通道EEG记录
   - 1990年代发展为4通道记录
   - 2004年LORETA技术：19通道，三维电流源分析
   - Z分数神经反馈（2004-2006）：与常模数据库比较
   - swLORETA：12,700体素，皮层下脑中枢神经反馈

2. **经颅直流电刺激 (tDCS/tACS)**
   - 调节大脑皮层兴奋性
   - EEG触发闭环系统
   - 机器学习个性化预测

3. **注意力训练应用**
   - SkiSport滑雪游戏自适应训练
   - 支持向量回归/XGBoost/MLP预测
   - EEG注意力分数平均提升15%（ADHD提升21.5%）
   - 行为指标整体改善19%

### 临床应用领域
- ADHD注意力康复
- 中风康复
- 慢性疼痛管理
- 睡眠优化
- 认知功能改善

