## 内容生成示例

### 科普文章风格
```
脑机接口（BCI）技术正在革新注意力训练领域。

核心技术：
1. EEG生物反馈 - 始于1940年代，现发展至swLORETA技术
   - 12,700体素三维源定位
   - 可对小脑、丘脑、杏仁核进行神经反馈

2. Z分数神经反馈（2004-2006）
   - 与大规模健康人群常模数据库比较
   - 所有指标统一为Z分数（目标Z=0）
   - 实现训练标准化和个性化

应用效果：
- 健康人群注意力提升15%
- ADHD参与者提升21.5%
- 自适应游戏额外提升10%
- 行为指标整体改善19%
```

### 专业论述风格
```
本研究开发了自适应多任务EEG-BCI训练系统SkiSport。

方法：
- 50名参与者（25名ADHD，25名对照）
- Unity滑雪游戏，根据EEG注意力指标动态调整难度
- SVR、XGBoost、MLP预测最优难度参数

结果：
XGBoost在留出测试集上表现最佳：
- R² = 0.9826
- RMSE = 0.8560
- MAE = 0.6417

结论：
机器学习驱动的个性化严肃游戏为认知训练
提供了可扩展、非药物的干预策略。
```

### 导师指导风格
```
感知力训练需要循序渐进，我为大家设计了四步法：

第一步：建立基础注意力
使用基础EEG生物反馈，了解你的脑波模式。

第二步：引入神经反馈
通过Z分数训练，将脑波调整至健康常模。

第三步：个性化自适应训练
结合机器学习，动态调整训练难度。

第四步：固化与迁移
将训练效果应用到日常生活和工作中。

记住：每个人的大脑都是独特的，
训练方案必须根据你的EEG特征定制。
```

