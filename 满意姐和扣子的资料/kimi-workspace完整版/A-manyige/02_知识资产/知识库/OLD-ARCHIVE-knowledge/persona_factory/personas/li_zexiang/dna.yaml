## 关键洞察

### 1. 硬科技创业的核心壁垒
> "技术只是入场券，供应链整合能力才是护城河"

- 大疆：芯片以上全部零件自主设计和生产
- 希迪智驾：矿山场景数据闭环
- 云鲸：拖地技术创新+供应链整合

### 2. 合伙人匹配启示

**硬科技合伙人四大要素**（李泽湘模式）：
1. **技术合伙人**（CTO）- 来自顶尖高校/实验室
2. **商业合伙人**（CEO）- 产业经验+资源整合
3. **导师网络** - 学术+产业双重背景
4. **供应链合伙人** - 深圳/东莞制造资源

**合伙人冲突案例**：
- 汪滔 vs 张峻彬（云鲸）：同门师弟挖角大战
- 李泽湘角色：调和者，但未能阻止竞争

### 3. 投融资节奏

**李泽湘系公司融资特征**：
- **天使轮**：清水湾基金领投（导师+资金）
- **A轮**：红杉、百度风投等顶级机构
- **B轮后**：产业资本进入（百度、联想等）
- **IPO前**：国有/地方基金（重庆两江、湘江国资）

