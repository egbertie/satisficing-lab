# Token阈值配置 - 2026-04-02校准
# 周期: 每周三12:00重置
# 频限: 每5小时重置

TOKEN_THRESHOLDS:
  L1_NORMAL:     { min: 70, interval: 30min,  action: "正常执行" }
  L2_CAUTION:    { min: 50, interval: 45min,  action: "降频33%" }
  L3_WARNING:    { min: 30, interval: 60min,  action: "降频50%" }
  L4_CRITICAL:   { min: 0,  interval: 120min, action: "仅P0任务" }
  NIGHT_MODE:    { hour: "00:00-08:00", interval: 120min, action: "静默模式" }

CURRENT_STATUS:
  token_consumed: "24%"
  rate_limit: "35% (60分钟后重置)"
  storage_used: "33%"
  level: "L1_NORMAL"
  action: "继续执行BAC顺序"

COST_THRESHOLDS:
  L0_NORMAL:   { rate: 0.00, color: "🟢" }
  L1_REMIND:   { rate: 0.50, color: "🔵" }
  L2_WARN:     { rate: 0.60, color: "🟡" }
  L3_ALERT:    { rate: 0.80, color: "🟠" }
  L4_REDLINE:  { rate: 1.00, color: "🔴" }
  L5_OVERFLOW: { rate: 1.10, color: "⚫" }
