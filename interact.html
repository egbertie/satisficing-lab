<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速评估 · 满意解研究所</title>
<meta name="description" content="3分钟了解你的团队健康度 · 满意解研究所">
<style>
:root{--red:#C23B22;--gold:#B8860B;--bg:#FAF7F2;--white:#FFFFFF;--text:#2D2D2D;--text2:#5C5C5C;--text3:#999;--border:#E8E0D5;--green:#3D7A4F;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header .logo{font-size:16px;font-weight:700;color:var(--red)}
.container{max-width:680px;margin:0 auto;padding:24px 20px 60px}
.hero{text-align:center;padding:24px 0}
.hero h1{font-size:22px;margin-bottom:4px}
.hero p{font-size:13px;color:var(--text2)}
.card{background:var(--white);border-radius:var(--radius);padding:20px 24px;border:1px solid var(--border);margin-bottom:16px}
.question{margin-bottom:20px;padding:16px;border-radius:var(--radius);border:1px solid var(--border);transition:all .2s}
.question h4{font-size:15px;margin-bottom:12px;line-height:1.5}
.options{display:flex;gap:8px;flex-wrap:wrap}
.option{padding:10px 16px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:var(--white);transition:all .15s;text-align:center;flex:1;min-width:60px}
.option:hover{border-color:var(--gold)}
.option.selected{background:var(--red);color:#fff;border-color:var(--red)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#A8321C}
.btn-block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}

.result-bar{height:8px;border-radius:4px;margin:8px 0;background:var(--border);overflow:hidden}
.result-fill{height:100%;border-radius:4px;transition:width .6s}
.result-fill.critical{background:var(--red)}
.result-fill.warning{background:#FF9800}
.result-fill.healthy{background:var(--green)}

.result-item{padding:12px 0;border-bottom:1px dotted var(--border)}
.result-item h4{font-size:14px;margin-bottom:2px}
.result-item p{font-size:12px;color:var(--text2)}

.hidden{display:none}
.progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:16px}
.progress-fill{height:100%;background:var(--red);border-radius:2px;transition:width .3s}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeUp .3s both}
</style>
</head>
<body>
<div class="header"><a class="logo" href="index.html">🔥 满意解研究所</a><a href="client.html" style="font-size:13px;color:var(--gold)">← 客户通道</a></div>
<div class="container">
<div class="hero"><h1>🚨 3分钟团队健康度检测</h1><p>回答7个问题，立即获得你的团队健康报告</p></div>

<div id="quizArea" class="animate-in">
  <div class="progress"><div class="progress-fill" id="qProgress" style="width:0%"></div></div>
  <div class="card" id="questions"></div>
  <button class="btn btn-primary btn-block hidden" id="resultBtn" onclick="showResult()">查看结果 →</button>
</div>

<div id="resultArea" class="hidden animate-in">
  <div class="card" id="resultContent"></div>
  <div class="card" style="text-align:center">
    <h3 style="font-size:16px;margin-bottom:12px">下一步怎么走？</h3>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap" id="nextActions"></div>
  </div>
</div>
</div>

<script>
var questions = [
  {q:'你们的合伙人之间，多久进行一次深入的一对一对话？',opts:['每周','每月','每季度','几乎不'],weights:[1,2,3,5]},
  {q:'当前团队有没有「说不得的话题」？（某些问题大家心照不宣地回避）',opts:['完全没有','有一两个','有不少','到处都是'],weights:[1,2,3,5]},
  {q:'如果有核心成员明天突然离职，团队能多快恢复运转？',opts:['马上恢复','1-2周','1-3个月','完全瘫痪'],weights:[1,2,3,5]},
  {q:'你们做重大人事决策时，依赖数据/框架的程度？',opts:['高度依赖','有参考','凭感觉','拍脑袋'],weights:[1,2,3,5]},
  {q:'团队里是否有人「名义上在，实际上已经离开」？（心不在焉的人）',opts:['完全没有','有1个','有2-3个','很多'],weights:[1,2,3,5]},
  {q:'创始人之间对「成功」的定义一致吗？',opts:['高度一致','大致一致','有些分歧','完全不同'],weights:[1,2,3,5]},
  {q:'团队成员之间，信任的「账户余额」是正还是负？',opts:['大幅盈余','略有盈余','开始透支','严重亏空'],weights:[1,2,3,5]}
];

var answers = {};
var currentQ = 0;

function renderQuestion() {
  if (currentQ >= questions.length) {
    document.getElementById('resultBtn').classList.remove('hidden');
    document.getElementById('questions').innerHTML = '<h3 style="text-align:center;color:var(--green)">✅ 全部回答完毕！</h3><p style="text-align:center;color:var(--text2)">点击下方按钮查看结果</p>';
    document.getElementById('qProgress').style.width = '100%';
    return;
  }

  var q = questions[currentQ];
  var html = '<h3 style="font-size:14px;color:var(--text2);margin-bottom:12px">问题 '+(currentQ+1)+'/'+questions.length+'</h3>';
  html += '<div class="question"><h4>'+q.q+'</h4><div class="options">';
  q.opts.forEach(function(opt,i){
    var sel = answers[currentQ] === i ? ' selected' : '';
    html += '<div class="option'+sel+'" data-idx="'+i+'" onclick="selectAnswer('+currentQ+','+i+')">'+opt+'</div>';
  });
  html += '</div></div>';
  
  document.getElementById('questions').innerHTML = html;
  document.getElementById('qProgress').style.width = Math.round(currentQ/questions.length*100)+'%';
}

function selectAnswer(qIdx, optIdx) {
  answers[qIdx] = optIdx;
  currentQ++;
  renderQuestion();
}

function showResult() {
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');

  var score = 0;
  questions.forEach(function(q,i){ score += q.weights[answers[i]||0]; });
  var maxScore = questions.length*5;
  var pct = Math.round(score/maxScore*100);

  var level, color, icon, actions;
  if (pct <= 30) { level='🟢 安全区'; color='healthy'; icon='✅'; actions=[
    '<a class="btn btn-primary" href="go.html">探索更多工具</a>',
    '<a class="btn btn-secondary" href="assessment.html">五维深度自评</a>'
  ];}
  else if (pct <= 60) { level='🟡 关注区'; color='warning'; icon='⚠️'; actions=[
    '<a class="btn btn-primary" href="crisis-sim.html">危机模拟演练</a>',
    '<a class="btn btn-primary" href="radar.html">团队雷达扫描</a>'
  ];}
  else { level='🔴 高危区'; color='critical'; icon='🚨'; actions=[
    '<a class="btn btn-primary" href="client.html">预约决策顾问</a>',
    '<a class="btn btn-secondary" href="crisis-sim.html">紧急危机推演</a>'
  ];}

  var html = '<h2 style="text-align:center;font-size:48px;margin-bottom:8px">'+icon+'</h2>';
  html += '<h3 style="text-align:center;font-size:20px;margin-bottom:16px">'+level+' · 风险指数 '+pct+'%</h3>';
  html += '<div class="result-bar"><div class="result-fill '+color+'" style="width:'+pct+'%"></div></div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:20px"><span>0% 安全</span><span>50% 关注</span><span>100% 高危</span></div>';

  // 各维度分析
  var dims = [
    {name:'沟通频率',idx:[0],critical:5},
    {name:'团队透明',idx:[1],critical:5},
    {name:'抗风险能力',idx:[2],critical:5},
    {name:'决策科学性',idx:[3],critical:5},
    {name:'人才流失风险',idx:[4],critical:5},
    {name:'目标一致性',idx:[5],critical:5},
    {name:'信任余额',idx:[6],critical:5}
  ];

  html += '<h4 style="font-size:14px;margin-bottom:12px">📊 各维度分析</h4>';
  dims.forEach(function(d){
    var s = questions[d.idx[0]].weights[answers[d.idx[0]]||0];
    var dpct = Math.round(s/5*100);
    var cls = dpct <= 40 ? 'healthy' : dpct <= 60 ? 'warning' : 'critical';
    html += '<div class="result-item"><h4>'+d.name+' <span style="font-size:11px;color:var(--text3)">'+dpct+'%</span></h4><div class="result-bar"><div class="result-fill '+cls+'" style="width:'+dpct+'%"></div></div></div>';
  });

  html += '<p style="font-size:12px;color:var(--text3);text-align:center;margin-top:16px">此评估为快速参考，不替代专业诊断。<br>深度咨询请联系顾问。</p>';
  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('nextActions').innerHTML = actions.join('');

  // 发送分析数据
  try { fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'匿名用户',message:'团队健康度检测 · 风险指数'+pct+'% · '+level})}); } catch(e){}
}

renderQuestion();
</script>
</body>
</html>
