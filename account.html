<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 满意解研究所</title>
<meta name="description" content="满意解研究所 · 客户个人中心">
<script src="sri-track.js"></script>
<script src="sri-api.js"></script>
<style>
:root{--red:#C23B22;--gold:#B8860B;--bg:#FAF7F2;--white:#FFF;--text:#2D2D2D;--text2:#5C5C5C;--text3:#999;--border:#E8E0D5;--green:#3D7A4F;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
a{color:var(--gold);text-decoration:none}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header .logo{font-size:16px;font-weight:700;color:var(--red)}
.container{max-width:800px;margin:0 auto;padding:24px 20px 60px}
.hero{text-align:center;padding:32px 0 20px}
.hero .avatar{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:28px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.card{background:var(--white);border-radius:var(--radius);padding:20px;border:1px solid var(--border);margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.card h3{font-size:15px;margin-bottom:10px}
.card p{font-size:13px;color:var(--text2);margin-bottom:4px}
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab{flex:1;padding:10px 4px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:inherit}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
.tab-content{display:none;animation:fadeUp .3s both}
.tab-content.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#A8321C}
.btn-outline{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-outline:hover{background:rgba(194,59,34,.05)}
.btn-block{width:100%}.btn:disabled{opacity:.5}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:all .3s}
.toast.show{opacity:1}.toast.success{background:#E8F5E9;color:var(--green)}.toast.error{background:#FFEBEE;color:var(--red)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:3px}
.field input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.field input:focus{border-color:var(--gold)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin:2px}
.tag-red{background:#FDE8E5;color:var(--red)}.tag-gold{background:#FDF3E0;color:var(--gold)}.tag-green{background:#E8F0EB;color:var(--green)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border)}
.stat-num{font-size:22px;font-weight:700;color:var(--red)}.stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.delivery-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}
.delivery-item:last-child{border-bottom:none}
.delivery-item .name{font-weight:600;font-size:13px}
.delivery-item .meta{font-size:11px;color:var(--text3)}
.empty{text-align:center;padding:40px;color:var(--text3)}
@media(max-width:480px){.container{padding:12px 14px}.tabs{font-size:11px}}
</style>
</head>
<body>
<div class="header"><a class="logo" href="index.html">🔥 满意解研究所</a><a href="index.html" style="font-size:13px;color:var(--gold)">← 返回首页</a></div>
<div class="container">
<!-- 未登录 -->
<div id="guestView" style="display:none">
  <div class="hero">
    <div class="avatar">👤</div>
    <h2 style="margin-bottom:4px">欢迎来到个人中心</h2>
    <p style="font-size:13px;color:var(--text2)">登录后管理你的档案、产品和推荐</p>
  </div>
  <div class="card">
    <h3>🔑 登录</h3>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field"><label>邮箱</label><input type="email" id="loginEmail" placeholder="your@email.com" required></div>
      <div class="field"><label>密码</label><input type="password" id="loginPwd" placeholder="至少6位" required></div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
  </div>
  <div class="card">
    <h3>🆕 注册</h3>
    <form id="regForm" onsubmit="return doRegister(event)">
      <div class="field"><label>邮箱 *</label><input type="email" id="regEmail" required></div>
      <div class="field"><label>姓名 *</label><input type="text" id="regName" required></div>
      <div class="field"><label>密码 *（至少6位）</label><input type="password" id="regPwd" required></div>
      <div class="field"><label>企业</label><input type="text" id="regCompany"></div>
      <div class="field"><label>行业</label><input type="text" id="regIndustry" placeholder="半导体 / AI / 生物医药..."></div>
      <button type="submit" class="btn btn-outline btn-block">创建账户</button>
    </form>
  </div>
</div>

<!-- 已登录 -->
<div id="memberView" style="display:none">
  <div class="hero">
    <div class="avatar" id="mAvatar">👤</div>
    <h2 id="mName" style="margin-bottom:2px">---</h2>
    <p style="font-size:12px;color:var(--text3)"><span id="mEmail">---</span> · <span id="mRole">---</span></p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview')">📊 概览</button>
    <button class="tab" onclick="switchTab('profile')">👤 档案</button>
    <button class="tab" onclick="switchTab('delivery')">📦 产品</button>
    <button class="tab" onclick="switchTab('referral')">🤝 推荐</button>
  </div>

  <div class="tab-content active" id="tab-overview">
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num" id="statProducts">0</div><div class="stat-label">已购产品</div></div>
      <div class="stat-card"><div class="stat-num" id="statInquiries">0</div><div class="stat-label">留言咨询</div></div>
      <div class="stat-card"><div class="stat-num" id="statReferrals">0</div><div class="stat-label">成功推荐</div></div>
      <div class="stat-card"><div class="stat-num" id="statScore">-</div><div class="stat-label">决策风格</div></div>
    </div>
    <div class="card">
      <h3>🔥 快速入口</h3>
      <a href="assessment.html" class="btn btn-primary" style="margin:4px">🧭 决策自评</a>
      <a href="go.html" class="btn btn-outline" style="margin:4px">🛠 产品中心</a>
      <a href="client.html" class="btn btn-outline" style="margin:4px">💬 联系我们</a>
    </div>
  </div>

  <div class="tab-content" id="tab-profile">
    <div class="card">
      <h3>👤 个人档案</h3>
      <form id="profileForm" onsubmit="return updateProfile(event)">
        <div class="field"><label>姓名</label><input type="text" id="pName"></div>
        <div class="field"><label>手机</label><input type="tel" id="pPhone"></div>
        <div class="field"><label>企业</label><input type="text" id="pCompany"></div>
        <div class="field"><label>职位</label><input type="text" id="pPosition"></div>
        <div class="field"><label>行业</label><input type="text" id="pIndustry"></div>
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" class="btn btn-outline" onclick="doLogout()" style="margin-left:8px">退出登录</button>
      </form>
    </div>
  </div>

  <div class="tab-content" id="tab-delivery">
    <div class="card">
      <h3>📦 我的产品</h3>
      <div id="deliveryList"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-referral">
    <div class="card">
      <h3>🤝 推荐有礼</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">推荐朋友注册，双方各获得奖励。</p>
      <div class="field"><label>我的推荐链接</label><input type="text" id="refLink" readonly onclick="this.select()"></div>
      <button class="btn btn-primary btn-block" onclick="createRef()">生成推荐链接</button>
      <div id="refList" style="margin-top:16px"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script>
var customer = null;

// Init
(function(){
  var t = SRI_API.getToken();
  if(t){
    SRI_API.getMe().then(function(d){customer=d.customer;renderMember();}).catch(function(){showGuest();});
  }else{showGuest();}
})();

function showGuest(){document.getElementById('guestView').style.display='block';document.getElementById('memberView').style.display='none';}
function showMember(){document.getElementById('guestView').style.display='none';document.getElementById('memberView').style.display='block';}

function renderMember(){
  if(!customer)return;
  showMember();
  document.getElementById('mName').textContent=customer.name||'未设置';
  document.getElementById('mEmail').textContent=customer.email;
  document.getElementById('mRole').textContent={trial:'试用',free:'免费',premium:'付费',vip:'VIP',partner:'合伙人'}[customer.role]||customer.role;
  document.getElementById('mAvatar').textContent=(customer.name||'?')[0];
  document.getElementById('statScore').textContent=customer.decision_style||'-';
  
  // Load data
  loadProfile();
  loadDeliveries();
  loadReferrals();
}

function loadProfile(){
  var c=customer; if(!c)return;
  document.getElementById('pName').value=c.name||'';
  document.getElementById('pPhone').value=c.phone||'';
  document.getElementById('pCompany').value=c.company||'';
  document.getElementById('pPosition').value=c.position||'';
  document.getElementById('pIndustry').value=c.industry||'';
}

async function updateProfile(e){
  e.preventDefault();
  var d={
    name:document.getElementById('pName').value.trim(),
    phone:document.getElementById('pPhone').value.trim(),
    company:document.getElementById('pCompany').value.trim(),
    position:document.getElementById('pPosition').value.trim(),
    industry:document.getElementById('pIndustry').value.trim()
  };
  try{
    await SRI_API.updateProfile(d);
    toast('✅ 档案已更新','success');
  }catch(e){toast('❌ 更新失败','error');}
  return false;
}

async function loadDeliveries(){
  try{
    var r=await SRI_API.getDeliveries();
    var items=r.deliveries||[];
    document.getElementById('statProducts').textContent=items.length;
    var html=items.length?items.map(function(d){
      return '<div class="delivery-item"><div><div class="name">'+d.product_name+'</div><div class="meta">'+d.granted_at+'</div></div><span class="tag tag-green">使用中</span></div>';
    }).join(''):'<div class="empty">暂无产品</div>';
    document.getElementById('deliveryList').innerHTML=html;
  }catch(e){}
}

async function loadReferrals(){
  try{
    var r=await SRI_API.getReferrals();
    var items=r.referrals||[];
    document.getElementById('statReferrals').textContent=items.filter(function(x){return x.status==='converted'}).length;
    var html=items.length?items.map(function(rf){
      return '<div class="delivery-item"><div><div class="name">'+rf.referral_code+'</div><div class="meta">状态: '+rf.status+'</div></div></div>';
    }).join(''):'';
    document.getElementById('refList').innerHTML=html||'<div class="empty" style="padding:16px">暂无推荐记录</div>';
  }catch(e){}
}

async function doLogin(e){
  e.preventDefault();
  try{
    var r=await SRI_API.login(document.getElementById('loginEmail').value.trim(),document.getElementById('loginPwd').value.trim());
    customer=r.customer;renderMember();toast('✅ 登录成功','success');
  }catch(e){toast('❌ 登录失败: '+(e.error||'邮箱或密码错误'),'error');}
  return false;
}

async function doRegister(e){
  e.preventDefault();
  var pwd=document.getElementById('regPwd').value.trim();
  if(pwd.length<6){toast('密码至少6位','error');return false;}
  try{
    var r=await SRI_API.register({
      email:document.getElementById('regEmail').value.trim(),
      password:pwd,
      name:document.getElementById('regName').value.trim(),
      company:document.getElementById('regCompany').value.trim(),
      industry:document.getElementById('regIndustry').value.trim()
    });
    customer=r.customer;renderMember();toast('✅ 注册成功','success');
  }catch(e){toast('❌ '+(e.error||'注册失败'),'error');}
  return false;
}

async function doLogout(){
  await SRI_API.logout();customer=null;showGuest();toast('已退出登录','success');
}

async function createRef(){
  try{
    var r=await SRI_API.createReferral();
    document.getElementById('refLink').value=r.link;
    loadReferrals();
    toast('✅ 推荐链接已生成','success');
  }catch(e){toast('❌ 生成失败','error');}
}

function switchTab(n){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
  var idx={overview:0,profile:1,delivery:2,referral:3}[n]||0;
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById('tab-'+n).classList.add('active');
}

function toast(m,t){
  var el=document.getElementById('toast');el.className='toast show '+t;el.textContent=m;
  setTimeout(function(){el.className='toast'},3000);
}
</script>
</body>
</html>
