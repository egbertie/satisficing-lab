<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRE-0 · 身体在说话</title>
<meta name="description" content="做一个决定之前，先问身体。Damasio说身体在决策前就已经在投票。30秒，听见它。">
<style>
:root{--red:#C23B22;--gold:#B8860B;--bg:#FAF7F2;--white:#fff;--text:#2D2D2D;--text2:#5C5C5C;--border:#E8E0D5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.v5-badge{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,var(--red),var(--gold));color:#fff;padding:8px;text-align:center;font-size:10px;letter-spacing:.5px;z-index:10}
.v5-badge a{color:#FFD700}

.card{background:var(--white);border-radius:16px;padding:32px 24px;max-width:420px;width:100%;text-align:center;border:1px solid var(--border);box-shadow:0 2px 16px rgba(0,0,0,.03);transition:all .4s;display:none}
.card.active{display:block;animation:fadeIn .6s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card .icon{font-size:40px;margin-bottom:12px}
.card h2{font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.4}
.card .lead{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:20px}

/* 决策输入 */
.decision-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:16px;text-align:center;font-family:inherit;background:var(--white);color:var(--text);transition:border-color .3s}
.decision-input:focus{outline:none;border-color:var(--gold)}
.decision-input::placeholder{color:#CCC}

/* 身体信号卡片 */
.body-zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.zone-btn{padding:16px 10px;border-radius:12px;border:2px solid var(--border);background:var(--white);cursor:pointer;text-align:center;transition:all .3s;font-size:13px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.zone-btn:hover{border-color:var(--gold)}
.zone-btn.selected{border-color:var(--red);background:rgba(194,59,34,.03)}
.zone-btn .z-emoji{font-size:24px}
.zone-btn .z-label{font-size:12px;font-weight:600;color:var(--text)}
.zone-btn .z-feel{font-size:11px;color:var(--text2);margin-top:2px;display:none}
.zone-btn.selected .z-feel{display:block}
.zone-btn .z-feel-input{width:100%;border:none;border-bottom:1.5px solid var(--border);background:transparent;text-align:center;font-size:11px;font-family:inherit;color:var(--red);padding:2px;display:none;margin-top:4px}
.zone-btn.selected .z-feel-input{display:block}
.zone-btn .z-feel-input:focus{outline:none;border-bottom-color:var(--red)}

/* 关联展示 */
.bridge-display{margin:20px 0;padding:16px;background:var(--bg);border-radius:10px;text-align:center;font-size:14px;line-height:1.6;color:var(--text2)}
.bridge-display .decision-name{font-weight:700;color:var(--text);font-size:16px}
.bridge-display .signal-line{color:var(--red);font-weight:600;margin:4px 0}

/* 最终问题 */
.final-question{font-size:18px;font-weight:700;color:var(--red);line-height:1.6;margin:20px 0}

/* 呼吸过渡 */
.breath-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(250,247,242,.95);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}
.breath-overlay.active{display:flex}
.breath-circle{width:80px;height:80px;border-radius:50%;border:3px solid var(--red);transition:all 4s ease-in-out}
.breath-circle.inhale{transform:scale(1.4)}
.breath-circle.exhale{transform:scale(1)}
.breath-text{font-size:14px;color:var(--text2);margin-top:12px}

.btn{display:inline-block;padding:12px 28px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all .2s}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(194,59,34,.25)}
.btn-outline{background:transparent;border:1.5px solid var(--red);color:var(--red);margin-top:8px}
.btn-outline:hover{background:rgba(194,59,34,.04)}

.back-link{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:11px}
.back-link a{color:var(--text2);text-decoration:none}
.back-link a:hover{color:var(--red)}
</style>
</head>
<body>

<div class="v5-badge">⭐优质·11/12门·水L5💧火L5🔥·v5.0统一框架·<a href="body-scan.html">快速版→</a></div>

<!-- 屏1: 锚定决定 -->
<div class="card active" id="c1">
  <div class="icon">🤔</div>
  <h2>你现在面对的一个决定</h2>
  <p class="lead">不需要说清楚。只需要想起它。<br>当你想到这个决定时——<br>身体哪个部位最先有反应？</p>
  <input type="text" class="decision-input" id="decisionName" placeholder="例如：要不要接受那个合伙条件" maxlength="60" oninput="onDecisionInput()">
  <button class="btn btn-primary" id="btnStart" disabled onclick="goToBody()">开始 →</button>
  <button class="btn btn-outline" onclick="skipToResult()">直接看结果</button>
</div>

<!-- 屏2: 身体信号 -->
<div class="card" id="c2">
  <div class="icon">🧘</div>
  <h2>身体在说什么</h2>
  <p class="lead">扫描四个部位。<br>不是打分——是用你自己的话描述感觉。</p>
  <div class="body-zones">
    <button class="zone-btn" data-zone="hand" onclick="toggleZone(this,'hand')">
      <span class="z-emoji">🤲</span><span class="z-label">手心</span>
      <span class="z-feel"></span>
      <input class="z-feel-input" placeholder="温暖？冰凉？出汗？" oninput="updateZoneFeel(this,'hand')" onclick="event.stopPropagation()">
    </button>
    <button class="zone-btn" data-zone="heart" onclick="toggleZone(this,'heart')">
      <span class="z-emoji">💓</span><span class="z-label">心跳</span>
      <span class="z-feel"></span>
      <input class="z-feel-input" placeholder="平稳？加速？沉重？" oninput="updateZoneFeel(this,'heart')" onclick="event.stopPropagation()">
    </button>
    <button class="zone-btn" data-zone="gut" onclick="toggleZone(this,'gut')">
      <span class="z-emoji">🫃</span><span class="z-label">胃部</span>
      <span class="z-feel"></span>
      <input class="z-feel-input" placeholder="放松？紧缩？翻腾？" oninput="updateZoneFeel(this,'gut')" onclick="event.stopPropagation()">
    </button>
    <button class="zone-btn" data-zone="breath" onclick="toggleZone(this,'breath')">
      <span class="z-emoji">🫁</span><span class="z-label">呼吸</span>
      <span class="z-feel"></span>
      <input class="z-feel-input" placeholder="深？浅？顺畅？堵？" oninput="updateZoneFeel(this,'breath')" onclick="event.stopPropagation()">
    </button>
  </div>
  <button class="btn btn-primary" id="btnBodyDone" disabled onclick="showBridge()">看看身体说了什么 →</button>
</div>

<!-- 屏3: 桥接 -->
<div class="card" id="c3">
  <div class="icon">🌉</div>
  <h2>身体和决定之间</h2>
  <div class="bridge-display" id="bridgeDisplay"></div>
  <p class="lead" style="font-size:13px">
    Damasio说：身体在决策前6-12个月就已经在投票。<br>
    不是让你听它的——是让你<span style="color:var(--red);font-weight:600">听见它</span>。<br>
    听见之后怎么做，是你的事。
  </p>
  <div class="final-question" id="finalQuestion"></div>
  <button class="btn btn-primary" onclick="saveAndFinish()">记下这个时刻</button>
  <button class="btn btn-outline" onclick="goBackToBody()">再感受一次</button>
</div>

<!-- 屏4: 完成 -->
<div class="card" id="c4">
  <div class="icon">💧</div>
  <h2>记下了</h2>
  <p class="lead">不需要下一次。<br>下一次会有新的信号。<br>身体每天都在说话——<br>PRE-0只是帮你听见第一次。</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
    <a class="btn btn-primary" href="assessment.html">→ 决策测评</a>
    <a class="btn btn-outline" href="go.html">← 返回通道</a>
  </div>
</div>

<!-- 呼吸过渡层 -->
<div class="breath-overlay" id="breathOverlay">
  <div class="breath-circle" id="breathCircle"></div>
  <div class="breath-text" id="breathText"></div>
</div>

<div class="back-link"><a href="go.html">← 决策通道</a> · <a href="body-scan.html">五分钟身体扫描</a> · <a href="dashboard-v3.html">🧠产品大脑</a></div>

<script>
var decision = '';
var bodySignals = {'hand':'','heart':'','gut':'','breath':''};
var selectedZones = 0;

function onDecisionInput() {
  decision = document.getElementById('decisionName').value.trim();
  document.getElementById('btnStart').disabled = decision.length < 2;
}

function goToBody() {
  document.getElementById('c1').classList.remove('active');
  document.getElementById('c2').classList.add('active');
}

function toggleZone(btn, zone) {
  btn.classList.toggle('selected');
  var feel = bodySignals[zone];
  if(btn.classList.contains('selected')) {
    selectedZones++;
    if(feel) btn.querySelector('.z-feel').textContent = feel;
  } else {
    selectedZones--;
    bodySignals[zone] = '';
  }
  document.getElementById('btnBodyDone').disabled = selectedZones < 2;
}

function updateZoneFeel(input, zone) {
  bodySignals[zone] = input.value.trim();
  var btn = document.querySelector('[data-zone="'+zone+'"]');
  if(btn) btn.querySelector('.z-feel').textContent = bodySignals[zone];
  // 有文字就算selected
  if(bodySignals[zone] && !btn.classList.contains('selected')) {
    btn.classList.add('selected');
    selectedZones++;
  }
  document.getElementById('btnBodyDone').disabled = selectedZones < 2;
}

function showBridge() {
  document.getElementById('c2').classList.remove('active');
  
  // 构建桥接展示
  var bridge = '';
  bridge += '<div class="decision-name">"' + decision + '"</div>';
  var signals = [];
  for(var z in bodySignals) {
    if(bodySignals[z]) {
      var znames = {hand:'手心',heart:'心跳',gut:'胃部',breath:'呼吸'};
      signals.push(znames[z] + '：' + bodySignals[z]);
    }
  }
  if(signals.length > 0) {
    bridge += '<div class="signal-line">' + signals.join(' · ') + '</div>';
  }
  bridge += '<div style="margin-top:8px;font-size:12px;color:var(--text2)">当我想到这个决定的时候，我的身体是这样反应的。</div>';
  document.getElementById('bridgeDisplay').innerHTML = bridge;
  
  // 最终问题——根据不同信号组合生成
  var q = '';
  var hasTense = bodySignals['gut'] && (bodySignals['gut'].includes('紧') || bodySignals['gut'].includes('缩') || bodySignals['gut'].includes('翻'));
  var hasCold = bodySignals['hand'] && (bodySignals['hand'].includes('凉') || bodySignals['hand'].includes('冷') || bodySignals['hand'].includes('冰'));
  var hasFast = bodySignals['heart'] && (bodySignals['heart'].includes('快') || bodySignals['heart'].includes('加速'));
  if(hasTense || hasCold || hasFast) {
    q = '身体在说："这个决定让我紧张。"<br>你打算怎么回应它？';
  } else if(signals.length >= 2) {
    q = '身体有反应——但它没有说"不"。<br>你听到了什么？';
  } else {
    q = '有时候身体的沉默也是一种语言。<br>你在想什么？';
  }
  document.getElementById('finalQuestion').innerHTML = q;
  
  document.getElementById('c3').classList.add('active');
}

function goBackToBody() {
  document.getElementById('c3').classList.remove('active');
  document.getElementById('c2').classList.add('active');
}

function skipToResult() {
  document.getElementById('c1').classList.remove('active');
  document.getElementById('c4').classList.add('active');
}

function saveAndFinish() {
  // 保存到localStorage
  var history = JSON.parse(localStorage.getItem('sri_pre0_v2') || '[]');
  history.unshift({
    date: new Date().toLocaleDateString('zh-CN'),
    decision: decision,
    signals: Object.assign({}, bodySignals),
    time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  });
  if(history.length > 10) history.length = 10;
  localStorage.setItem('sri_pre0_v2', JSON.stringify(history));
  
  document.getElementById('c3').classList.remove('active');
  document.getElementById('c4').classList.add('active');
}
</script>
</body>
</html>
