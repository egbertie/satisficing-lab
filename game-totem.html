<style>

<div class="hero"><h1>🎮 觉·图腾</h1><p>游戏工厂·五路图腾·决策卡</p></div>
<div class="article"><h2>五路图腾·决策卡</h2><p>五条决策通道——每条通道一套卡牌。不是"选一个图腾"——是<span class="highlight">走完五条通道。</span></p>
<h3>五套卡组</h3><p><strong>土·刘禹锡卡</strong>（时间轴）："五年后回头看——这个决定还成立吗？"<br><strong>金·司马贺卡</strong>（可行域）："你的'够用就好'线在哪里？"<br><strong>水·观自在卡</strong>（身心流）："身体在说什么？"<br><strong>木·孔子卡</strong>（信义观）："钱和原则，你选哪个？"<br><strong>火·慧能卡</strong>（直觉阈）："心里那个声音，你敢不敢听？"</p>
<h3>玩法</h3><p>单人：每日抽一张·回答一个问题<br>双人：各抽一张·交换答案·讨论分歧<br>团队：每人抽一张·共同决策前各走一条通道</p></div>
