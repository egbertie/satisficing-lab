<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意红 · 管理后台 | 毛细血管级数据穿透</title>
<style>
:root{--paper:#F5F0E6;--card:#FFFFFF;--warm:#FAF6EF;--ink:#4A3728;--red:#C23B22;--gold:#B8860B;--green:#3D7A4F;--warn:#C2780A;--ink-light:#8B7355;--ink-lighter:#B8A890;--border:#E8DDCC;--border-subtle:#F0E8D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh}
.gate-overlay{position:fixed;inset:0;background:var(--paper);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.gate-overlay.hidden{opacity:0;pointer-events:none}
.gate-box{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:48px 40px;text-align:center;max-width:400px;box-shadow:0 4px 24px rgba(74,55,40,.12)}
.gate-box h2{color:var(--red);font-size:1.5em;margin-bottom:8px}
.gate-box .sub{color:var(--ink-light);font-size:.85em;margin-bottom:24px}
.gate-box input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:1.1em;text-align:center;outline:none;transition:all .2s}
.gate-box input:focus{border-color:var(--gold)}
.gate-box button{margin-top:16px;padding:10px 36px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:all .2s}
.gate-box button:hover{background:var(--gold)}
.gate-error{color:var(--red);font-size:.8em;margin-top:8px;min-height:20px}
.gate-degrade{background:#FFF8E1;border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:.75em;color:var(--warn);display:none}
.app{display:none;min-height:100vh}.app.show{display:flex}
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.sidebar-header h3{font-size:.9em;color:var(--red)}.sidebar-header .sub{font-size:.7em;color:var(--ink-lighter)}
.sidebar-nav{list-style:none}
.sidebar-nav li{cursor:pointer;padding:10px 20px;font-size:.85em;transition:all .15s;border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
.sidebar-nav li:hover{background:var(--warm);border-left-color:var(--gold)}
.sidebar-nav li.active{background:var(--warm);border-left-color:var(--red);font-weight:600}
.sidebar-nav li .badge{font-size:.65em;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;margin-left:auto}
.main{flex:1;padding:24px 32px;overflow-y:auto;max-height:100vh}
.window-panel{display:none}.window-panel.show{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel-header h2{font-size:1.3em;color:var(--red)}.panel-header .meta{font-size:.78em;color:var(--ink-lighter)}
.panel-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border-subtle)}
.panel-toolbar input{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:.82em;min-width:200px;outline:none}
.panel-toolbar input:focus{border-color:var(--gold)}
.panel-toolbar select,.panel-toolbar button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;font-size:.82em;background:var(--card);cursor:pointer}
.panel-toolbar button:hover{border-color:var(--gold)}
.data-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(74,55,40,.06)}
.data-table th{text-align:left;padding:10px 14px;background:var(--warm);font-size:.78em;color:var(--ink-light);border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.data-table th:hover{color:var(--red)}
.data-table th .sort-arrow{font-size:.7em;margin-left:4px}
.data-table td{padding:8px 14px;font-size:.82em;border-bottom:1px solid var(--border-subtle);vertical-align:top}
.data-table tr:hover{background:var(--warm)}
.data-table .empty-row td{text-align:center;color:var(--ink-lighter);padding:40px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75em;white-space:nowrap}
.tag-red{background:#FDE8E5;color:var(--red)}.tag-gold{background:#FDF3E0;color:var(--gold)}
.tag-green{background:#E8F0EB;color:var(--green)}.tag-gray{background:#F0EDE8;color:var(--ink-light)}
.detail-row{display:none}.detail-row.show{display:table-row}
.detail-row td{background:var(--warm);font-size:.78em;padding:12px 14px}
.detail-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.detail-card .field{margin-bottom:8px}
.detail-card .field-label{font-weight:600;font-size:.75em;color:var(--ink-light);text-transform:uppercase;letter-spacing:.04em}
.detail-card .field-value{font-size:.88em;margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-card .stat-num{font-size:1.6em;font-weight:700;color:var(--red)}
.stat-card .stat-label{font-size:.75em;color:var(--ink-light);margin-top:4px}
.stat-card .stat-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.stat-card .stat-bar .fill{height:100%;border-radius:3px}
.fill-red{background:var(--red)}.fill-gold{background:var(--gold)}.fill-green{background:var(--green)}.fill-warn{background:var(--warn)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--warm);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:.75em;display:flex;align-items:center;gap:5px}
.immune-layer{margin-bottom:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;border-left:4px solid var(--gold)}
.immune-layer.l0{border-left-color:var(--red)}.immune-layer h4{font-size:.88em;margin-bottom:6px}
.immune-layer p{font-size:.78em;color:var(--ink-light)}
.loading{padding:60px;text-align:center;color:var(--ink-lighter)}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.graph-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.conn-chip{background:var(--warm);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.75em;display:flex;align-items:center;gap:6px}
.conn-chip .edge-type{font-size:.7em;color:var(--gold)}.conn-chip .arrow{color:var(--ink-lighter)}
.conn-list{display:flex;flex-wrap:wrap;gap:6px}
.evidence-block{margin-top:8px;padding:8px 12px;background:var(--warm);border-radius:6px;font-size:.78em}
.evidence-block .ev-label{font-weight:600;color:var(--ink-light);margin-bottom:4px}
@media(max-width:768px){.sidebar{width:180px;font-size:.8em}.main{padding:16px}.data-table{font-size:.75em}.stat-grid{grid-template-columns:repeat(2,1fr)}.graph-stat{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="gate-overlay" id="gate">
  <div class="gate-box">
    <h2>🔐 管理后台</h2>
    <div class="sub">毛细血管级 · 9维度数据穿透</div>
    <input type="password" id="gpw" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkGate(this)">
    <button onclick="checkGate(this)">进入</button>
    <div class="gate-error" id="gate-error"></div>
    <div class="gate-degrade" id="gate-degrade">⚠️ 浏览器限制了会话存储，关闭标签页后需重新登录</div>
  </div>
</div>

<div class="app" id="app">
  <nav class="sidebar">
    <div class="sidebar-header"><h3>🩸 毛细血管</h3><div class="sub">满意红 · 自检仪表</div></div>
    <ul class="sidebar-nav" id="sidebar-nav"></ul>
  </nav>
  <main class="main" id="main-content"></main>
</div>

<script>
/* ================================================================
   核心状态
   ================================================================ */
var DB=null,loadError=false,currentWindow='overview',sortState={key:null,asc:true};
var WINDOWS=[
  {id:'overview', label:'🏠 实体总览',icon:'🏠',badgeKey:'meta'},
  {id:'products', label:'📦 产品目录',icon:'📦',badgeKey:'products'},
  {id:'customers',label:'👤 客户档案',icon:'👤',badgeKey:'customers'},
  {id:'tasks',    label:'📋 任务看板',icon:'📋',badgeKey:'tasks'},
  {id:'decisions',label:'⚖️ 决策记录',icon:'⚖️',badgeKey:'decisions'},
  {id:'rules',    label:'🧬 规则引擎',icon:'🧬',badgeKey:'living_rules'},
  {id:'immune',   label:'🛡️ 免疫系统',icon:'🛡️',badgeKey:'events'},
  {id:'archaeo',  label:'🏺 考古数据',icon:'🏺',badgeKey:'historical_artifacts'},
  {id:'graph',    label:'🕸️ 知识图谱',icon:'🕸️',badgeKey:'graph'}
];

/* ===== 密码门 ===== */
function checkGate(btn){
  var pw=document.getElementById('gpw').value;
  try{if(!sessionStorage)throw new Error('no');sessionStorage.setItem('_at','1');sessionStorage.removeItem('_at')}catch(e){document.getElementById('gate-degrade').style.display='block'}
  if(pw==='123654'){
    try{sessionStorage.setItem('_admin_auth','1')}catch(e){}
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.add('show');
    initApp();
  }else{document.getElementById('gate-error').textContent='密码错误'}
}

/* ===== 初始化 ===== */
function initApp(){
  renderSidebar();
  var ct=document.getElementById('main-content');if(ct&&!document.getElementById('win-overview')){var d=document.createElement('div');d.id='win-overview';d.className='window-panel';ct.appendChild(d)}
  fetch('entities_index.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
    DB=j;loadError=false;renderSidebar();switchWindow('overview');
  }).catch(function(err){
    console.error('加载失败:',err);loadError=true;DB=null;renderSidebar();switchWindow('overview');
  });
}

/* ===== 侧栏 ===== */
function renderSidebar(){
  var h='';for(var i=0;i<WINDOWS.length;i++){var w=WINDOWS[i];var b=getBadge(w);var a=w.id===currentWindow?' active':'';h+='<li class="'+a+'" onclick="switchWindow(\''+w.id+'\', this)"><span>'+w.icon+'</span>'+w.label+(b!==null?'<span class="badge">'+b+'</span>':'')+'</li>'}document.getElementById('sidebar-nav').innerHTML=h;
}
function getBadge(w){
  if(!DB)return w.id==='overview'?'...':null;
  switch(w.badgeKey){
    case'meta':return DB.meta?DB.meta.total_entities:null;
    case'products':return DB.products?DB.products.length:null;
    case'customers':return DB.customers?DB.customers.length:null;
    case'tasks':return DB.tasks?DB.tasks.length:null;
    case'decisions':return DB.decisions?DB.decisions.length:null;
    case'living_rules':return DB.living_rules?DB.living_rules.length:null;
    case'events':return DB.events?DB.events.length:null;
    case'historical_artifacts':return DB.historical_artifacts?DB.historical_artifacts.length:null;
    case'graph':return DB.meta?DB.meta.knowledge_graph_density+'%':null;
    default:return null;
  }
}

/* ===== 窗口切换 ===== */
function switchWindow(id,li){
  currentWindow=id;
  var lis=document.querySelectorAll('#sidebar-nav li');for(var i=0;i<lis.length;i++)lis[i].classList.remove('active');
  if(li)li.classList.add('active');
  var ps=document.querySelectorAll('.window-panel');for(var j=0;j<ps.length;j++)ps[j].classList.remove('show');
  var p=document.getElementById('win-'+id);if(p)p.parentNode.removeChild(p);
  var d=document.createElement('div');d.id='win-'+id;d.className='window-panel show';
  d.innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div>';
  document.getElementById('main-content').appendChild(d);
  sortState={key:null,asc:true};
  setTimeout(function(){renderPane(id)},10);
}
function renderPane(id){
  var d=document.getElementById('win-'+id);if(!d)return;
  try{switch(id){case'overview':d.innerHTML=rOverview();break;case'products':d.innerHTML=rProducts();break;case'customers':d.innerHTML=rCustomers();break;case'tasks':d.innerHTML=rTasks();break;case'decisions':d.innerHTML=rDecisions();break;case'rules':d.innerHTML=rRules();break;case'immune':d.innerHTML=rImmune();break;case'archaeo':d.innerHTML=rArchaeo();break;case'graph':d.innerHTML=rGraph();break}}catch(e){d.innerHTML='<div class="loading" style="color:var(--red)">渲染错误: '+escH(String(e))+'</div>'}
}

/* ===== 降级 ===== */
function renderDegrade(){return'<div class="loading"><div class="spinner" style="border-top-color:var(--red)"></div><p style="margin-top:16px;color:var(--red)">⚠️ 数据加载失败</p><p style="font-size:.8em;color:var(--ink-light)">请检查 entities_index.json 路径</p></div>'}

/* ===== 辅助函数 ===== */
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escA(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toolbar(id,ph,filts){
  var h='<div class="panel-toolbar"><input type="text" placeholder="'+ph+'" id="srch-'+id+'" oninput="filterPane(\''+id+'\',this.value)">';
  if(filts){h+='<select onchange="filterPane(\''+id+'\',document.getElementById(\'srch-'+id+'\').value,this.value)"><option value="">全部</option>';for(var i=0;i<filts.length;i++)h+='<option value="'+escA(filts[i])+'">'+escH(filts[i])+'</option>';h+='</select>'}
  h+='</div>';return h;
}
function toggleDetail(rowId){var r=document.getElementById(rowId);if(r)r.classList.toggle('show')}
function filterPane(id,text,cat){
  text=(text||'').toLowerCase();var rows=document.querySelectorAll('#tbody-'+id+' tr');
  for(var i=0;i<rows.length;i++){var row=rows[i];if(row.className.indexOf('empty-row')>=0||row.className.indexOf('detail-row')>=0)continue;var m=true;if(text&&(row.textContent||'').toLowerCase().indexOf(text)<0)m=false;if(cat&&m){var tags=row.querySelectorAll('.tag');var cm=false;for(var j=0;j<tags.length;j++){if((tags[j].textContent||'').indexOf(cat)>=0){cm=true;break}}if(!cm)m=false}row.style.display=m?'':'none';var nx=row.nextElementSibling;if(nx&&nx.className.indexOf('detail-row')>=0)nx.style.display='none'}
}

/* ===== 排序/填表 ===== */
var PANE_DATA={};
function fillPaneTable(id,rows,rowBld,emptyMsg){
  var tbody=document.getElementById('tbody-'+id);if(!tbody)return;
  if(!rows||!rows.length){tbody.innerHTML='<tr class="empty-row"><td colspan="10">'+(emptyMsg||'暂无数据')+'</td></tr>';return}
  var h='';for(var i=0;i<rows.length;i++)h+=rowBld(rows[i],i);tbody.innerHTML=h;
}
function sortPane(id,key,th){
  var rows=PANE_DATA[id];if(!rows)return;var asc=sortState.key===key?!sortState.asc:true;sortState={key:key,asc:asc};
  rows.sort(function(a,b){var va=a[key]||'',vb=b[key]||'';if(typeof va==='number')return asc?va-vb:vb-va;va=String(va);vb=String(vb);return asc?va.localeCompare(vb,'zh'):vb.localeCompare(va,'zh')});
  var arrows=document.querySelectorAll('#tbl-'+id+' .sort-arrow');for(var i=0;i<arrows.length;i++)arrows[i].textContent='';
  th.querySelector('.sort-arrow').textContent=asc?' ▲':' ▼';
  fillPaneTable(id,rows,getRowBuilder(id),'暂无数据');
}
function getRowBuilder(id){return rowBuilders[id]||function(){return''}}
var rowBuilders={};
/* ================================================================
   1. 实体总览 · 3994实体按维度分布的可视化
   ================================================================ */
function rOverview(){
  if(!DB)return renderDegrade();
  var m=DB.meta,bd=m.breakdown,h='<div class="panel-header"><div><h2>🏠 实体总览</h2><div class="meta">'+m.total_entities+' 实体 · '+Object.keys(bd).length+' 维度 · 密度 '+m.knowledge_graph_density+'%</div></div></div>';
  h+='<div class="stat-grid">';
  var dims=[{k:'products',l:'产品',i:'📦'},{k:'tasks',l:'任务',i:'📋'},{k:'terms',l:'术语',i:'📖'},{k:'decisions',l:'决策',i:'⚖️'},{k:'customers',l:'客户',i:'👤'},{k:'living_rules',l:'规则',i:'🧬'},{k:'instructions_set',l:'指令',i:'📜'},{k:'workflows',l:'流程',i:'🔁'}];
  for(var i=0;i<dims.length;i++){var d=dims[i],v=bd[d.k]||0,pct=Math.min(v/m.total_entities*500,100);h+='<div class="stat-card"><div class="stat-num">'+v+'</div><div class="stat-label">'+d.i+' '+d.l+'</div><div class="stat-bar"><div class="fill fill-gold" style="width:'+pct+'%"></div></div></div>'}
  h+='</div>';
  var dims2=[{k:'documents',l:'文档',i:'📄'},{k:'events',l:'事件',i:'⚡'},{k:'milestones',l:'里程碑',i:'🏁'},{k:'crons',l:'Cron',i:'⏰'},{k:'scripts',l:'脚本',i:'🔧'},{k:'scoring_models',l:'评分模型',i:'📊'},{k:'simulation_scenarios',l:'模拟场景',i:'🎭'},{k:'historical_artifacts',l:'考古',i:'🏺'},{k:'governance_frameworks',l:'治理框架',i:'🏛️'},{k:'vi_standards',l:'VI标准',i:'🎨'},{k:'quality_metrics',l:'质量指标',i:'✅'},{k:'additional_discoveries',l:'发现',i:'🔍'}];
  h+='<div style="margin-top:16px"><h3 style="font-size:.95em;margin-bottom:10px">📊 全维度分布</h3><table class="data-table"><thead><tr><th>维度</th><th>数量</th><th>占比</th></tr></thead><tbody>';
  for(var j=0;j<dims2.length;j++){var d2=dims2[j],v2=bd[d2.k]||0,pct2=m.total_entities?(v2/m.total_entities*100).toFixed(1):0;h+='<tr><td>'+d2.i+' '+d2.l+'</td><td><b>'+v2+'</b></td><td>'+pct2+'%</td></tr>'}h+='</tbody></table></div>';
  if(m.product_families){h+='<div style="margin-top:20px"><h3 style="font-size:.95em;margin-bottom:10px">📦 产品族分布</h3><div class="chip-wrap">';var fk=Object.keys(m.product_families);for(var kc=0;kc<fk.length;kc++)h+='<div class="chip"><b>'+escH(fk[kc])+'</b> '+m.product_families[fk[kc]]+'个</div>';h+='</div></div>'}
  if(m.living_rules_status){var rs=m.living_rules_status;h+='<div style="margin-top:20px"><h3 style="font-size:.95em">🧬 规则引擎健康度 · 规则数: '+(DB.living_rules||[]).length+'</h3><div class="chip-wrap"><div class="chip"><span class="tag tag-green">活跃 '+rs.active+'</span></div><div class="chip"><span class="tag tag-gold">休眠 '+rs.dormant+'</span></div>';if(rs.broken)h+='<div class="chip"><span class="tag tag-red">损坏 '+rs.broken+'</span></div>';h+='</div></div>'}
  if(m.biological_health){var bh=m.biological_health;h+='<div style="margin-top:8px;font-size:.78em;color:var(--ink-light)">🔥 全活: '+bh.fully_alive+'/'+bh.rules_with_triggers+' · 触发:'+bh.rules_with_triggers+' · 反馈:'+bh.rules_with_feedback+' · 适应:'+bh.rules_with_adaptation+' · Cron连接:'+bh.cron_connected+'</div>'}
  if(m.corrections){h+='<div style="margin-top:20px"><h3 style="font-size:.95em">📝 数据修正记录</h3>';for(var c=0;c<m.corrections.length;c++)h+='<div style="font-size:.78em;color:var(--ink-light);padding:4px 0">'+escH(m.corrections[c])+'</div>';h+='</div>'}
  return h;
}
/* ================================================================
   2. 产品目录 · 240产品·按族筛选·状态活跃/休眠/待完善
   ================================================================ */
function rProducts(){
  if(!DB)return renderDegrade();
  var prods=DB.products||[],mf=(DB.meta||{}).product_families||{},fks=Object.keys(mf);
  var h='<div class="panel-header"><div><h2>📦 产品目录</h2><div class="meta">'+prods.length+' 产品 · '+fks.length+' 族</div></div></div>';
  h+=toolbar('products','搜索产品名/描述...',fks);
  h+='<table class="data-table" id="tbl-products"><thead><tr><th onclick="sortPane(\'products\',\'id\',this)">ID<span class="sort-arrow"></span></th><th onclick="sortPane(\'products\',\'name\',this)">产品名<span class="sort-arrow"></span></th><th onclick="sortPane(\'products\',\'family\',this)">族<span class="sort-arrow"></span></th><th onclick="sortPane(\'products\',\'status\',this)">状态<span class="sort-arrow"></span></th><th onclick="sortPane(\'products\',\'tier\',this)">层级<span class="sort-arrow"></span></th><th>标签</th></tr></thead><tbody id="tbody-products"></tbody></table>';
  rowBuilders.products=prodRow;PANE_DATA.products=prods.slice();setTimeout(function(){fillPaneTable('products',prods,prodRow,'无产品数据')},0);
  return h;
}
function prodRow(p,idx){

   ================================================================ */
function rDecisions(){
  if(!DB)return renderDegrade();
  var decs=DB.decisions||[];
  // Build decision chains from connections
  var chains=[];
  if(DB.connections){
    var fromMap={},toMap={};
    for(var i=0;i<DB.connections.length;i++){
      var c=DB.connections[i];
      if(c.from_entity&&c.from_entity.indexOf('DEC-')===0&&c.to_entity&&c.to_entity.indexOf('DEC-')===0&&c.relationship_type==='决策时间序列'){
        if(!fromMap[c.from_entity])fromMap[c.from_entity]=[];
        fromMap[c.from_entity].push(c.to_entity);
        toMap[c.to_entity]=true;
      }
    }
    var starts=[];
    for(var k in fromMap){if(!toMap[k])starts.push(k)}
    for(var si=0;si<starts.length;si++){
      var chain=[starts[si]],cur=starts[si];
      while(fromMap[cur]&&fromMap[cur].length>0){cur=fromMap[cur][0];chain.push(cur)}
      chains.push(chain);
    }
  }

  var h='<div class="panel-header"><div><h2>⚖️ 决策记录</h2><div class="meta">'+decs.length+' 条决策 · '+(chains.length>0?chains[0].length:0)+' 条决策链</div></div></div>';
  h+=toolbar('decisions','搜索决策...',null);
  h+='<table class="data-table" id="tbl-decisions"><thead><tr><th onclick="sortPane(\'decisions\',\'id\',this)">ID<span class="sort-arrow"></span></th><th onclick="sortPane(\'decisions\',\'date\',this)">日期<span class="sort-arrow"></span></th><th onclick="sortPane(\'decisions\',\'title\',this)">决策<span class="sort-arrow"></span></th><th onclick="sortPane(\'decisions\',\'confidence\',this)">置信度<span class="sort-arrow"></span></th><th>结果</th></tr></thead><tbody id="tbody-decisions"></tbody></table>';

  // Show decision chains
  if(chains.length>0){
    h+='<div style="margin-top:20px"><h3 style="font-size:.95em;margin-bottom:10px">🔗 决策链 ('+chains[0].length+'条连续)</h3><div class="conn-list">';
    var chain=chains[0];
    for(var ci=0;ci<chain.length;ci++){
      var dname='';for(var di=0;di<decs.length;di++){if(decs[di].id===chain[ci]){dname=decs[di].title;break}}
      h+='<div class="conn-chip"><span class="edge-type">'+(ci+1)+'</span>'+escH(dname||chain[ci])+'</div>';
    }
    h+='</div></div>';
  }
  rowBuilders.decisions=decRow;PANE_DATA.decisions=decs.slice();setTimeout(function(){fillPaneTable('decisions',decs,decRow,'无决策记录')},0);
  return h;
}

    for(var mi=0;mi<scoring.length;mi++){
      var sm=scoring[mi];
      h+='<tr><td>'+escH(sm.id)+'</td><td><b>'+escH(sm.name)+'</b></td><td><span class="tag tag-gold">'+escH(sm.status||'—')+'</span></td><td>'+escH((sm.dimensions?Object.keys(sm.dimensions).join(', '):'—'))+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }

  // Additional discoveries
  if(disc.length>0){
    h+='<div><h3 style="font-size:.95em;margin-bottom:10px">🔍 额外发现 ('+disc.length+'条)</h3>';
    for(var di=0;di<disc.length;di++){
      var dd=disc[di];
      h+='<div style="margin-bottom:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px"><b>'+escH(dd.id)+'</b> '+escH(dd.name)+'<br><span style="font-size:.78em;color:var(--ink-light)">'+escH(dd.description||'')+'</span></div>';
    }
    h+='</div>';
  }
  return h;
}
/* ================================================================
   9. 知识图谱 · 1,222真实连接·密度43.9%
   ================================================================ */
function rGraph(){
  if(!DB)return renderDegrade();
  var m=DB.meta,conns=DB.connections||[];
  var verified=m.verified_connections||0,strong=m.strong_connections||0,medium=m.medium_connections||0,weak=m.weak_connections||0;
  var totalEntities=m.total_entities||0;

  var h='<div class="panel-header"><div><h2>🕸️ 知识图谱</h2><div class="meta">'+verified+' 真实连接 · '+conns.length+' 总连接 · 密度 '+m.knowledge_graph_density+'%</div></div></div>';

  // Stats
  h+='<div class="stat-grid">';
  h+='<div class="stat-card"><div class="stat-num">'+verified+'</div><div class="stat-label">✅ 真实连接</div><div class="stat-bar"><div class="fill fill-green" style="width:100%"></div></div></div>';
  h+='<div class="stat-card"><div class="stat-num">'+strong+'</div><div class="stat-label">💪 强连接</div><div class="stat-bar"><div class="fill fill-red" style="width:100%"></div></div></div>';
  h+='<div class="stat-card"><div class="stat-num">'+medium+'</div><div class="stat-label">🤝 中连接</div><div class="stat-bar"><div class="fill fill-gold" style="width:100%"></div></div></div>';
  h+='<div class="stat-card"><div class="stat-num">'+weak+'</div><div class="stat-label">💬 弱连接</div><div class="stat-bar"><div class="fill fill-warn" style="width:100%"></div></div></div>';
  h+='</div>';

  // Connection type breakdown
  var typeMap={};
  for(var i=0;i<conns.length;i++){
    var rt=conns[i].relationship_type||'未分类';
    typeMap[rt]=(typeMap[rt]||0)+1;
  }
  var types=Object.keys(typeMap).sort(function(a,b){return typeMap[b]-typeMap[a]});

  h+='<div style="margin-top:20px"><h3 style="font-size:.95em;margin-bottom:10px">🔗 连接类型分布 (Top 15)</h3><table class="data-table"><thead><tr><th>类型</th><th>数量</th><th>占比</th></tr></thead><tbody>';
  var shown=Math.min(types.length,15);
  for(var ti=0;ti<shown;ti++){
    var t=types[ti],tc=typeMap[t],pct=conns.length?(tc/conns.length*100).toFixed(1):0;
    h+='<tr><td>'+escH(t)+'</td><td><b>'+tc+'</b></td><td>'+pct+'%</td></tr>';
  }
  h+='</tbody></table></div>';

  // Additional info
  if(m.auto_rule_connections){
    h+='<div style="margin-top:20px"><h3 style="font-size:.95em">📋 连接详情</h3>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px">';
    h+='<div class="stat-card"><div class="stat-num">'+totalEntities+'</div><div class="stat-label">📦 总实体数</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+conns.length+'</div><div class="stat-label">🕸️ 总连接数</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+m.auto_rule_connections+'</div><div class="stat-label">🤖 自动规则连接</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+m.knowledge_graph_density+'%</div><div class="stat-label">📊 图密度</div></div>';
    h+='</div></div>';
  }

  // Weight distribution
  var weightMap={};
  for(var wi=0;wi<conns.length;wi++){
    var w=conns[wi].weight;if(w!==undefined){var wk=String(w);weightMap[wk]=(weightMap[wk]||0)+1}
  }
  var weights=Object.keys(weightMap).sort();
  if(weights.length>0){
    h+='<div style="margin-top:20px"><h3 style="font-size:.95em;margin-bottom:10px">⚖️ 权重分布</h3><div class="chip-wrap">';
    for(var wj=0;wj<weights.length;wj++)h+='<div class="chip"><b>'+weights[wj]+'</b> '+weightMap[weights[wj]]+'条</div>';
    h+='</div></div>';
  }

  return h;
}
