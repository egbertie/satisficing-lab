<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意红 · 管理窗口 | 毛细血管级数据穿透</title>
<style>
/* ========== VI 变量 ========== */
:root {
  --paper:    #F5F0E6;
  --card:     #FFFFFF;
  --warm:     #FAF6EF;
  --ink:      #4A3728;
  --red:      #C23B22;
  --gold:     #B8860B;
  --green:    #3D7A4F;
  --warn:     #C2780A;
  --ink-light:#8B7355;
  --ink-lighter:#B8A890;
  --border:   #E8DDCC;
  --border-subtle:#F0E8D8;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:var(--paper); color:var(--ink); line-height:1.6; min-height:100vh; }

/* ========== 密码门 ========== */
.gate-overlay { position:fixed; inset:0; background:var(--paper); z-index:1000; display:flex; align-items:center; justify-content:center; transition:opacity 0.3s; }
.gate-overlay.hidden { opacity:0; pointer-events:none; }
.gate-box { background:var(--card); border:2px solid var(--gold); border-radius:16px; padding:48px 40px; text-align:center; max-width:400px; box-shadow:0 4px 24px rgba(74,55,40,0.12); }
.gate-box h2 { color:var(--red); font-size:1.5em; margin-bottom:8px; }
.gate-box .sub { color:var(--ink-light); font-size:0.85em; margin-bottom:24px; }
.gate-box input { width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:8px; font-size:1.1em; text-align:center; outline:none; transition:all 0.2s; }
.gate-box input:focus { border-color:var(--gold); }
.gate-box button { margin-top:16px; padding:10px 36px; background:var(--red); color:#fff; border:none; border-radius:8px; font-size:1em; cursor:pointer; transition:all 0.2s; }
.gate-box button:hover { background:var(--gold); }
.gate-error { color:var(--red); font-size:0.8em; margin-top:8px; min-height:20px; }
.gate-degrade { background:#FFF8E1; border:1px solid var(--warn); border-radius:8px; padding:8px 12px; margin-top:12px; font-size:0.75em; color:var(--warn); display:none; }

/* ========== 布局 ========== */
.app { display:none; min-height:100vh; }
.app.show { display:flex; }
.sidebar { width:240px; background:var(--card); border-right:1px solid var(--border); padding:16px 0; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; }
.sidebar-header { padding:16px 20px; border-bottom:1px solid var(--border); margin-bottom:8px; }
.sidebar-header h3 { font-size:0.9em; color:var(--red); }
.sidebar-header .sub { font-size:0.7em; color:var(--ink-lighter); }
.sidebar-nav { list-style:none; }
.sidebar-nav li { cursor:pointer; padding:10px 20px; font-size:0.85em; transition:all 0.15s; border-left:3px solid transparent; display:flex; align-items:center; gap:8px; }
.sidebar-nav li:hover { background:var(--warm); border-left-color:var(--gold); }
.sidebar-nav li.active { background:var(--warm); border-left-color:var(--red); font-weight:600; }
.sidebar-nav li .badge { font-size:0.65em; background:var(--red); color:#fff; border-radius:10px; padding:1px 7px; margin-left:auto; }
.main { flex:1; padding:24px 32px; overflow-y:auto; max-height:100vh; }

/* ========== 窗口通用 ========== */
.window-panel { display:none; }
.window-panel.show { display:block; }
.panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.panel-header h2 { font-size:1.3em; color:var(--red); }
.panel-header .meta { font-size:0.78em; color:var(--ink-lighter); }
.panel-toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; padding:12px; background:var(--card); border-radius:8px; border:1px solid var(--border-subtle); }
.panel-toolbar input { padding:6px 12px; border:1px solid var(--border); border-radius:6px; font-size:0.82em; min-width:200px; outline:none; }
.panel-toolbar input:focus { border-color:var(--gold); }
.panel-toolbar select, .panel-toolbar button { padding:6px 14px; border:1px solid var(--border); border-radius:6px; font-size:0.82em; background:var(--card); cursor:pointer; }
.panel-toolbar button:hover { border-color:var(--gold); }

/* ========== 数据表 ========== */
.data-table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(74,55,40,0.06); }
.data-table th { text-align:left; padding:10px 14px; background:var(--warm); font-size:0.78em; color:var(--ink-light); border-bottom:2px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none; }
.data-table th:hover { color:var(--red); }
.data-table th .sort-arrow { font-size:0.7em; margin-left:4px; }
.data-table td { padding:8px 14px; font-size:0.82em; border-bottom:1px solid var(--border-subtle); vertical-align:top; }
.data-table tr:hover { background:var(--warm); }
.data-table .empty-row td { text-align:center; color:var(--ink-lighter); padding:40px; }
.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.75em; white-space:nowrap; }
.tag-red { background:#FDE8E5; color:var(--red); }
.tag-gold { background:#FDF3E0; color:var(--gold); }
.tag-green { background:#E8F0EB; color:var(--green); }
.tag-gray { background:#F0EDE8; color:var(--ink-light); }

/* ========== 详情行 ========== */
.detail-row { display:none; }
.detail-row.show { display:table-row; }
.detail-row td { background:var(--warm); font-size:0.78em; padding:12px 14px; }
.detail-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
.detail-card .field { margin-bottom:8px; }
.detail-card .field-label { font-weight:600; font-size:0.75em; color:var(--ink-light); text-transform:uppercase; letter-spacing:0.04em; }
.detail-card .field-value { font-size:0.88em; margin-top:2px; }
.detail-links { display:flex; gap:8px; margin-top:8px; }
.detail-links a { font-size:0.75em; color:var(--gold); text-decoration:none; border:1px solid var(--gold); padding:3px 10px; border-radius:4px; transition:all 0.15s; }
.detail-links a:hover { background:var(--gold); color:#fff; }

/* ========== 图谱 ========== */
.graph-section { margin-top:24px; }
.graph-section h3 { font-size:1em; color:var(--ink); margin-bottom:12px; }
.conn-list { display:flex; flex-wrap:wrap; gap:6px; }
.conn-chip { background:var(--warm); border:1px solid var(--border); border-radius:6px; padding:4px 10px; font-size:0.75em; display:flex; align-items:center; gap:6px; }
.conn-chip .edge-type { font-size:0.7em; color:var(--gold); }
.conn-chip .arrow { color:var(--ink-lighter); }

/* ========== 对比网格 ========== */
.compare-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:16px; }
.compare-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; transition:all 0.15s; }
.compare-card.selected { border-color:var(--red); box-shadow:0 0 0 2px rgba(194,59,34,0.15); }
.compare-card:hover { border-color:var(--gold); }
.compare-card h4 { font-size:0.9em; margin-bottom:8px; }
.compare-card .stat { display:flex; justify-content:space-between; padding:4px 0; font-size:0.82em; border-bottom:1px solid var(--border-subtle); }
.compare-card .stat-label { color:var(--ink-light); }
.compare-card .stat-value { font-weight:500; }
.compare-card .check-col { position:absolute; top:8px; right:8px; }

/* ========== 图表占位 ========== */
.chart-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:4px; }
.chart-bar .fill { height:100%; border-radius:4px; transition:width 0.3s; }
.fill-red { background:var(--red); }
.fill-gold { background:var(--gold); }
.fill-green { background:var(--green); }

/* ========== 响应式 ========== */
@media(max-width:768px){.sidebar{width:180px;font-size:0.8em}.main{padding:16px}.data-table{font-size:0.75em}}
</style>
</head>

    document.getElementById('gate-degrade').style.display = 'block';

    document.getElementById('app').classList.add('show');
    initApp();
  } else {
    document.getElementById('gate-error').textContent = '密码错误';
  }
}

function renderSidebar() {
  var h = '';
  for (var i = 0; i < WINDOWS.length; i++) {
    var w = WINDOWS[i];
    var count = getDataCount(w.id);
    var active = w.id === currentWindow ? ' active' : '';
    h += '<li class="' + active + '" onclick="switchWindow(\'' + w.id + '\', this)"><span>' + w.icon + '</span>' + w.label + (count !== null ? '<span class="badge">' + count + '</span>' : '') + '</li>';
  }
  document.getElementById('sidebar-nav').innerHTML = h;
}

function getDataCount(windowId) {
  var map = {
    terms: DATA.terms ? DATA.terms.length : null,
    decisions: DATA.decisions ? DATA.decisions.length : null,
    quality: DATA.quality ? DATA.quality.length : null,
    lifecycle: DATA.lifecycle ? DATA.lifecycle.length : null,
    customers: DATA.customers ? DATA.customers.length : null,
    instructions: DATA.instructions ? DATA.instructions.length : null,
    workflows: DATA.workflows ? DATA.workflows.length : null,
    vi: DATA.vi ? DATA.vi.length : null,
    knowledge: DATA.knowledge ? DATA.knowledge.length : null
  };
  return map[windowId] || null;
}

function switchWindow(id, li) {
  currentWindow = id;
  // 更新侧栏激活
  var lis = document.querySelectorAll('#sidebar-nav li');
  for (var i = 0; i < lis.length; i++) lis[i].classList.remove('active');
  if (li) li.classList.add('active');
  // 隐藏所有窗口
  var panels = document.querySelectorAll('.window-panel');
  for (var i = 0; i < panels.length; i++) panels[i].classList.remove('show');
  // 显示当前
  var panel = document.getElementById('win-' + id);
  if (!panel) { renderWindow(id); panel = document.getElementById('win-' + id); }
  if (panel) panel.classList.add('show');
  sortState = {key:null, asc:true};
}

function renderWindow(id) {
  var h = '';
  switch(id) {
    case 'terms': h = renderTerms(); break;
    case 'decisions': h = renderDecisions(); break;
    case 'quality': h = renderQuality(); break;
    case 'lifecycle': h = renderLifecycle(); break;
    case 'customers': h = renderCustomers(); break;
    case 'instructions': h = renderInstructions(); break;
    case 'workflows': h = renderWorkflows(); break;
    case 'vi': h = renderVI(); break;
    case 'knowledge': h = renderKnowledge(); break;
  }
  var div = document.createElement('div');
  div.id = 'win-' + id;
  div.className = 'window-panel show';
  div.innerHTML = h;
  document.getElementById('main-content').appendChild(div);
}

function toolbar(id, placeholder, filters) {
  var h = '<div class="panel-toolbar">';
  h += '<input type="text" placeholder="' + placeholder + '" oninput="filterTable(\'' + id + '\', this.value)">';
  if (filters) {
    h += '<select onchange="filterTable(\'' + id + '\', document.getElementById(\'search-' + id + '\').value, this.value)">';
    h += '<option value="">全部</option>';
    for (var i = 0; i < filters.length; i++) {
      h += '<option value="' + escAttr(filters[i]) + '">' + escHtml(filters[i]) + '</option>';
    }
    h += '</select>';
  }
  h += '<button onclick="exportCSV(\'' + id + '\')">📥 导出CSV</button>';
  h += '</div>';
  return h;
}

function renderTable(id, cols, rows, rowBuilder, emptyMsg) {
  var h = '<table class="data-table" id="tbl-' + id + '"><thead><tr>';
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i];
    h += '<th onclick="sortTable(\'' + id + '\', \'' + c.key + '\', this)">' + c.label + '<span class="sort-arrow"></span></th>';
  }
  h += '</tr></thead><tbody id="tbody-' + id + '"></tbody></table>';
  return h;
}

function fillTable(id, rows, rowBuilder, emptyMsg) {
  var tbody = document.getElementById('tbody-' + id);
  if (!tbody) return;
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">' + (emptyMsg || '暂无数据') + '</td></tr>';
    return;
  }

/* ================================================================
   交互辅助
   ================================================================ */

function toggleDetail(rowId) {
  var row = document.getElementById(rowId);
  if (row) {
    if (row.style.display === 'none' || row.style.display === '') {
      row.style.display = 'table-row';
    } else {
      row.style.display = 'none';
    }
  }
}

function filterTable(id, text, category) {
  text = (text || '').toLowerCase();
  var rows = document.querySelectorAll('#tbody-' + id + ' tr');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    if (row.className.indexOf('empty-row') >= 0 || row.className.indexOf('detail-row') >= 0) continue;
    var match = true;
    if (text) {
      var rowText = (row.textContent || '').toLowerCase();
      if (rowText.indexOf(text) < 0) match = false;
    }
    if (category && match) {
      // category filter: 找包含 category 的元素
      var cats = row.querySelectorAll('.tag');
      var catMatch = false;
      for (var j = 0; j < cats.length; j++) {
        if ((cats[j].textContent||'').indexOf(category) >= 0) { catMatch = true; break; }
      }
      if (!catMatch) match = false;
    }
    row.style.display = match ? '' : 'none';
    // 隐藏对应的详情行
    var next = row.nextElementSibling;
    if (next && next.className.indexOf('detail-row') >= 0) {
      next.style.display = 'none';
    }
  }
}

function sortTable(id, key, th) {
  var dataArr;
  switch(id) {
    case 'terms': dataArr = DATA.terms.slice(); break;
    case 'decisions': dataArr = DATA.decisions.slice(); break;
    case 'quality': dataArr = DATA.quality.slice(); break;
    case 'lifecycle': dataArr = DATA.lifecycle.slice(); break;
    case 'customers': dataArr = DATA.customers.slice(); break;
    case 'instructions': dataArr = DATA.instructions.slice(); break;
    case 'workflows': dataArr = DATA.workflows.slice(); break;
    case 'vi': dataArr = DATA.vi.slice(); break;
    case 'knowledge': dataArr = DATA.knowledge.slice(); break;
    default: return;
  }
  var asc = sortState.key === key ? !sortState.asc : true;
  sortState = {key:key, asc:asc};
  dataArr.sort(function(a,b) {
    var va = (a[key]||''); var vb = (b[key]||'');
    if (typeof va === 'number') return asc ? va - vb : vb - va;
    va = String(va); vb = String(vb);
    return asc ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
  });
  // 更新箭头
  var arrows = document.querySelectorAll('#tbl-' + id + ' .sort-arrow');
  for (var i = 0; i < arrows.length; i++) arrows[i].textContent = '';
  th.querySelector('.sort-arrow').textContent = asc ? ' ▲' : ' ▼';
  // 重填表
  var builders = {terms:termRowBuilder, decisions:decRowBuilder, quality:qmRowBuilder, lifecycle:lcRowBuilder, customers:custRowBuilder, instructions:instRowBuilder, workflows:wfRowBuilder, vi:viRowBuilder, knowledge:knwRowBuilder};
  fillTable(id, dataArr, builders[id], '暂无数据');
}

function exportCSV(id) {
  alert('导出功能: ' + id + ' — 即将下载CSV文件（开发中）');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
