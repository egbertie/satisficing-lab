<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 v3.0 · 满意解研究所</title>
<style>
:root{--paper:#F5F0E6;--card:#FFFFFF;--warm:#FAF6EF;--red:#C23B22;--gold:#B8860B;--green:#3D7A4F;--blue:#4A6FA5;--ink:#4A3728;--ink-light:#8B7355;--ink-lighter:#B8A890;--border:#E8DDCC;--border-subtle:#F0E8D8;--warn:#C2780A;--l-phy:#B8860B;--l-chem:#C23B22;--l-bio:#3D7A4F;--l-psy:#4A6FA5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh}
.gate-overlay{position:fixed;inset:0;background:var(--paper);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.gate-overlay.hidden{opacity:0;pointer-events:none}
.gate-box{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:48px 40px;text-align:center;max-width:420px;box-shadow:0 4px 24px rgba(74,55,40,.12)}
.gate-box h2{color:var(--red);font-size:1.5em;margin-bottom:6px}.gate-box .sub{color:var(--ink-light);font-size:.82em;margin-bottom:24px}
.gate-box input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:1.1em;text-align:center;outline:none;transition:all .2s}
.gate-box input:focus{border-color:var(--gold)}.gate-box button{margin-top:16px;padding:10px 36px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:all .2s}
.gate-box button:hover{background:var(--gold)}.gate-error{color:var(--red);font-size:.8em;margin-top:8px;min-height:20px}
.gate-degrade{background:#FFF8E1;border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:.75em;color:var(--warn);display:none}
.app{display:none;min-height:100vh}.app.show{display:flex}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border)}.sidebar-header h3{font-size:.9em;color:var(--red)}.sidebar-header .sub{font-size:.7em;color:var(--ink-lighter)}
.sidebar-back{display:block;font-size:.78em;color:var(--gold);text-decoration:none;padding:8px 20px;border-bottom:1px solid var(--border-subtle);transition:color .2s}.sidebar-back:hover{color:var(--red)}
.sidebar-nav-wrap{flex:1;overflow-y:auto;padding:8px 0}
.nav-domain{border-bottom:1px solid var(--border-subtle)}.nav-domain-header{cursor:pointer;padding:10px 20px;font-size:.85em;font-weight:600;display:flex;align-items:center;justify-content:space-between;transition:background .15s}
.nav-domain-header:hover{background:var(--warm)}.nav-domain-header .domain-label{display:flex;align-items:center;gap:8px}.nav-domain-header .domain-arrow{font-size:.7em;color:var(--ink-lighter);transition:transform .2s}
.nav-domain.open .nav-domain-header .domain-arrow{transform:rotate(90deg)}
.nav-children{display:none}.nav-domain.open .nav-children{display:block}
.nav-child{cursor:pointer;padding:7px 20px 7px 36px;font-size:.82em;border-left:3px solid transparent;transition:all .15s;color:var(--ink-light)}
.nav-child:hover{background:var(--warm);border-left-color:var(--gold);color:var(--ink)}.nav-child.active{background:var(--warm);border-left-color:var(--red);font-weight:600;color:var(--ink)}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border-subtle);font-size:.68em;color:var(--ink-lighter)}
.main{flex:1;padding:20px 28px;overflow-y:auto;max-height:100vh}.window-panel{display:none}.window-panel.show{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-header h2{font-size:1.25em;color:var(--red)}.panel-header .meta{font-size:.76em;color:var(--ink-lighter)}
.panel-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--card);border-radius:8px;border:1px solid var(--border-subtle);align-items:center}
.panel-toolbar input{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:.82em;min-width:200px;outline:none;background:var(--card)}.panel-toolbar input:focus{border-color:var(--gold)}
.panel-toolbar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82em;background:var(--card);cursor:pointer}
.breadcrumb{font-size:.75em;color:var(--ink-lighter);margin-bottom:12px}.breadcrumb span{color:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s}
.stat-card:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(74,55,40,.08)}.stat-card .stat-num{font-size:1.6em;font-weight:700;color:var(--red)}.stat-card .stat-label{font-size:.75em;color:var(--ink-light);margin-top:2px}
.stat-card .stat-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}.stat-card .stat-bar .fill{height:100%;border-radius:3px}
.fill-red{background:var(--red)}.fill-gold{background:var(--gold)}.fill-green{background:var(--green)}.fill-warn{background:var(--warn)}
.graph-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.data-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(74,55,40,.06)}
.data-table th{text-align:left;padding:9px 12px;background:var(--warm);font-size:.76em;color:var(--ink-light);border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}.data-table th:hover{color:var(--red)}
.data-table th .sort-arrow{font-size:.7em;margin-left:3px}
.data-table td{padding:7px 12px;font-size:.8em;border-bottom:1px solid var(--border-subtle);vertical-align:top}.data-table tr:hover{background:var(--warm)}.data-table .empty-row td{text-align:center;color:var(--ink-lighter);padding:40px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.74em;white-space:nowrap}.tag-red{background:#FDE8E5;color:var(--red)}.tag-gold{background:#FDF3E0;color:var(--gold)}.tag-green{background:#E8F0EB;color:var(--green)}.tag-gray{background:#F0EDE8;color:var(--ink-light)}
.detail-row{display:none}.detail-row.show{display:table-row}.detail-row td{background:var(--warm);font-size:.76em;padding:0}
.detail-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin:8px 12px}.detail-card .field{margin-bottom:7px}.detail-card .field-label{font-weight:600;font-size:.73em;color:var(--ink-light);letter-spacing:.04em}.detail-card .field-value{font-size:.84em;margin-top:2px}
.layer-section{margin-top:10px;padding:10px 12px;border-left:4px solid var(--gold);border-radius:0 6px 6px 0;background:var(--warm)}
.layer-section.l-phy{border-left-color:var(--l-phy)}.layer-section.l-chem{border-left-color:var(--l-chem)}.layer-section.l-bio{border-left-color:var(--l-bio)}.layer-section.l-psy{border-left-color:var(--l-psy)}
.layer-section .layer-title{font-weight:700;font-size:.76em;margin-bottom:6px}.layer-section .t-phy{color:var(--l-phy)}.layer-section .t-chem{color:var(--l-chem)}.layer-section .t-bio{color:var(--l-bio)}.layer-section .t-psy{color:var(--l-psy)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--warm);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:.74em;display:flex;align-items:center;gap:5px;cursor:pointer;transition:all .15s}.chip:hover{border-color:var(--gold)}.chip.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.immune-layer{margin-bottom:14px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;border-left:4px solid var(--gold)}.immune-layer.l0{border-left-color:var(--red)}.immune-layer h4{font-size:.86em;margin-bottom:4px}.immune-layer p{font-size:.76em;color:var(--ink-light)}
.loading{padding:60px;text-align:center;color:var(--ink-lighter)}.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.placeholder-card{background:var(--card);border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center}
.placeholder-card .ph-icon{font-size:2em;margin-bottom:8px}.placeholder-card .ph-title{font-size:.95em;color:var(--ink-light)}.placeholder-card .ph-desc{font-size:.78em;color:var(--ink-lighter)}
@media(max-width:768px){.sidebar{width:180px;font-size:.8em}.main{padding:14px}.data-table{font-size:.74em}.stat-grid{grid-template-columns:repeat(2,1fr)}.graph-stat{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="app" id="app"><nav class="sidebar" id="sidebar"></nav><main class="main" id="main-content"></main></div>
<script>

/* ================================================================
   管理后台 v3.0 · 9管理域·36子模块·三级穿透
   驾驶舱的二层核心基石 — 数据统一源·双向协同
   ================================================================ */
var DB=null,loadError=false,currentView=null,sortState={key:null,asc:true};
var currentDomain=null;
var LC_LABELS={L0_概念:'💡概念',L1_原型:'🔬原型',L2_内测:'🧪内测',L3_打磨:'✨打磨',L4_精品:'💎精品',L5_维护:'🔄维护',L6_退役:'📦退役'};
var MAT_LABELS={M0_种子:'🌱种子',M1_萌芽:'🌿萌芽',M2_成型:'🌳成型',M3_成熟:'🍎成熟',M4_标杆:'🏆标杆'};
var LAYERS=[{k:'physical',icon:'🔩',label:'物理层',color:'var(--l-phy)'},{k:'chemical',icon:'⚗️',label:'化学层',color:'var(--l-chem)'},{k:'biological',icon:'🧬',label:'生物层',color:'var(--l-bio)'},{k:'psychological',icon:'🧠',label:'心理层',color:'var(--l-psy)'}];

var NAV=[
  {id:'strategy',label:'📊 战略仪表盘',children:[
    {id:'strategy-kpi',label:'KPI仪表盘',desc:'核心指标实时监控'},
    {id:'strategy-map',label:'战略地图',desc:'BSC四视角联动'},
    {id:'strategy-milestone',label:'里程碑看板',desc:'时间线·关键事件'},
    {id:'strategy-risk',label:'风险雷达',desc:'识别·评级·应对'}
  ]},
  {id:'product',label:'📦 产品全生命周期',children:[
    {id:'product-overview',label:'产品总览',desc:'312产品·7阶段·8族'},
    {id:'product-pipeline',label:'研发管道',desc:'概念→原型→内测→打磨→精品'},
    {id:'product-quality',label:'质量中心',desc:'四维评分·审计·改进'},
    {id:'product-release',label:'版本与发布',desc:'版本历史·变更·部署'}
  ]},
  {id:'customer',label:'👤 客户关系',children:[
    {id:'customer-360',label:'客户360',desc:'档案·画像·决策风格'},
    {id:'customer-pipeline',label:'销售管道',desc:'线索→商机→提案→签约'},
    {id:'customer-delivery',label:'交付与满意度',desc:'项目·反馈·NPS'},
    {id:'customer-success',label:'客户成功',desc:'续约·增购·案例'}
  ]},
  {id:'finance',label:'💰 财务与定价',children:[
    {id:'finance-overview',label:'收入仪表盘',desc:'收入·成本·利润'},
    {id:'finance-pricing',label:'产品定价',desc:'SKU·折扣·许可'},
    {id:'finance-cost',label:'成本跟踪',desc:'开发·运营·销售'},
    {id:'finance-budget',label:'预算与预测',desc:'预算vs实际·滚动预测'}
  ]},
  {id:'knowledge',label:'🧬 知识资产',children:[
    {id:'knowledge-graph',label:'知识图谱',desc:'实体·连接·密度'},
    {id:'knowledge-content',label:'内容生命周期',desc:'创建·审核·发布·归档'},
    {id:'knowledge-term',label:'术语管理',desc:'词汇产权·映射·一致性'},
    {id:'knowledge-learn',label:'学习与培训',desc:'课程·认证·技能矩阵'}
  ]},
  {id:'ops',label:'⚙️ 运营与流程',children:[
    {id:'ops-tasks',label:'任务看板',desc:'P0-P3·状态·截止'},
    {id:'ops-decisions',label:'决策记录',desc:'日志·链条·结果'},
    {id:'ops-cron',label:'自动化引擎',desc:'Cron·触发·执行日志'},
    {id:'ops-workflow',label:'流程管理',desc:'工作流·审批·SOP'}
  ]},
  {id:'governance',label:'🛡️ 免疫与治理',children:[
    {id:'gov-immune',label:'免疫系统',desc:'L0-L6七层·事件'},
    {id:'gov-rules',label:'规则引擎',desc:'48规则·激活·反馈'},
    {id:'gov-quality-gate',label:'质量门禁',desc:'代码·内容·设计·数据'},
    {id:'gov-compliance',label:'合规与审计',desc:'隐私·安全·许可'}
  ]},
  {id:'archaeology',label:'🏺 考古与洞察',children:[
    {id:'arch-timeline',label:'时间线',desc:'105天·6阶段·19关键时刻'},
    {id:'arch-artifacts',label:'历史文物',desc:'35件·来源·意义'},
    {id:'arch-simulations',label:'模拟与场景',desc:'16场景·30天随访'},
    {id:'arch-insights',label:'发现与洞察',desc:'趋势·模式·异常'}
  ]},
  {id:'people',label:'👥 组织与人',children:[
    {id:'people-avatars',label:'替身管理',desc:'激活·休眠·唤醒'},
    {id:'people-experts',label:'专家团',desc:'角色·专长·可用性'},
    {id:'people-council',label:'五路评议会',desc:'图腾·编排·决议'},
    {id:'people-network',label:'协作者网络',desc:'关系图·协同效率'}
  ]}
];

/* ===== 辅助函数 ===== */
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escA(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function q(s){return JSON.stringify(String(s))}
function renderDegrade(){return'<div class="loading"><div class="spinner" style="border-top-color:var(--red)"></div><p style="margin-top:16px;color:var(--red)">⚠️ 数据加载失败</p><p style="font-size:.8em;color:var(--ink-light)">请检查 entities_index.json</p></div>'}
function placeholder(title,desc){return'<div class="placeholder-card"><div class="ph-icon">🏗️</div><div class="ph-title">'+escH(title)+'</div><div class="ph-desc">'+escH(desc)+'</div></div>'}
function toolbar(id,ph,filts){
  var h='<div class="panel-toolbar"><input type="text" placeholder="'+ph+'" id="srch-'+id+'" oninput="filtPane(\''+id+'\',this.value)">';
  if(filts&&filts.length){h+='<select id="filt-'+id+'" onchange="filtPane(\''+id+'\',document.getElementById(\'srch-'+id+'\').value,this.value)"><option value="">全部</option>';for(var i=0;i<filts.length;i++)h+='<option value="'+escA(filts[i])+'">'+escH(filts[i])+'</option>';h+='</select>'}
  h+='</div>';return h;
}
function toggleDetail(id){var r=document.getElementById(id);if(r)r.classList.toggle('show')}
function filtPane(id,text,cat){
  text=(text||'').toLowerCase();var rows=document.querySelectorAll('#tbody-'+id+' tr');
  for(var i=0;i<rows.length;i++){var row=rows[i];if(row.className.indexOf('empty-row')>=0||row.className.indexOf('detail-row')>=0)continue;var m=true;
  if(text&&(row.textContent||'').toLowerCase().indexOf(text)<0)m=false;
  if(cat&&m){var tags=row.querySelectorAll('.tag');var cm=false;for(var j=0;j<tags.length;j++){if((tags[j].textContent||'').indexOf(cat)>=0){cm=true;break}}if(!cm&&(row.textContent||'').indexOf(cat)<0)cm=false;if(!cm)m=false}
  row.style.display=m?'':'none';var nx=row.nextElementSibling;if(nx&&nx.className.indexOf('detail-row')>=0)nx.style.display='none'}
}

var PANE_DATA={};
function fillTbl(id,rows,rowBld,emptyMsg){
  var tb=document.getElementById('tbody-'+id);if(!tb)return;
  if(!rows||!rows.length){tb.innerHTML='<tr class="empty-row"><td colspan="12">'+(emptyMsg||'暂无数据')+'</td></tr>';return}
  var h='';for(var i=0;i<rows.length;i++)h+=rowBld(rows[i],i);tb.innerHTML=h;
}
function sortTbl(id,key,th){
  var rows=PANE_DATA[id];if(!rows)return;var asc=sortState.key===key?!sortState.asc:true;sortState={key:key,asc:asc};
  rows.sort(function(a,b){var va=a[key]||'',vb=b[key]||'';if(typeof va==='number')return asc?va-vb:vb-va;va=String(va);vb=String(vb);return asc?va.localeCompare(vb,'zh'):vb.localeCompare(va,'zh')});
  var arrows=document.querySelectorAll('#tbl-'+id+' .sort-arrow');for(var i=0;i<arrows.length;i++)arrows[i].textContent='';
  if(th){var ar=th.querySelector('.sort-arrow');if(ar)ar.textContent=asc?' ▲':' ▼'}
  fillTbl(id,rows,rowBuilders[id],'暂无数据');
}
var rowBuilders={};

/* ===== 直接进入（无密码） ===== */
initApp();

/* ===== 初始化 ===== */
function initApp(){
  renderSidebar();
  fetch('entities_index.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
    DB=j;loadError=false;renderSidebar();navTo('strategy-kpi');
  }).catch(function(err){console.error(err);loadError=true;DB=null;renderSidebar();navTo('strategy-kpi')});
}

/* ===== 侧栏 ===== */
function renderSidebar(){
  var h='<div class="sidebar-header"><h3>🩸 毛细血管</h3><div class="sub">满意红 · 管理后台 v3.0</div></div>';
  h+='<a href="dashboard-v3.html" class="sidebar-back">◂ 返回驾驶舱</a><div class="sidebar-nav-wrap">';
  for(var i=0;i<NAV.length;i++){
    var d=NAV[i],openClass=(currentDomain===d.id||!currentDomain&&i===0)?' open':'';
    h+='<div class="nav-domain'+openClass+'" id="domain-'+d.id+'"><div class="nav-domain-header" onclick="toggleDomain(\''+d.id+'\')"><span class="domain-label"><span>'+d.label+'</span></span><span class="domain-arrow">▶</span></div><div class="nav-children">';
    for(var j=0;j<d.children.length;j++){
      var ch=d.children[j],activeClass=currentView===ch.id?' active':'';
      h+='<div class="nav-child'+activeClass+'" onclick="navTo(\''+ch.id+'\',this)" id="nav-'+ch.id+'">'+ch.label+'</div>';
    }
    h+='</div></div>';
  }
  h+='</div>';
  h+='<div class="sidebar-footer">数据 v'+(DB?DB.meta.version:'?.?')+' · '+(DB?DB.meta.updated:'加载中…')+'<br>9域·36模块·三级穿透</div>';
  document.getElementById('sidebar').innerHTML=h;
}
function toggleDomain(id){
  var el=document.getElementById('domain-'+id);if(el)el.classList.toggle('open');
  currentDomain=id;
}
function navTo(viewId,el){
  if(currentView===viewId)return;
  currentView=viewId;
  // Update nav active
  var allNav=document.querySelectorAll('.nav-child');for(var i=0;i<allNav.length;i++)allNav[i].classList.remove('active');
  var navEl=document.getElementById('nav-'+viewId);if(navEl)navEl.classList.add('active');
  // Auto-open domain
  for(var di=0;di<NAV.length;di++){var d=NAV[di];for(var cj=0;cj<d.children.length;cj++){if(d.children[cj].id===viewId){var domEl=document.getElementById('domain-'+d.id);if(domEl)domEl.classList.add('open');currentDomain=d.id}}}
  // Clear main
  var mc=document.getElementById('main-content');if(!mc)return;
  mc.innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div>';
  sortState={key:null,asc:true};
  setTimeout(function(){renderView(viewId)},10);
}
function setMain(h){var mc=document.getElementById('main-content');if(mc)mc.innerHTML=h}

/* ===== 面包屑 ===== */
function breadcrumb(domainId,moduleLabel){
  var dom=null;for(var i=0;i<NAV.length;i++){if(NAV[i].id===domainId){dom=NAV[i];break}}
  return'<div class="breadcrumb">管理后台 / <span>'+(dom?dom.label:domainId)+'</span> / '+moduleLabel+'</div>';
}

/* ===== 四层详情通用函数 ===== */
function renderLayerDetail(p,showDesc){
  var h='';
  if(showDesc&&p.description)h+='<div class="field"><span class="field-label">📝 描述</span><div class="field-value">'+escH(p.description)+'</div></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px">';
  // 物理层
  h+='<div class="layer-section l-phy"><div class="layer-title t-phy">🔩 物理层</div>';

  return h;

/* ── chemistry-overview: 化学总览 (数据源: meta.heating + meta.chemistry + meta.perpetual_control) ── */
viewRenderers['chemistry-overview']=function(){
  var meta=DB.meta||{}, chem=meta.chemistry||{}, results=chem.results||{}, heat=meta.heating||{}, pc=meta.perpetual_control||{}, org=meta.orchestration_health||{};
  var h=breadcrumb('governance','化学总览');
  h+='<div class="panel-header"><div><h2>⚗️ 化学总览 · 控制室视图</h2><div class="meta">从 entities_index.json 实时读取 · 最后一次反应: '+(chem.last_reacted||'?').slice(0,19)+'</div></div></div>';

  // ═══ 第一行: 核心指标 4 卡 (真实数据) ═══
  h+='<div class="graph-stat">';
  var th=Math.round(heat.total_heat||0);
  var hotColor=th>800?'fill-red':(th>500?'fill-gold':'fill-green');
  var hotPct=Math.min(Math.round(th/12),100);
  h+='<div class="stat-card"><div class="stat-num">'+th+'</div><div class="stat-label">🔥 化学总热力</div><div class="stat-bar"><div class="fill '+hotColor+'" style="width:'+hotPct+'%"></div></div><div style="font-size:0.65em;color:var(--ink-light)">'+(heat.temperature_grade||'?')+' · '+Math.round(heat.heat_sources||0)+'热源</div></div>';

  var alive=0,totalReacts=0;
  for(var rk in results){if(results[rk]&&typeof results[rk].effect!=='undefined'){totalReacts++;if(results[rk].effect>0)alive++;}}
  var alivePct=totalReacts>0?Math.round(100*alive/totalReacts):0, dead=totalReacts-alive;
  var aliveColor=alivePct>=50?'fill-green':(alivePct>=25?'fill-gold':'fill-red');
  h+='<div class="stat-card"><div class="stat-num">'+alive+' / '+dead+'</div><div class="stat-label">🧪 活链 / 死链</div><div class="stat-bar" style="display:flex"><div class="fill '+aliveColor+'" style="width:'+alivePct+'%"></div><div class="fill fill-red" style="width:'+(100-alivePct)+'%"></div></div><div style="font-size:0.65em;color:var(--ink-light)">'+(chem.total_reactions||0)+'总链 · '+alivePct+'%活跃</div></div>';

  var hs=org.health_score!=null?org.health_score:'?';
  var hsColor=hs>=80?'fill-green':(hs>=50?'fill-gold':'fill-red');
  h+='<div class="stat-card"><div class="stat-num">'+hs+'</div><div class="stat-label">🫀 编排器</div><div class="stat-bar"><div class="fill '+hsColor+'" style="width:'+Math.min(hs,100)+'%"></div></div><div style="font-size:0.65em;color:var(--ink-light)">'+(org.ok||0)+'✅ '+(org.degraded||0)+'🟡 '+(org.failed||0)+'❌ · '+(org.total_stages||'?')+'环节</div></div>';

  var pcState=pc.state||'idle', pcSpeed=pc.speed_multiplier||'1.0', pcLearn=Math.round(pc.learning_progress||0);
  var pcStable=Math.round(pc.stability_score||0);
  h+='<div class="stat-card"><div class="stat-num">'+pcState+'</div><div class="stat-label">🎛️ 永续控制</div><div class="stat-bar"><div class="fill '+pcColor+'" style="width:'+Math.min(pcLearn,100)+'%"></div></div><div style="font-size:0.65em;color:var(--ink-light)">'+pcSpeed+'x · '+pcStable+'%稳定 · '+pcLearn+'%学习</div></div>';
  h+='</div>';

  // ═══ 第二行: 60链热力图 (分类折叠) ═══
  h+='<h3 style="font-size:1em;margin:16px 0 8px">🧬 60条化学反应链 · 完整热力图 <span style="font-size:0.65em;color:var(--ink-lighter)">(驾驶舱精简版→仅一屏快照)</span></h3>';
  var chainCats=[
    {name:'基础反应',keys:['parallel','serial','ph','temperature','pressure','dosage']},
    {name:'分子化学',keys:['crystallize','activate','gradient','chain','equilibrium','compound','entropy','catalyst','energy','isotope','redox','polymerization','phase','osmosis','enzyme','superposition','symmetry','dissipative','isomer','enantiomer','conformer','reversible']},
    {name:'替身化学',keys:['avatar_activation','avatar_compound','avatar_osmosis','avatar_equilibrium','avatar_catalyst','avatar_spin','avatar_decay','avatar_field']},
    {name:'信息化学',keys:['metabolism','info_synthesis','info_redox']},
    {name:'环节化学',keys:['nourish_chem','gate_chem','scan_chem','consistency_chem','heal_chem','lifecycle_chem','standards_chem','audit_chem','report_chem']},
    {name:'高烈度',keys:['fission','combustion','explosion','precipitation','electrolysis','sublimation','condensation','tracers','termination','recrystallization']}
  ];
  // 先把 all chain keys flatten 出来做id映射
  var prefixMap={};
  for(var ci=0;ci<chainCats.length;ci++){
    for(var ki=0;ki<chainCats[ci].keys.length;ki++){
      prefixMap[chainCats[ci].keys[ki]]=true;
    }
  }
  // 看 meta 下面有哪些是直接挂在 meta.xxx (如 meta.crystallize) 而不仅是 meta.chemistry.results.crystallize
  for(var ci2=0;ci2<chainCats.length;ci2++){
    var cat=chainCats[ci2];
    var catAlive=0,catTotal=cat.keys.length;
    h+='<details style="margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px">';
    h+='<summary style="font-weight:700;cursor:pointer;font-size:0.92em">'+cat.name+' <span style="color:var(--ink-lighter);font-weight:400;font-size:0.85em">('+cat.keys.length+'链)</span></summary>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin-top:8px">';
    for(var ki=0;ki<cat.keys.length;ki++){
      var k=cat.keys[ki];
      var r=results[k];
      var eff=(r&&typeof r.effect!=='undefined')?r.effect:null;
      if(eff!==null && eff>0) catAlive++;
      var cellBg='#f5f5f5';
      if(eff!==null){
        if(eff>=50)cellBg='#c0392b';
        else if(eff>=20)cellBg='#e67e22';
        else if(eff>=10)cellBg='#f39c12';
        else if(eff>0)cellBg='#27ae60';
        else cellBg='#e0ddd5';
      }
      var rName=(r&&r.name)?r.name:k;
      h+='<div style="background:'+cellBg+';color:'+(eff!==null&&eff>0?'#fff':'var(--ink-light)')+';border-radius:6px;padding:6px 8px;font-size:0.7em;font-weight:600;text-align:center" title="'+escH(rName)+': '+(eff!=null?eff:'无数据')+'">'+rName+'<br><span style="font-size:1.4em">'+(eff!=null?eff:'—')+'</span></div>';
    }
    h+='</div>';
    var catRatio=Math.round(100*catAlive/catTotal);
    var catDot=catRatio>=50?'🟢':(catRatio>=25?'🟡':'🔴');
    h+='<div style="font-size:0.72em;color:var(--ink-lighter);margin-top:6px">'+catDot+' '+catAlive+'/'+catTotal+' 活跃 ('+catRatio+'%)</div>';
    h+='</details>';
  }

  // ═══ 第三行: 休眠链诊断 ═══
  var dormancy=meta._chain_dormancy||{};
  var dormCount=0;
  for(var dk in dormancy){if(dormancy[dk]&&dormancy[dk].reason)dormCount++;}
  if(dormCount>0){
    h+='<h3 style="font-size:1em;margin:16px 0 8px">💤 休眠链诊断 ('+dormCount+'条)</h3>';
    h+='<table class="data-table" style="width:100%;font-size:0.75em"><thead><tr><th>链</th><th>原因</th><th>建议</th></tr></thead><tbody>';
    for(var dk in dormancy){
      var d=dormancy[dk];
      if(!d||!d.reason)continue;
      h+='<tr><td>'+escH(dk)+'</td><td>'+escH(d.reason)+'</td><td>'+(d.suggestion?escH(d.suggestion):'—')+'</td></tr>';
    }
    h+='</tbody></table>';
  }

  // ═══ 溶解/调谐统计 ═══
  var gov=meta.chemical_governor||{};
  if(gov.dissolved||gov.cleaned||gov.reduced){
    h+='<h3 style="font-size:1em;margin:16px 0 8px">🧹 化学调控统计</h3>';
    h+='<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">';
    h+='<div class="stat-card"><div class="stat-num">'+(gov.dissolved||0)+'</div><div class="stat-label">过期键清理</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+(gov.cleaned||0)+'</div><div class="stat-label">冗余键移除</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+(gov.reduced||'?')+'</div><div class="stat-label">meta精简至</div></div>';
    h+='</div>';
  }

  return h;
};

/* ── chemistry-llm: LLM替身评分 ── */
viewRenderers['chemistry-llm']=function(){
  var meta=DB.meta||{};
  var stats=meta.llm_stats||{};
  var h=breadcrumb('governance','LLM替身评分');
  h+='<div class="panel-header"><div><h2>🤖 LLM替身评分</h2><div class="meta">评分分布 · 替身排行榜 · 最佳最差</div></div></div>';

  // 评分分布
  var dist=stats.score_distribution||{};
  var distKeys=Object.keys(dist);
  if(distKeys.length){
    h+='<h3 style="font-size:.92em;margin-bottom:8px">📊 评分分布</h3>';
    h+='<div class="stat-grid">';
    for(var dk=0;dk<distKeys.length;dk++){
      var dkv=distKeys[dk];
      var dvv=dist[dkv];
      var dBar=Math.min((dvv||0)/10*100,100);
      var dColor='fill-gold';
      if(parseFloat(dkv)>=80)dColor='fill-green';
      else if(parseFloat(dkv)>=60)dColor='fill-gold';
      else if(parseFloat(dkv)>=40)dColor='fill-warn';
      else dColor='fill-red';
      h+='<div class="stat-card"><div class="stat-num">'+dvv+'</div><div class="stat-label">≥'+dkv+'分</div><div class="stat-bar"><div class="fill '+dColor+'" style="width:'+dBar+'%"></div></div></div>';
    }
    h+='</div>';
  }

  // 替身排行榜
  var ranking=stats.ranking||stats.leaderboard||[];
  if(ranking.length){
    h+='<h3 style="font-size:.92em;margin:16px 0 8px">🏆 替身排行榜</h3>';
    h+='<table class="data-table"><thead><tr><th>#</th><th>替身</th><th>综合评分</th><th>响应速度</th><th>准确度</th><th>风格匹配</th></tr></thead><tbody>';
    for(var ri=0;ri<ranking.length;ri++){
      var r=ranking[ri];
      var rName=r.name||r.avatar||r.id||('替身#'+(ri+1));
      var rScore=r.score!=null?r.score:r.overall_score!=null?r.overall_score:r.rating!=null?r.rating:'—';
      var rSpeed=r.speed||r.response_speed||r.latency||'—';
      var rAcc=r.accuracy||r.precision||r.correctness||'—';
      var rStyle=r.style_match||r.style||r.tone_match||'—';
      var rankClass='';
      if(ri===0)rankClass=' style="color:var(--gold);font-weight:700"';
      else if(ri===1)rankClass=' style="color:var(--ink-light);font-weight:600"';
      h+='<tr'+rankClass+'><td>'+(ri+1)+'</td><td><b>'+escH(rName)+'</b></td><td>'+rScore+'</td><td>'+escH(rSpeed)+'</td><td>'+escH(rAcc)+'</td><td>'+escH(rStyle)+'</td></tr>';
    }
    h+='</tbody></table>';
  }

  // 最佳 / 最差
  var best=stats.best||stats.top||null;
  var worst=stats.worst||stats.bottom||null;
  if(best||worst){
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px">';
    if(best){
      var bestName=best.name||best.avatar||best.id||'—';
      var bestScore=best.score!=null?best.score:best.overall_score!=null?best.overall_score:'—';
      var bestReason=best.reason||best.note||best.comment||'';
      h+='<div style="background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:16px"><h4 style="color:var(--gold);margin-bottom:6px">🥇 最佳替身</h4>';
      h+='<div style="font-size:1.2em;font-weight:700">'+escH(bestName)+'</div>';
      h+='<div style="font-size:2em;font-weight:700;color:var(--gold);margin:4px 0">'+bestScore+'</div>';
      if(bestReason)h+='<div style="font-size:.76em;color:var(--ink-light)">'+escH(bestReason)+'</div>';
      h+='</div>';
    }
    if(worst){
      var worstName=worst.name||worst.avatar||worst.id||'—';
      var worstScore=worst.score!=null?worst.score:worst.overall_score!=null?worst.overall_score:'—';
      var worstReason=worst.reason||worst.note||worst.comment||'';
      h+='<div style="background:var(--card);border:2px solid var(--red);border-radius:10px;padding:16px"><h4 style="color:var(--red);margin-bottom:6px">🔻 最差替身</h4>';
      h+='<div style="font-size:1.2em;font-weight:700">'+escH(worstName)+'</div>';
      h+='<div style="font-size:2em;font-weight:700;color:var(--red);margin:4px 0">'+worstScore+'</div>';
      if(worstReason)h+='<div style="font-size:.76em;color:var(--ink-light)">'+escH(worstReason)+'</div>';
      h+='</div>';
    }
    h+='</div>';
  }

  // 无数据兜底
  if(!distKeys.length&&!ranking.length&&!(best||worst)){
    h+='<div class="placeholder-card"><div class="ph-icon">🤖</div><div class="ph-title">LLM替身评分数待加载</div><div class="ph-desc">评分分布、替身排行榜、最佳最差将在数据完善后展示</div></div>';
  }

  // 额外统计摘要
  var totalAvatars=stats.total_avatars||stats.total||stats.count||null;
  var avgScore=stats.average_score||stats.avg||stats.mean||null;
  if(totalAvatars!=null||avgScore!=null){
    h+='<div class="graph-stat" style="margin-top:16px">';
    if(totalAvatars!=null)h+='<div class="stat-card"><div class="stat-num">'+totalAvatars+'</div><div class="stat-label">📊 评价替身总数</div></div>';
    if(avgScore!=null)h+='<div class="stat-card"><div class="stat-num">'+avgScore+'</div><div class="stat-label">📈 平均评分</div></div>';
    var median=stats.median||stats.median_score||null;
    if(median!=null)h+='<div class="stat-card"><div class="stat-num">'+median+'</div><div class="stat-label">📐 中位数评分</div></div>';
    var stddev=stats.stddev||stats.standard_deviation||null;
    if(stddev!=null)h+='<div class="stat-card"><div class="stat-num">'+stddev+'</div><div class="stat-label">📏 标准差</div></div>';
    h+='</div>';
  }

  return h;
};
