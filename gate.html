<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>授权验证 · 满意解研究所</title>
<style>
  :root { --sri-red:#C23B22; --sri-gold:#B8860B; --sri-bg:#F5F0E6; --text:#4A4A4A; --title:#2A2A2A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:var(--sri-bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .gate-box { background:#fff; border-radius:20px; padding:40px 28px; max-width:380px; width:92%; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.06); border:2px solid var(--sri-red); }
  .gate-box .logo { font-size:40px; margin-bottom:12px; }
  .gate-box h1 { font-size:20px; color:var(--title); margin-bottom:4px; }
  .gate-box .sub { font-size:12px; color:var(--text); opacity:0.6; margin-bottom:20px; }
  .product-info { background:rgba(194,59,34,0.04); padding:10px 14px; border-radius:10px; margin-bottom:20px; font-size:13px; }
  .product-info .name { font-weight:700; color:var(--sri-red); }
  .product-info .desc { font-size:11px; opacity:0.7; margin-top:2px; }
  .input-group { display:flex; gap:6px; justify-content:center; margin-bottom:16px; }
  .digit { width:42px; height:52px; border:2px solid #D4C5A0; border-radius:10px; text-align:center; font-size:22px; font-weight:700; font-family:monospace; color:var(--title); background:var(--sri-bg); }
  .digit:focus { border-color:var(--sri-red); outline:none; background:#fff; }
  .digit.error { border-color:var(--sri-red); animation:shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .btn { display:block; width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; margin:8px 0; }
  .btn-primary { background:var(--sri-red); color:#F5F0E6; }
  .btn-primary:active { opacity:0.85; }
  .btn-ghost { background:transparent; color:var(--text); font-size:12px; font-weight:400; opacity:0.5; }
  .error-msg { color:var(--sri-red); font-size:12px; min-height:20px; margin:4px 0; }
  .info-box { font-size:11px; color:var(--text); opacity:0.6; margin-top:20px; padding-top:16px; border-top:1px solid #D4C5A0; }
  .info-box a { color:var(--sri-red); text-decoration:none; }
</style>
</head>
<body>
<div class="gate-box">
  <div class="logo">🔐</div>
  <h1>满意解研究所</h1>
  <div class="sub">请输入授权密码以继续</div>
  <div class="product-info" id="productInfo">
    <div class="name" id="productName">测评工具</div>
    <div class="desc" id="productDesc">输入8位数字密码开始使用</div>
  </div>
  <div class="input-group" id="digitGroup">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d0">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d1">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d2">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d3">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d4">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d5">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d6">
    <input type="text" class="digit" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="nextDigit(this)" onkeydown="prevDigit(event,this)" id="d7">
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <button class="btn btn-primary" onclick="verify()">验证 →</button>
  <button class="btn btn-ghost" onclick="skipGate()">先看看公开内容</button>
  <p style="text-align:center;margin-top:12px;font-size:11px;opacity:0.4;"><a href="go.html" style="color:inherit;">← 返回决策通道</a> · <a href="guide.html" style="color:inherit;">🧭 先做导购问卷</a></p>
  <div class="info-box" id="infoBox">
    <p>未获得授权密码？</p>
    <p>公开内容无需密码 · <a href="cases.html">案例库</a> · <a href="roots.html">寻根手记</a> · <a href="creation.html">星月传奇</a></p>
  </div>
</div>

<script src="password.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const target = params.get('to') || 'go.html';
const product = params.get('p') || '';

// Product name display
const names = {
  'assessment':'衡·观局 · 五维快速自评','fulldiag':'衡·测渊 · 五维完整诊断',
  'rps':'衡·探底 · RPS风险剖面','thermometer':'镜·触温 · 关系温度计',
  'knights':'镜·警兆 · 四骑士自检','crisis-sim':'觉·淬火 · 危机模拟器',
  'cards-play':'觉·卡牌 · 决策卡牌','match':'契·择伴 · 合伙人匹配度',
  'metapartner':'契·立盟 · 元合伙章程','exit-guide':'契·善别 · 退出决策指南',
  'pre0':'镜·回身 · PRE-0压力锚定','slicing-pie':'衡·分利 · 贡献记账',
  'checklist':'衡·校尺 · 自检清单','decision-theatre':'觉·入幕 · 决策剧场',
};
if (product && names[product]) {
  document.getElementById('productName').textContent = names[product];
  document.getElementById('productDesc').textContent = '输入授权密码以解锁此工具';
}

// Check existing auth
const auth = JSON.parse(localStorage.getItem('sri_auth') || '{}');
if (auth.valid && new Date().getTime() < auth.expires) {
  window.location.href = target;
}

function nextDigit(el) {
  el.value = el.value.replace(/[^0-9]/g, '');
  if (el.value && el.nextElementSibling) el.nextElementSibling.focus();
  document.querySelectorAll('.digit').forEach(d => d.classList.remove('error'));
  document.getElementById('errorMsg').textContent = '';
}

function prevDigit(e, el) {
  if (e.key === 'Backspace' && !el.value && el.previousElementSibling?.classList.contains('digit'))
    el.previousElementSibling.focus();
}

async function verify() {
  let code = '';
  for (let i=0; i<8; i++) {
    let v = document.getElementById('d'+i).value;
    if (!v) { document.getElementById('errorMsg').textContent = '请输入完整的8位数字密码'; return; }
    code += v;
  }

  // Hash input
  const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
  const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

  // Check against all passwords
  let matched = null;
  const now = Date.now();
  
  for (const pw of (window.SRI_PASSWORDS || [])) {
    if (hashHex !== pw.h) continue;
    
    // Check expiration
    const expiry = new Date(pw.e).getTime();
    if (now > expiry) {
      document.getElementById('errorMsg').textContent = '此密码已过期';
      return;
    }

    // Check product access
    if (pw.p[0] !== 'all' && product && !pw.p.includes(product)) {
      document.getElementById('errorMsg').textContent = '此密码不适用于该工具';
      return;
    }

    // Check usage count
    const usageKey = 'sri_usage_' + hashHex.substring(0, 16);
    let used = parseInt(localStorage.getItem(usageKey) || '0');
    if (used >= pw.m) {
      document.getElementById('errorMsg').textContent = '此密码已达使用次数上限';
      return;
    }

    // Increment usage
    localStorage.setItem(usageKey, (used + 1).toString());
    matched = pw;
    break;
  }

  if (matched || hashHex === (window.SRI_DEFAULT_HASH || '')) {
    // Success
    localStorage.setItem('sri_auth', JSON.stringify({
      valid: true,
      expires: now + (window.SRI_AUTH_TTL_MS || 7*24*60*60*1000),
      code: code,
      time: new Date().toISOString()
    }));

    // Log usage for tracking
    let usageLog = JSON.parse(localStorage.getItem('sri_usage_log') || '[]');
    usageLog.push({ product: product || target, time: new Date().toISOString(), codeLen: code.length });
    if (usageLog.length > 100) usageLog = usageLog.slice(-50);
    localStorage.setItem('sri_usage_log', JSON.stringify(usageLog));

    window.location.href = target;
  } else {
    document.querySelectorAll('.digit').forEach(d => d.classList.add('error'));
    document.getElementById('errorMsg').textContent = '密码错误，请重试';
    setTimeout(() => {
      document.querySelectorAll('.digit').forEach(d => { d.value = ''; d.classList.remove('error'); });
      document.getElementById('d0').focus();
    }, 800);
  }
}

function skipGate() { window.location.href = 'go.html'; }
document.getElementById('d0').focus();

// Paste support
document.addEventListener('paste', (e) => {
  let paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
  if (paste.length === 8) { e.preventDefault(); for (let i=0; i<8; i++) document.getElementById('d'+i).value = paste[i]; verify(); }
});
</script>
</body>
</html>
