<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享组件 · <a href="index.html"><img src="assets/dingyu-small.png" alt="鼎玉" style="width:48px;height:auto;vertical-align:middle;margin-right:8px"></a>满意解研究所</title>
  <meta name="description" content="满意解研究所 · 分享组件 · 满意解研究所">
<style>
.share-section { max-width:560px; margin:32px auto; padding:16px; }
.share-card { background:#fff; border-radius:16px; padding:24px; text-align:center; border:2px solid var(--sri-red, #C23B22); }
.share-card h3 { font-size:18px; color:#2A2A2A; margin-bottom:8px; }
.share-card .result-preview { background:#F5F0E6; border-radius:12px; padding:16px; margin:12px 0; font-size:13px; line-height:1.8; color:#4A4A4A; }
.share-card .share-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 0; }
.share-card .next-steps { display:flex; flex-direction:column; gap:8px; margin-top:16px; padding-top:16px; border-top:1px solid #D4C5A0; }
.share-card .next-step { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#F5F0E6; border-radius:10px; text-decoration:none; color:#4A4A4A; font-size:13px; transition:0.15s; }
.share-card .next-step:hover { background:rgba(194,59,34,0.06); }
.share-card .next-step .ns-icon { font-size:20px; }
.share-card .next-step .ns-name { font-weight:700; color:#2A2A2A; }
</style>
<link rel="stylesheet" href="vi_quick_ref.css">
</head>
<body>
<div class="share-section">
  <div class="share-card">
    <h3>🎯 这就是你的决策画像</h3>
    <p style="font-size:13px;color:#6E6E6E;margin-bottom:8px;">保存或分享——下次回来看看变化</p>
    
    <div class="result-preview" id="preview">你的测评结果将显示在这里</div>
    
    <div class="share-actions">
      <button class="btn btn-primary" onclick="copyResult()" style="padding:10px 22px;background:#C23B22;color:#fff;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;">📋 复制结果</button>
      <button class="btn btn-outline" onclick="shareResult()" style="padding:10px 22px;background:transparent;border:1.5px solid #C23B22;color:#C23B22;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;">📤 分享给合伙人</button>
    </div>
    <p id="copyMsg" style="display:none;color:#3D7A4F;font-size:12px;font-weight:600;">✅ 已复制！</p>
    
    <div class="next-steps">
      <p style="font-size:12px;color:#6E6E6E;text-align:center;">下一步</p>
      <a class="next-step" href="thermometer.html"><span class="ns-icon">🌡️</span><span class="ns-name">关系温度计</span> · 30秒测信任度</a>
      <a class="next-step" href="knights.html"><span class="ns-icon">⚠️</span><span class="ns-name">四骑士自检</span> · 1分钟看预警</a>
      <a class="next-step" href="cards-play.html?deck=7"><span class="ns-icon">🎴</span><span class="ns-name">决策卡牌</span> · 场景模拟练习</a>
      <a class="next-step" href="account.html"><span class="ns-icon">👤</span><span class="ns-name">注册账户</span> · 解锁更多工具 + 追踪进度</a>
    </div>
  </div>
</div>
</body>
</html>
