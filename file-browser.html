<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意解研究所 · 仓库文件浏览器</title>
<style>
:root {
  --bg: #F5F0E6;
  --paper-white: #FDFAF3;
  --card: #FFFDF8;
  --ink: #4A3728;
  --ink-light: #8B7355;
  --ink-lighter: #B8A898;
  --accent-red: #C23B22;
  --accent-gold: #B8860B;
  --border: #E0D5C0;
  --border-light: #EDE5D5;
  --hover: #F0E8D8;
  --code-bg: #2D2A26;
  --code-fg: #E8DCC8;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh; display:flex;
}
a { color:var(--accent-gold); text-decoration:none; }
a:hover { text-decoration:underline; }

/* === GATE (password) === */
#gate {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:var(--bg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:10000;
}
#gate .gate-logo {
  width:72px; height:72px; background:var(--accent-red);
  color:#fff; border-radius:16px; display:flex;
  align-items:center; justify-content:center;
  font-size:36px; font-weight:700; margin-bottom:16px;
}
#gate h1 { font-size:1.5em; color:var(--ink); margin-bottom:4px; }
#gate .subtitle { color:var(--ink-light); font-size:0.88em; margin-bottom:24px; }
#gate input {
  width:240px; padding:10px 14px; border:1px solid var(--border);
  border-radius:6px; background:var(--paper-white);
  color:var(--ink); font-size:1em; outline:none; text-align:center;
  margin-bottom:12px; transition:border-color 0.2s;
}
#gate input:focus { border-color:var(--accent-gold); }
#gate button {
  padding:8px 32px; background:var(--accent-red); color:#fff;
  border:none; border-radius:6px; font-size:0.95em; cursor:pointer;
}
#gate button:hover { opacity:0.85; }
#gate .hint { color:var(--ink-lighter); font-size:0.82em; margin-top:12px; }

/* === LOADING === */
#loading {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:var(--bg); display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:9999;
}
#loading .spinner {
  width:40px; height:40px; border:4px solid var(--border);
  border-top-color:var(--accent-gold); border-radius:50%;
  animation: spin 0.8s linear infinite; margin-bottom:16px;
}
@keyframes spin { to { transform:rotate(360deg); } }
#loading p { color:var(--ink-light); font-size:0.88em; }

/* === SIDEBAR === */
#sidebar {
  width:320px; min-width:260px; max-width:450px;
  background:var(--card); border-right:1px solid var(--border);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
#sb-header {
  padding:14px 16px; border-bottom:1px solid var(--border);
  background:linear-gradient(135deg, var(--accent-red), #A01E14); color:#FFF;
}
#sb-header h2 { font-size:1.1em; margin-bottom:2px; }
#sb-header p { font-size:0.7em; opacity:0.85; }
#sb-search {
  padding:10px 12px; border-bottom:1px solid var(--border);
}
#sb-search input {
  width:100%; padding:8px 12px; border:1px solid var(--border);
  border-radius:6px; font-size:0.85em; background:var(--paper-white);
  color:var(--ink); outline:none;
}
#sb-search input:focus { border-color:var(--accent-gold); }
#tree-container {
  flex:1; overflow-y:auto; padding:4px 0;
}
.tree-item {
  display:flex; align-items:center; padding:4px 12px 4px 0;
  cursor:pointer; font-size:0.85em; border-left:3px solid transparent;
  transition:background 0.15s; user-select:none; white-space:nowrap;
}
.tree-item:hover { background:var(--hover); }
.tree-item.active { border-left-color:var(--accent-gold); background:var(--hover); }
.tree-item .icon { margin:0 4px 0 4px; width:18px; text-align:center; flex-shrink:0; }
.tree-item .name { overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.tree-item .meta { font-size:0.72em; color:var(--ink-lighter); margin-left:8px; flex-shrink:0; }
.tree-children { padding-left:0; }
.tree-children .tree-item { padding-left:28px; }
.tree-children .tree-children .tree-item { padding-left:40px; }
.tree-children .tree-children .tree-children .tree-item { padding-left:52px; }
.tree-children .tree-children .tree-children .tree-children .tree-item { padding-left:64px; }
.tree-children .tree-children .tree-children .tree-children .tree-children .tree-item { padding-left:76px; }
.tree-toggle {
  display:inline-block; width:14px; font-size:0.6em;
  color:var(--ink-lighter); flex-shrink:0; text-align:center;
  transition:transform 0.2s; margin:0 2px;
}
.tree-toggle.expanded { transform:rotate(90deg); }
.tree-toggle.leaf { visibility:hidden; }
.tree-children.collapsed { display:none; }
#sb-footer {
  padding:6px 12px; border-top:1px solid var(--border);
  font-size:0.68em; color:var(--ink-lighter); text-align:center;
}

/* === MAIN === */
#main {
  flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
#toolbar {
  padding:10px 20px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; flex-shrink:0; flex-wrap:wrap;
}
#breadcrumb { font-size:0.85em; color:var(--ink-light); display:flex; align-items:center; gap:2px; flex-wrap:wrap; }
.crumb { color:var(--ink-light); } .crumb:hover { color:var(--accent-gold); text-decoration:none; }
.crumb-sep { color:var(--ink-lighter); margin:0 2px; }
.toolbtn {
  background:var(--accent-gold); color:#FFF; border:none; padding:6px 14px;
  border-radius:6px; font-size:0.82em; cursor:pointer; font-weight:600;
}
.toolbtn:hover { background:#9A6F09; }

#content-area {
  flex:1; overflow-y:auto; padding:20px;
}
#status-bar {
  padding:6px 20px; background:var(--card); border-top:1px solid var(--border);
  font-size:0.72em; color:var(--ink-lighter); display:flex;
  justify-content:space-between; flex-shrink:0;
}

/* === CONTENT === */
.empty-state { text-align:center; padding:80px 20px; color:var(--ink-lighter); }
.empty-state .big-icon { font-size:3em; margin-bottom:12px; }
.empty-state h3 { margin-bottom:8px; color:var(--ink-light); }

.preview-wrapper { max-width:960px; }
.preview-wrapper > h2 { font-size:1.3em; margin-bottom:4px; color:var(--ink); }
.preview-wrapper > .file-meta { font-size:0.8em; color:var(--ink-lighter); margin-bottom:16px; }

.preview-img { max-width:100%; max-height:70vh; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
.preview-frame { width:100%; height:80vh; border:1px solid var(--border); border-radius:8px; }

.preview-md { line-height:1.8; font-size:0.92em; }
.preview-md h1,.preview-md h2,.preview-md h3 { margin:16px 0 8px; color:var(--ink); }
.preview-md h1 { font-size:1.5em; border-bottom:2px solid var(--accent-gold); padding-bottom:8px; }
.preview-md h2 { font-size:1.25em; border-bottom:1px solid var(--border); padding-bottom:4px; }
.preview-md p { margin:8px 0; }
.preview-md code { background:var(--code-bg); color:var(--code-fg); padding:2px 6px; border-radius:4px; font-size:0.88em; }
.preview-md pre { background:var(--code-bg); color:var(--code-fg); padding:16px; border-radius:8px; overflow-x:auto; font-size:0.82em; line-height:1.5; margin:12px 0; }
.preview-md pre code { background:none; padding:0; }
.preview-md table { border-collapse:collapse; width:100%; margin:12px 0; }
.preview-md th,.preview-md td { border:1px solid var(--border); padding:6px 10px; text-align:left; font-size:0.88em; }
.preview-md th { background:var(--hover); font-weight:600; }
.preview-md blockquote { border-left:3px solid var(--accent-gold); padding:4px 16px; margin:8px 0; color:var(--ink-light); background:var(--hover); }
.preview-md ul,.preview-md ol { padding-left:24px; margin:8px 0; }
.preview-md li { margin:2px 0; }
.preview-md hr { border:none; border-top:1px solid var(--border); margin:16px 0; }

.preview-text {
  font-family:'SF Mono','Fira Code',monospace;
  font-size:0.8em; line-height:1.6; white-space:pre-wrap; word-break:break-all;
  background:var(--card); padding:14px; border-radius:8px;
  border:1px solid var(--border); max-height:70vh; overflow-y:auto;
}

.msg-box {
  background:var(--paper-white); border:1px solid var(--border);
  border-radius:8px; padding:14px; margin:8px 0; font-size:0.9em; color:var(--ink-light);
}

/* === RESPONSIVE === */
@media (max-width:768px) {
  body { flex-direction:column; }
  #sidebar { width:100%; max-width:100%; height:40vh; }
  #main { height:60vh; }
}
</style>

<script>
// ============================================================
//  PASSWORD GATE
// ============================================================
var PASS = '123654';
(function(){
  var saved = localStorage.getItem('fb_unlocked');
  var t = saved ? parseInt(saved) : 0;
  if (saved && (Date.now() - t < 86400000)) { // 24h session
    document.getElementById('gate').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    init();
  } else {
    localStorage.removeItem('fb_unlocked');
  }
})();
function unlock(btn) {
  var pw = document.getElementById('pw').value;
  if (pw === PASS) {
    localStorage.setItem('fb_unlocked', Date.now());
    document.getElementById('gate').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    init();
  } else {
    var inp = document.getElementById('pw');
    inp.value = '';
    inp.style.borderColor = 'var(--accent-red)';
    inp.placeholder = '通行码错误，请重试';
    setTimeout(function(){ inp.style.borderColor = ''; inp.placeholder = '输入通行码'; }, 1500);
  }
}
// ============================================================
//  CONFIG
// ============================================================
var OWNER = 'egbertie';
var REPO = 'satisficing-lab';
var BRANCH = 'main';
var API_BASE = 'https://api.github.com';
var RAW_BASE = 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH;

// ============================================================
//  STATE
// ============================================================
var fileTree = null;          // cached flat tree from API
var treeRoot = null;         // nested tree for rendering
var currentFile = null;
var apiRemaining = '--';
var apiLimit = '--';

// ============================================================
//  IGNORE
// ============================================================
var IGNORE_DIRS = ['.git','__pycache__','.bak','node_modules','.venv','venv','.backups','_backups'];
var IGNORE_EXTS = ['.DS_Store'];
var IMAGE_EXTS = ['.png','.jpg','.jpeg','.gif','.webp','.svg','.ico','.bmp'];
var CODE_EXTS = ['.py','.js','.ts','.css','.json','.yml','.yaml','.toml','.xml','.csv','.sh','.log','.txt','.env','.gitignore','.ini','.cfg','.conf','.html','.htm','.md','.markdown'];

// ============================================================
//  FILE ICON
// ============================================================
function getFileIcon(name, ext) {
  var map = {
    '.md': '&#128221;','.html': '&#127760;','.htm': '&#127760;',
    '.py': '&#128013;','.js': '&#128220;','.json': '&#128203;',
    '.css': '&#127912;','.svg': '&#127912;','.png': '&#127912;',
    '.jpg': '&#127912;','.jpeg': '&#127912;','.gif': '&#127912;',
    '.webp': '&#127912;','.pdf': '&#128214;','.docx': '&#128196;',
    '.pptx': '&#128202;','.xlsx': '&#128200;','.txt': '&#128195;',
    '.csv': '&#128203;','.yml': '&#9881;','.yaml': '&#9881;',
    '.toml': '&#9881;','.sh': '&#128187;','.xml': '&#128203;',
    '.ts': '&#128220;','.tsx': '&#128220;','.jsx': '&#128220;',
    '.mp3': '&#127925;','.mp4': '&#127916;','.mov': '&#127916;',
    '.zip': '&#128230;','.gz': '&#128230;','.tar': '&#128230;',
    '.log': '&#128195;','.env': '&#9881;','.gitignore': '&#9881;',
    '.ini': '&#9881;','.cfg': '&#9881;','.conf': '&#9881;',
    '.ttf': '&#128397;','.woff': '&#128397;','.woff2': '&#128397;'
  };
  return map[ext] || '&#128196;';
}

function isImage(ext) { return IMAGE_EXTS.indexOf(ext) >= 0; }
function isText(ext) { return CODE_EXTS.indexOf(ext) >= 0; }
function isIgnored(name, isDir) {
  if (name === '.DS_Store' || name === 'Thumbs.db') return true;
  if (isDir && IGNORE_DIRS.indexOf(name) >= 0) return true;
  if (name.startsWith('.') && !isDir) return true; // skip hidden files
  return false;
}
function humanSize(bytes) {
  if (bytes === undefined || bytes === null) return '? B';
  var units = ['B','KB','MB','GB'];
  var s = bytes;
  for (var i = 0; i < units.length; i++) {
    if (s < 1024 || i === units.length - 1) return s.toFixed(1) + ' ' + units[i];
    s /= 1024;
  }
  return s.toFixed(1) + ' TB';
}

// ============================================================
//  BASE64 DECODE (handles UTF-8)
// ============================================================
function b64DecodeUtf8(b64) {
  try {
    var binStr = atob(b64);
    var arr = new Uint8Array(binStr.length);
    for (var i = 0; i < binStr.length; i++) arr[i] = binStr.charCodeAt(i);
    return new TextDecoder('utf-8').decode(arr);
  } catch(e) {
    // fallback
    try { return decodeURIComponent(escape(atob(b64))); }
    catch(e2) { return atob(b64); }
  }
}

// ============================================================
//  SIMPLE MARKDOWN RENDERER
// ============================================================
function renderMarkdown(md) {
  var lines = md.split('\n');
  var html = '';
  var inCode = false, codeBuf = '', codeLang = '';
  var inTable = false, tableRows = [];
  var lastWasEmpty = true;

  function flushParagraph() {
    if (html.endsWith('<br>')) html = html.slice(0, -4);
    if (!html.endsWith('</p>\n') && !html.endsWith('</pre>') && !html.endsWith('</blockquote>\n') && !html.endsWith('</table>\n') && !html.endsWith('</h3>')) {
      // close inline
    }
  }

  for (var li = 0; li < lines.length; li++) {
    var raw = lines[li];
    var l = raw;

    // code block
    if (l.trim().startsWith('```')) {
      if (inCode) {
        html += '<pre><code>' + escHtml(codeBuf) + '</code></pre>';
        codeBuf = ''; inCode = false;
      } else {
        inCode = true; codeLang = l.trim().slice(3).trim();
      }
      continue;
    }
    if (inCode) { codeBuf += (codeBuf ? '\n' : '') + raw; continue; }

    // table
    if (isTableRow(l)) {
      if (!inTable) { inTable = true; tableRows = []; }
      tableRows.push(parseTableRow(l));
      continue;
    }
    if (inTable) {
      if (tableRows.length > 0) html += renderTable(tableRows) + '\n';
      inTable = false; tableRows = [];
    }

    // empty line
    if (l.trim() === '') { lastWasEmpty = true; continue; }

    // heading
    var hMatch = l.match(/^(#{1,6})\s+(.+)/);
    if (hMatch) {
      var hn = hMatch[1].length;
      html += '<h' + hn + '>' + renderInline(hMatch[2]) + '</h' + hn + '>';
      lastWasEmpty = false;
      continue;
    }

    // horizontal rule
    if (/^[-*_]{3,}\s*$/.test(l)) { html += '<hr>'; lastWasEmpty = false; continue; }

    // blockquote
    if (l.startsWith('> ')) { html += '<blockquote><p>' + renderInline(l.slice(2)) + '</p></blockquote>\n'; continue; }

    // unordered list
    var ulMatch = l.match(/^(\s*)[-*+]\s+(.+)/);
    if (ulMatch) { html += '<ul><li>' + renderInline(ulMatch[2]) + '</li></ul>\n'; continue; }

    // ordered list
    var olMatch = l.match(/^(\s*)\d+[.)]\s+(.+)/);
    if (olMatch) { html += '<ol><li>' + renderInline(olMatch[2]) + '</li></ol>\n'; continue; }

    // paragraph
    html += '<p>' + renderInline(l) + '</p>\n';
  }

  // close any open code block
  if (inCode) { html += '<pre><code>' + escHtml(codeBuf) + '</code></pre>'; }

  // close any open table
  if (inTable && tableRows.length > 0) { html += renderTable(tableRows) + '\n'; }

  return html;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function isTableRow(l) { return /^\|.*\|$/.test(l.trim()); }
function isTableSep(l) { return /^\|[\s\-:]+\|$/.test(l); }
function parseTableRow(l) {
  return l.trim().replace(/^\||\|$/g,'').split('|').map(function(c) { return c.trim(); });
}
function renderTable(rows) {
  if (rows.length === 0) return '';
  // detect separator row
  var sepIdx = -1;
  var headers = rows[0];
  if (rows.length > 1 && isTableSep('|' + rows[1].join('|') + '|')) {
    sepIdx = 1;
  }
  var dataRows = sepIdx >= 0 ? rows.slice(sepIdx + 1) : rows.slice(1);
  var h = '<table>';
  h += '<thead><tr>';
  for (var hi = 0; hi < headers.length; hi++) h += '<th>' + renderInline(headers[hi]) + '</th>';
  h += '</tr></thead><tbody>';
  for (var ri = 0; ri < dataRows.length; ri++) {
    h += '<tr>';
    for (var ci = 0; ci < headers.length; ci++) {
      h += '<td>' + (dataRows[ri][ci] !== undefined ? renderInline(dataRows[ri][ci]) : '') + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}
function renderInline(t) {
  if (!t) return '';
  // code
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__(.+?)__/g, '<strong>$1</strong>');
  // italic
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  t = t.replace(/_(.+?)_/g, '<em>$1</em>');
  // strikethrough
  t = t.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // links
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // images
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  return t;
}

// ============================================================
//  API HELPERS
// ============================================================
function apiHeaders() {
  var h = { 'Accept': 'application/vnd.github.v3+json' };
  return h;
}

function updateRateLimit(headers) {
  apiRemaining = headers.get('X-RateLimit-Remaining') || '--';
  apiLimit = headers.get('X-RateLimit-Limit') || '--';
  document.getElementById('rate-limit').textContent = 'API: ' + apiRemaining + '/' + apiLimit;
}

async function apiFetch(url) {
  var resp = await fetch(url, { headers: apiHeaders() });
  updateRateLimit(resp.headers);
  if (!resp.ok) {
    if (resp.status === 403 && apiRemaining === '0') {
      throw new Error('API rate limit exceeded (' + apiLimit + ' requests/hour). Try again later.');
    }
    throw new Error('HTTP ' + resp.status + ': ' + resp.statusText);
  }
  return resp.json();
}

// ============================================================
//  LOAD FILE TREE
// ============================================================
async function loadTree() {
  try {
    var data = await apiFetch(API_BASE + '/repos/' + OWNER + '/' + REPO + '/git/trees/' + BRANCH + '?recursive=1');
    fileTree = data.tree;

    // Build nested tree
    treeRoot = buildNestedTree(fileTree);

    // Render
    renderTree();
    document.getElementById('sb-footer').textContent = fileTree.length + ' 个条目';

    // Hide loading
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<div style="font-size:2em;margin-bottom:12px">&#9888;&#65039;</div>' +
      '<h3 style="color:var(--ink-light);margin-bottom:8px">加载失败</h3>' +
      '<p>' + escHtml(e.message) + '</p>' +
      '<button class="toolbtn" style="margin-top:12px" onclick="location.reload()">重试</button>';
  }
}

function buildNestedTree(flatList) {
  var root = { name: '', children: {}, files: [] };

  for (var i = 0; i < flatList.length; i++) {
    var item = flatList[i];
    var parts = item.path.split('/');
    var node = root;

    for (var j = 0; j < parts.length; j++) {
      var part = parts[j];
      var isLast = (j === parts.length - 1);
      var isDir = (item.type === 'tree') && isLast;

      if (isDir) {
        // This part is a directory
        if (!node.children[part]) {
          node.children[part] = { name: part, children: {}, files: [] };
        }
        // have dir marker
      } else if (isLast && item.type === 'blob') {
        // This is a file
        node.files.push({
          name: part,
          path: item.path,
          size: item.size,
          sha: item.sha
        });
      } else {
        // intermediate directory
        if (!node.children[part]) {
          node.children[part] = { name: part, children: {}, files: [] };
        }
        node = node.children[part];
      }
    }
  }
  return root;
}

// ============================================================
//  RENDER TREE
// ============================================================
function renderTree(filter) {
  var container = document.getElementById('tree-container');
  var html = '<ul style="list-style:none">';
  html += renderTreeNode(treeRoot, '/', 0, filter || '');
  html += '</ul>';
  container.innerHTML = html;
}

function renderTreeNode(node, prefix, depth, filter) {
  var html = '';

  // Sort children
  var dirNames = Object.keys(node.children).sort(function(a,b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
  for (var di = 0; di < dirNames.length; di++) {
    var dn = dirNames[di];
    if (isIgnored(dn, true)) continue;
    var dirNode = node.children[dn];
    var dirPath = prefix + dn + '/';
    var match = !filter || dn.toLowerCase().indexOf(filter) >= 0 || hasMatchingChild(dirNode, filter);

    if (!match) continue;

    var dirHtml = renderTreeNode(dirNode, dirPath, depth + 1, filter);
    var hasChildren = dirHtml.trim() !== '';

    html += '<li>';
    html += '<div class="tree-item" onclick="toggleTreeNode(this)" data-path="' + escapeAttr(dirPath) + '">';
    html += '<span class="tree-toggle ' + (hasChildren ? '' : 'leaf') + '">&#9654;</span>';
    html += '<span class="icon">&#128193;</span>';
    html += '<span class="name">' + escHtml(dn) + '</span>';
    html += '</div>';
    if (hasChildren) {
      html += '<ul class="tree-children collapsed" style="list-style:none">';
      html += dirHtml;
      html += '</ul>';
    }
    html += '</li>';
  }

  // Sort files
  node.files.sort(function(a,b) { return a.name.toLowerCase().localeCompare(b.name.toLowerCase()); });
  for (var fi = 0; fi < node.files.length; fi++) {
    var f = node.files[fi];
    if (isIgnored(f.name, false)) continue;

    var ext = f.name.substring(f.name.lastIndexOf('.')).toLowerCase();
    if (ext === '') ext = '(none)';

    if (filter && f.name.toLowerCase().indexOf(filter) < 0) continue;

    html += '<li>';
    html += '<div class="tree-item leaf" onclick="openFile(\'' + escapeAttr(f.path) + '\',\'' + escapeAttr(f.name) + '\',' + (f.size||0) + ')" title="' + escHtml(f.name) + '">';
    html += '<span class="tree-toggle leaf">&#9654;</span>';
    html += '<span class="icon">' + getFileIcon(f.name, ext) + '</span>';
    html += '<span class="name">' + escHtml(f.name) + '</span>';
    html += '<span class="meta">' + humanSize(f.size) + '</span>';
    html += '</div>';
    html += '</li>';
  }

  return html;
}

function hasMatchingChild(node, filter) {
  if (!filter) return true;
  // Check files
  for (var fi = 0; fi < node.files.length; fi++) {
    if (node.files[fi].name.toLowerCase().indexOf(filter) >= 0) return true;
  }
  // Check children
  var keys = Object.keys(node.children);
  for (var ki = 0; ki < keys.length; ki++) {
    var cn = keys[ki];
    if (cn.toLowerCase().indexOf(filter) >= 0) return true;
    if (hasMatchingChild(node.children[cn], filter)) return true;
  }
  return false;
}

function escapeAttr(s) { return s.replace(/'/g,"\\'").replace(/\\/g,"\\\\"); }

function toggleTreeNode(el) {
  var ul = el.parentElement.querySelector('ul');
  if (ul) {
    ul.classList.toggle('collapsed');
    el.querySelector('.tree-toggle').classList.toggle('expanded');
  }
}

function filterTree() {
  var q = document.getElementById('search-box').value.toLowerCase().trim();
  renderTree(q);
  // auto-expand when filtering
  if (q) {
    var allUl = document.querySelectorAll('.tree-children');
    allUl.forEach(function(u) { u.classList.remove('collapsed'); });
    var allToggle = document.querySelectorAll('.tree-toggle:not(.leaf)');
    allToggle.forEach(function(t) { t.classList.add('expanded'); });
  }
}

// ============================================================
//  FILE OPEN / PREVIEW
// ============================================================
async function openFile(path, name, size) {
  currentFile = { path: path, name: name, size: size };

  // Update breadcrumb
  var parts = path.split('/');
  var bread = '<a href="javascript:void(0)" class="crumb" onclick="clearPreview()">&#127968;</a>';
  var cum = '';
  for (var i = 0; i < parts.length; i++) {
    cum += (cum ? '/' : '') + parts[i];
    bread += '<span class="crumb-sep">/</span>';
    if (i === parts.length - 1) {
      bread += '<span class="crumb" style="font-weight:600;color:var(--ink)">' + escHtml(parts[i]) + '</span>';
    } else {
      bread += '<a href="javascript:void(0)" class="crumb">' + escHtml(parts[i]) + '</a>';
    }
  }
  document.getElementById('breadcrumb').innerHTML = bread;

  var ext = name.substring(name.lastIndexOf('.')).toLowerCase();
  var rawUrl = RAW_BASE + '/' + path;
  var contentArea = document.getElementById('content-area');

  // Show download button
  document.getElementById('dl-btn').style.display = '';

  // Show loading
  contentArea.innerHTML = '<div style="text-align:center;padding:60px"><div class="spinner" style="margin:0 auto 12px"></div><p style="color:var(--ink-light)">加载中...</p></div>';

  try {
    if (isImage(ext)) {
      // Show image directly
      contentArea.innerHTML =
        '<div class="preview-wrapper">' +
        '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
        '<p class="file-meta">' + humanSize(size) + ' · ' + ext.replace('.','').toUpperCase() + '</p>' +
        '<img src="' + rawUrl + '" class="preview-img" alt="' + escHtml(name) + '" onerror="this.onerror=null;this.parentElement.innerHTML+=\'<div class=msg-box>Image failed to load</div>\'">' +
        '</div>';

    } else if (ext === '.pdf') {
      // iframe preview + download link
      contentArea.innerHTML =
        '<div class="preview-wrapper">' +
        '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
        '<p class="file-meta">' + humanSize(size) + ' · PDF</p>' +
        '<iframe src="' + rawUrl + '" class="preview-frame" title="PDF"></iframe>' +
        '</div>';

    } else if (ext === '.html' || ext === '.htm') {
      // iframe live preview
      contentArea.innerHTML =
        '<div class="preview-wrapper">' +
        '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
        '<p class="file-meta">' + humanSize(size) + ' · HTML</p>' +
        '<iframe src="' + rawUrl + '" class="preview-frame" title="HTML Preview"></iframe>' +
        '</div>';

    } else if (ext === '.docx' || ext === '.pptx' || ext === '.xlsx') {
      // Office: show download link + brief info
      contentArea.innerHTML =
        '<div class="preview-wrapper">' +
        '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
        '<p class="file-meta">' + humanSize(size) + ' · ' + ext.replace('.','').toUpperCase() + '</p>' +
        '<div class="msg-box">' +
        '<p>此文件类型（' + ext.replace('.','').toUpperCase() + '）无法在线预览。</p>' +
        '<p style="margin-top:8px"><a href="' + rawUrl + '" class="toolbtn" style="display:inline-block;text-decoration:none">下载 ' + escHtml(name) + '</a></p>' +
        '</div>' +
        '</div>';

    } else if (isText(ext)) {
      // Fetch and decode content
      var data = await apiFetch(API_BASE + '/repos/' + OWNER + '/' + REPO + '/contents/' + path + '?ref=' + BRANCH);
      var text = '';
      if (data.content) {
        text = b64DecodeUtf8(data.content);
      }

      if (ext === '.md' || ext === '.markdown') {
        contentArea.innerHTML =
          '<div class="preview-wrapper">' +
          '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
          '<p class="file-meta">' + humanSize(size) + ' . ' + ext.replace('.','').toUpperCase() + '</p>' +
          '<div class="preview-md">' + renderMarkdown(text) + '</div>' +
          '</div>';
      } else {
        contentArea.innerHTML =
          '<div class="preview-wrapper">' +
          '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
          '<p class="file-meta">' + humanSize(size) + ' . ' + ext.replace('.','').toUpperCase() + '</p>' +
          '<pre class="preview-text">' + escHtml(text) + '</pre>' +
          '</div>';
      }

    } else {
      // Unknown: download
      contentArea.innerHTML =
        '<div class="preview-wrapper">' +
        '<h2>' + getFileIcon(name, ext) + ' ' + escHtml(name) + '</h2>' +
        '<p class="file-meta">' + humanSize(size) + ' . ' + (ext ? ext.replace('.','').toUpperCase() : '') + '</p>' +
        '<div class="msg-box">' +
        '<p>此文件类型无法在线预览。</p>' +
        '<p style="margin-top:8px"><a href="' + rawUrl + '" class="toolbtn" style="display:inline-block;text-decoration:none">Download ' + escHtml(name) + '</a></p>' +
        '</div>' +
        '</div>';
    }

    // Highlight tree item
    var allItems = document.querySelectorAll('.tree-item');
    allItems.forEach(function(it) { it.classList.remove('active'); });
    updateStatus('File: ' + path + ' . ' + humanSize(size));

  } catch(e) {
    contentArea.innerHTML =
      '<div class="empty-state">' +
      '<div class="big-icon">&#9888;&#65039;</div>' +
      '<h3>无法加载文件</h3>' +
      '<p>' + escHtml(e.message) + '</p>' +
      '<p style="margin-top:8px"><a href="' + rawUrl + '" class="toolbtn" style="display:inline-block;text-decoration:none">Download Raw File</a></p>' +
      '</div>';
    updateStatus('Error: ' + e.message);
  }
}

function downloadCurrent() {
  if (currentFile) {
    window.open(RAW_BASE + '/' + currentFile.path, '_blank');
  }
}

function clearPreview() {
  currentFile = null;
  document.getElementById('breadcrumb').innerHTML = '';
  document.getElementById('dl-btn').style.display = 'none';
  document.getElementById('content-area').innerHTML =
    '<div class="empty-state"><div class="big-icon">&#128194;</div><h3>Select a file on the left</h3><p>Supports Markdown / Images / PDF / Code / HTML</p></div>';
  var allItems = document.querySelectorAll('.tree-item');
  allItems.forEach(function(it) { it.classList.remove('active'); });
  updateStatus('Ready');
}

function updateStatus(msg) {
  var el = document.getElementById('status-bar');
  el.innerHTML = '<span>' + msg + '</span><span id="rate-limit">API: ' + apiRemaining + '/' + apiLimit + '</span>';
}

// ============================================================
//  INIT
// ============================================================
function init() {
  loadTree();
}
</script>
