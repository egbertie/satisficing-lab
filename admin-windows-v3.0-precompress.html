<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意红 · 管理后台 | 毛细血管级数据穿透</title>
<style>
:root{--paper:#F5F0E6;--card:#FFFFFF;--warm:#FAF6EF;--ink:#4A3728;--red:#C23B22;--gold:#B8860B;--green:#3D7A4F;--warn:#C2780A;--ink-light:#8B7355;--ink-lighter:#B8A890;--border:#E8DDCC;--border-subtle:#F0E8D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh}
.gate-overlay{position:fixed;inset:0;background:var(--paper);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.gate-overlay.hidden{opacity:0;pointer-events:none}
.gate-box{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:48px 40px;text-align:center;max-width:400px;box-shadow:0 4px 24px rgba(74,55,40,.12)}
.gate-box h2{color:var(--red);font-size:1.5em;margin-bottom:8px}
.gate-box .sub{color:var(--ink-light);font-size:.85em;margin-bottom:24px}
.gate-box input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:1.1em;text-align:center;outline:none;transition:all .2s}
.gate-box input:focus{border-color:var(--gold)}
.gate-box button{margin-top:16px;padding:10px 36px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:all .2s}
.gate-box button:hover{background:var(--gold)}
.gate-error{color:var(--red);font-size:.8em;margin-top:8px;min-height:20px}
.gate-degrade{background:#FFF8E1;border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:.75em;color:var(--warn);display:none}
.app{display:none;min-height:100vh}.app.show{display:flex}
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.sidebar-header h3{font-size:.9em;color:var(--red)}.sidebar-header .sub{font-size:.7em;color:var(--ink-lighter)}
.sidebar-back{font-size:.78em;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:4px;padding:4px 20px;transition:color .2s}.sidebar-back:hover{color:var(--red)}
.sidebar-nav{list-style:none}
.sidebar-nav li{cursor:pointer;padding:10px 20px;font-size:.85em;transition:all .15s;border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
.sidebar-nav li:hover{background:var(--warm);border-left-color:var(--gold)}
.sidebar-nav li.active{background:var(--warm);border-left-color:var(--red);font-weight:600}
.sidebar-nav li .badge{font-size:.65em;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;margin-left:auto}
.main{flex:1;padding:24px 32px;overflow-y:auto;max-height:100vh}
.window-panel{display:none}.window-panel.show{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel-header h2{font-size:1.3em;color:var(--red)}.panel-header .meta{font-size:.78em;color:var(--ink-lighter)}
.panel-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border-subtle)}
.panel-toolbar input{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:.82em;min-width:200px;outline:none}
.panel-toolbar input:focus{border-color:var(--gold)}
.panel-toolbar select,.panel-toolbar button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;font-size:.82em;background:var(--card);cursor:pointer}
.panel-toolbar button:hover{border-color:var(--gold)}
.data-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(74,55,40,.06)}
.data-table th{text-align:left;padding:10px 14px;background:var(--warm);font-size:.78em;color:var(--ink-light);border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.data-table th:hover{color:var(--red)}
.data-table th .sort-arrow{font-size:.7em;margin-left:4px}
.data-table td{padding:8px 14px;font-size:.82em;border-bottom:1px solid var(--border-subtle);vertical-align:top}
.data-table tr:hover{background:var(--warm)}
.data-table .empty-row td{text-align:center;color:var(--ink-lighter);padding:40px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75em;white-space:nowrap}
.tag-red{background:#FDE8E5;color:var(--red)}.tag-gold{background:#FDF3E0;color:var(--gold)}
.tag-green{background:#E8F0EB;color:var(--green)}.tag-gray{background:#F0EDE8;color:var(--ink-light)}
.detail-row{display:none}.detail-row.show{display:table-row}
.detail-row td{background:var(--warm);font-size:.78em;padding:12px 14px}
.detail-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.detail-card .field{margin-bottom:8px}
.detail-card .field-label{font-weight:600;font-size:.75em;color:var(--ink-light);text-transform:uppercase;letter-spacing:.04em}
.detail-card .field-value{font-size:.88em;margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-card .stat-num{font-size:1.6em;font-weight:700;color:var(--red)}
.stat-card .stat-label{font-size:.75em;color:var(--ink-light);margin-top:4px}
.stat-card .stat-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.stat-card .stat-bar .fill{height:100%;border-radius:3px}
.fill-red{background:var(--red)}.fill-gold{background:var(--gold)}.fill-green{background:var(--green)}.fill-warn{background:var(--warn)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--warm);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:.75em;display:flex;align-items:center;gap:5px}
.immune-layer{margin-bottom:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;border-left:4px solid var(--gold)}
.immune-layer.l0{border-left-color:var(--red)}.immune-layer h4{font-size:.88em;margin-bottom:6px}
.immune-layer p{font-size:.78em;color:var(--ink-light)}
.loading{padding:60px;text-align:center;color:var(--ink-lighter)}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.graph-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.conn-chip{background:var(--warm);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.75em;display:flex;align-items:center;gap:6px}
.conn-chip .edge-type{font-size:.7em;color:var(--gold)}.conn-chip .arrow{color:var(--ink-lighter)}
.conn-list{display:flex;flex-wrap:wrap;gap:6px}
.evidence-block{margin-top:8px;padding:8px 12px;background:var(--warm);border-radius:6px;font-size:.78em}
.evidence-block .ev-label{font-weight:600;color:var(--ink-light);margin-bottom:4px}
@media(max-width:768px){.sidebar{width:180px;font-size:.8em}.main{padding:16px}.data-table{font-size:.75em}.stat-grid{grid-template-columns:repeat(2,1fr)}.graph-stat{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="gate-overlay" id="gate">
  <div class="gate-box">
    <h2>🔐 管理后台</h2>
    <div class="sub">毛细血管级 · 9维度数据穿透</div>
    <input type="password" id="gpw" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkGate(this)">
    <button onclick="checkGate(this)">进入</button>
    <div class="gate-error" id="gate-error"></div>
    <div class="gate-degrade" id="gate-degrade">⚠️ 浏览器限制了会话存储，关闭标签页后需重新登录</div>
  </div>
</div>

<div class="app" id="app">
  <nav class="sidebar">
    <div class="sidebar-header"><h3>🩸 毛细血管</h3><div class="sub">满意红 · 自检仪表</div></div><div style="padding:4px 20px;margin-bottom:4px"><a href="dashboard-v3.html" class="sidebar-back">◂ 返回驾驶舱</a></div>
    <ul class="sidebar-nav" id="sidebar-nav"></ul>
  </nav>
  <main class="main" id="main-content"></main>
</div>

<script>

/* ================================================================
   管理后台 v3.0 · 9管理域·36子模块·三级穿透
   驾驶舱的二层核心基石 — 数据统一源·双向协同
   ================================================================ */
var DB=null,loadError=false,currentView=null,sortState={key:null,asc:true};
var currentDomain=null;
var LC_LABELS={L0_概念:'💡概念',L1_原型:'🔬原型',L2_内测:'🧪内测',L3_打磨:'✨打磨',L4_精品:'💎精品',L5_维护:'🔄维护',L6_退役:'📦退役'};
var MAT_LABELS={M0_种子:'🌱种子',M1_萌芽:'🌿萌芽',M2_成型:'🌳成型',M3_成熟:'🍎成熟',M4_标杆:'🏆标杆'};
var LAYERS=[{k:'physical',icon:'🔩',label:'物理层',color:'var(--l-phy)'},{k:'chemical',icon:'⚗️',label:'化学层',color:'var(--l-chem)'},{k:'biological',icon:'🧬',label:'生物层',color:'var(--l-bio)'},{k:'psychological',icon:'🧠',label:'心理层',color:'var(--l-psy)'}];

var NAV=[
  {id:'strategy',label:'📊 战略仪表盘',children:[
    {id:'strategy-kpi',label:'KPI仪表盘',desc:'核心指标实时监控'},
    {id:'strategy-map',label:'战略地图',desc:'BSC四视角联动'},
    {id:'strategy-milestone',label:'里程碑看板',desc:'时间线·关键事件'},
    {id:'strategy-risk',label:'风险雷达',desc:'识别·评级·应对'}
  ]},
  {id:'product',label:'📦 产品全生命周期',children:[
    {id:'product-overview',label:'产品总览',desc:'242可上架·7族·精品41'}, 
    {id:'product-pipeline',label:'研发管道',desc:'概念→原型→内测→打磨→精品'},
    {id:'product-quality',label:'质量中心',desc:'四维评分·审计·改进'},
    {id:'product-release',label:'版本与发布',desc:'版本历史·变更·部署'}
  ]},
  {id:'customer',label:'👤 客户关系',children:[
    {id:'customer-360',label:'客户360',desc:'档案·画像·决策风格'},
    {id:'customer-pipeline',label:'销售管道',desc:'线索→商机→提案→签约'},
    {id:'customer-delivery',label:'交付与满意度',desc:'项目·反馈·NPS'},
    {id:'customer-success',label:'客户成功',desc:'续约·增购·案例'}
  ]},
  {id:'finance',label:'💰 财务与定价',children:[
    {id:'finance-overview',label:'收入仪表盘',desc:'收入·成本·利润'},
    {id:'finance-pricing',label:'产品定价',desc:'SKU·折扣·许可'},
    {id:'finance-cost',label:'成本跟踪',desc:'开发·运营·销售'},
    {id:'finance-budget',label:'预算与预测',desc:'预算vs实际·滚动预测'}
  ]},
  {id:'knowledge',label:'🧬 知识资产',children:[
    {id:'knowledge-graph',label:'知识图谱',desc:'实体·连接·密度'},
    {id:'knowledge-content',label:'内容生命周期',desc:'创建·审核·发布·归档'},
    {id:'knowledge-term',label:'术语管理',desc:'词汇产权·映射·一致性'},
    {id:'knowledge-learn',label:'学习与培训',desc:'课程·认证·技能矩阵'}
  ]},
  {id:'ops',label:'⚙️ 运营与流程',children:[
    {id:'ops-tasks',label:'任务看板',desc:'P0-P3·状态·截止'},
    {id:'ops-decisions',label:'决策记录',desc:'日志·链条·结果'},
    {id:'ops-cron',label:'自动化引擎',desc:'Cron·触发·执行日志'},
    {id:'ops-workflow',label:'流程管理',desc:'工作流·审批·SOP'}
  ]},
  {id:'governance',label:'🛡️ 免疫与治理',children:[
    {id:'gov-immune',label:'免疫系统',desc:'L0-L6七层·事件'},
    {id:'gov-rules',label:'规则引擎',desc:'48规则·激活·反馈'},
    {id:'gov-quality-gate',label:'质量门禁',desc:'代码·内容·设计·数据'},
    {id:'gov-compliance',label:'合规与审计',desc:'隐私·安全·许可'}
  ]},
  {id:'archaeology',label:'🏺 考古与洞察',children:[
    {id:'arch-timeline',label:'时间线',desc:'105天·6阶段·19关键时刻'},
    {id:'arch-artifacts',label:'历史文物',desc:'35件·来源·意义'},
    {id:'arch-simulations',label:'模拟与场景',desc:'16场景·30天随访'},
    {id:'arch-insights',label:'发现与洞察',desc:'趋势·模式·异常'}
  ]},
  {id:'people',label:'👥 组织与人',children:[
    {id:'people-avatars',label:'替身管理',desc:'22替身·激活·休眠·唤醒'},
    {id:'people-experts',label:'专家团',desc:'5图腾+10专家·专长·贡献'},
    {id:'people-council',label:'五路评议会',desc:'图腾·专家·工具·蓝军·决议'},
    {id:'people-network',label:'协作者网络',desc:'关系图·协同效率·审计日志'}
  ]}
];

/* ===== 辅助函数 ===== */
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escA(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function q(s){return JSON.stringify(String(s))}
function renderDegrade(){return'<div class="loading"><div class="spinner" style="border-top-color:var(--red)"></div><p style="margin-top:16px;color:var(--red)">⚠️ 数据加载失败</p><p style="font-size:.8em;color:var(--ink-light)">请检查 entities_index.json</p></div>'}
function placeholder(title,desc){return'<div class="placeholder-card"><div class="ph-icon">🏗️</div><div class="ph-title">'+escH(title)+'</div><div class="ph-desc">'+escH(desc)+'</div></div>'}
function toolbar(id,ph,filts){
  var h='<div class="panel-toolbar"><input type="text" placeholder="'+ph+'" id="srch-'+id+'" oninput="filtPane(\''+id+'\',this.value)">';
  if(filts&&filts.length){h+='<select id="filt-'+id+'" onchange="filtPane(\''+id+'\',document.getElementById(\'srch-'+id+'\').value,this.value)"><option value="">全部</option>';for(var i=0;i<filts.length;i++)h+='<option value="'+escA(filts[i])+'">'+escH(filts[i])+'</option>';h+='</select>'}
  h+='</div>';return h;
}
function toggleDetail(id){var r=document.getElementById(id);if(r)r.classList.toggle('show')}
function filtPane(id,text,cat){
  text=(text||'').toLowerCase();var rows=document.querySelectorAll('#tbody-'+id+' tr');
  for(var i=0;i<rows.length;i++){var row=rows[i];if(row.className.indexOf('empty-row')>=0||row.className.indexOf('detail-row')>=0)continue;var m=true;
  if(text&&(row.textContent||'').toLowerCase().indexOf(text)<0)m=false;
  if(cat&&m){var tags=row.querySelectorAll('.tag');var cm=false;for(var j=0;j<tags.length;j++){if((tags[j].textContent||'').indexOf(cat)>=0){cm=true;break}}if(!cm&&(row.textContent||'').indexOf(cat)<0)cm=false;if(!cm)m=false}
  row.style.display=m?'':'none';var nx=row.nextElementSibling;if(nx&&nx.className.indexOf('detail-row')>=0)nx.style.display='none'}
}

var PANE_DATA={};
function fillTbl(id,rows,rowBld,emptyMsg){
  var tb=document.getElementById('tbody-'+id);if(!tb)return;
  if(!rows||!rows.length){tb.innerHTML='<tr class="empty-row"><td colspan="12">'+(emptyMsg||'暂无数据')+'</td></tr>';return}
  var h='';for(var i=0;i<rows.length;i++)h+=rowBld(rows[i],i);tb.innerHTML=h;
}
function sortTbl(id,key,th){
  var rows=PANE_DATA[id];if(!rows)return;var asc=sortState.key===key?!sortState.asc:true;sortState={key:key,asc:asc};
  rows.sort(function(a,b){var va=a[key]||'',vb=b[key]||'';if(typeof va==='number')return asc?va-vb:vb-va;va=String(va);vb=String(vb);return asc?va.localeCompare(vb,'zh'):vb.localeCompare(va,'zh')});
  var arrows=document.querySelectorAll('#tbl-'+id+' .sort-arrow');for(var i=0;i<arrows.length;i++)arrows[i].textContent='';
  if(th){var ar=th.querySelector('.sort-arrow');if(ar)ar.textContent=asc?' ▲':' ▼'}
  fillTbl(id,rows,rowBuilders[id],'暂无数据');
}
var rowBuilders={};

/* ===== 密码门 ===== */
function checkGate(btn){
  var pw=document.getElementById('gpw').value;
  try{if(!sessionStorage)throw new Error('no');sessionStorage.setItem('_at','1');sessionStorage.removeItem('_at')}catch(e){document.getElementById('gate-degrade').style.display='block'}
  if(pw==='123654'){try{sessionStorage.setItem('_admin_auth','1')}catch(e){}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.add('show');initApp()}else{document.getElementById('gate-error').textContent='密码错误'}
}

/* ===== 初始化 ===== */
function initApp(){
  renderSidebar();
  fetch('entities_index.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
    DB=j;loadError=false;renderSidebar();navTo('strategy-kpi');
  }).catch(function(err){console.error(err);loadError=true;DB=null;renderSidebar();navTo('strategy-kpi')});
}

/* ===== 侧栏 ===== */
function renderSidebar(){
  var h='<div class="sidebar-header"><h3>🩸 毛细血管</h3><div class="sub">满意红 · 管理后台 v3.0</div></div>';
  h+='<a href="dashboard-v3.html" class="sidebar-back">◂ 返回驾驶舱</a><div class="sidebar-nav-wrap">';
  for(var i=0;i<NAV.length;i++){
    var d=NAV[i],openClass=(currentDomain===d.id||!currentDomain&&i===0)?' open':'';
    h+='<div class="nav-domain'+openClass+'" id="domain-'+d.id+'"><div class="nav-domain-header" onclick="toggleDomain(\''+d.id+'\')"><span class="domain-label"><span>'+d.label+'</span></span><span class="domain-arrow">▶</span></div><div class="nav-children">';
    for(var j=0;j<d.children.length;j++){
      var ch=d.children[j],activeClass=currentView===ch.id?' active':'';
      h+='<div class="nav-child'+activeClass+'" onclick="navTo(\''+ch.id+'\',this)" id="nav-'+ch.id+'">'+ch.label+'</div>';
    }
    h+='</div></div>';
  }
  h+='</div>';
  h+='<div class="sidebar-footer">数据 v'+(DB?DB.meta.version:'?.?')+' · '+(DB?DB.meta.updated:'加载中…')+'<br>9域·36模块·三级穿透</div>';
  document.getElementById('sidebar').innerHTML=h;
}
function toggleDomain(id){
  var el=document.getElementById('domain-'+id);if(el)el.classList.toggle('open');
  currentDomain=id;
}
function navTo(viewId,el){
  if(currentView===viewId)return;
  currentView=viewId;
  // Update nav active
  var allNav=document.querySelectorAll('.nav-child');for(var i=0;i<allNav.length;i++)allNav[i].classList.remove('active');
  var navEl=document.getElementById('nav-'+viewId);if(navEl)navEl.classList.add('active');
  // Auto-open domain
  for(var di=0;di<NAV.length;di++){var d=NAV[di];for(var cj=0;cj<d.children.length;cj++){if(d.children[cj].id===viewId){var domEl=document.getElementById('domain-'+d.id);if(domEl)domEl.classList.add('open');currentDomain=d.id}}}
  // Clear main
  var mc=document.getElementById('main-content');if(!mc)return;
  mc.innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:12px">加载中...</p></div>';
  sortState={key:null,asc:true};
  setTimeout(function(){renderView(viewId)},10);
}
function setMain(h){var mc=document.getElementById('main-content');if(mc)mc.innerHTML=h}

/* ===== 面包屑 ===== */
function breadcrumb(domainId,moduleLabel){
  var dom=null;for(var i=0;i<NAV.length;i++){if(NAV[i].id===domainId){dom=NAV[i];break}}
  return'<div class="breadcrumb">管理后台 / <span>'+(dom?dom.label:domainId)+'</span> / '+moduleLabel+'</div>';
}

/* ===== 四层详情通用函数 ===== */
function renderLayerDetail(p,showDesc){
  var h='';
  if(showDesc&&p.description)h+='<div class="field"><span class="field-label">📝 描述</span><div class="field-value">'+escH(p.description)+'</div></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px">';

};

    var h='<tr onclick="toggleDetail(\'pcl-'+j+'\')" style="cursor:pointer"><td><b>'+escH(a.name)+'</b></td><td>'+escH(a.dimension||'—')+'</td><td><span style="color:'+elColor+';font-weight:600">'+escH(a.element||'—')+'</span></td><td>'+(a.contribution_score||0)+'</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-light)">"'+escH(a.description||'—')+'"</td></tr>';
    h+='<tr class="detail-row" id="pcl-'+j+'"><td colspan="5"><div class="detail-card"><div class="field"><span class="field-label">图腾</span><div class="field-value"><b>'+escH(a.name)+'</b></div></div><div class="field"><span class="field-label">对应维度</span><div class="field-value">'+escH(a.dimension||'—')+'</div></div><div class="field"><span class="field-label">五行元素</span><div class="field-value">'+escH(a.element||'—')+'</div></div><div class="field"><span class="field-label">评议会层级</span><div class="field-value">'+escH(a.tier||'—')+'</div></div><div class="field"><span class="field-label">决策箴言</span><div class="field-value">"'+escH(a.description||'—')+'"</div></div><div class="field"><span class="field-label">贡献分</span><div class="field-value">'+(a.contribution_score||0)+'</div></div><div class="field"><span class="field-label">激活次数</span><div class="field-value">'+(a.activation_count||0)+'</div></div></div></td></tr>';

  // 评议会流程说明
  h+='<div style="margin-top:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px">';

};
viewRenderers['people-network']=function(){
  var avs=DB.avatars||[],conns=DB.connections||[],m=DB.meta||{};
  // 替身相关连接
  var avIds={};
  for(var i=0;i<avs.length;i++)avIds[avs[i].id]=true;
  var avatarConns=[];
  for(var j=0;j<conns.length;j++){
    var c=conns[j];
    if(avIds[c.from_entity]||avIds[c.to_entity])avatarConns.push(c);
  }
  // 按tier分组
  var tiers={};
  for(var k=0;k<avs.length;k++){
    var a=avs[k],t=a.tier||'未分级';
    if(!tiers[t])tiers[t]=[];
    tiers[t].push(a);
  }
  var tierKeys=Object.keys(tiers).sort();
  // 总计激活次数
  var totalAct=0;
  for(var ak=0;ak<avs.length;ak++)totalAct+=avs[ak].activation_count||0;
  // 最强连接: 找weight最高的avatar连接
  var strongest=null;
  for(var ac=0;ac<avatarConns.length;ac++){
    if(!strongest||avatarConns[ac].weight>strongest.weight)strongest=avatarConns[ac];
  }
  var h=breadcrumb('people','协作者网络')+'<div class="panel-header"><div><h2>🕸️ 协作者网络</h2><div class="meta">'+avs.length+'替身 · '+avatarConns.length+'关联连接 · 五层协作矩阵</div></div></div>';
  // L1 总览卡
  h+='<div class="graph-stat">';
  h+='<div class="stat-card" style="border-left:4px solid var(--red)"><div class="stat-num">'+avs.length+'</div><div class="stat-label">🎭 替身网络</div><div class="stat-bar"><div class="fill fill-red" style="width:100%"></div></div><div style="font-size:.68em;color:var(--ink-light);margin-top:2px">5图腾+10专家+6工具+1蓝军</div></div>';
  h+='<div class="stat-card" style="border-left:4px solid var(--gold)"><div class="stat-num">'+totalAct+'</div><div class="stat-label">⚡ 协作次数(待激活)</div><div class="stat-bar"><div class="fill fill-gold" style="width:'+(totalAct>0?100:10)+'%"></div></div><div style="font-size:.68em;color:var(--ink-light);margin-top:2px">全部替身activation_count=0</div></div>';
  var densityPct=m.knowledge_graph_density||43.9;
  h+='<div class="stat-card" style="border-left:4px solid var(--green)"><div class="stat-num">'+densityPct+'%</div><div class="stat-label">🕸️ 网络密度(全局)</div><div class="stat-bar"><div class="fill fill-green" style="width:'+densityPct+'%"></div></div></div>';
  h+='<div class="stat-card" style="border-left:4px solid var(--gold)"><div class="stat-num" style="font-size:.85em">'+(strongest?escH(strongest.relationship_type||'—'):'—')+'</div><div class="stat-label">🔗 最强连接类型</div><div style="font-size:.68em;color:var(--ink-light);margin-top:2px">'+(strongest?escH(strongest.description||''):'待激活')+'</div></div>';
  h+='</div>';
  // 诚实标注
  h+='<div style="margin:8px 0 16px;padding:8px 14px;background:var(--warm);border-radius:8px;font-size:.78em;color:var(--ink-light)">📌 <b>网络状态</b>：'+avs.length+' 位替身已定义但 all activation_count=0 —— 替身尚未被实际调用。文档已定义协作关系矩阵(expert_team_manifest.md 第五节)，包含 L0图腾↔L2专家/L3工具 之间的协作映射。真实协作数据将在替身被激活后经由连接引擎动态生成。</div>';
  // L2 按tier分组展示替身协作关系
  for(var ti=0;ti<tierKeys.length;ti++){
    var tk=tierKeys[ti],group=tiers[tk];
    var tierIcon=tk==='L0图腾'?'👑':(tk==='L2专家'?'🎓':(tk==='L3工具'?'🔧':(tk==='L3独立审计'?'🛡️':'👤')));
    var tierColor=tk==='L0图腾'?'var(--red)':(tk==='L2专家'?'var(--gold)':(tk==='L3独立审计'?'var(--red)':'var(--green)'));
    h+='<div class="immune-layer" style="border-left-color:'+tierColor+';margin-bottom:12px"><h4>'+tierIcon+' '+escH(tk)+' ('+group.length+'位)</h4>';
    h+='<div class="conn-list">';
    for(var gi=0;gi<group.length;gi++){
      var g=group[gi];
      // 查该替身的连接
      var gConns=[];
      for(var gc=0;gc<avatarConns.length;gc++){
        if(avatarConns[gc].from_entity===g.id||avatarConns[gc].to_entity===g.id)gConns.push(avatarConns[gc]);
      }
      var connTypes=[];
      for(var ct=0;ct<gConns.length;ct++){
        var rt=gConns[ct].relationship_type||'';
        if(connTypes.indexOf(rt)<0)connTypes.push(rt);
      }
      var elColor=g.element==='金'?'#B8860B':(g.element==='木'?'#3D7A4F':(g.element==='水'?'#4A90D9':(g.element==='火'?'#C23B22':(g.element==='土'?'#8B7355':'#B8A890'))));
      h+='<div class="conn-chip" onclick="toggleDetail(\'pnet-'+ti+'-'+gi+'\')" style="cursor:pointer;position:relative">';
      h+='<span style="font-weight:600;color:'+elColor+'">'+escH(g.name)+'</span>';
      h+='<span style="font-size:.65em;color:var(--ink-lighter)">'+escH(g.element||'—')+'</span>';
      h+='<span class="edge-type">'+gConns.length+'连接</span>';
      h+='</div>';
      h+='<div class="detail-row" id="pnet-'+ti+'-'+gi+'" style="display:none;flex-basis:100%;margin:4px 0;padding:6px 10px;background:var(--card);border-radius:6px;font-size:.73em">';
      h+='<div><b>'+escH(g.name)+'</b> · '+escH(g.dimension||'—')+' · '+escH(g.element||'—')+' · '+(g.activation_count||0)+'次激活</div>';
      if(gConns.length){
        h+='<div style="color:var(--ink-light);margin-top:4px">'+gConns.slice(0,5).map(function(cn){
          var target=cn.from_entity===g.id?cn.to_entity:cn.from_entity;
          return '<div class="chip" style="font-size:.9em">'+escH(cn.relationship_type||'—')+' <span class="arrow">→</span> '+escH(target)+'</div>';
        }).join('')+'</div>';
      }else{
        h+='<div style="color:var(--ink-lighter)">暂无活跃连接 — 替身尚未被调用</div>';
      }
      h+='</div>';
    }
    h+='</div></div>';
  }
  // 协作矩阵定义 (基于expert_team_manifest.md第五节)
  h+='<div style="margin-top:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px">';
  h+='<h4 style="font-size:.85em;margin-bottom:8px">🗺️ 五层协作矩阵 (expert_team_manifest §5)</h4>';
  h+='<div style="font-size:.76em;color:var(--ink-light);line-height:1.8">';
  h+='<div>① <b>L0图腾 ↔ 人类决策者</b>：5位图腾(刘禹锡·司马贺·水月观音·孔子·六祖慧能)并行评审 → 加权评分 → 决议</div>';
  h+='<div>② <b>L0图腾 ↔ L2专家团</b>：10位专家按任务类型路由到专属图腾（可行域→代码/数据/项目/财务、信义观→内容/品牌、时间轴→研究/知识、身心流→运维/数据、直觉阈→创意）</div>';
  h+='<div>③ <b>L2专家团 ↔ L3工具方法</b>：Pre-Mortem→所有L2专家、RPS→风控相关、CT温度计→关系相关、元合伙→治理相关</div>';
  h+='<div>④ <b>L0图腾 ↔ L3工具</b>：时间轴→决策日志、可行域→五维简版、身心流→CT温度计、信义观→元合伙、直觉阈→Pre-Mortem</div>';
  h+='<div>⑤ <b>蓝军 ↔ 全体</b>：L3独立审计 平行运行，有权打断一次决策，不可连续打断两次</div>';
  h+='</div></div>';
  // 下一步计划
  h+='<div style="padding:24px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-top:24px">';
  h+='<div style="font-size:2em;margin-bottom:8px">📋</div>';
  h+='<div style="color:var(--ink-light);font-size:.85em">协作者网络激活计划：</div>';
  h+='<div style="color:var(--ink-lighter);font-size:.75em;margin-top:8px;text-align:left;max-width:500px;margin-left:auto;margin-right:auto">① Q3: 首批决策支持任务激活5位L0图腾<br>② Q3: L2专家团按需激活(代码/数据/内容首发)<br>③ Q4: L3工具方法随任务流程联动激活<br>④ Q4: 连接引擎动态更新协作关系图谱<br>⑤ 2027 Q1: 网络密度·影响力评分·协作模式聚类上线</div>';
  h+='</div>';
  return h;
};
