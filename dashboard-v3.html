<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意解 · 自我报告 V3</title>
<style>
/* ========== CSS 变量：满意解 VI 体系 ========== */
:root {
  --paper-white:      #F5F0E6;  /* 宣纸白·底色 */
  --card-white:        #FFFFFF;  /* 卡片白 */
  --card-warm:         #FAF6EF;  /* 暖白 */
  --ink:               #4A3728;  /* 墨色·正文 */
  --accent-red:        #C23B22;  /* 绀红·强调 */
  --accent-gold:       #B8860B;  /* 古铜金 */
  --border-warm:       #E0D5C8;  /* 暖边界 */
  --green-ok:          #3D7A4F;  /* 达标绿 */
  --amber-warn:        #C2780A;  /* 警示金 */
  --red-alert:         #C23B22;
  --ink-light:         #7A6958;
  --ink-lighter:       #A89880;
  --bg-warm:           #FBF8F2;
  --shadow-subtle:     rgba(74, 55, 40, 0.06);
  --shadow-medium:     rgba(74, 55, 40, 0.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--paper-white);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
}

/* ========== 密码门 ========== */
#gate {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; flex-direction: column; gap: 20px;
  background: var(--paper-white);
}
#gate .gate-logo {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent-red);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6em; font-weight: 300;
  margin-bottom: 8px;
}
#gate h1 { font-size: 2.2em; font-weight: 300; color: var(--ink); letter-spacing: 0.08em; }
#gate .subtitle { color: var(--ink-light); font-size: 0.95em; margin-bottom: 16px; }
#gate input {
  background: var(--card-white); border: 1px solid var(--border-warm);
  color: var(--ink); padding: 12px 20px; width: 260px; border-radius: 10px;
  font-size: 1.1em; text-align: center; outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
#gate input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.1); }
#gate button {
  background: var(--accent-red); color: #fff; border: none;
  padding: 11px 44px; border-radius: 10px; font-size: 1.05em;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.04em;
  font-weight: 500;
}
#gate button:hover { background: #A8351E; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(194,59,34,0.25); }
#gate .hint { color: var(--ink-lighter); font-size: 0.82em; }

/* ========== 应用主体 ========== */
#app { display:none; max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

/* ========== Header ========== */
.header { text-align: center; margin-bottom: 44px; padding-bottom: 28px; border-bottom: 1px solid var(--border-warm); }
.header h1 { font-size: 1.95em; font-weight: 300; letter-spacing: 0.06em; color: var(--ink); margin-bottom: 6px; }
.header h1 .accent { color: var(--accent-red); }
.header .dateline { color: var(--ink-light); font-size: 0.88em; letter-spacing: 0.04em; }
.header .countdown { margin-top: 6px; font-size: 0.82em; color: var(--accent-gold); }

/* ========== L0 · 生命体征条 ========== */
.vitals-bar { display: flex; gap: 10px; justify-content: center; margin-bottom: 44px; flex-wrap: wrap; }
.vital-dot {
  display: flex; align-items: center; gap: 8px;
  background: var(--card-white); border: 1px solid var(--border-warm);
  border-radius: 24px; padding: 9px 18px 9px 12px;
  transition: all 0.5s; box-shadow: var(--shadow-subtle);
}
.vital-dot:hover { border-color: var(--accent-gold); }
.vital-pulse { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
.vital-pulse.ok { background: var(--green-ok); color: var(--green-ok); }
.vital-pulse.warn { background: var(--amber-warn); color: var(--amber-warn); animation: pulse-warn 1.8s infinite; }
.vital-pulse.dead { background: var(--red-alert); color: var(--red-alert); animation: pulse-dead 0.6s infinite; }
@keyframes pulse-warn { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
@keyframes pulse-dead { 0%,100% { opacity:1; } 50% { opacity:0.15; } }
.vital-label { font-size: 0.84em; color: var(--ink-light); white-space: nowrap; }

/* ========== Section 标题 ========== */
.section-title {
  font-size: 1.1em; font-weight: 500; color: var(--accent-gold);
  margin-bottom: 16px; letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 10px;
}
.section-title::after { content:''; flex:1; height:1px; background: var(--border-warm); }

/* ========== L1 · 内稳态仪表卡 ========== */
.gauges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 48px; }
.gauge-card {
  background: var(--card-white); border: 1px solid var(--border-warm);
  border-radius: 14px; padding: 22px 18px;
  transition: border-color 0.3s, box-shadow 0.3s;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-subtle);
}
.gauge-card:hover { border-color: var(--accent-gold); box-shadow: var(--shadow-medium); }
.gauge-card .gauge-icon { font-size: 1.5em; margin-bottom: 8px; }
.gauge-card .gauge-name { font-size: 0.85em; color: var(--ink-light); margin-bottom: 4px; }
.gauge-card .gauge-name span { font-size: 0.85em; color: var(--ink-lighter); }
.gauge-card .gauge-value { font-size: 1.7em; font-weight: 300; letter-spacing: 0.03em; color: var(--ink); }
.gauge-card .gauge-bar-outer { height: 4px; background: var(--border-warm); border-radius: 2px; margin-top: 12px; overflow: hidden; }
.gauge-card .gauge-bar-inner { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.gauge-card .gauge-status { font-size: 0.78em; margin-top: 8px; color: var(--ink-light); }
.gauge-card.compliant { border-left: 3px solid var(--green-ok); }
.gauge-card.compliant .gauge-bar-inner { background: var(--green-ok); }
.gauge-card.deviation { border-left: 3px solid var(--amber-warn); }
.gauge-card.deviation .gauge-bar-inner { background: var(--amber-warn); }
.gauge-card.critical { border-left: 3px solid var(--red-alert); }
.gauge-card.critical .gauge-bar-inner { background: var(--red-alert); }

/* ========== L1 · 快速概览卡片 ========== */
.overview-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 14px; margin-bottom: 48px; }
.overview-card {
  background: var(--card-white); border: 1px solid var(--border-warm);
  border-radius: 12px; padding: 22px 18px; text-align: center;
  box-shadow: var(--shadow-subtle); transition: border-color 0.3s;
}
.overview-card:hover { border-color: var(--accent-gold); }
.overview-card .ov-number { font-size: 2.2em; font-weight: 300; letter-spacing: 0.02em; color: var(--ink); }
.overview-card .ov-label { font-size: 0.84em; color: var(--ink-light); margin-top: 4px; }
.overview-card .ov-sub { font-size: 0.76em; color: var(--ink-lighter); margin-top: 8px; }
.overview-card.featured { border-color: var(--accent-gold); background: var(--card-warm); }
.family-chips { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.family-chip {
  font-size: 0.72em; padding: 2px 8px; border-radius: 10px;
  background: var(--card-white); border: 1px solid var(--border-warm);
  color: var(--ink-light);
}

/* ========== L2 · 产品资产 ========== */
.product-section { margin-bottom: 48px; }
.family-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.family-filter-btn {
  background: var(--card-white); border: 1px solid var(--border-warm);
  color: var(--ink-light); padding: 6px 16px; border-radius: 20px;
  font-size: 0.82em; cursor: pointer; transition: all 0.2s;
  letter-spacing: 0.03em;
}
.family-filter-btn:hover { border-color: var(--accent-gold); color: var(--ink); }
.family-filter-btn.active { background: var(--accent-gold); color: #fff; border-color: var(--accent-gold); }

/* 展开详情表 */
.detail-table-wrap { display:none; background: var(--card-white); border: 1px solid var(--border-warm); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-subtle); margin-top: 12px; }
.detail-table-wrap.show { display:block; }
.detail-table { width:100%; border-collapse:collapse; font-size:0.88em; }
.detail-table thead { background: var(--card-warm); }
.detail-table th { text-align:left; padding:12px 14px; color: var(--ink-light); font-weight:500; font-size:0.82em; letter-spacing:0.03em; border-bottom:1px solid var(--border-warm); }
.detail-table td { padding:10px 14px; border-bottom:1px solid var(--border-warm); color: var(--ink); }
.detail-table tbody tr:hover { background: var(--card-warm); }
.detail-table tbody tr:last-child td { border-bottom:none; }
.detail-table .check-col { width:42px; text-align:center; }
.detail-table .check-col input[type=checkbox] { width:16px; height:16px; accent-color: var(--accent-red); cursor:pointer; }
.detail-table .prod-link { color: var(--accent-red); text-decoration:none; font-weight:500; transition:color 0.2s; }
.detail-table .prod-link:hover { color: var(--accent-gold); text-decoration:underline; }
.detail-table .family-badge {
  display:inline-block; padding:2px 10px; border-radius:10px;
  font-size:0.8em; font-weight:500;
}
.family-badge.mirror { background: rgba(184,134,11,0.12); color: var(--accent-gold); }
.family-badge.scale { background: rgba(61,122,79,0.12); color: var(--green-ok); }
.family-badge.contract { background: rgba(194,59,34,0.08); color: var(--accent-red); }
.family-badge.sense { background: rgba(74,55,40,0.08); color: var(--ink); }
.family-badge.other { background: rgba(168,152,128,0.12); color: var(--ink-lighter); }
.maturity-badge { font-size:0.78em; color: var(--ink-lighter); }
.size-num { font-variant-numeric:tabular-nums; color: var(--ink-light); font-size:0.82em; }

/* 对比按钮 */
.compare-actions { display:none; align-items:center; gap:12px; margin-top:14px; padding:12px 16px; background: var(--card-warm); border:1px solid var(--border-warm); border-radius:10px; }
.compare-actions.show { display:flex; }
.compare-actions .compare-count { color: var(--accent-red); font-weight:600; }
.btn-compare {
  background: var(--accent-red); color:#fff; border:none;
  padding:8px 24px; border-radius:8px; cursor:pointer;
  font-size:0.88em; font-weight:500; letter-spacing:0.03em;
  transition: all 0.2s;
}
.btn-compare:hover { background:#A8351E; }
.btn-compare:disabled { background: var(--ink-lighter); cursor:not-allowed; }

/* ========== L3 · 组合比对面板 ========== */
.compare-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(74,55,40,0.4); z-index:100; align-items:center; justify-content:center; }
.compare-overlay.show { display:flex; }
.compare-panel {
  background: var(--card-white); border-radius:18px;
  max-width:820px; width:92%; max-height:85vh; overflow-y:auto;
  padding:32px 28px; position:relative;
  box-shadow: 0 20px 60px rgba(74,55,40,0.2);
}
.compare-panel h3 { font-size:1.2em; font-weight:500; color: var(--ink); margin-bottom:8px; letter-spacing:0.04em; }
.compare-panel .compare-subtitle { color: var(--ink-light); font-size:0.82em; margin-bottom:24px; }
.compare-close {
  position:absolute; top:16px; right:20px;
  background:none; border:none; color: var(--ink-light);
  font-size:1.6em; cursor:pointer; padding:4px 10px; border-radius:8px;
  transition: all 0.2s;
}
.compare-close:hover { background: var(--card-warm); color: var(--accent-red); }

/* 比对表格 */
.compare-table { width:100%; border-collapse:collapse; margin-bottom:28px; font-size:0.88em; }
.compare-table th { text-align:left; padding:12px 14px; background: var(--card-warm); border-bottom:2px solid var(--border-warm); color: var(--ink-light); font-weight:500; font-size:0.82em; letter-spacing:0.03em; }
.compare-table th:first-child { border-radius:10px 0 0 0; }
.compare-table th:last-child { border-radius:0 10px 0 0; }
.compare-table td { padding:12px 14px; border-bottom:1px solid var(--border-warm); color: var(--ink); }
.compare-table td:first-child { font-weight:500; }
.compare-table .comp-divider { color: var(--ink-lighter); padding:0 8px; }

/* 五族柱状图 */
.compare-chart { margin-bottom:16px; }
.compare-chart h4 { font-size:0.9em; font-weight:500; color: var(--ink-light); margin-bottom:14px; }
.bar-row { display:flex; align-items:center; margin-bottom:8px; gap:10px; }
.bar-label { width:48px; text-align:right; font-size:0.84em; color: var(--ink-light); flex-shrink:0; }
.bar-track { flex:1; height:28px; background: var(--card-warm); border-radius:6px; overflow:hidden; position:relative; }
.bar-fill { height:100%; border-radius:6px; transition:width 0.5s ease; display:flex; align-items:center; padding-left:10px; font-size:0.76em; color:#fff; min-width:0; }
.bar-fill._mirror { background: var(--accent-gold); }
.bar-fill._scale { background: var(--green-ok); }
.bar-fill._contract { background: var(--accent-red); }
.bar-fill._sense { background: var(--ink); }
.bar-fill._other { background: var(--ink-lighter); }
.bar-count { width:28px; text-align:center; font-size:0.84em; color: var(--ink-light); flex-shrink:0; font-variant-numeric:tabular-nums; }

/* ========== L2.5 · 🧠 产品大脑（左右脑+五维双光谱） ========== */
.brain-section { margin-bottom: 48px; }
.brain-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.brain-stat-card {
  background: var(--card-white); border: 1px solid var(--border-warm);
  border-radius: 12px; padding: 16px; text-align: center;
  box-shadow: var(--shadow-subtle); transition: border-color 0.2s;
}
.brain-stat-card:hover { border-color: var(--accent-gold); }
.brain-stat-card .stat-num { font-size: 2em; font-weight: 300; color: var(--ink); }
.brain-stat-card .stat-label { font-size: 0.78em; color: var(--ink-light); margin-top: 4px; }
.brain-stat-card.warn { border-left: 3px solid var(--amber-warn); }
.brain-stat-card.good { border-left: 3px solid var(--green-ok); }

.brain-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
@media (max-width: 600px) { .brain-grid { grid-template-columns: 1fr; } }

.brain-panel {
  background: var(--card-white); border: 1px solid var(--border-warm);
  border-radius: 14px; padding: 20px; box-shadow: var(--shadow-subtle);
}
.brain-panel h3 {
  font-size: 1em; font-weight: 500; color: var(--accent-gold);
  margin-bottom: 14px; letter-spacing: 0.03em;
}

/* 四象限散点图 */
.brain-scatter { position: relative; width: 100%; padding-bottom: 80%; background: var(--card-warm); border-radius: 10px; overflow: hidden; }
.brain-scatter svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

/* 五维雷达 Mini */
.radar-mini { display: flex; flex-direction: column; gap: 10px; }
.radar-bar-row { display: flex; align-items: center; gap: 8px; }
.radar-bar-label { width: 80px; font-size: 0.78em; color: var(--ink-light); text-align: right; flex-shrink: 0; }
.radar-bar-track { flex: 1; height: 8px; background: var(--card-warm); border-radius: 4px; overflow: hidden; }
.radar-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.radar-bar-fill.earth { background: #A08060; }
.radar-bar-fill.metal { background: #C0C0C0; }
.radar-bar-fill.water { background: #6080A0; }
.radar-bar-fill.wood { background: #70A060; }
.radar-bar-fill.fire { background: var(--accent-red); }
.radar-bar-val { width: 36px; font-size: 0.78em; color: var(--ink); text-align: left; font-variant-numeric: tabular-nums; }

/* 象限分布条 */
.quad-dist { display: flex; gap: 2px; height: 24px; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
.quad-bar { height: 100%; transition: all 0.3s; }
.quad-bar:hover { filter: brightness(1.15); }
.quad-bar.q1 { background: #7B68EE; }
.quad-bar.q2 { background: #FF6B6B; }
.quad-bar.q3 { background: #DDD6C8; }
.quad-bar.q4 { background: #4A90D9; }
.quad-legend { display: flex; gap: 14px; font-size: 0.72em; color: var(--ink-light); flex-wrap: wrap; }
.quad-legend span { display: flex; align-items: center; gap: 4px; }
.quad-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* 失衡预警横幅 */
.brain-alert {
  padding: 12px 18px; border-radius: 10px; font-size: 0.82em; display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px;
}
.brain-alert.yellow { background: rgba(194,120,10,0.1); border: 1px solid rgba(194,120,10,0.3); color: #8A6010; }
.brain-alert.orange { background: rgba(194,59,34,0.08); border: 1px solid rgba(194,59,34,0.25); color: #A04020; }
.brain-alert.green { background: rgba(61,122,79,0.08); border: 1px solid rgba(61,122,79,0.25); color: #3D7A4F; }
.brain-alert .alert-icon { font-size: 1.3em; }

/* ========== L3 · 需要关注 ========== */
.attention-section { margin-bottom: 48px; }
.attention-item {
  background: var(--card-white); border: 1px solid var(--border-warm);
  border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
  display: flex; align-items: flex-start; gap: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow-subtle);
}
.attention-item:hover { border-color: var(--accent-gold); box-shadow: var(--shadow-medium); }
.attention-item.p0 { border-left: 3px solid var(--red-alert); }
.attention-item.p1 { border-left: 3px solid var(--amber-warn); }
.att-badge {
  font-size: 0.7em; font-weight: 600; padding: 3px 8px; border-radius: 4px;
  letter-spacing: 0.04em; white-space: nowrap; margin-top: 2px;
}
.att-badge.p0 { background: rgba(194,59,34,0.12); color: var(--red-alert); }
.att-badge.p1 { background: rgba(194,120,10,0.12); color: var(--amber-warn); }
.attention-item .att-body { flex: 1; }
.attention-item .att-title { font-size: 0.95em; margin-bottom: 2px; color: var(--ink); }
.attention-item .att-desc { font-size: 0.82em; color: var(--ink-light); }

/* ========== L4 · 活动日志 ========== */
.activity-section { margin-bottom: 20px; }
.log-item {
  display: flex; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--border-warm);
  font-size: 0.88em; align-items: flex-start;
}
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--ink-lighter); font-size:0.8em; white-space:nowrap; min-width: 54px; font-variant-numeric: tabular-nums; }
.log-icon { font-size: 1em; min-width: 26px; text-align: center; }
.log-msg { color: var(--ink-light); flex: 1; }

/* ========== Footer ========== */
.footer {
  text-align: center; padding-top: 28px; margin-top: 20px;
  border-top: 1px solid var(--border-warm);
  color: var(--ink-lighter); font-size: 0.78em; letter-spacing: 0.04em;
}
.footer .quote { font-style: italic; margin-top: 6px; color: var(--ink-light); }

/* === 快捷操作区 === */
.quick-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; padding:12px 0; border-bottom:1px solid var(--border-subtle); }
.quick-actions button { font-size:0.78em; padding:6px 14px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--card); color:var(--ink); cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.quick-actions button:hover { border-color:var(--gold); color:var(--red); background:var(--card-alt); }
/* 来源标注 */
.gauge-source,.ov-source { font-size:0.68em; color:var(--ink-lighter); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-subtle); display:none; }
.gauge-card.expanded .gauge-source,.overview-card.expanded .ov-source { display:block; }

/* ========== 按钮工具 ========== */
.btn-outline {
  background: var(--card-white); border: 1px solid var(--accent-gold);
  color: var(--accent-gold); padding: 8px 20px; border-radius: 8px;
  cursor: pointer; font-size: 0.88em; font-weight: 500;
  transition: all 0.2s; letter-spacing: 0.03em;
}
.btn-outline:hover { background: var(--accent-gold); color: #fff; }
.empty-state { color: var(--ink-lighter); font-style:italic; padding:16px; text-align:center; }

/* ========== 响应式 ========== */
@media (max-width: 600px) {
  #app { padding: 20px 12px 50px; }
  .vitals-bar { gap:6px; }
  .vital-dot { padding:6px 10px 6px 8px; font-size:0.76em; }
  .overview-cards { grid-template-columns: repeat(2, 1fr); }
  .gauges-grid { grid-template-columns: 1fr; }
  .detail-table { font-size:0.78em; }
  .detail-table th, .detail-table td { padding:8px 8px; }
  .compare-panel { padding:24px 16px; }
  .compare-table th, .compare-table td { padding:8px 8px; }
}
</style>
</head>
<body>

<!-- ==================== 密码门 ==================== -->
<div id="gate">
  <div class="gate-logo">红</div>

/* ========== 日期 + 夏至倒计时 ========== */

function renderDateline() {
  var n = new Date();
  var days = ['日','一','二','三','四','五','六'];
  var s = n.getFullYear() + '年' + (n.getMonth()+1) + '月' + n.getDate() + '日 · 周' + days[n.getDay()] + ' · ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  document.getElementById('dateline').textContent = s;
}

function renderCountdown() {
  var now = new Date();
  var year = now.getFullYear();
  // 夏至: 大约 6月21-22日，用 6月21日
  var solstice = new Date(year, 5, 21);
  if (now > solstice) solstice = new Date(year + 1, 5, 21);
  var diff = Math.ceil((solstice - now) / (1000 * 60 * 60 * 24));
  document.getElementById('countdown').textContent = '☀️ 距夏至还有 ' + diff + ' 天';
}

/* ========== L1 · 内稳态仪表卡 ========== */

function renderGauges() {
  var h = '';
  for (var i = 0; i < HO.length; i++) {
    var g = HO[i];
    var cls = g.compliant ? 'compliant' : (g.deviation === 'critical' ? 'critical' : 'deviation');
    var pct;
    if (g.id === 'last_full_sync') {
      pct = g.value;
    } else {
      pct = Math.min(100, Math.max(0, (g.value - g.min) / (g.max - g.min) * 100));
    }
    var valStr = g.value + g.unit;
    var statusText = g.compliant ? '✅ 达标' : '⚠️ ' + g.note;
    var srcText = g.source || (g.id==='product_count'?'扫描 site/ 目录':g.id==='customer_count'?'替身/客户/*.md':g.id==='file_scan_rate'?'data_init_pipeline.py':g.id==='cron_health'?'Cron系统API':g.id==='data_completeness'?'实体索引v1.0':g.id==='decision_backlog'?'驾驶舱PN列表':g.id==='last_full_sync'?'GitHub推送日志':'系统评估');
    h += '<div class="gauge-card ' + cls + '" onclick="this.classList.toggle(\'expanded\')" title="点击查看数据来源">';
    h += '<div class="gauge-icon">' + g.icon + '</div>';
    h += '<div class="gauge-name">' + g.name + ' <span>目标: ' + g.target + '</span></div>';
    h += '<div class="gauge-value">' + valStr + '</div>';
    h += '<div class="gauge-bar-outer"><div class="gauge-bar-inner" style="width:' + pct + '%"></div></div>';
    h += '<div class="gauge-status">' + statusText + '</div>';
    h += '<div class="gauge-source">📎 来源: ' + srcText + ' · ' + (g.updated||'实时') + '</div>';
    h += '</div>';
  }
  document.getElementById('gauges-grid').innerHTML = h;
}

function renderDetailRows() {
  var filtered = [];
  for (var i = 0; i < PD.length; i++) {
    if (currentFilter === '全部' || PD[i].family === currentFilter) {
      filtered.push(PD[i]);
    }
  }

  var h = '';
  for (var i = 0; i < filtered.length; i++) {
    var p = filtered[i];
    var checked = (selectedProducts.indexOf(p.name) >= 0) ? ' checked' : '';
    var familyCls = getFamilyClass(p.family);
    var sizeKB = Math.round(p.size / 1024 * 10) / 10;
    h += '<tr>';
    h += '<td class="check-col"><input type="checkbox"' + checked + ' onclick="toggleProductSelect(this, \'' + escAttr(p.name) + '\')"></td>';
    h += '<td>' + escHtml(p.name) + '</td>';
    h += '<td><span class="family-badge ' + familyCls + '">' + escHtml(p.family) + '</span></td>';
    h += '<td><span class="maturity-badge">' + escHtml(p.maturity) + '</span></td>';
    h += '<td><span class="size-num">' + sizeKB + ' KB</span></td>';
    h += '<td><a class="prod-link" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">打开 →</a></td>';
    h += '</tr>';
  }

  var tbody = document.getElementById('detail-tbody');
  if (tbody) tbody.innerHTML = h;
}

function getFamilyClass(family) {
  if (family === '镜') return 'mirror';
  if (family === '衡') return 'scale';
  if (family === '契') return 'contract';
  if (family === '觉') return 'sense';
  return 'other';
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function setFamilyFilter(btn, family) {
  currentFilter = family;
  // 更新按钮 active 状态
  var btns = document.querySelectorAll('#family-filters .family-filter-btn');
  for (var i = 0; i < btns.length; i++) {
    var text = btns[i].textContent;
    var fname = text.split(' (')[0];
    if (fname === family) {
      btns[i].classList.add('active');
    } else {
      btns[i].classList.remove('active');
    }
  }
  renderDetailRows();
}

function toggleDetailTable(btn) {
  detailVisible = !detailVisible;
  var wrap = document.getElementById('detail-table-wrap');
  if (wrap) {
    if (detailVisible) {
      wrap.classList.add('show');
    } else {
      wrap.classList.remove('show');
    }
  }
  btn.textContent = detailVisible ? '收起详情' : '展开详情表';
}

function toggleProductSelect(cb, name) {
  var idx = selectedProducts.indexOf(name);
  if (cb.checked && idx < 0) {
    selectedProducts.push(name);
  } else if (!cb.checked && idx >= 0) {
    selectedProducts.splice(idx, 1);
  }
  updateCompareBar();
}

function updateCompareBar() {
  var bar = document.getElementById('compare-actions');
  var countEl = document.getElementById('compare-count');
  var btn = document.getElementById('btn-compare');
  if (!bar || !countEl || !btn) return;

  countEl.textContent = selectedProducts.length;

  if (selectedProducts.length >= 2) {
    bar.classList.add('show');
    btn.disabled = false;
  } else {
    bar.classList.add('show');
    btn.disabled = true;
  }

  if (selectedProducts.length === 0 && !detailVisible) {
    bar.classList.remove('show');
  }
}

function clearSelection(btn) {
  selectedProducts = [];
  // 取消所有 checkbox
  var cbs = document.querySelectorAll('#detail-tbody input[type=checkbox]');
  for (var i = 0; i < cbs.length; i++) {
    cbs[i].checked = false;
  }
  updateCompareBar();
}

/* ================================================================
   L3 · 组合比对
   ================================================================ */

function openCompare(btn) {
  if (selectedProducts.length < 2) return;
  if (selectedProducts.length > 5) {
    alert('最多选择 5 个产品进行对比');
    return;
  }

  // 找到选中的产品对象
  var compareItems = [];
  for (var i = 0; i < selectedProducts.length; i++) {
    for (var j = 0; j < PD.length; j++) {
      if (PD[j].name === selectedProducts[i]) {
        compareItems.push(PD[j]);
        break;
      }
    }
  }

  // 构建对比面板
  var h = '';
  h += '<h3>🔍 组合比对</h3>';
  h += '<p class="compare-subtitle">' + compareItems.length + ' 个产品并排对比</p>';
  h += '<button class="compare-close" onclick="closeCompare(this)">✕</button>';

  // 对比表格
  h += '<table class="compare-table"><thead><tr>';
  h += '<th>维度</th>';
  for (var i = 0; i < compareItems.length; i++) {
    h += '<th>' + escHtml(compareItems[i].name) + '</th>';
  }
  h += '</tr></thead><tbody>';

  // 族
  h += '<tr><td>族</td>';
  for (var i = 0; i < compareItems.length; i++) {
    var fc = getFamilyClass(compareItems[i].family);
    h += '<td><span class="family-badge ' + fc + '">' + escHtml(compareItems[i].family) + '</span></td>';
  }
  h += '</tr>';

  // 成熟度
  h += '<tr><td>成熟度</td>';
  for (var i = 0; i < compareItems.length; i++) {
    h += '<td><span class="maturity-badge">' + escHtml(compareItems[i].maturity) + '</span></td>';
  }
  h += '</tr>';

  // 大小
  h += '<tr><td>大小</td>';
  for (var i = 0; i < compareItems.length; i++) {
    var skb = Math.round(compareItems[i].size / 1024 * 10) / 10;
    h += '<td><span class="size-num">' + skb + ' KB</span></td>';
  }
  h += '</tr>';

  // 链接
  h += '<tr><td>链接</td>';
  for (var i = 0; i < compareItems.length; i++) {
    h += '<td><a class="prod-link" href="' + escAttr(compareItems[i].url) + '" target="_blank" rel="noopener">打开 →</a></td>';
  }
  h += '</tr>';

  h += '</tbody></table>';

  // 五族分布柱状图
  h += '<div class="compare-chart">';
  h += '<h4>📊 五族分布（选中产品）</h4>';

  var familyDist = {};
  var allFamilies = ['镜','衡','契','觉'];
  for (var i = 0; i < allFamilies.length; i++) {
    familyDist[allFamilies[i]] = 0;
  }
  for (var i = 0; i < compareItems.length; i++) {
    var f = compareItems[i].family;
    if (familyDist[f] !== undefined) {
      familyDist[f]++;
    } else {
      familyDist[f] = 1;
      if (allFamilies.indexOf(f) < 0) allFamilies.push(f);
    }
  }

  var maxCount = 0;
  for (var i = 0; i < allFamilies.length; i++) {
    if (familyDist[allFamilies[i]] > maxCount) maxCount = familyDist[allFamilies[i]];
  }
  if (maxCount === 0) maxCount = 1;

  var barColors = { '镜': '_mirror', '衡': '_scale', '契': '_contract', '觉': '_sense' };

  for (var i = 0; i < allFamilies.length; i++) {
    var fam = allFamilies[i];
    var cnt = familyDist[fam];
    var barPct = cnt / maxCount * 100;
    var barCls = barColors[fam] || '_other';
    h += '<div class="bar-row">';
    h += '<span class="bar-label">' + fam + '</span>';
    h += '<div class="bar-track">';
    if (cnt > 0) {
      h += '<div class="bar-fill' + barCls + '" style="width:' + barPct + '%">' + cnt + '</div>';
    }
    h += '</div>';
    h += '<span class="bar-count">' + cnt + '</span>';
    h += '</div>';
  }

  h += '</div>';

  document.getElementById('compare-panel').innerHTML = h;
  document.getElementById('compare-overlay').classList.add('show');
}

function closeCompare(btn) {
  document.getElementById('compare-overlay').classList.remove('show');
}

// 点击遮罩层关闭
document.getElementById('compare-overlay').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('show');
  }
});

/* ========== L2.5 · 🧠 产品大脑 ========== */

// 从 entities_index.json 拉取 spectrum 汇总数据
var BRAIN_DATA = null;

function loadBrainData(callback) {
  if (BRAIN_DATA) { callback(BRAIN_DATA); return; }
  fetch('memory/_data/entities_index.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      BRAIN_DATA = d.meta && d.meta.spectrum_summary ? d.meta.spectrum_summary : null;
      callback(BRAIN_DATA);
    })
    .catch(function() {
      // 回退默认值
      BRAIN_DATA = {
        L_mean: 58.2, R_mean: 28.8, balance_score: 0.71, health_status: 'orange',
        quadrant_distribution: {'Ⅰ·全脑型': 15, 'Ⅱ·体验型': 9, 'Ⅲ·真空型': 2, 'Ⅳ·分析型': 289},
        five_elements_mean: {'土_时间轴': 59.7, '金_可行域': 56.7, '水_身心流': 25.3, '木_信义观': 43.1, '火_直觉阈': 32.2},
        products_evaluated: 315
      };
      callback(BRAIN_DATA);
    });
}

function renderBrain() {
  loadBrainData(function(sum) {
  if (!sum) return;
  
  var total = sum.products_evaluated || 315;
  var L = sum.L_mean, R = sum.R_mean;
  var diff = Math.abs(L - R);
  var quad = sum.quadrant_distribution;
  var fem = sum.five_elements_mean;

  // 预警横幅
  var h = '';
  var alertLevel = sum.health_status === 'green' ? 'green' : (diff > 20 ? 'orange' : 'yellow');
  var alertIcon = alertLevel === 'green' ? '✅' : '⚠️';
  var alertMsg = alertLevel === 'green' 
    ? '产品矩阵左右脑平衡，五维分布健康。'
    : (diff > 20 
      ? '产品矩阵显著左脑偏侧(L-R=' + diff.toFixed(1) + ')。右脑产品不足，建议增加体验型/创意型产品。'
      : '产品矩阵轻度左脑偏侧(L-R=' + diff.toFixed(1) + ')。关注右脑产品比例，向全脑平衡发展。');
  h += '<div class="brain-alert ' + alertLevel + '"><span class="alert-icon">' + alertIcon + '</span><span>' + alertMsg + '</span></div>';

  // 4张 stat-card
  h += '<div class="brain-stats">';
  h += '<div class="brain-stat-card good"><div class="stat-num">' + L.toFixed(1) + '</div><div class="stat-label">📐 左脑均值</div></div>';
  h += '<div class="brain-stat-card good"><div class="stat-num">' + R.toFixed(1) + '</div><div class="stat-label">🎨 右脑均值</div></div>';
  h += '<div class="brain-stat-card ' + (sum.balance_score >= 0.8 ? 'good' : 'warn') + '"><div class="stat-num">' + (sum.balance_score * 100).toFixed(0) + '%</div><div class="stat-label">⚖️ 平衡度</div></div>';
  h += '<div class="brain-stat-card ' + (diff > 20 ? 'warn' : 'good') + '"><div class="stat-num">' + diff.toFixed(1) + '</div><div class="stat-label">📏 L-R差距</div></div>';
  h += '</div>';

  // 两栏：象限分布 + 五维雷达
  h += '<div class="brain-grid">';
  
  // 左侧：象限分布
  h += '<div class="brain-panel"><h3>🧭 四象限产品分布</h3>';
  h += '<div class="quad-dist">';
  var qKeys = ['Ⅰ·全脑型', 'Ⅱ·体验型', 'Ⅲ·真空型', 'Ⅳ·分析型'];
  var qClasses = ['q1', 'q2', 'q3', 'q4'];
  var qIcons = ['🧠', '🎭', '📦', '🔬'];
  var qNames = ['全脑型', '体验型', '真空型', '分析型'];
  for (var qi = 0; qi < qKeys.length; qi++) {
    var qc = quad[qKeys[qi]] || 0;
    var qp = Math.round(qc / total * 100);
    if (qp > 0) h += '<div class="quad-bar ' + qClasses[qi] + '" style="width:' + qp + '%" title="' + qNames[qi] + ': ' + qc + '个 (' + qp + '%)"></div>';
  }
  h += '</div>';
  h += '<div class="quad-legend">';
  for (var qi = 0; qi < qKeys.length; qi++) {
    var qc = quad[qKeys[qi]] || 0;
    var qp = Math.round(qc / total * 100);
    h += '<span><span class="quad-dot" style="background:' + (qClasses[qi] === 'q1' ? '#7B68EE' : qClasses[qi] === 'q2' ? '#FF6B6B' : qClasses[qi] === 'q3' ? '#DDD6C8' : '#4A90D9') + '"></span> ' + qIcons[qi] + ' ' + qNames[qi] + ': ' + qc + ' (' + qp + '%)</span>';
  }
  h += '</div>';
  h += '</div>';

  // 右侧：五维均值雷达
  h += '<div class="brain-panel"><h3>📊 五维均值（全产品）</h3>';
  h += '<div class="radar-mini">';
  var dims = [
    {key: '土_时间轴', label: '🟫 土·时间轴', cls: 'earth', icon: '刘禹锡'},
    {key: '金_可行域', label: '⬜ 金·可行域', cls: 'metal', icon: '司马贺'},
    {key: '水_身心流', label: '🟦 水·身心流', cls: 'water', icon: '水月观音'},
    {key: '木_信义观', label: '🟩 木·信义观', cls: 'wood', icon: '孔子'},
    {key: '火_直觉阈', label: '🟥 火·直觉阈', cls: 'fire', icon: '慧能'}
  ];
  for (var di = 0; di < dims.length; di++) {
    var d = dims[di];
    var dv = fem[d.key] || 0;
    h += '<div class="radar-bar-row">';
    h += '<span class="radar-bar-label" title="' + d.icon + '">' + d.label + '</span>';
    h += '<div class="radar-bar-track"><div class="radar-bar-fill ' + d.cls + '" style="width:' + dv + '%"></div></div>';
    h += '<span class="radar-bar-val">' + dv.toFixed(1) + '</span>';
    h += '</div>';
  }
  h += '</div>';
  
  // 标注偏侧说明
  var leftElems = fem['金_可行域'] + fem['土_时间轴'];
  var rightElems = fem['水_身心流'] + fem['火_直觉阈'];
  h += '<div style="margin-top:14px;font-size:0.75em;color:var(--ink-light);text-align:center;">';
  h += '左脑力(金+土)=' + leftElems.toFixed(0) + ' · 右脑力(水+火)=' + rightElems.toFixed(0) + ' · 桥梁(木)=' + (fem['木_信义观'] || 0).toFixed(0);
  h += '</div>';
  h += '</div>';

  h += '</div>'; // brain-grid

  // v3.0 品质金字塔
  var qs = sum.quality_system;
  if (qs) {
    var tiers = qs.tier_distribution || {};
    h += '<div class="brain-panel" style="margin-bottom:20px"><h3>🏆 品质金字塔 v3.0</h3>';
    h += '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">';
    var tierData = [
      {label:'🏆精品',key:'🏆精品',color:'#C23B22',target:'≤30',desc:'12-Gate通过·Delighter·用户推荐'},
      {label:'⭐优质',key:'⭐优质',color:'#B8860B',target:'50-80',desc:'JTBD清晰·高完成度·缺少惊喜'},
      {label:'✅合格',key:'✅合格',color:'#6080A0',target:'50-80',desc:'基本可用·需补A门'},
      {label:'🌱原型',key:'🌱原型',color:'#AAA',target:'动态',desc:'概念验证·核心功能开发中'}
    ];
    var totalPyramid = (tiers['🏆精品']||0)+(tiers['⭐优质']||0)+(tiers['✅合格']||0)+(tiers['🌱原型']||0);
    for(var ti=0;ti<tierData.length;ti++){
      var td=tierData[ti];
      var cnt=tiers[td.key]||0;
      var pct=Math.round(cnt/totalPyramid*100);
      h += '<div style="display:flex;align-items:center;gap:8px;font-size:12px">';
      h += '<span style="width:60px;text-align:right">'+td.label+'</span>';
      h += '<div style="flex:1;height:8px;background:var(--card-warm);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+td.color+';border-radius:4px"></div></div>';
      h += '<span style="width:32px;text-align:right;font-weight:600;color:'+td.color+'">'+cnt+'</span>';
      h += '<span style="width:100px;font-size:10px;color:var(--ink-lighter)">'+td.desc+'</span>';
      h += '</div>';
    }
    h += '</div>';
    h += '<div style="font-size:10px;color:var(--ink-lighter);text-align:center">v3.0品质体系·四层金字塔+12-Gate+精品飞轮·"少即是多"</div>';
    h += '</div>';
  }

  document.getElementById('brain-section').innerHTML = h;
  }); // loadBrainData callback
}

/* ========== L3 · 需要关注 ========== */

function renderAttention() {
  var h = '';
  for (var i = 0; i < PN.length; i++) {
    var it = PN[i];
    h += '<div class="attention-item ' + it.priority.toLowerCase() + '">';
    h += '<span class="att-badge ' + it.priority.toLowerCase() + '">' + it.priority + '</span>';
    h += '<div class="att-body">';
    h += '<div class="att-title">' + escHtml(it.title) + '</div>';
    h += '<div class="att-desc">' + escHtml(it.desc) + '<br><small style="opacity:0.6">来源: ' + escHtml(it.source || '') + '</small></div>';
    h += '</div></div>';
  }
  document.getElementById('attention-section').innerHTML = h;
}

/* ========== L4 · 活动日志 ========== */

function renderActivity() {
  var h = '';
  for (var i = 0; i < AC.length; i++) {
    var a = AC[i];
    h += '<div class="log-item">';
    h += '<span class="log-time">' + escHtml(a.time) + '</span>';
    h += '<span class="log-icon">' + a.icon + '</span>';
    h += '<span class="log-msg">' + escHtml(a.msg) + '</span>';
    h += '</div>';
  }
  document.getElementById('activity-section').innerHTML = h;
}
