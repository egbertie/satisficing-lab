<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意红 · 自我报告</title>
<style>
:root {
  --sri-red: #C23B22; --sri-gold: #B8860B; --sri-bg: #F5F0E6;
  --bg-deep: #1a1410; --bg-card: #231e18; --bg-card-alt: #2a241c;
  --text-primary: #ede4d3; --text-secondary: #b8a88c; --text-muted: #8a7c6a;
  --border-subtle: #3a3228; --green-ok: #4caf50; --amber-warn: #d4980b;
  --red-alert: #c23b22; --pulse-glow: 0 0 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-deep);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(194,59,34,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(184,134,11,0.04) 0%, transparent 60%);
  color: var(--text-primary); min-height: 100vh; line-height: 1.6;
}
#gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 20px; }
#gate h1 { font-size: 2.2em; letter-spacing: 0.05em; font-weight: 300; }
#gate .subtitle { color: var(--text-muted); font-size: 0.95em; }
#gate input { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 12px 20px; width: 260px; border-radius: 8px; font-size: 1.1em; text-align: center; outline: none; transition: border-color 0.3s; }
#gate input:focus { border-color: var(--sri-gold); }
#gate button { background: var(--sri-red); color: #fff; border: none; padding: 10px 40px; border-radius: 8px; font-size: 1.05em; cursor: pointer; transition: all 0.2s; letter-spacing: 0.03em; }
#gate button:hover { background: #a8321d; transform: translateY(-1px); }
#gate .hint { color: var(--text-muted); font-size: 0.8em; }
#app { display: none; max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
.header { text-align: center; margin-bottom: 48px; padding-bottom: 32px; border-bottom: 1px solid var(--border-subtle); }
.header h1 { font-size: 2em; font-weight: 300; letter-spacing: 0.06em; margin-bottom: 6px; }
.header h1 .accent { color: var(--sri-red); }
.header .dateline { color: var(--text-muted); font-size: 0.85em; letter-spacing: 0.04em; }
.vitals-bar { display: flex; gap: 12px; justify-content: center; margin-bottom: 44px; flex-wrap: wrap; }
.vital-dot { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 8px 18px 8px 12px; transition: all 0.5s; }
.vital-pulse { width: 12px; height: 12px; border-radius: 50%; box-shadow: var(--pulse-glow) currentColor; }
.vital-pulse.ok { background: var(--green-ok); color: var(--green-ok); }
.vital-pulse.warn { background: var(--amber-warn); color: var(--amber-warn); animation: pulse-warn 1.8s infinite; }
.vital-pulse.dead { background: var(--red-alert); color: var(--red-alert); animation: pulse-dead 0.6s infinite; }
@keyframes pulse-warn { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
@keyframes pulse-dead { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
.vital-label { font-size: 0.85em; color: var(--text-secondary); white-space: nowrap; }
.section-title { font-size: 1.15em; font-weight: 500; color: var(--sri-gold); margin-bottom: 18px; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
.gauges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 44px; }
.gauge-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 20px 18px; transition: border-color 0.3s; position: relative; overflow: hidden; }
.gauge-card:hover { border-color: #5a4e38; }
.gauge-card .gauge-icon { font-size: 1.4em; margin-bottom: 8px; }
.gauge-card .gauge-name { font-size: 0.85em; color: var(--text-muted); margin-bottom: 4px; }
.gauge-card .gauge-value { font-size: 1.6em; font-weight: 300; letter-spacing: 0.03em; }
.gauge-card .gauge-bar-outer { height: 4px; background: var(--border-subtle); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.gauge-card .gauge-bar-inner { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.gauge-card .gauge-status { font-size: 0.78em; margin-top: 6px; color: var(--text-muted); }
.gauge-card.compliant { border-left: 3px solid var(--green-ok); }
.gauge-card.compliant .gauge-bar-inner { background: var(--green-ok); }
.gauge-card.deviation { border-left: 3px solid var(--amber-warn); }
.gauge-card.deviation .gauge-bar-inner { background: var(--amber-warn); }
.gauge-card.critical { border-left: 3px solid var(--red-alert); }
.gauge-card.critical .gauge-bar-inner { background: var(--red-alert); }
.overview-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 44px; }
.overview-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px 16px; text-align: center; }
.overview-card .ov-number { font-size: 2.2em; font-weight: 300; letter-spacing: 0.02em; color: var(--text-primary); }
.overview-card .ov-label { font-size: 0.82em; color: var(--text-muted); margin-top: 4px; }
.overview-card .ov-sub { font-size: 0.75em; color: var(--text-muted); margin-top: 8px; opacity: 0.7; }
.overview-card.featured { border-color: var(--sri-gold); background: var(--bg-card-alt); }
.family-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.family-chip { font-size: 0.72em; padding: 2px 8px; border-radius: 10px; background: var(--bg-card-alt); border: 1px solid var(--border-subtle); color: var(--text-muted); }
.attention-list { margin-bottom: 44px; }
.attention-item { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.2s; }
.attention-item:hover { border-color: #5a4e38; }
.attention-item.p0 { border-left: 3px solid var(--red-alert); }
.attention-item.p1 { border-left: 3px solid var(--amber-warn); }
.attention-item .att-badge { font-size: 0.7em; font-weight: 600; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.04em; white-space: nowrap; margin-top: 2px; }
.att-badge.p0 { background: rgba(194,59,34,0.2); color: var(--red-alert); }
.att-badge.p1 { background: rgba(212,152,11,0.2); color: var(--amber-warn); }
.attention-item .att-body { flex: 1; }
.attention-item .att-title { font-size: 0.95em; margin-bottom: 2px; }
.attention-item .att-desc { font-size: 0.8em; color: var(--text-muted); }
.activity-log { margin-bottom: 44px; }
.log-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(58,50,40,0.4); font-size: 0.88em; align-items: flex-start; }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text-muted); font-size: 0.78em; white-space: nowrap; min-width: 54px; font-variant-numeric: tabular-nums; }
.log-icon { font-size: 1em; min-width: 24px; text-align: center; }
.log-msg { color: var(--text-secondary); flex: 1; }
.footer { text-align: center; padding-top: 32px; margin-top: 20px; border-top: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.78em; letter-spacing: 0.04em; }
.footer .quote { font-style: italic; margin-top: 6px; opacity: 0.7; }
@media (max-width: 600px) {
  #app { padding: 24px 16px 60px; }
  .vitals-bar { gap: 8px; }
  .vital-dot { padding: 6px 12px 6px 10px; font-size: 0.8em; }
  .overview-cards { grid-template-columns: repeat(2, 1fr); }
  .gauges-grid { grid-template-columns: 1fr; }
}
</style>
</head>

  </div>
</div>
<script>
var PASSCODE='123654';
function unlock(btn){
  var inp=document.getElementById('pw');
  if(inp.value.trim()===PASSCODE){
    sessionStorage.setItem('sri_dash_v3_unlocked','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    initDashboard();
  }else{
    btn.textContent='&#x274C; 再试';
    btn.style.background='#5a2020';
    inp.value='';
    inp.focus();
    setTimeout(function(){btn.textContent='进入';btn.style.background='';},1200);
  }
}
(function(){
  if(sessionStorage.getItem('sri_dash_v3_unlocked')==='1'){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    initDashboard();
  }
})();

function initDashboard(){
  var data=loadData();
  if(!data){saveData(SEED);data=SEED;}
  renderDateline();
  renderVitals(data);
  renderGauges(data.homeostasis);
  renderOverview(data);
  renderAttention(data.pending);
  renderActivity(data.activity);
}
function loadData(){
  try{var r=localStorage.getItem('sri_dash_v3_data');if(r)return JSON.parse(r);}catch(e){}
  return null;
}
function saveData(data){
  try{localStorage.setItem('sri_dash_v3_data',JSON.stringify(data));}catch(e){}
}
function renderDateline(){
  var n=new Date();
  var days=['日','一','二','三','四','五','六'];
  var s=n.getFullYear()+'年'+String(n.getMonth()+1).padStart(2,'0')+'月'+String(n.getDate()).padStart(2,'0')+'日 · 周'+days[n.getDay()]+' · '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+' · 满意红在线';
  document.getElementById('dateline').textContent=s;
}
function renderVitals(data){
  var vs=[
    {label:'心脏',icon:'🫀',status:'ok',desc:'心跳正常'},
    {label:'大脑',icon:'🧠',status:'ok',desc:'认知在线'},
    {label:'消化',icon:'🔄',status:'ok',desc:'管道畅通'},
    {label:'免疫',icon:'🛡️',status:'warn',desc:'邮箱异常'},
    {label:'节律',icon:'🌓',status:'ok',desc:'Cron运行中'}
  ];
  var h='';
  for(var i=0;i<vs.length;i++){
    var v=vs[i];
    var cls=v.status==='ok'?'ok':(v.status==='dead'?'dead':'warn');
    h+='<div class="vital-dot"><span class="vital-pulse '+cls+'"></span><span class="vital-label">'+v.icon+' '+v.label+' · '+v.desc+'</span></div>';
  }
  document.getElementById('vitals-bar').innerHTML=h;
}
function renderGauges(ho){
  if(!ho||ho.length===0){
    document.getElementById('gauges-grid').innerHTML='<div class="empty-state">内稳态数据未加载 — 我还在学习看清自己</div>';
    return;
  }
  var h='';
  for(var i=0;i<ho.length;i++){
    var g=ho[i];
    var cls=g.compliant?'compliant':(g.deviation==='critical'?'critical':'deviation');
    var pct=Math.min(100,Math.max(0,(g.value-g.min)/(g.max-g.min)*100));
    if(g.id==='last_full_sync')pct=g.value;
    var valStr=g.value+g.unit;
    var statusText=g.compliant?'✅ 达标':'⚠️ '+g.note;
    h+='<div class="gauge-card '+cls+'">';
    h+='<div class="gauge-icon">'+g.icon+'</div>';
    h+='<div class="gauge-name">'+g.name+' <span style="color:var(--text-muted);font-size:0.8em">目标: '+g.target+'</span></div>';
    h+='<div class="gauge-value">'+valStr+'</div>';
    h+='<div class="gauge-bar-outer"><div class="gauge-bar-inner" style="width:'+pct+'%"></div></div>';
    h+='<div class="gauge-status">'+statusText+'</div>';
    h+='</div>';
  }
  document.getElementById('gauges-grid').innerHTML=h;
}
function renderOverview(data){
  var ps=data.products||[];
  var cs=data.customers||[];
  var families={};
  for(var i=0;i<ps.length;i++){
    var f=ps[i].family;
    families[f]=(families[f]||0)+1;
  }
  var totalSize=0;
  for(var i=0;i<ps.length;i++)totalSize+=ps[i].size;
  var avgSize=Math.round(totalSize/ps.length/1024*10)/10;
  var h='';
  h+='<div class="overview-card featured"><div class="ov-number">'+ps.length+'</div><div class="ov-label">📦 产品</div>';
  h+='<div class="family-chips">';
  var fks=Object.keys(families);
  for(var i=0;i<fks.length;i++){
    h+='<span class="family-chip">'+fks[i]+' ×'+families[fks[i]]+'</span>';
  }
  h+='</div></div>';
  h+='<div class="overview-card"><div class="ov-number">'+cs.length+'</div><div class="ov-label">👥 客户</div><div class="ov-sub">全部处于画像阶段</div></div>';
  h+='<div class="overview-card"><div class="ov-number">13</div><div class="ov-label">⏱️ Cron任务</div><div class="ov-sub">2个异常 · 11个正常</div></div>';
  h+='<div class="overview-card"><div class="ov-number">35<span style="font-size:0.5em;opacity:0.6">%</span></div><div class="ov-label">🧩 数据完整度</div><div class="ov-sub">我还在学习看清自己</div></div>';
  h+='<div class="overview-card"><div class="ov-number">'+avgSize+'<span style="font-size:0.5em;opacity:0.6">KB</span></div><div class="ov-label">📐 产品均尺寸</div><div class="ov-sub">总计 '+Math.round(totalSize/1024*10)/10+'KB</div></div>';
  h+='<div class="overview-card featured"><div class="ov-number">5.5<span style="font-size:0.5em;opacity:0.6">%</span></div><div class="ov-label">🔍 文件扫描率</div><div class="ov-sub">853 / 15,606 文件</div></div>';
  document.getElementById('overview-cards').innerHTML=h;
}
function renderAttention(items){
  if(!items||items.length===0){
    document.getElementById('attention-list').innerHTML='<div class="empty-state">✨ 暂无需要关注的事项 — 一切平稳</div>';
    return;
  }
  var h='';
  for(var i=0;i<items.length;i++){
    var it=items[i];
    h+='<div class="attention-item '+it.priority.toLowerCase()+'">';
    h+='<span class="att-badge '+it.priority.toLowerCase()+'">'+it.priority+'</span>';
    h+='<div class="att-body">';
    h+='<div class="att-title">'+it.title+'</div>';
    h+='<div class="att-desc">'+it.desc+'<br><small style="opacity:0.6">来源: '+(it.source||'')+'</small></div>';
    h+='</div></div>';
  }
  document.getElementById('attention-list').innerHTML=h;
}
function renderActivity(items){
  if(!items||items.length===0){
    document.getElementById('activity-log').innerHTML='<div class="empty-state">📭 暂无活动记录</div>';
    return;
  }
  var h='';
  for(var i=0;i<items.length;i++){
    var a=items[i];
    h+='<div class="log-item">';
    h+='<span class="log-time">'+a.time+'</span>';
    h+='<span class="log-icon">'+a.icon+'</span>';
    h+='<span class="log-msg">'+a.msg+'</span>';
    h+='</div>';
  }
  document.getElementById('activity-log').innerHTML=h;
}
</script>
