<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>章·传播·邮件|满意解研究所</title>
<style>
  :root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
  .hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}
  .hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}
  .article{max-width:600px;margin:0 auto;padding:24px 16px 40px;font-size:15px;line-height:2}
  .article h2{font-size:18px;color:var(--title-color);margin:24px 0 10px}
  .article h3{font-size:15px;color:var(--sri-red);margin:20px 0 8px}
  .article p{margin:8px 0}
  .article .quote{padding:12px 16px;margin:12px 0;border-left:3px solid var(--sri-red);font-style:italic;color:var(--sri-red);background:rgba(194,59,34,0.04);border-radius:0 8px 8px 0}
  .article .highlight{color:var(--sri-red);font-weight:600}
  .article ul{padding-left:20px}
  .article li{margin:6px 0;font-size:14px}
</style>
</head>
<body>
<div class="hero"><h1>✉️ 章·传播·邮件</h1><p>传播弹药库·商务邮件3封</p></div>
<div class="article"><h2>商务邮件合集·3封</h2>
<h3>邮件一：VC投后管理·合作邀请</h3><p>主题：帮你的被投企业降低合伙人失败风险。一句话：你投了钱，我们帮你保护这笔投资。附件：五维诊断简介+案例。</p>
<h3>邮件二：硬科技创始人·冷启动邮件</h3><p>主题：3分钟，看看你的合伙人决策健康度。一句话：我们做了个免费工具——不是因为"想卖东西"，是因为见过太多凌晨发"散了"的创始人。</p>
<h3>邮件三：老客户·复购提醒</h3><p>主题：你的团队温度计——该重新测了。一句话：上次测是3个月前。Gottman说每两周测一次。30秒。</p></div>
</body>
</html>
