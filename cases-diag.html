<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>案例库诊断</title>
  <meta name="description" content="满意解研究所 · 案例库诊断">
<style>
body{font-family:-apple-system,sans-serif;padding:20px;background:#F5F0E6}
button{padding:10px 20px;margin:4px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer;font-size:14px}
button.on{background:#C23B22;color:#fff}
.test{background:#fff;border-radius:12px;padding:16px;margin:12px 0;border:1px solid #e0d5c8}
.pass{color:green}.fail{color:red}
@media(max-width:480px){body{font-size:14px}}
</style>
</head>
<body>
<h1>🔧 案例库诊断页</h1>
<p>此页面逐步测试案例库的每个组件</p>

<div class="test"><h3>测试1: 按钮onclick</h3>
<button onclick="testAlert()">点击测试alert</button>
<span id="t1"></span></div>

<div class="test"><h3>测试2: this传参</h3>
<button class="fbtn" onclick="testThis('A', this)">测试A</button>
<button class="fbtn" onclick="testThis('B', this)">测试B</button>
<span id="t2"></span></div>

<div class="test"><h3>测试3: CASES数据</h3>
<button onclick="testData()">检查数据</button>
<span id="t3"></span></div>

<div class="test"><h3>测试4: 完整筛选流程</h3>
<button class="fbtn on" onclick="testFil('all',this)">全部</button>
<button class="fbtn" onclick="testFil('股权',this)">股权</button>
<button class="fbtn" onclick="testFil('退出',this)">退出</button>
<div id="t4"></div></div>

<script>
// 测试1: 最基础onclick
function testAlert(){document.getElementById('t1').innerHTML='<span class="pass">✅ onclick可以触发</span>';alert('onclick works!')}

// 测试2: this传参
function testThis(type,btn){
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  document.getElementById('t2').innerHTML='<span class="pass">✅ this传参正常: '+type+'</span>';
}

// 测试3: 数据
var CASES=[{id:1,name:'大疆',type:'涅槃'},{id:2,name:'比锐',type:'退出'}];
function testData(){
  document.getElementById('t3').innerHTML='<span class="pass">✅ 数据正常: '+CASES.length+'条</span>';
}

// 测试4: 完整流程
var AF='all';
function testFil(type,btn){
  AF=type;
  var bs=document.querySelectorAll('.fbtn');
  for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');
  btn.classList.add('on');
  var f=AF==='all'?CASES:CASES.filter(function(c){return c.type===AF});
  document.getElementById('t4').innerHTML='<span class="pass">✅ 筛选完成: '+type+' → '+f.length+'条</span>';
}
</script>
<p style="text-align:center;font-size:10px;opacity:0.35;padding:4px;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</p>

<div style="max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px">
  <div id="fbQ" style="color:#4A4A4A;font-weight:600;margin-bottom:10px">这个页面对你有用吗？</div>
  <div id="fbBtns" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px">
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'up');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">👍 有用</button>
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'text');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">💬 有建议</button>
  </div>
</div>


<p style="text-align:center;padding:10px;font-size:11px"><a href="go.html" style="color:#C23B22;text-decoration:none">← 返回决策通道</a></p>
</body>
</html>
