<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地驾驶舱 · 满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title:#2A2A2A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:linear-gradient(160deg,var(--sri-red),var(--sri-gold));color:#F5F0E6;padding:24px 20px;text-align:center}
.hero h1{font-size:20px;color:#F5F0E6}.hero p{font-size:12px;opacity:0.7}
.main{max-width:720px;margin:0 auto;padding:16px}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:12px;padding:12px;text-align:center;border:1px solid #D4C5A0}
.kpi-card .v{font-size:22px;font-weight:800;color:var(--sri-red)}.kpi-card .l{font-size:10px;color:var(--text);opacity:0.5}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab-btn{padding:8px 16px;border-radius:20px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:12px;font-weight:600}
.tab-btn.active{background:var(--sri-red);color:#fff;border-color:var(--sri-red)}

.panel{background:#fff;border-radius:14px;padding:16px;margin:8px 0;border:1px solid #D4C5A0}
.panel h3{font-size:14px;color:var(--title);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--sri-red);color:#fff;padding:6px 4px;text-align:left;font-size:10px}
td{padding:6px 4px;border-bottom:1px solid #f0e8d8}
tr:hover{background:rgba(194,59,34,0.03)}

.form-row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}
.form-row input,.form-row select{flex:1;padding:8px 10px;border:1.5px solid #D4C5A0;border-radius:8px;font-size:12px;min-width:100px}
.btn{padding:8px 18px;border-radius:16px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:var(--sri-red);color:#fff}
.btn-sm{padding:4px 12px;font-size:10px}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.dot-green{background:#3D7A4F}.dot-amber{background:var(--sri-gold)}.dot-red{background:var(--sri-red)}
</style>
<link rel="stylesheet" href="vi_quick_ref.css">
</head>
<body>
<a href="index.html" style="display:inline-block;padding:6px 14px;margin:8px 0 0 12px;font-size:12px;color:#C23B22;text-decoration:none;border:1px solid #C23B22;border-radius:6px">← 返回首页</a>

<div class="hero">
  <h1>📊 本地驾驶舱</h1>
  <p>SQLite · 本地部署 · 无需飞书 · API: localhost:8765</p>
</div>
<div class="main">

  <div class="kpi" id="kpiBar"></div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" onclick="switchTab('tasks')">📋 任务</button>
    <button class="tab-btn" onclick="switchTab('customers')">👤 客户</button>
    <button class="tab-btn" onclick="switchTab('passwords')">🔐 密码</button>
    <button class="tab-btn" onclick="switchTab('quality')">✅ 质量</button>
    <button class="tab-btn" onclick="switchTab('growth')">📈 增长</button>
    <button class="tab-btn" onclick="switchTab('logs')">📜 日志</button>
  </div>

  <div id="content"></div>
</div>

<script>
const API = 'http://localhost:8765/api';
let currentTab = 'tasks';

async function fetchAPI(endpoint) {
  let r = await fetch(`${API}/${endpoint}`);
  return r.json();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderTab();
}

async function renderTab() {
  let html = '';
  if (currentTab === 'tasks') {
    let data = await fetchAPI('tasks');
    html = `<div class="panel">
      <h3>📋 任务驾驶舱</h3>
      <div class="form-row">
        <input id="taskName" placeholder="任务名称">
        <select id="taskPri"><option>P0</option><option selected>P1</option><option>P2</option><option>P3</option></select>
        <input id="taskDeadline" type="date" style="max-width:130px">
        <button class="btn" onclick="addTask()">+ 添加</button>
      </div>
      <table><tr><th>任务</th><th>优先级</th><th>状态</th><th>截止</th><th>操作</th></tr>`;
    for (let t of data) {
      html += `<tr><td>${t.task||''}</td><td>${t.priority||''}</td><td><span class="status-dot ${t.status==='完成'?'dot-green':t.status==='进行中'?'dot-amber':'dot-red'}"></span>${t.status||''}</td><td>${t.deadline||''}</td><td><button class="btn btn-sm" onclick="updateTask(${t.id},'完成')">✓</button></td></tr>`;
    }
    html += '</table></div>';
  } else if (currentTab === 'customers') {
    let data = await fetchAPI('customers');
    html = `<div class="panel"><h3>👤 客户档案库</h3>
      <div class="form-row">
        <input id="custName" placeholder="姓名"><input id="custCompany" placeholder="企业">
        <input id="custEmail" placeholder="邮箱"><button class="btn" onclick="addCustomer()">+</button>
      </div>
      <table><tr><th>姓名</th><th>企业</th><th>邮箱</th><th>身份</th><th>行业</th><th>时间</th></tr>`;
    for (let c of data) {
      html += `<tr><td>${c.name||''}</td><td>${c.company||''}</td><td>${c.email||''}</td><td>${c.role||''}</td><td>${c.industry||''}</td><td>${(c.created_at||'').substring(0,10)}</td></tr>`;
    }
    html += '</table></div>';
  } else if (currentTab === 'passwords') {
    let data = await fetchAPI('passwords');
    html = `<div class="panel"><h3>🔐 授权密码管理</h3>
      <div class="form-row">
        <input id="pwdCode" placeholder="8位密码" maxlength="8"><input id="pwdCustomer" placeholder="绑定客户">
        <select id="pwdProd"><option value="all">全部产品</option><option value="assessment">衡·观局</option><option value="thermometer">镜·触温</option></select>
        <button class="btn" onclick="addPassword()">生成</button>
      </div>
      <table><tr><th>密码</th><th>产品</th><th>客户</th><th>次数(已用/最大)</th><th>状态</th></tr>`;
    for (let p of data) {
      html += `<tr><td><b>${p.code||'***'}</b></td><td>${p.products||''}</td><td>${p.customer||''}</td><td>${p.used||0}/${p.max_uses||9999}</td><td>${p.status||''}</td></tr>`;
    }
    html += '</table></div>';
  } else if (currentTab === 'quality') {
    let data = await fetchAPI('quality');
    html = `<div class="panel"><h3>✅ 质量仪表盘</h3>
      <table><tr><th>编号</th><th>模块</th><th>标准项</th><th>当前状态</th><th>负责方</th><th>截止</th><th>优先级</th></tr>`;
    for (let q of data) {
      html += `<tr><td>${q.qm_id||''}</td><td>${q.module||''}</td><td>${q.standard||''}</td><td>${q.current_status||''}</td><td>${q.assignee||''}</td><td>${q.deadline||''}</td><td>${q.priority||''}</td></tr>`;
    }
    html += '</table></div>';
  } else if (currentTab === 'growth') {
    let data = await fetchAPI('growth');
    html = `<div class="panel"><h3>📈 增长飞轮</h3>
      <table><tr><th>指标</th><th>当前值</th><th>目标值</th><th>趋势</th></tr>`;
    for (let g of data) {
      html += `<tr><td>${g.metric_name||''}</td><td><b>${g.current_value||''}</b></td><td>${g.target_value||''}</td><td>${g.trend||'—'}</td></tr>`;
    }
    html += '</table></div>';
  } else if (currentTab === 'logs') {
    let data = await fetchAPI('logs');
    html = `<div class="panel"><h3>📜 使用日志 (最近50条)</h3>
      <table><tr><th>页面</th><th>动作</th><th>数据</th><th>时间</th></tr>`;
    for (let l of data) {
      html += `<tr><td>${l.page||''}</td><td>${l.action||''}</td><td>${(l.data||'').substring(0,40)}</td><td>${(l.created_at||'').substring(10)}</td></tr>`;
    }
    html += '</table></div>';
  }
  document.getElementById('content').innerHTML = html;
}

// KPI
async function loadKPI() {
  let s = await fetchAPI('stats');
  document.getElementById('kpiBar').innerHTML = `
    <div class="kpi-card"><div class="v">${s.tasks}</div><div class="l">任务</div></div>
    <div class="kpi-card"><div class="v">${s.customers}</div><div class="l">客户</div></div>
    <div class="kpi-card"><div class="v">${s.products}</div><div class="l">产品</div></div>
    <div class="kpi-card"><div class="v">${s.passwords}</div><div class="l">密码</div></div>
    <div class="kpi-card"><div class="v">${s.quality_items}</div><div class="l">质量标准</div></div>
    <div class="kpi-card"><div class="v">${s.usage_today}</div><div class="l">今日使用</div></div>
    <div class="kpi-card"><div class="v">${s.flywheel_cycles}</div><div class="l">飞轮循环</div></div>
  `;
}

async function addTask() {
  let task = document.getElementById('taskName').value.trim();
  if(!task) return;
  await fetch(`${API}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    task:task, priority:document.getElementById('taskPri').value, deadline:document.getElementById('taskDeadline').value
  })});
  document.getElementById('taskName').value=''; renderTab(); loadKPI();
}

async function addCustomer() {
  let n=document.getElementById('custName').value.trim();
  if(!n) return;
  await fetch(`${API}/customers`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    name:n, company:document.getElementById('custCompany').value, email:document.getElementById('custEmail').value
  })});
  document.getElementById('custName').value=''; renderTab(); loadKPI();
}

async function addPassword() {
  let code=document.getElementById('pwdCode').value.trim();
  if(!code||code.length!==8) return alert('密码必须8位数字');
  await fetch(`${API}/passwords`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    code:code, customer:document.getElementById('pwdCustomer').value, products:document.getElementById('pwdProd').value
  })});
  document.getElementById('pwdCode').value=''; renderTab(); loadKPI();
}

async function updateTask(id, status) {
  await fetch(`${API}/tasks/update`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id, status:status})});
  renderTab();
}

loadKPI(); renderTab();
</script>
</body>
</html>
