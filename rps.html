<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPS风险剖面 · 三维风险评估</title>
<style>:root{--primary:#C23B22;--bg:#F5F0E6;--text:#4A4A4A;--heading:#2A2A2A;--border:#D4CFC5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;max-width:600px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:40px}
.header h1{color:var(--heading);font-size:1.8em;margin-bottom:8px}
h2{color:var(--heading);font-size:1.3em;margin:40px 0 20px;padding-bottom:8px;border-bottom:2px solid var(--primary)}
.question{margin-bottom:28px}
.question label{display:block;font-weight:600;color:var(--heading);margin-bottom:6px;font-size:1.02em}
.question .hint{font-size:0.82em;color:#888;margin-bottom:10px}
.scale{display:flex;justify-content:space-between;gap:4px}
.scale input[type="radio"]{display:none}
.scale label{flex:1;text-align:center;padding:8px 2px;border:2px solid var(--border);border-radius:6px;cursor:pointer;font-size:0.82em;transition:all 0.2s;background:white}
.scale label:hover{border-color:var(--primary)}
.scale input:checked+label{background:var(--primary);color:white;border-color:var(--primary);font-weight:600}
.btn{display:block;width:100%;padding:16px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer;margin:40px 0}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.result{display:none;padding:24px;background:white;border-radius:8px;margin-bottom:20px}
.result .section{text-align:center;padding:16px}
.result .section h3{color:var(--heading);margin-bottom:12px}
.result .section .score{font-size:3em;font-weight:700;color:var(--primary)}
.result .section .label{font-size:1.2em;margin:8px 0}
.matrix{margin:10px 0;padding:8px;border-radius:4px}
.matrix.green{background:#e8f5e9;border-left:3px solid #2e7d32}
.matrix.yellow{background:#fff3e0;border-left:3px solid #e65100}
.matrix.red{background:#ffebee;border-left:3px solid #c62828}
.footer{text-align:center;margin-top:40px;font-size:0.8em;color:#999}
.footer a{color:var(--primary);text-decoration:none}
.cta-box{text-align:center;margin-top:20px;padding:20px;background:white;border-radius:8px}
.cta-box a{color:var(--primary);font-weight:600}
</style><link rel="stylesheet" href="vi_quick_ref.css">
</head>
<script>
// 授权验证 - 满意解研究所
(function(){
  // Public pages - no auth needed
  var publicPages = ['go.html','index.html','about.html','privacy.html','terms.html','symbols.html',
    'creation.html','stars.html','roots.html','wulu.html','qijin.html','wings.html','eyes.html',
    '54days.html','fails.html','liang.html','treasure.html','farewell.html',
    'cases.html','tracks.html','lineage.html','whitepaper.html','quotes.html',
    'flywheel.html','fw-','bluearmy.html','opensource.html','hibernate.html','life.html','newcomer.html',
    'duanwei.html','bigrich.html','game-','blood-','media-','skill-','university.html',
    'report-demo.html','radar.html','chemical-report.html','proposal.html','gate.html',
    'miniapp-preview.html','cards.html'];
  
  var page = window.location.pathname.split('/').pop();
  
  // Check if this is a public page
  for (var i=0; i<publicPages.length; i++) {
    if (page === publicPages[i] || (publicPages[i].endsWith('-') && page.startsWith(publicPages[i]))) {
      return; // Public page - no auth needed
    }
  }
  
  // Protected page - check auth
  var auth = JSON.parse(localStorage.getItem('sri_auth') || '{}');
  if (!auth.valid || new Date().getTime() >= auth.expires) {
    // Not authenticated - redirect to gate
    var target = page;
    var productName = page.replace('.html','');
    window.location.href = 'gate.html?to=' + encodeURIComponent(target) + '&p=' + encodeURIComponent(productName);
  }
})();
</script>

<body>
<div class="hero" style="background:linear-gradient(135deg,#C23B22,#B8860B);color:#fff;padding:40px 24px 28px;text-align:center"><h1>风险剖面 RPS</h1><p style="font-size:14px;margin-top:6px">概率×影响×检测难度——三维看清你的合伙人风险</p><p style="font-size:12px;opacity:0.7;margin-top:4px">不是所有风险都要解决，但你必须知道最危险的是什么</p></div>

<form id="rps"><div id="questions"></div>
<button type="submit" class="btn" id="submitBtn" disabled>查看我的风险剖面</button></form>

<div id="results"></div>
<div class="footer"><a href="https://egbertie.github.io/satisficing-lab">满意解研究所</a> · 2026年夏至</div>

<script>
const DIMS = {
  tech:{name:'技术风险',emoji:'🔬',weight:0.35},
  market:{name:'市场风险',emoji:'📊',weight:0.20},
  finance:{name:'财务风险',emoji:'💰',weight:0.25},
  people:{name:'人才风险',emoji:'👥',weight:0.20}
};

const QUESTIONS = {
tech:[
  {q:'产品在技术验证(TRL 4)阶段你愿意立即向客户承诺交付期吗？',low:'必须TRL 7+才承诺',high:'TRL 3就可以承诺'},
  {q:'你愿意用一个未经验证的全新技术栈替代现有方案的50%吗？',low:'绝不，必须3个POC验证',high:'只要性能提升>2倍'},
  {q:'你愿意为技术突破把产品上市延迟多久？',low:'最多1个月',high:'只要做到行业第一，12个月+也可以'},
  {q:'探索性项目应占研发总预算的比例？',low:'0-5%',high:'>30%'},
  {q:'竞品宣布类似技术突破但细节未公开，你会？',low:'等论文/白皮书再评估',high:'立即投入加速'},
  {q:'核心科学家建议推翻过去2年积累改全新路线？',low:'必须6个月并行验证',high:'强信心就把主力调过去'},
  {q:'技术投资的"失败率"多少可接受？',low:'<10%',high:'40%概率成功就赌'},
  {q:'产品性能和交付速度之间？',low:'先上市再迭代',high:'做出行业最好再上市'}
],
market:[
  {q:'进入全新市场，你愿投入比例？',low:'不超过现有收入10%',high:'50%资源投入'},
  {q:'客户口头承诺"做出来就买"，无合同愿启动研发？',low:'必须签框架协议',high:'真诚即可'},
  {q:'愿为抢市场先机牺牲多少毛利？',low:'不接受牺牲',high:'可先亏50%+'},
  {q:'行业头部客户条件苛刻但拿下=标杆，愿投入？',low:'不超过收入15%',high:'亏损也要拿标杆'},
  {q:'新市场验证周期？',low:'12-18个月',high:'3-6个月没结果就转'},
  {q:'销售和市场数据不一致时信谁？',low:'数据A/B测试',high:'自己的判断'},
  {q:'先渠道验证还是先建直销？',low:'低成本渠道先验证',high:'先建直销抢机会'},
  {q:'市场判断信心来源？',low:'行业报告/咨询公司',high:'直觉和趋势判断'}
],
finance:[
  {q:'账上剩12个月现金，怎么做？',low:'收缩拉长到24个月',high:'加速投入6个月后融资'},
  {q:'愿用多少股权融资？',low:'每轮不超过10%',high:'30%也可以'},
  {q:'新项目最大亏损多少叫停？',low:'不超过20%超支',high:'可追加到3倍预算'},
  {q:'收入增长预期和burn rate关系？',low:'保守预期实际超是惊喜',high:'激进预期80%是正常'},
  {q:'接受对赌条款吗？',low:'不接受',high:'估值够高可接受'},
  {q:'现金流危机时第一反应？',low:'立即全面收缩',high:'判断后寻桥接资金'},
  {q:'合理资产负债率上限？',low:'<20%',high:'有增长机会60%+'},
  {q:'1000万闲置现金？',low:'保持安全垫',high:'全投增长'}
],
people:[
  {q:'招聘更看重稳定性还是潜力？',low:'稳定性+经验匹配',high:'潜力+学习能力'},
  {q:'为超级明星员工打破薪酬体系？',low:'不会',high:'会'},
  {q:'顶级贡献者但破坏文化？',low:'请他离开',high:'隔离保留'},
  {q:'年包是现在3倍但风险极高？',low:'不跳',high:'跳'},
  {q:'人才流失率容忍度？',low:'<10%',high:'核心5人稳定即可'},
  {q:'内部培养vs外部挖人？',low:'内部培养建梯队',high:'外部挖人快速提升'},
  {q:'核心合伙人跟不上发展？',low:'给时间资源保留权益',high:'调整角色或退出'},
  {q:'招聘节奏？',low:'有预算再扩招',high:'有势头时提前储备'}
]
};

let qhtml='';
for(const [dim,meta] of Object.entries(DIMS)){
  qhtml+=`<h2>${meta.emoji} ${meta.name}（8题）</h2>`;
  QUESTIONS[dim].forEach((q,i)=>{
    qhtml+=`<div class="question"><label>${i+1}. ${q.q}</label>
    <div class="hint">1 = ${q.low} | 5 = ${q.high}</div>
    <div class="scale" data-dim="${dim}" data-idx="${i}">`;
    for(let v=1;v<=5;v++) qhtml+=`<input type="radio" id="${dim}_${i}_${v}" name="${dim}_${i}" value="${v}"><label for="${dim}_${i}_${v}">${v}</label>`;
    qhtml+=`</div></div>`;
  });
}
document.getElementById('questions').innerHTML=qhtml;

const form=document.getElementById('rps');
const submitBtn=document.getElementById('submitBtn');
form.addEventListener('change',()=>{
  let all=0,answered=0;
  for(const dim of Object.keys(DIMS)){
    for(let i=0;i<8;i++){
      all++;
      if(form.querySelector(`input[name="${dim}_${i}"]:checked`)) answered++;
    }
  }
  submitBtn.disabled=answered<all;
});

form.addEventListener('submit',e=>{
  e.preventDefault();
  let scores={},html='',idx=0;
  for(const [dim,meta] of Object.entries(DIMS)){
    let sum=0;
    for(let i=0;i<8;i++){
      let v=parseInt(form.querySelector(`input[name="${dim}_${i}"]:checked`)?.value||3);
      sum+=v;
    }
    let avg=sum/8;
    let weighted=avg*meta.weight;
    let label=avg<=2?'保守型':avg<=2.8?'稳健型':avg<=3.5?'平衡型':avg<=4.2?'激进型':'极度激进型';
    let cls=avg>=3.6?'red':avg>=2.9?'yellow':'green';
    html+=`<div class="result"><div class="section"><h3>${meta.emoji} ${meta.name}</h3>
    <div class="score">${avg.toFixed(1)}</div><div class="label">${label}</div>
    <div class="matrix ${cls}">加权贡献: ${(weighted*25).toFixed(1)}/25 · 权重: ${(meta.weight*100).toFixed(0)}%</div></div></div>`;
    scores[dim]=avg;
  }
  let total=(scores.tech*0.35+scores.market*0.20+scores.finance*0.25+scores.people*0.20);
  let totalLabel=total<=2?'极度保守型':total<=2.8?'稳健派实干家':total<=3.5?'机会把握者':total<=4.2?'冒险家':'赌徒';
  html+=`<div class="result"><div class="section"><h3>📐 综合风险剖面</h3>
  <div class="score">${total.toFixed(1)}</div><div class="label">${totalLabel}</div></div></div>`;
  html+=`<div class="cta-box"><p>想看看你和合伙人的风险剖面差在哪？</p>
  <p><a href="https://egbertie.github.io/satisficing-lab/thermometer.html">先做一个30秒温度计 →</a></p>
  <p style="margin-top:12px;font-size:0.9em">或联系Egbertie预约完整版诊断</p></div>`;
  document.getElementById('results').innerHTML=html;
  form.style.display='none';
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
});
</script>
<div style="max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px;">
  <div id="fbQuestion" style="color:#4A4A4A;font-weight:600;margin-bottom:10px;">这个工具对你有用吗？</div>
  <div id="fbActions" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px;">
    <button onclick="submitFeedback('up')" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">👍</span>有用</button>
    <button onclick="showFeedbackText()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">💬</span>有建议</button>
  </div>
  <textarea id="fbText" style="display:none;width:100%;max-width:400px;height:60px;border:1.5px solid #D4C5A0;border-radius:10px;padding:10px;font-size:13px;font-family:inherit;background:#fff;margin:8px auto;resize:vertical;" placeholder="你的建议会帮我们改进..."></textarea>
  <button id="fbSubmit" style="display:none;padding:8px 18px;border-radius:20px;border:1.5px solid #C23B22;background:#fff;cursor:pointer;font-size:13px;color:#C23B22;font-weight:600;margin:4px auto;" onclick="submitFeedbackText()">发送反馈 →</button>
  <div id="fbThanks" style="display:none;color:#4A8C5C;font-weight:600;padding:8px;">收到！感谢你的反馈。</div>
  <div id="fbTally" style="font-size:11px;color:#999;margin-top:4px;"></div>
  <p style="font-size:10px;opacity:0.4;margin-top:8px;"><a href="go.html" style="color:inherit;">返回决策通道</a></p>
</div>
<script>
(function(){
  let page=location.pathname.split('/').pop()||'index';
  let key='sri_fb_'+page;
  let data=JSON.parse(localStorage.getItem(key)||'{}');
  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>


<script>
(function(){
  var toolName = location.pathname.split('/').pop().replace('.html','');
  localStorage.setItem('sri_last_use_'+toolName, Date.now().toString());
})();
</script>
