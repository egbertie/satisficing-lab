<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>镜·信号卡|压力信号识别卡|满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A;--border:#D4C5A0;--sri-green:#4A8C5C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}
.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}
.main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
.intro{text-align:center;font-size:14px;line-height:2;margin-bottom:20px}

.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
@media(max-width:400px){.signal-grid{grid-template-columns:1fr}}
.signal-card{background:#fff;border-radius:12px;padding:14px;cursor:pointer;border:2px solid #f0e8d8;transition:all 0.2s;text-align:center}
.signal-card:hover{border-color:var(--sri-gold)}
.signal-card.checked{background:rgba(194,59,34,0.04);border-color:var(--sri-red)}
.signal-card .s-emoji{font-size:24px;margin-bottom:4px}
.signal-card .s-name{font-size:13px;font-weight:600;color:var(--title-color)}
.signal-card .s-desc{font-size:11px;color:#999;margin-top:2px}

.stats-bar{display:flex;justify-content:center;gap:20px;padding:16px;background:#fff;border-radius:12px;margin-bottom:20px}
.stat-item{text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--sri-red)}
.stat-label{font-size:11px;color:#999}
.severity{text-align:center;padding:12px;background:rgba(184,134,11,0.06);border-radius:12px;font-size:14px;line-height:2;margin-bottom:16px;display:none}
.severity.show{display:block}
.btn-reset{padding:8px 20px;border-radius:18px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;margin-top:8px}

.back-link{text-align:center;padding:20px;font-size:11px;color:#999}
.back-link a{color:var(--sri-red);text-decoration:none}
.feedback-zone{max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px}
</style>

<script src="sri-track.js"></script>
<script src="sri-api.js"></script>
</head>
<body>
<div class="hero"><h1>🩺 镜·信号卡</h1><p>12张身体压力信号识别卡</p></div>
<div class="main">
  <p class="intro">逐项检查——你最近两周出现过哪些身体信号？<br><span style="color:var(--sri-red);font-weight:600">身体比大脑早6-12个月知道。</span></p>

  <div class="signal-grid" id="signalGrid"></div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="stat-num" id="signalCount">0</div><div class="stat-label">信号数</div></div>
    <div class="stat-item"><div class="stat-num" id="severityLevel">--</div><div class="stat-label">严重度</div></div>
  </div>
  <div class="severity" id="severityBox"></div>
  <div style="text-align:center"><button class="btn-reset" onclick="resetSignals()">清空重来</button></div>
</div>
<div class="back-link"><a href="go.html">← 返回决策通道</a></div>
<div class="feedback-zone">
  <div id="fbQuestion" style="color:#4A4A4A;font-weight:600;margin-bottom:10px;">这个工具对你有用吗？</div>
  <div id="fbActions" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px;">
    <button onclick="submitFeedback('up')" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">👍</span>有用</button>
    <button onclick="showFeedbackText()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">💬</span>有建议</button>
  </div>
  <textarea id="fbText" style="display:none;width:100%;max-width:400px;height:60px;border:1.5px solid #D4C5A0;border-radius:10px;padding:10px;font-size:13px;font-family:inherit;background:#fff;margin:8px auto;resize:vertical;" placeholder="你的建议会帮我们改进..."></textarea>
  <button id="fbSubmit" style="display:none;padding:8px 18px;border-radius:20px;border:1.5px solid #C23B22;background:#fff;cursor:pointer;font-size:13px;color:#C23B22;font-weight:600;margin:4px auto;" onclick="submitFeedbackText()">发送反馈 →</button>
  <div id="fbThanks" style="display:none;color:var(--sri-green);font-weight:600;padding:8px;">收到！感谢你的反馈。</div>
  <div id="fbTally" style="font-size:11px;color:#999;margin-top:4px;"></div>
</div>

<script>
var SIGNALS = [
  {emoji:'🦷', name:'咬牙/紧咬', desc:'睡觉或专注时无意识咬紧'},
  {emoji:'💓', name:'心跳加速', desc:'没有运动但心跳明显加快'},
  {emoji:'💧', name:'手心出汗', desc:'紧张或安静时手心湿润'},
  {emoji:'🤢', name:'胃紧/不适', desc:'胃部拧紧感或食欲变化'},
  {emoji:'🫁', name:'肩颈酸痛', desc:'肩膀不自觉耸起·脖子僵硬'},
  {emoji:'😤', name:'呼吸浅短', desc:'容易喘或感觉呼吸不深'},
  {emoji:'😴', name:'异常疲劳', desc:'睡了还是累·醒不过来'},
  {emoji:'🧠', name:'头脑空白', desc:'突然想不起要说什么'},
  {emoji:'👂', name:'耳鸣', desc:'安静时有嗡嗡声'},
  {emoji:'🦵', name:'腿不自主动', desc:'抖腿·脚趾扣地'},
  {emoji:'👄', name:'口干', desc:'经常觉得口干想喝水'},
  {emoji:'🥶', name:'手冷/脚冷', desc:'手脚冰凉但身体不冷'}
];

var SIG_KEY = '***';
var checked = {};

function loadSignals(){try{checked=JSON.parse(localStorage.getItem(SIG_KEY))||{};}catch(e){}}

function renderSignals(){
  var html = '';
  SIGNALS.forEach(function(s,i){
    var isChecked = !!checked[i];
    html += '<div class="signal-card'+(isChecked?' checked':'')+'" onclick="toggleSignal('+i+')">';
    html += '<div class="s-emoji">'+s.emoji+'</div>';
    html += '<div class="s-name">'+s.name+'</div>';
    html += '<div class="s-desc">'+s.desc+'</div>';
    html += '</div>';
  });
  document.getElementById('signalGrid').innerHTML = html;
  updateStats();
}

function toggleSignal(i){
  checked[i] = !checked[i];
  localStorage.setItem(SIG_KEY, JSON.stringify(checked));
  renderSignals();
}

function updateStats(){
  var count = Object.values(checked).filter(Boolean).length;
  document.getElementById('signalCount').textContent = count + '/12';

  var level = '';
  var box = document.getElementById('severityBox');
  if(count === 0){level = '--'; box.classList.remove('show');}
  else if(count <= 3){level = '🟢 轻度'; box.innerHTML = '你的身体在轻声说话。注意到就好了——不用急着做什么。'; box.classList.add('show');}
  else if(count <= 6){level = '🟡 中度'; box.innerHTML = '身体已经在提高音量了。考虑：今天能不能少做一件事？'; box.classList.add('show');}
  else if(count <= 9){level = '🟠 显著'; box.innerHTML = '身体的警报在响。建议：做一次Pre-0身体觉察，或者约个靠谱的人聊聊。'; box.classList.add('show');}
  else {level = '🔴 严重'; box.innerHTML = '你的身体在大声呼救。先停下来——身体不会说谎。去看看<a href="pre0.html" style="color:var(--sri-red);font-weight:600">Pre-0身体觉察 →</a>'; box.classList.add('show');}
  document.getElementById('severityLevel').textContent = level;
}

function resetSignals(){
  if(!confirm('清空所有信号记录？')) return;
  checked = {};
  localStorage.removeItem(SIG_KEY);
  renderSignals();
}

loadSignals();
renderSignals();

// feedback
(function(){
  let page=location.pathname.split('/').pop()||'index';
  let key='sri_fb_'+page;
  let data=JSON.parse(localStorage.getItem(key)||'{}');
  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>

<div style="text-align:center;padding:8px 0;font-size:10px;opacity:0.25;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</div>
</body>
</html>
