<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>章·案例·比锐|比锐精密对赌清算|满意解研究所</title><style>:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}.article{max-width:600px;margin:0 auto;padding:24px 16px 40px;font-size:15px;line-height:2}.article h2{font-size:18px;color:var(--title-color);margin:24px 0 10px}.article h3{font-size:15px;color:var(--sri-red);margin:20px 0 8px}.article p{margin:8px 0}.article .quote{padding:12px 16px;margin:12px 0;border-left:3px solid var(--sri-red);font-style:italic;color:var(--sri-red);background:rgba(194,59,34,0.04);border-radius:0 8px 8px 0}.article .highlight{color:var(--sri-red);font-weight:600}li{margin:6px 0;font-size:14px}ul{padding-left:20px}table{width:100%;font-size:12px;border-collapse:collapse;margin:12px 0}th{padding:6px;border-bottom:1px solid #D4C5A0;color:var(--sri-gold);text-align:left}td{padding:6px;border-bottom:1px solid #f0e8d8}</style></head><body><div class="hero"><h1>⚠️ 章·案例·比锐</h1><p>满意姐·案例脚本·比锐精密对赌清算</p></div><div class="article"><h2>比锐精密·对赌清算</h2><p>创始人签了对赌——如果明年收入不达预期的80%——两人共同承担无限连带责任。清算前一天才第一次认真看条款。</p><p>三个月后——对赌触发。五个月后——公司清算。</p><p><strong>五维诊断</strong>：<br>时间轴：如果一年前问自己——签这个对赌五年后回头看值不值？<br>可行域：对赌的"够用就好"线在哪里？无限连带责任越过了任何合理的底线。<br>信义观：对赌条款不是"激励"——是在两个合伙人之间埋了一颗定时炸弹。</p><p>Feld: <span class="highlight">"估值越高条款越危险。"</span></p>
<div class="quote">对赌不是"激励"——是"如果你失败，不只是公司失败，是你个人破产。"</div></div><p style="text-align:center;padding:20px;font-size:11px;color:#999"><a href="go.html" style="color:#C23B22;text-decoration:none">← 返回决策通道</a></p></body></html>
