<div class="article"><h2>寻根之旅·地点卡</h2><p>五路图腾的五个物理地点——每个地点是一张卡，一段故事，一种体验。</p>
<h3>五个地点</h3><p><strong>常德·司马楼</strong>（刘禹锡）：柳叶湖畔·"沉舟侧畔千帆过"<br><strong>卡内基梅隆</strong>（司马贺）：有限理性诞生的地方<br><strong>普陀山</strong>（观自在）：海边寺院·自在从容<br><strong>曲阜·杏坛</strong>（孔子）：儒商哲学的源头<br><strong>曹溪·南华寺</strong>（六祖慧能）："本来无一物"</p>
<p>满意姐在54天里走过这五个地方。她用身体丈量了五条通道。这些地点卡——是她在那些地方记录的所见、所感、所悟。</p>
<div class="quote">有些东西，不在书里。<br>在脚踩到那片土地的那一刻。<br>—— 满意姐·寻根之旅</div></div>
