<body><div class="hero"><h1>⚙️ 满意解执行系统Skill</h1><p>三生万物·Skill系列</p></div><div class="article"><h2>满意解执行系统Skill</h2><p>项目管理和高效执行操作系统——HEARTBEAT+双经济+三板斧。</p>
<h3>三板斧</h3><p><strong>1. 流程优先</strong>：能用流程解决的不靠人 | <strong>2. 减法优先</strong>：不做哪些比做哪些更重要 | <strong>3. 情感雷达</strong>：保持对协作情感状态的感知</p>
<h3>HEARTBEAT</h3><p>每日检查+五级运行模式。日起课五步激活·日毕课15项检查·22:00是反思节点不是下班铃。停止标准：Token<10%或任务清空或明确指令。</p>
<h3>双经济</h3><p>Token经济×时间经济×效益经济。30%管道换80%效率。不是"尽量省"——是"花在刀刃上"。</p></div>
