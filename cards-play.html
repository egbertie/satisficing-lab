<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合伙人决策卡牌 · 线上版 | 满意解研究所</title>
<style>
  :root {
    --sri-red: #C23B22; --sri-gold: #B8860B; --sri-bg: #F5F0E6;
    --text: #4A4A4A; --title: #2A2A2A; --border: #D4C5A0;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:var(--sri-bg); color:var(--text); min-height:100vh; }

  .app { max-width:480px; margin:0 auto; padding:0 0 40px; }

  /* Hero */
  .hero { background:linear-gradient(135deg,var(--sri-red),var(--sri-gold)); color:#F5F0E6; padding:36px 20px 28px; text-align:center; }
  .hero h1 { font-size:22px; font-weight:700; }
  .hero .sub { font-size:12px; opacity:0.85; margin-top:2px; }

  /* Deck Select */
  .deck-select { padding:20px 16px 12px; }
  .deck-select h2 { font-size:14px; color:var(--title); margin-bottom:12px; text-align:center; }
  .deck-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .deck-card { background:#fff; border:2px solid var(--border); border-radius:12px; padding:14px; text-align:center; cursor:pointer; transition:all 0.2s; }
  .deck-card:hover,.deck-card.active { border-color:var(--sri-red); }
  .deck-card .icon { font-size:32px; display:block; margin-bottom:4px; }
  .deck-card .name { font-size:14px; font-weight:700; color:var(--title); }
  .deck-card .count { font-size:11px; color:var(--sri-red); margin-top:2px; }

  /* Mode */
  .mode-select { padding:0 16px 16px; display:flex; gap:10px; }
  .mode-btn { flex:1; padding:12px; border:1.5px solid var(--border); border-radius:10px; background:#fff; text-align:center; cursor:pointer; font-size:13px; transition:all 0.2s; }
  .mode-btn.active { border-color:var(--sri-red); background:rgba(194,59,34,0.05); color:var(--sri-red); font-weight:600; }

  /* Game Board */
  .board { padding:0 16px; }
  .phase-badge { text-align:center; font-size:11px; color:var(--sri-gold); margin-bottom:10px; padding:4px 12px; background:rgba(184,134,11,0.1); border-radius:12px; display:inline-block; }
  
  .progress-bar { display:flex; gap:4px; justify-content:center; margin:12px 0; }
  .p-dot { width:8px; height:8px; border-radius:50%; background:var(--border); transition:0.3s; }
  .p-dot.done { background:var(--sri-red); }
  .p-dot.alert { background:var(--sri-gold); }
  .p-dot.current { transform:scale(1.4); border:2px solid var(--sri-red); background:transparent; }

  /* Card */
  .card-face { background:#fff; border-radius:16px; padding:24px 20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:2px solid var(--sri-red); position:relative; min-height:260px; }
  .card-type-badge { position:absolute; top:-1px; left:-1px; background:var(--sri-red); color:#F5F0E6; font-size:10px; padding:4px 12px; border-radius:14px 0 10px 0; font-weight:600; letter-spacing:1px; }
  .card-num { position:absolute; top:8px; right:14px; font-size:11px; color:var(--text); opacity:0.5; }
  .card-emoji { font-size:40px; text-align:center; margin:8px 0 4px; }
  .card-title { font-size:17px; font-weight:700; color:var(--title); text-align:center; margin-bottom:8px; }
  .card-scene { font-size:14px; color:var(--text); line-height:1.7; text-align:center; margin-bottom:14px; }
  
  .choices { display:flex; flex-direction:column; gap:8px; }
  .choice-btn { padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; background:#fff; font-size:13px; text-align:left; cursor:pointer; transition:all 0.2s; color:var(--text); }
  .choice-btn:hover,.choice-btn.chosen { border-color:var(--sri-red); background:rgba(194,59,34,0.04); }
  .choice-btn.best { border-color:#4A8C5C; background:rgba(74,140,92,0.05); }

  .insight { margin-top:12px; padding:10px 14px; background:rgba(194,59,34,0.04); border-radius:8px; font-size:12px; line-height:1.6; display:none; }
  .insight.show { display:block; }

  .card-controls { display:flex; gap:10px; margin-top:16px; justify-content:center; }
  .btn { padding:10px 22px; border:none; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:var(--sri-red); color:#F5F0E6; }
  .btn-outline { background:transparent; border:1.5px solid var(--sri-red); color:var(--sri-red); }
  .btn-ghost { background:transparent; color:var(--text); }
  .btn:active { opacity:0.8; }

  /* Result */
  .result-area { display:none; padding:20px 16px; }
  .result-area.show { display:block; }
  .result-card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); text-align:center; }
  .result-card h2 { font-size:20px; color:var(--title); margin-bottom:16px; }
  
  .score-badge { display:inline-block; font-size:24px; font-weight:800; padding:10px 28px; border-radius:14px; margin:12px 0; }
  .score-green { background:rgba(74,140,92,0.12); color:#4A8C5C; }
  .score-amber { background:rgba(184,134,11,0.12); color:#B8860B; }
  .score-red { background:rgba(194,59,34,0.12); color:var(--sri-red); }
  
  .conflict-list { text-align:left; margin-top:16px; }
  .conflict-item { padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .conflict-item .alert-icon { margin-right:6px; }

  .result-cta { margin-top:20px; display:flex; flex-direction:column; gap:8px; }
  .result-cta .btn { padding:12px 24px; font-size:14px; }

  .footer { text-align:center; padding:24px 16px; font-size:11px; color:#999; }
  .footer a { color:var(--sri-red); text-decoration:none; }
</style>

    'report-demo.html','radar.html','chemical-report.html','proposal.html','gate.html',
    'miniapp-preview.html','cards.html'];
  
  var page = window.location.pathname.split('/').pop();
  
  // Check if this is a public page
  for (var i=0; i<publicPages.length; i++) {
    if (page === publicPages[i] || (publicPages[i].endsWith('-') && page.startsWith(publicPages[i]))) {
      return; // Public page - no auth needed
    }
  }
  
  // Protected page - check auth
  var auth = JSON.parse(localStorage.getItem('sri_auth') || '{}');
  if (!auth.valid || new Date().getTime() >= auth.expires) {
    // Not authenticated - redirect to gate
    var target = page;
    var productName = page.replace('.html','');
    window.location.href = 'gate.html?to=' + encodeURIComponent(target) + '&p=' + encodeURIComponent(productName);
  }
})();

<script>
// ============ 52张卡牌数据集 ============
const ALL_CARDS = [
  // === 系列一: 核心冲突(7张) ===
  {id:1, type:"承诺", emoji:"🤝", title:"股权分配的第一句话", cat:"股权",
   scene:"你和合伙人第一次讨论股权。他说：'咱们五五开，公平。'你的直觉告诉你这不对——但你不知道怎么开口。",
   choices:["A. 同意——先做起来再说","B. 提出动态分配——按贡献调整","C. 转移话题——先不谈这个"],
   best:1, insight:"73%的创始人在首月选择静态分配（Wasserman·HBS）。'先做起来再说'是最常见的拖延策略——拖得越久，修正越难。", source:"Wasserman, Moyer"},
  
  {id:2, type:"冲突", emoji:"💢", title:"他改了你的方案", cat:"边界",
   scene:"周一晨会，你发现合伙人在你没参与的情况下，改了你主导的产品路线图。他在群里发了更新，但没跟你说。",

   best:0, insight:"Lencioni金字塔第二层：惧怕冲突。私下谈避免了公开对抗，但也意味着团队其他人不知道你们的分歧在哪。健康的冲突是公开的。", source:"Lencioni, Duke"},
  
  {id:3, type:"危机", emoji:"🔥", title:"投资人问你一个问题", cat:"角色",
   scene:"投资人问：'你们两个谁是最终决策者？'你看向合伙人。他没说话。投资人在等你回答。",
   choices:["A. '我们共同决策'","B. '我是CEO，最终决策在我'","C. 看向合伙人，让他回答"],
   best:1, insight:"Altman(YC): '坏合伙人 > 没合伙人'。投资人问的不是'谁说了算'——是'出了问题谁负责'。如果你不能当场回答，投资人看到的是治理结构缺失。", source:"Altman, Feld"},

  {id:4, type:"承诺", emoji:"📝", title:"竞业限制该不该签", cat:"协议",
   scene:"律师发来协议，竞业条款：离职后2年不能做同类业务。你觉得太长，又不想显得'不信任'。",

  {id:5, type:"冲突", emoji:"😶", title:"什么都不说了", cat:"虚假和谐",
   scene:"最近一个月，你们不再争论了。会议很'和谐'。但项目推进明显慢了。每次你想提敏感话题——看到他的表情，就咽回去了。",
   choices:["A. 继续等——等合适的时机","B. 约他喝咖啡——只说'我感觉我们之间有些东西没聊'","C. 用卡牌做媒介——'朋友推荐了一个游戏，一起试试？'"],
   best:1, insight:"Gottman: 冷漠是四骑士中最后出现的——也是最危险的。不是'关系好才不吵'——是'吵不动了所以不吵'。Lencioni: 虚假和谐是团队第一杀手。", source:"Gottman, Lencioni"},

  {id:6, type:"危机", emoji:"🌪️", title:"他在外面说你坏话", cat:"蔑视",
   scene:"共同朋友告诉你，合伙人在饭局上说：'项目都是我在扛，他只会画饼。'你听到后，心脏沉了一下。",
   choices:["A. 当面质问——'我听说你说过...'","B. 不提。但以后观察","C. 约正式谈话——'我听到一些话，想听听你的版本'"],
   best:2, insight:"Gottman发现：蔑视是关系解体的头号杀手（91%预测准确率）。他不是批评你做错了某件事——他在否定你这个人。用'我不知道这些是不是真的，所以来问你'开场。", source:"Gottman, Duke"},

  {id:7, type:"承诺", emoji:"💰", title:"估值3亿——他要更多", cat:"股权",

  {id:19, type:"训练", emoji:"🌳", title:"信义观·钱和原则怎么选", cat:"信义观",
   scene:"投资人给你两个选择：①保持独立性但估值低30%；②接受对赌条款但估值更高。合伙人力主接受——'先拿到钱再说'。",
   choices:["A. 接受对赌——'钱先到手'","B. 拒绝——'独立比估值重要'","C. '不是选A或B——是问：五年后，你愿意对别人说'我当时拿了那个对赌'吗？如果说不出口，对赌的条件是什么你才能说得出口？'"],
   best:2, insight:"孔子追问：钱和原则你选哪一个？不是'放弃原则'或'放弃利益'二选一——是'什么样的条件会让你的原则也能被尊重'。对赌本身没有错——但条件要对等。", source:"五路图腾·孔子(木)"},

  {id:20, type:"训练", emoji:"🔥", title:"直觉阈·心里那个声音", cat:"直觉阈",

   choices:["A. 签——'数据不会说谎'","B. 不签——'相信直觉'","C. '给我24小时。我做一件事：假设我签了——6个月后出问题了，最可能的3个原因是什么？再决定签不签'"],

  // === 系列二补充: 更多场景卡 ===

// ============ GAME ENGINE ============
let deckSize = 7, mode = 'solo', currentIdx = 0;
let gameCards = [], answered = {}, gameStarted = false;

function selectDeck(el, size) {
  document.querySelectorAll('.deck-card').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  deckSize = size;
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function shuffle(a) {
  let arr = [...a];
  for (let i=arr.length-1;i>0;i--) {
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function start() {
  currentIdx = 0; answered = {}; gameStarted = true;
  let n = deckSize === 'daily' ? 1 : deckSize;
  gameCards = shuffle(ALL_CARDS).slice(0, n);
  if (mode === 'duo' && gameCards.length > 1) {
    gameCards[1] = ALL_CARDS.find(c=>c.id===23) || gameCards[1]; // insert博弈card
  }
  
  document.getElementById('deckSelect').style.display = 'none';
  document.getElementById('modeSelect').style.display = 'none';
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('board').style.display = 'block';
  document.getElementById('resultArea').classList.remove('show');
  document.getElementById('resultArea').innerHTML = '';
  
  renderProgress();
  renderCard();
}

function renderProgress() {
  let html = '';
  for (let i=0;i<gameCards.length;i++) {
    let cls = 'p-dot';
    if (answered[gameCards[i].id] !== undefined) {
      cls += gameCards[i].best === answered[gameCards[i].id] ? ' done' : ' alert';
    }
    if (i === currentIdx) cls += ' current';
    html += `<div class="${cls}"></div>`;
  }
  document.getElementById('progressBar').innerHTML = html;
  document.getElementById('phaseBadge').textContent = `第${currentIdx+1}/${gameCards.length}张`;
}

function renderCard() {
  if (currentIdx >= gameCards.length) { showResult(); return; }
  
  let c = gameCards[currentIdx];
  let chosen = answered[c.id];
  
  let html = `<div class="card-type-badge">${c.type}卡</div>`;
  html += `<div class="card-num">#${c.id} · ${c.cat}</div>`;
  html += `<div class="card-emoji">${c.emoji}</div>`;
  html += `<div class="card-title">${c.title}</div>`;
  html += `<div class="card-scene">${c.scene}</div>`;
  html += `<div class="choices">`;
  c.choices.forEach((ch,i) => {
    let cls = 'choice-btn';
    if (chosen === i) cls += ' chosen';
    if (chosen !== undefined && i === c.best) cls += ' best';
    html += `<button class="${cls}" ${chosen!==undefined?'disabled':''} onclick="choose(${c.id},${i})">${ch}</button>`;
  });
  html += `</div>`;
  
  document.getElementById('cardFace').innerHTML = html;
  
  let insightEl = document.getElementById('insight');
  if (chosen !== undefined) {
    insightEl.innerHTML = `💡 ${c.insight}<br><span style="font-size:11px;opacity:0.7;">📚 ${c.source}</span>`;
    insightEl.classList.add('show');
  } else {
    insightEl.classList.remove('show');
  }
  
  let controls = '';
  if (currentIdx > 0) controls += '<button class="btn btn-ghost" onclick="prevCard()">◀ 上一张</button>';
  if (currentIdx < gameCards.length - 1) {
    controls += '<button class="btn btn-primary" onclick="nextCard()">下一张 ▶</button>';
  } else {
    controls += '<button class="btn btn-primary" onclick="nextCard()">查看结果 📊</button>';
  }
  document.getElementById('cardControls').innerHTML = controls;
  renderProgress();
}

function choose(cardId, idx) {
  answered[cardId] = idx;
  renderCard();
}

function nextCard() {
  if (answered[gameCards[currentIdx].id] === undefined) return; // must choose
  currentIdx++;
  if (currentIdx >= gameCards.length) showResult();
  else renderCard();
}

function prevCard() {
  if (currentIdx > 0) { currentIdx--; renderCard(); }
}

function showResult() {
  document.getElementById('board').style.display = 'none';
  let resultArea = document.getElementById('resultArea');
  resultArea.classList.add('show');
  
  let good=0, bad=0, conflicts=[];
  gameCards.forEach(c => {
    let chosen = answered[c.id];
    if (chosen === undefined) return;
    if (chosen === c.best) good++; else bad++;
    conflicts.push({title:c.title, cat:c.cat, type:c.type, alert:chosen!==c.best, insight:c.insight, source:c.source});
  });
  
  let total = good+bad;
  let ratio = total>0 ? bad/total : 0;
  let scoreClass = ratio<0.3?'score-green':ratio<0.6?'score-amber':'score-red';
  let level = ratio<0.3?'🟢 低冲突风险':ratio<0.6?'🟡 中等冲突风险':'🔴 高冲突风险';
  let stage = ratio<0.3?'你的团队在'绿区'——决策模式总体健康。保持现在的沟通节奏。':ratio<0.6?'你的团队在'黄区'——有一些值得关注的信号。建议做一次深度测评。':'你的团队在'红区'——有明显的冲突预警。可能需要一次正式的诊断工作坊。';
  
  let html = `<div class="result-card">`;
  html += `<h2>📊 你的冲突剖面</h2>`;
  html += `<div class="score-badge ${scoreClass}">${level}</div>`;
  html += `<p style="font-size:14px;margin:8px 0;">${good}张选择与最佳实践一致 / ${bad}张触发冲突预警</p>`;
  html += `<p style="font-size:13px;color:var(--text);margin:8px 0;">${stage}</p>`;
  
  html += `<div class="conflict-list">`;
  conflicts.forEach(c => {
    html += `<div class="conflict-item"><span class="alert-icon">${c.alert?'🔴':'🟢'}</span> <strong>${c.title}</strong> <span style="font-size:11px;opacity:0.6;">· ${c.cat}</span></div>`;
  });
  html += `</div>`;
  
  // Deck summary
  let cats = {};
  conflicts.forEach(c=>{ cats[c.cat] = (cats[c.cat]||0)+1; });
  html += `<div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;">`;
  Object.entries(cats).forEach(([cat,count]) => {
    html += `<span style="padding:3px 10px;border-radius:12px;font-size:11px;background:rgba(194,59,34,0.08);color:var(--sri-red);">${cat} ×${count}</span>`;
  });
  html += `</div>`;
  
  html += `<div class="result-cta">`;
  html += `<a class="btn btn-primary" href="assessment.html">🎯 做五维快速自评（3分钟）</a>`;
  html += `<a class="btn btn-outline" href="thermometer.html">🌡️ 测一下关系温度计（30秒）</a>`;
  html += `<button class="btn btn-ghost" onclick="restart()">🔄 换一组卡再来一轮</button>`;
  html += `<button class="btn btn-ghost" onclick="shareResult()">📤 分享结果</button>`;
  html += `</div>`;
  html += `</div>`;
  
  resultArea.innerHTML = html;
}

function restart() {
  document.getElementById('deckSelect').style.display = 'block';
  document.getElementById('modeSelect').style.display = 'flex';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('board').style.display = 'none';
  document.getElementById('resultArea').classList.remove('show');
  document.getElementById('resultArea').innerHTML = '';
  currentIdx = 0; answered = {}; gameCards = []; gameStarted = false;
}

function shareResult() {
  let bad = Object.values(answered).filter((v,i) => v !== gameCards[i].best).length;
  let text = `我刚用满意解研究所的合伙人决策卡牌做了自测。
${gameCards.length}张卡牌，${bad}张触发冲突预警。

试试你团队的决策健康度：`;
  let url = window.location.href;
  if (navigator.share) {
    navigator.share({title:'合伙人决策卡牌', text, url}).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text+' '+url).then(()=>alert('已复制到剪贴板！'));
  } else {
    prompt('复制分享:', text+' '+url);
  }
}
</script>

  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>
