<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线上产品库 · 满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A;--border:#D4C5A0;--sri-green:#4A8C5C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:var(--title-color);color:#F5F0E6;padding:32px 20px 24px;text-align:center}
.hero h1{font-size:20px;font-weight:700}
.hero p{font-size:12px;opacity:0.8}
.main{max-width:960px;margin:0 auto;padding:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat .num{font-size:22px;font-weight:700;color:var(--sri-red)}
.stat .label{font-size:10px;opacity:.6}

.filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.fbtn{padding:5px 12px;border-radius:12px;font-size:10px;cursor:pointer;border:1px solid var(--border);background:#fff;font-family:inherit}
.fbtn.active{background:var(--sri-red);color:#fff;border-color:var(--sri-red)}

.search{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:12px;font-size:13px;font-family:inherit}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:11px}
th{background:var(--sri-red);color:#fff;padding:8px 4px;text-align:left;font-size:10px}
td{padding:6px 4px;border-bottom:1px solid #f0e8d8;font-size:10px}
tr:hover td{background:rgba(194,59,34,0.03)}
td a{color:var(--sri-red);text-decoration:none}
.badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px}
.badge-green{background:rgba(74,140,92,.12);color:var(--sri-green)}
.badge-amber{background:rgba(184,134,11,.12);color:var(--sri-gold)}

.footer{text-align:center;padding:20px;font-size:10px;opacity:.4}
@media(max-width:480px){body{font-size:14px}}
</style>
</head>
<body>
<div class="hero"><h1>📦 线上产品库</h1><p>动态加载 · 实时同步 · 精品18+线上167=185件面向客户</p></div>
<div class="main">
  <div class="stats" id="statsBar"></div>
  <input class="search" id="searchInput" placeholder="🔍 搜索产品..." oninput="renderTable()">
  <div class="filter-bar" id="filterBar"></div>
  <table id="productTable">
    <thead><tr><th>名称</th><th>族</th><th>状态</th><th>阶段</th><th>链接</th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="tableCount" style="text-align:center;font-size:11px;opacity:.5;padding:8px;"></div>
</div>
<div class="footer">
  满意解研究所 · 动态数据源: entities_index.json<br>
  <span style="color:var(--sri-gold)">火承土印·鼎玉契晋·三脉两翼·五维相生</span>
</div>

<script>
var allProds = [];
var currentFilter = 'all';
var filters = {};

// 加载 entities_index.json
fetch('memory/_data/entities_index.json')
  .then(function(r){return r.json();})
  .then(function(data){
    allProds = data.products || [];
    // 统计
    var st = {};
    allProds.forEach(function(p){
      var s = p.status||'?';
      st[s] = (st[s]||0) + 1;
    });
    var html = '';
    var fams = {};
    allProds.forEach(function(p){
      var f = p.family||'?';
      fams[f] = (fams[f]||0) + 1;
      filters[f] = true;
    });
    for(var k in st){
      html += '<div class="stat"><div class="num">'+st[k]+'</div><div class="label">'+k+'</div></div>';
    }
    document.getElementById('statsBar').innerHTML = html;
    
    // 筛选栏
    var fhtml = '<button class="fbtn active" onclick="setFilter(\'all\',this)">全部('+allProds.length+')</button>';
    for(var f in fams){
      fhtml += '<button class="fbtn" onclick="setFilter(\''+f+'\',this)">'+f+'('+fams[f]+')</button>';
    }
    document.getElementById('filterBar').innerHTML = fhtml;
    
    renderTable();
  })
  .catch(function(){
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px">⚠️ 数据加载中...请稍后刷新</td></tr>';
  });

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderTable();
}

function renderTable(){
  var query = (document.getElementById('searchInput').value||'').toLowerCase();
  var filtered = allProds.filter(function(p){
    if(currentFilter!='all' && p.family!=currentFilter) return false;
    var name = (p.name||'').toLowerCase();
    if(query && name.indexOf(query)==-1) return false;
    return true;
  });
  
  var html = '';
  filtered.forEach(function(p){
    var url = p.url||'';
    var link = url ? '<a href="'+url+'">🔗</a>' : '-';
    html += '<tr>';
    html += '<td>'+(p.name||'?')+'</td>';
    html += '<td>'+p.family+'</td>';
    html += '<td><span class="badge '+(p.status=='精品'?'badge-green':'badge-amber')+'">'+(p.status||'?')+'</span></td>';
    html += '<td>'+(p.lifecycle_stage||'?')+'</td>';
    html += '<td>'+link+'</td>';
    html += '</tr>';
  });
  
  document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="5" style="text-align:center;padding:20px">无匹配结果</td></tr>';
  document.getElementById('tableCount').textContent = '显示 '+filtered.length+'/'+allProds.length+' 件';
}
</script>

<div style="max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px">
  <div id="fbQ" style="color:#4A4A4A;font-weight:600;margin-bottom:10px">这个页面对你有用吗？</div>
  <div id="fbBtns" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px">
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'up');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">👍 有用</button>
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'text');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">💬 有建议</button>
  </div>
</div>


<p style="text-align:center;padding:10px;font-size:11px"><a href="go.html" style="color:#C23B22;text-decoration:none">← 返回决策通道</a></p>
</body>
</html>
