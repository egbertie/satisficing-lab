<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>章·知机 | 8赛道风险画像 | 满意解研究所</title>
<style>
  :root { --sri-red:#C23B22; --sri-gold:#B8860B; --sri-bg:#F5F0E6; --text:#4A4A4A; --title:#2A2A2A; --border:#D4C5A0; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; background:var(--sri-bg); color:var(--text); min-height:100vh; }
  .hero { background:linear-gradient(135deg,var(--sri-red),var(--sri-gold)); color:#F5F0E6; padding:36px 20px 28px; text-align:center; }
  .hero h1 { font-size:22px; font-weight:700; }
  .hero p { font-size:13px; opacity:0.9; margin-top:4px; }
  .main { max-width:600px; margin:0 auto; padding:16px; }
  
  .track-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .track-card { background:#fff; border-radius:12px; padding:14px; cursor:pointer; border:1.5px solid var(--border); transition:0.15s; text-decoration:none; color:inherit; }
  .track-card:active,.track-card.active { border-color:var(--sri-red); }
  .track-card .icon { font-size:28px; }
  .track-card .name { font-size:14px; font-weight:700; color:var(--title); margin:4px 0 2px; }
  .track-card .risk { font-size:11px; padding:1px 6px; border-radius:8px; display:inline-block; }
  .risk-high { background:rgba(194,59,34,0.1); color:var(--sri-red); }
  .risk-mid { background:rgba(184,134,11,0.1); color:var(--sri-gold); }
  .risk-low { background:rgba(74,140,92,0.1); color:#4A8C5C; }

  .detail { display:none; background:#fff; border-radius:14px; padding:24px; border:2px solid var(--sri-red); margin-bottom:16px; animation:fadeIn 0.3s; }
  .detail.show { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .detail h3 { font-size:18px; color:var(--title); margin-bottom:10px; }
  .detail .symptoms { font-size:13px; line-height:1.7; margin:12px 0; }
  .detail .symptoms li { margin:4px 0; padding-left:4px; }
  .detail .symptoms li::before { content:'⚠️ '; }
  .detail .antidote { font-size:13px; line-height:1.7; padding:12px; background:rgba(194,59,34,0.04); border-radius:8px; margin:12px 0; }
  .detail .source { font-size:10px; opacity:0.5; margin-top:8px; }

  .btn { display:inline-block; padding:10px 22px; border-radius:16px; font-size:13px; font-weight:600; cursor:pointer; border:none; text-decoration:none; }
  .btn-back { background:transparent; border:1.5px solid var(--sri-red); color:var(--sri-red); }
  .footer { text-align:center; padding:24px 16px 40px; font-size:11px; color:#999; }
  .footer a { color:var(--sri-red); text-decoration:none; }
</style>
<link rel="stylesheet" href="vi_quick_ref.css">
</head>
<body>

<div class="hero">
  <h1>🗼 灯塔 · 8赛道风险画像</h1>
  <p>你所在的赛道——最可能踩的三个雷</p>
</div>

<div class="main">
  <p style="font-size:13px;margin-bottom:12px;text-align:center;color:var(--text);opacity:0.7;">选择一个赛道，查看专属风险画像</p>
  
  <div class="track-grid" id="trackGrid">
    <div class="track-card" onclick="showDetail('quantum')">
      <div class="icon">⚛️</div><div class="name">量子/光子芯片</div>
      <span class="risk risk-high">极高风险</span>
    </div>
    <div class="track-card" onclick="showDetail('brain')">
      <div class="icon">🧠</div><div class="name">脑机接口</div>
      <span class="risk risk-high">极高风险</span>
    </div>
    <div class="track-card" onclick="showDetail('evtol')">
      <div class="icon">✈️</div><div class="name">eVTOL飞行器</div>
      <span class="risk risk-high">极高风险</span>
    </div>
    <div class="track-card" onclick="showDetail('robot')">
      <div class="icon">🤖</div><div class="name">具身智能/机器人</div>
      <span class="risk risk-mid">高风险</span>
    </div>
    <div class="track-card" onclick="showDetail('auto')">
      <div class="icon">🚗</div><div class="name">自动驾驶</div>
      <span class="risk risk-mid">高风险</span>
    </div>
    <div class="track-card" onclick="showDetail('semi')">
      <div class="icon">💾</div><div class="name">半导体设备</div>
      <span class="risk risk-mid">高风险</span>
    </div>
    <div class="track-card" onclick="showDetail('energy')">
      <div class="icon">🔋</div><div class="name">新能源/储能</div>
      <span class="risk risk-low">中风险</span>
    </div>
    <div class="track-card" onclick="showDetail('mfg')">
      <div class="icon">🏭</div><div class="name">精密制造</div>
      <span class="risk risk-low">中风险</span>
    </div>
  </div>

  <div class="detail" id="detail"></div>
</div>

<div class="footer"><p><a href="go.html">← 返回产品中心</a></p><p style="margin-top:6px;">满意解研究所 · 灯塔·8赛道风险画像 · 基于84案例+YTT蒸馏</p></div>

<script>
const tracks = {
  quantum: {icon:'⚛️',name:'量子/光子芯片',risk:'极高', riskClass:'risk-high',
    top3:[
      {title:'政府依赖断裂',desc:'2000万政府资助+500万天使→政府要求"半年出商业化成果"，天使要退出。两位"客户"同时施压——你不是在做公司，是在管理两个投资人的预期。'},
      {title:'CTO路线内战',desc:'平台vs场景之争：CTO要通用平台（烧钱·想象空间大），CEO要细分场景（近期能交差·天花板低）。分歧公开化→技术团队无所适从→研发效率归零。'},
      {title:'商业化时钟错位',desc:'距商业化至少两年，但所有利益方要的是"现在"。被迫在不可能三角下工作——技术领先+产品稳定+速度快→必然动作变形。'}
    ],
    antidote:'1.与CTO达成战时同盟——先活下来再谈理想。2.重新定义"商业化成果"：不是卖产品，是做一场"震撼演示"。3.用演示管理政府预期→争取下一期资助。4.为天使投资人寻找接盘方→展示6个月求生计划。',
    source:'YTT蒸馏·I3·硬科技·量子传感芯片案例'},
  brain: {icon:'🧠',name:'脑机接口',risk:'极高', riskClass:'risk-high',
    top3:[
      {title:'监管悬崖',desc:'医疗级脑机接口需要FDA/NMPA认证——周期5-10年。投资人等不了。'},{title:'伦理地雷',desc:'隐私·意识·人格——任何一个伦理争议都可能让整个赛道被叫停。不是技术风险，是舆论风险。'},{title:'人才黑洞',desc:'全球能做的人不到200个。任何核心人离职=公司断一条腿。'}],
    antidote:'1.不做侵入式——先做非侵入式消费级产品作为现金流。2.伦理前置——成立伦理委员会，主动公开。3.关键人才必须有vesting锁定期+竞业条款。',
    source:'YTT蒸馏·8赛道特化·交叉验证'},
  evtol: {icon:'✈️',name:'eVTOL飞行器',risk:'极高', riskClass:'risk-high',
    top3:[{title:'认证地狱',desc:'适航认证周期5-8年·烧钱数十亿。全球只有少数几家公司能走到认证阶段。'},{title:'基础设施真空',desc:'没有起降点·没有空管系统·没有保险体系。不是造出来就能飞。'},{title:'先发劣势',desc:'第一个拿证的不一定是赢家——可能是替后来者蹚完了所有的坑。'}],
    antidote:'1.认证策略：找已有适航经验的合伙人或顾问。2.先做货运eVTOL（监管更松）。3.和政府共建起降基础设施——谁建标准谁有话语权。',
    source:'YTT蒸馏·8赛道特化·eVTOL'},
  robot: {icon:'🤖',name:'具身智能/机器人',risk:'高', riskClass:'risk-mid',
    top3:[{title:'落地场景碎片化',desc:'工业/家庭/医疗/物流——每个场景都是独立的产品。一个团队不可能全做。'},{title:'硬件软件双线作战',desc:'本体+大脑+小脑——三条战线同时推进，任何一条掉队都拖累整体。'},{title:'定价权缺失',desc:'硬件价格透明→毛利被压缩。软件还没被证明值钱——BOM成本倒逼定价。'}],
    antidote:'1.选一个场景做到世界第一→再谈扩展。2.硬件外包、软件自研——不要双线作战。3.定价=软件订阅+硬件成本价——收入不来自硬件。',
    source:'YTT蒸馏·8赛道特化·机器人'},
  auto: {icon:'🚗',name:'自动驾驶',risk:'高', riskClass:'risk-mid',
    top3:[{title:'长尾场景无限',desc:'99%的路况解决了——剩下1%需要99%的成本。永远在"快要好了"的路上。'},{title:'责任归属黑洞',desc:'L4事故——驾驶员/车企/供应商/算法——谁负责？法律真空。'},{title:'资本退潮',desc:'一级市场融资从狂热到冰封。没有新钱进来→估值缩水→团队流失。'}],
    antidote:'1.不做L4——先做L2+商用车（卡车/物流）变现。2.和保险公司共建责任模型。3.降低烧钱速度——先活过资本寒冬。',
    source:'YTT蒸馏·8赛道特化·自动驾驶'},
  semi: {icon:'💾',name:'半导体设备',risk:'高', riskClass:'risk-mid',
    top3:[{title:'客户集中度极高',desc:'TSMC+三星+Intel占全球设备采购70%。丢掉一个客户=丢掉半条命。'},{title:'验证周期极长',desc:'从送样到量产——2-3年。客户不会因为你"快"就加速。'},{title:'地缘政治双刃剑',desc:'制裁让国产替代有了窗口——但也意味着供应链被切割、技术交流受阻。'}],
    antidote:'1.绑定一个灯塔客户→用案例撬动第二家。2.先做耗材/零部件→再攻整机。3.地缘政治风险不可控——但国产替代趋势不可逆。保持技术独立。',
    source:'YTT蒸馏·8赛道特化·半导体'},
  energy: {icon:'🔋',name:'新能源/储能',risk:'中', riskClass:'risk-low',
    top3:[{title:'产能过剩',desc:'锂电行业产能利用率已降至50%以下。不是市场不够大——是造的人太多了。'},{title:'政策依赖',desc:'补贴退坡=利润归零。不能永远靠政策活着。'},{title:'技术路线赌注',desc:'锂电/钠电/固态/液流——选错路线=浪费2-3年窗口。'}],
    antidote:'1.不做电芯——做系统集成或回收。2.政策红利期加速扩张→红利消退前建立成本优势。3.多条技术路线同时小规模验证。',
    source:'YTT蒸馏·8赛道特化·新能源'},
  mfg: {icon:'🏭',name:'精密制造',risk:'中', riskClass:'risk-low',
    top3:[{title:'低端订单外流',desc:'越南和印度正在吃掉低端订单。不转型=等死。'},{title:'转型资金缺口',desc:'数字化产线投入3000万——三年回本，但期间现金流极度紧张。'},{title:'老师傅不可复制',desc:'核心能力在人的手上——不是在生产系统里。人走了=能力走了。'}],
    antidote:'1.数字化改造分期投入——先改造最痛点环节。2.用系统沉淀经验——把老师傅的手感变成工艺参数。3.从"代工"转向"精密制造服务"——不是卖零件，是卖制造能力。',
    source:'YTT蒸馏·I1·制造业·精密机械案例'}
};

function showDetail(key) {
  let t = tracks[key];
  let html = `<h3>${t.icon} ${t.name} · <span class="risk ${t.riskClass}">${t.risk}风险</span></h3>`;
  html += `<div class="symptoms"><strong>最可能踩的三个雷：</strong><ul>`;
  t.top3.forEach((item,i) => {
    html += `<li><strong>${item.title}</strong>：${item.desc}</li>`;
  });
  html += `</ul></div>`;
  html += `<div class="antidote"><strong>💡 行动建议：</strong><br>${t.antidote}</div>`;
  html += `<div class="source">📚 ${t.source}</div>`;
  html += `<button class="btn btn-back" onclick="hideDetail()">← 查看全部赛道</button>`;
  document.getElementById('detail').innerHTML = html;
  document.getElementById('detail').classList.add('show');
  document.getElementById('trackGrid').style.display = 'none';
  window.scrollTo(0,0);
}

function hideDetail() {
  document.getElementById('detail').classList.remove('show');
  document.getElementById('trackGrid').style.display = 'grid';
}
</script>

<p style="text-align:center;font-size:10px;opacity:0.35;padding:4px;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</p>
<div style="max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px;">
  <div id="fbQuestion" style="color:#4A4A4A;font-weight:600;margin-bottom:10px;">这个工具对你有用吗？</div>
  <div id="fbActions" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px;">
    <button onclick="submitFeedback('up')" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">👍</span>有用</button>
    <button onclick="showFeedbackText()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">💬</span>有建议</button>
  </div>
  <textarea id="fbText" style="display:none;width:100%;max-width:400px;height:60px;border:1.5px solid #D4C5A0;border-radius:10px;padding:10px;font-size:13px;font-family:inherit;background:#fff;margin:8px auto;resize:vertical;" placeholder="你的建议会帮我们改进..."></textarea>
  <button id="fbSubmit" style="display:none;padding:8px 18px;border-radius:20px;border:1.5px solid #C23B22;background:#fff;cursor:pointer;font-size:13px;color:#C23B22;font-weight:600;margin:4px auto;" onclick="submitFeedbackText()">发送反馈 →</button>
  <div id="fbThanks" style="display:none;color:#4A8C5C;font-weight:600;padding:8px;">收到！感谢你的反馈。</div>
  <div id="fbTally" style="font-size:11px;color:#999;margin-top:4px;"></div>
  <p style="font-size:10px;opacity:0.4;margin-top:8px;"><a href="go.html" style="color:inherit;">返回决策通道</a></p>
</div>
<script>
(function(){
  let page=location.pathname.split('/').pop()||'index';
  let key='sri_fb_'+page;
  let data=JSON.parse(localStorage.getItem(key)||'{}');
  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>

</body>
</html>
