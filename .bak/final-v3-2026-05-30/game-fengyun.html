<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>觉·风云|合伙人风云桌游|满意解研究所</title>
<style>
:root{--sri-red:#C23B22;--sri-gold:#B8860B;--sri-bg:#F5F0E6;--text:#4A4A4A;--title-color:#2A2A2A;--border:#D4C5A0;--sri-green:#4A8C5C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--sri-bg);color:var(--text);min-height:100vh}
.hero{background:linear-gradient(135deg,var(--title-color),var(--sri-gold));color:#F5F0E6;padding:36px 20px 28px;text-align:center}
.hero h1{font-size:21px;font-weight:700}.hero p{font-size:12px;opacity:.8}

.game-zone{max-width:560px;margin:0 auto;padding:24px 16px 40px}
.game-intro{text-align:center;font-size:14px;line-height:2;margin-bottom:24px}
.game-intro em{color:var(--sri-red);font-style:normal;font-weight:600}

.event-card{background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.08);text-align:center;margin-bottom:20px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:all 0.3s}
.event-card .event-icon{font-size:48px;margin-bottom:12px}
.event-card .event-scene{font-size:15px;color:var(--title-color);font-weight:600;line-height:1.8;margin-bottom:8px}
.event-card .event-tag{font-size:11px;padding:4px 12px;border-radius:12px;background:rgba(184,134,11,0.1);color:var(--sri-gold);margin-bottom:16px;display:inline-block}

.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choice-btn{padding:14px 18px;border:1.5px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;font-size:14px;text-align:center;transition:all 0.2s;font-family:inherit}
.choice-btn:hover{background:rgba(194,59,34,0.04);border-color:var(--sri-red)}
.choice-btn:disabled{opacity:.5;cursor:not-allowed}
.choice-btn.chosen{background:rgba(194,59,34,0.06);border-color:var(--sri-red);font-weight:600}

.outcome{display:none;padding:16px;background:rgba(74,140,92,0.05);border-radius:12px;margin-top:16px;font-size:14px;line-height:2;text-align:left;animation:fadeIn 0.4s}
.outcome.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.outcome .outcome-result{font-weight:700;color:var(--title-color);margin-bottom:6px}
.outcome .outcome-impact{font-size:13px;color:var(--text)}

.btn-next{padding:10px 28px;border-radius:20px;border:1.5px solid var(--sri-gold);background:#fff;color:var(--sri-gold);font-size:14px;cursor:pointer;font-family:inherit;margin-top:16px;transition:all 0.2s}
.btn-next:hover{background:var(--sri-gold);color:#fff}

.stage-track{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.stage-dot{width:10px;height:10px;border-radius:50%;background:#f0e8d8;transition:all 0.3s}
.stage-dot.done{background:var(--sri-gold)}
.stage-dot.current{background:var(--sri-red);transform:scale(1.3)}

.stats-board{text-align:center;font-size:13px;color:#999;margin-top:24px;padding:12px;background:#fff;border-radius:12px}
.stats-board .stat-row{display:flex;justify-content:center;gap:24px;margin-top:8px}
.stats-board .stat-val{font-size:20px;font-weight:700;color:var(--title-color)}

.back-link{text-align:center;padding:20px;font-size:11px;color:#999}
.back-link a{color:var(--sri-red);text-decoration:none}
.feedback-zone{max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px}
</style>
</head>
<body>
<div class="hero"><h1>🎲 觉·风云</h1><p>游戏工厂·合伙人风云·硬科技创业桌游</p></div>

<div class="game-zone">
  <div class="game-intro"><p>你是硬科技创业团队的<em>联合创始人</em>。<br>每一轮你会遇到一个关键时刻——做出选择，看公司走向。</p></div>

  <div class="stage-track" id="stageTrack"></div>

  <div class="event-card" id="eventCard">
    <div class="event-icon">🎲</div>
    <div class="event-scene">准备好开始你的创业之旅了吗？</div>
    <button class="btn-next" onclick="startGame()">🚀 开始风云之路</button>
  </div>

  <div class="stats-board" id="statsBoard" style="display:none"></div>
</div>

<div class="back-link"><a href="go.html">← 返回决策通道</a></div>

<div class="feedback-zone">
  <div id="fbQuestion" style="color:#4A4A4A;font-weight:600;margin-bottom:10px;">这个工具对你有用吗？</div>
  <div id="fbActions" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px;">
    <button onclick="submitFeedback('up')" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">👍</span>有用</button>
    <button onclick="showFeedbackText()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;"><span style="font-size:18px;">💬</span>有建议</button>
  </div>
  <textarea id="fbText" style="display:none;width:100%;max-width:400px;height:60px;border:1.5px solid #D4C5A0;border-radius:10px;padding:10px;font-size:13px;font-family:inherit;background:#fff;margin:8px auto;resize:vertical;" placeholder="你的建议会帮我们改进..."></textarea>
  <button id="fbSubmit" style="display:none;padding:8px 18px;border-radius:20px;border:1.5px solid #C23B22;background:#fff;cursor:pointer;font-size:13px;color:#C23B22;font-weight:600;margin:4px auto;" onclick="submitFeedbackText()">发送反馈 →</button>
  <div id="fbThanks" style="display:none;color:var(--sri-green);font-weight:600;padding:8px;">收到！感谢你的反馈。</div>
  <div id="fbTally" style="font-size:11px;color:#999;margin-top:4px;"></div>
</div>

<script>
var EVENTS = [
  {
    icon:'💰', scene:'第一笔融资到账了。500万。你打算怎么分配？', tag:'融资阶段',
    choices:['全部投入研发——先把产品做出来','一半研发一半市场——两条腿走路','先留着——看竞品动作再说'],
    outcomes:['研发投入翻倍，产品提前3个月上线。但市场声音不够大，竞品先声夺人。','节奏稳健。研发进度OK，第一批种子用户也来了。好选择。','钱在账上但时间在流失。投资人开始催问进度。']
  },
  {
    icon:'⚡', scene:'两个合伙人吵起来了。技术派要坚持技术路线，市场派说先做能卖的。你站哪边？', tag:'团队冲突',
    choices:['站技术——长期壁垒最重要','站市场——现金流先跑起来','把两个人拉到同一个房间——不解决分歧不出门'],
    outcomes:['选择了长期主义。但你注意到市场派的眼神暗了一下。记下来——回头需要修复。','销售额第一个月就上来了，团队气势很旺。但技术派在半夜给你发了条消息：\"我们是不是忘了初心？\"','经过6小时的关房对话，两个人第一次理解了对方的恐惧。不是谁对谁错——是看的风景不一样。']
  },
  {
    icon:'🏛️', scene:'投资人要求对赌：明年营收达到3000万，否则他占股比例翻倍。签不签？', tag:'融资压力',
    choices:['签——赌一把，相信团队','不签——宁可慢一点也不要被绑','谈条件——营收目标降到2000万，锁定期延长'],
    outcomes:['你签了。接下来的365天，每一天都背着这座山。团队开始有人离开——不是干不了，是压力太大。','投资人不太高兴但尊重了你的决定。后来市场变化，你庆幸没签那个对赌。','经过两周谈判，达成了一个双方都能接受的条件。这是最好的结果——不是谁赢了谈判，是两边的底线都对上了。']
  },
  {
    icon:'🔮', scene:'一个关键员工要走——去竞品。他脑子里有你最核心的技术路线。', tag:'人才危机',
    choices:['加薪留人——不管代价','让他走——但要求竞业限制','坐下来聊聊——到底为什么走？'],
    outcomes:['留住了人但团队其他人觉得不公平。你看不见的裂痕在扩展。','竞业限制签了。但你不能限制一个人的思想。6个月后竞品的产品路线跟你的预判高度重合。','原来他不是为了钱——是觉得自己没有成长空间了。你给了他一个新角色。他留下来了，比之前更投入。']
  },
  {
    icon:'🌟', scene:'公司到了关键路口。上市？卖掉？还是继续独立发展？', tag:'终极选择',
    choices:['上市——把故事讲给更多人听','卖掉——拿钱走人，重新开始','继续独立——这是我的孩子，不卖'],
    outcomes:['你敲钟的那一刻——脑子里闪过的不是PPT上的数字，是第一次在车库写下第一行代码的那个凌晨。','把钱分给了团队。有人用这笔钱开了新公司。有人买了个小岛。你开始画下一个项目的草图。','你说服了董事会。第三年——利润翻倍，客户翻倍。不上市不等于不成功。只是走了一条不一样的路。']
  }
];

var currentStage = -1;
var choices = [];
var totals = {tech:0, market:0, trust:0};

function startGame(){
  currentStage = -1;
  choices = [];
  totals = {tech:0, market:0, trust:0};
  document.getElementById('statsBoard').style.display = 'none';
  renderStages();
  nextStage();
}

function renderStages(){
  var track = document.getElementById('stageTrack');
  var html = '';
  for(var i=0;i<EVENTS.length;i++){
    var cls = i<currentStage ? 'done' : i===currentStage ? 'current' : '';
    html += '<div class="stage-dot '+cls+'"></div>';
  }
  track.innerHTML = html;
}

function nextStage(){
  currentStage++;
  if(currentStage >= EVENTS.length){
    endGame();
    return;
  }
  renderStages();
  var e = EVENTS[currentStage];
  var card = document.getElementById('eventCard');
  var html = '';
  html += '<div class="event-icon">'+e.icon+'</div>';
  html += '<div class="event-scene">'+e.scene+'</div>';
  html += '<div class="event-tag">'+e.tag+' · 第'+(currentStage+1)+'/'+EVENTS.length+'幕</div>';
  html += '<div class="choices" id="choices">';
  e.choices.forEach(function(c, j){
    html += '<button class="choice-btn" onclick="choose('+j+')">'+c+'</button>';
  });
  html += '</div>';
  html += '<div class="outcome" id="outcome"></div>';
  card.innerHTML = html;
}

function choose(idx){
  var e = EVENTS[currentStage];
  choices.push(idx);
  // 追踪维度
  if(currentStage===0){totals.tech+=idx===0?2:idx===1?1:0;totals.market+=idx===0?0:idx===1?2:1;}
  else if(currentStage===1){totals.trust+=idx===2?3:idx===0?1:2;}
  else if(currentStage===2){totals.tech+=idx===2?2:idx===0?1:0;totals.market+=idx===0?2:idx===1?1:0;}
  else if(currentStage===3){totals.trust+=idx===2?3:idx===0?1:2;}
  else{totals.tech+=idx===2?2:0;totals.market+=idx===1?2:0;totals.trust+=idx===2?1:0;}

  // 禁用按钮
  document.querySelectorAll('#choices .choice-btn').forEach(function(b,i){
    b.disabled = true;
    if(i===idx) b.classList.add('chosen');
  });

  // 显示结果
  var outcome = document.getElementById('outcome');
  outcome.innerHTML = '<div class="outcome-result">💬 '+e.outcomes[idx]+'</div>';
  outcome.classList.add('show');

  // 下一步按钮
  var nextBtn = document.createElement('button');
  nextBtn.className = 'btn-next';
  nextBtn.textContent = currentStage<EVENTS.length-1?'👉 下一幕':'🏆 看结局';
  nextBtn.onclick = nextStage;
  outcome.appendChild(nextBtn);
}

function endGame(){
  document.getElementById('eventCard').innerHTML = 
    '<div class="event-icon">🏆</div>'+
    '<div class="event-scene">风云之路——走完了</div>'+
    '<div style="font-size:14px;color:var(--text);line-height:2;margin-top:12px">'+
    '🛡️ 技术远见：'+(totals.tech>=4?'高瞻远瞩':totals.tech>=2?'稳扎稳打':'需要更多聆听技术团队的声音')+'<br>'+
    '📈 市场直觉：'+(totals.market>=4?'嗅觉敏锐':totals.market>=2?'步步为营':'偶尔需要更强的变现意识')+'<br>'+
    '🤝 团队信任：'+(totals.trust>=4?'团队的锚':totals.trust>=2?'善于斡旋':'也许是时候坐下来好好聊一次')+'<br>'+
    '</div>'+
    '<button class="btn-next" onclick="startGame()">🔄 重新开始</button>';
  document.getElementById('statsBoard').style.display = 'block';
  document.getElementById('statsBoard').innerHTML = 
    '<div class="stat-row">'+
    '<div><div class="stat-val">🛡️</div>技术</div>'+
    '<div><div class="stat-val">📈</div>市场</div>'+
    '<div><div class="stat-val">🤝</div>信任</div>'+
    '</div>五项选择：'+choices.map(function(c,i){return EVENTS[i].choices[c].slice(0,8)+'...';}).join(' → ');
}

renderStages();

// ===== 反馈组件 =====
(function(){
  let page=location.pathname.split('/').pop()||'index';
  let key='sri_fb_'+page;
  let data=JSON.parse(localStorage.getItem(key)||'{}');
  if(data.sent){document.getElementById('fbQuestion').textContent='感谢你的反馈！';document.getElementById('fbActions').style.display='none';}
  let tally=JSON.parse(localStorage.getItem('sri_fb_tally_'+page)||'{"up":0,"text":0}');
  if(tally.up+tally.text>0) document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  window.submitFeedback=function(type){
    tally[type]=(tally[type]||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type=type;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbQuestion').textContent='感谢你的反馈！';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
  window.showFeedbackText=function(){
    document.getElementById('fbText').style.display='block';
    document.getElementById('fbSubmit').style.display='inline-block';
  };
  window.submitFeedbackText=function(){
    let text=document.getElementById('fbText').value.trim();
    if(!text)return;
    tally.text=(tally.text||0)+1;
    localStorage.setItem('sri_fb_tally_'+page,JSON.stringify(tally));
    data.sent=true;data.type='text';data.text=text;data.time=new Date().toISOString();
    localStorage.setItem(key,JSON.stringify(data));
    document.getElementById('fbActions').style.display='none';
    document.getElementById('fbText').style.display='none';
    document.getElementById('fbSubmit').style.display='none';
    document.getElementById('fbQuestion').textContent='收到！感谢你的建议。';
    document.getElementById('fbTally').textContent='♡'+tally.up+' 💬'+tally.text;
  };
})();
</script>
</body>
</html>
