    if(p0.length>0){h+='<div class="pn bl"><div class="pn-h" style="color:#C23B22">🔴 P0 待办 ('+p0.length+')</div>';p0.slice(0,8).forEach(function(t){h+='<div style="padding:4px 0;font-size:11px;border-bottom:1px solid #f0e8d8">'+t.task+'</div>'});h+='</div>'}
    var md=MLS.filter(function(m){return m.s==='完成'}).length;
    h+='<div class="pn"><div class="pn-h">🎯 里程碑 ('+md+'/'+MLS.length+')</div><div style="display:flex;align-items:center;gap:8px;font-size:10px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'%</span></div>';
    MLS.filter(function(m){return m.s!=='完成'}).forEach(function(m){h+='<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px solid #f0e8d8"><span>'+m.n+'</span><span><span class="tg '+(m.s==='进行中'?'tga':'tgr')+'">'+m.s+'</span> '+m.d+'</span></div>'});h+='</div>';
  }else if(CT==='tasks'){
    h+='<div class="pn"><div class="pn-h">📋 任务 ('+ts.length+')</div>';
    if(ts.length===0)h+='<div class="emp">暂无任务</div>';else{h+='<table class="tbl"><tr><th>任务</th><th>优先级</th><th>状态</th></tr>';ts.forEach(function(t){h+='<tr><td>'+t.task+'</td><td>'+t.priority+'</td><td><span class="dot '+(t.status.indexOf('完成')>=0?'dg':t.status.indexOf('进行')>=0?'da':'dr')+'"></span>'+t.status+'</td></tr>'});h+='</table>'}h+='</div>';
  }else if(CT==='project'){
    var md=MLS.filter(function(m){return m.s==='完成'}).length;
    h+='<div class="pn"><div class="pn-h">🗓️ 项目 · 里程碑</div><div style="display:flex;align-items:center;gap:8px;font-size:10px;margin-bottom:8px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'% ('+md+'/'+MLS.length+')</span></div>';
    h+='<table class="tbl"><tr><th>里程碑</th><th>截止</th><th>状态</th></tr>'+MLS.map(function(m){return'<tr><td>'+m.n+'</td><td>'+m.d+'</td><td><span class="tg '+(m.s==='完成'?'tgg':m.s==='进行中'?'tga':'tgr')+'">'+m.s+'</span></td></tr>'}).join('')+'</table></div>';
  }else if(CT==='customers'){var cs=DB.cs();h+='<div class="pn"><div class="pn-h">👤 客户 ('+cs.length+')</div>';if(cs.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>姓名</th><th>企业</th></tr>'+cs.map(function(c){return'<tr><td>'+c.name+'</td><td>'+(c.company||'')+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='products'){var pr=DB.pr();h+='<div class="pn"><div class="pn-h">📦 产品 ('+pr.length+')</div>';if(pr.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>名称</th><th>五族</th></tr>'+pr.map(function(p){return'<tr><td>'+p.name+'</td><td>'+(p.family||'')+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='quality'){var qu=DB.qu();h+='<div class="pn"><div class="pn-h">✅ 质量标准 ('+qu.length+')</div>';if(qu.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>编号</th><th>标准</th><th>状态</th></tr>'+qu.map(function(q){return'<tr><td>'+q.qm_id+'</td><td>'+q.standard+'</td><td>'+q.status+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='finance'){h+='<div class="pn"><div class="pn-h">💰 财务</div><div class="sg"><div class="si"><div class="v">~¥0</div><div class="l">月成本</div></div><div class="si"><div class="v">¥10-30K</div><div class="l">里程碑</div></div></div><table class="tbl" style="margin-top:8px"><tr><th>项目</th><th>年成本</th></tr><tr><td>GitHub Pages</td><td>¥0</td></tr><tr><td>商标注册</td><td>~¥3K</td></tr><tr><td>飞书认证</td><td>¥300</td></tr></table></div>'}
  else if(CT==='growth'){var g=DB.gr();h+='<div class="pn"><div class="pn-h">📈 增长</div>';if(g.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>指标</th><th>当前</th><th>目标</th></tr>'+g.map(function(x){return'<tr><td>'+x.m+'</td><td><b>'+x.c+'</b></td><td>'+x.t+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='system'){h+='<div class="pn"><div class="pn-h">⚡ 系统</div><div class="sg"><div class="si"><div class="v">12</div><div class="l">Cron</div></div><div class="si"><div class="v">6</div><div class="l">脚本</div></div><div class="si"><div class="v">233</div><div class="l">线上</div></div></div><table class="tbl" style="margin-top:8px"><tr><th>cron任务</th></tr><tr><td>06:00 日起课</td></tr><tr><td>每2h Token压缩</td></tr><tr><td>22:00 日毕课</td></tr><tr><td>23:00 飞书同步</td></tr></table></div>'}
  else if(CT==='avatars'){h+='<div class="pn"><div class="pn-h">🎭 替身</div><table class="tbl"><tr><th>名称</th><th>维度</th></tr><tr><td>🪨 刘禹锡</td><td>土·时间轴</td></tr><tr><td>🪙 司马贺</td><td>金·可行域</td></tr><tr><td>💧 水月观音</td><td>水·身心流</td></tr><tr><td>🪵 孔子</td><td>木·信义观</td></tr><tr><td>🔥 六祖慧能</td><td>火·直觉阈</td></tr></table></div>'}
  else if(CT==='glossary'){h+='<div class="pn"><div class="pn-h">📖 术语</div><table class="tbl"><tr><th>概念</th><th>术语</th></tr><tr><td>产品体系</td><td>章·衡·镜·契·觉</td></tr><tr><td>品牌名</td><td>满意解研究所</td></tr><tr><td>决策框架</td><td>五维决策</td></tr><tr><td>核心理论</td><td>满意解</td></tr></table></div>'}
  document.getElementById('mc').innerHTML=h;
}

function searchResults(q){
  var h='<div class="pn"><div class="pn-h">🔍 搜索: <b>'+q+'</b></div>',rs=[];
  (DB.ts()||[]).filter(function(t){return(t.task||'').indexOf(q)>=0}).forEach(function(t){rs.push({ty:'📋',tx:t.task+' ['+t.priority+']',tb:'tasks'})});
  (DB.cs()||[]).filter(function(c){return(c.name||'').indexOf(q)>=0}).forEach(function(c){rs.push({ty:'👤',tx:c.name,tb:'customers'})});
  (DB.pr()||[]).filter(function(p){return(p.name||'').indexOf(q)>=0}).forEach(function(p){rs.push({ty:'📦',tx:p.name,tb:'products'})});
  MLS.filter(function(m){return m.n.indexOf(q)>=0}).forEach(function(m){rs.push({ty:'🎯',tx:m.n+' '+m.s,tb:'overview'})});
  if(rs.length===0)h+='<div class="emp">未找到匹配</div>';
  else rs.forEach(function(r){h+='<div onclick="CT=\''+r.tb+'\';renderTabs();renderMC()" style="padding:6px 10px;border-bottom:1px solid #f0e8d8;cursor:pointer;font-size:11px"><span style="font-size:10px;opacity:0.5">'+r.ty+'</span> <b>'+r.tx+'</b></div>'});
  return h+'</div>';
}
</script>
