<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱 · 满意解研究所</title>
<style>
:root{--sr:#C23B22;--sg:#B8860B;--sb:#F5F0E6;--st:#4A4A4A;--sh:#2A2A2A}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#F5F0E6;color:#4A4A4A;min-height:100vh}
.lo{position:fixed;top:0;left:0;width:100%;height:100%;background:#F5F0E6;z-index:99999;display:flex;align-items:center;justify-content:center}
.lb{background:#fff;border-radius:20px;padding:40px 28px;max-width:360px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.1);border:2px solid #C23B22}
.lb h2{font-size:18px;color:#2A2A2A;margin-bottom:4px}.lb p{font-size:12px;color:#6E6E6E;margin-bottom:16px}
.lb input{width:42px;height:52px;border:2px solid #D4C5A0;border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:monospace;background:#F5F0E6}
.ld{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.lb .gbtn{width:100%;padding:12px;border:none;border-radius:12px;background:#C23B22;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.hid{display:none}
.tb{background:#fff;border-bottom:1px solid #e0d5c8;padding:8px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.ts{flex:1;min-width:140px;padding:7px 12px;border:1.5px solid #D4C5A0;border-radius:10px;font-size:12px;background:#F5F0E6;outline:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:8px 0}
.ki{background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid #e0d5c8;cursor:pointer}
.ki:hover{border-color:#C23B22}.ki .v{font-size:22px;font-weight:800;color:#C23B22}.ki .l{font-size:9px;color:#6E6E6E;margin-top:2px}
.tc{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0}
.tc-btn{padding:5px 10px;border-radius:14px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.tc-btn.on{background:#C23B22;color:#fff;border-color:#C23B22}
.pn{background:#fff;border-radius:12px;padding:14px;margin:8px 0;border:1px solid #e0d5c8}
.pn-h{font-size:14px;color:#2A2A2A;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #f0e8d8}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:8px}
.si{background:#F5F0E6;border-radius:8px;padding:10px;text-align:center}.si .v{font-size:20px;font-weight:700;color:#2A2A2A}.si .l{font-size:9px;color:#6E6E6E}
.tbl{width:100%;border-collapse:collapse;font-size:10px}.tbl th{background:#F5F0E6;color:#2A2A2A;padding:5px 4px;text-align:left;font-size:9px;font-weight:600;border-bottom:2px solid #C23B22}.tbl td{padding:5px 4px;border-bottom:1px solid #f0e8d8;font-size:9px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}.dr{background:#C23B22}.da{background:#B8860B}.dg{background:#3D7A4F}
.tg{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600}.tgr{background:rgba(194,59,34,0.12);color:#C23B22}.tga{background:rgba(184,134,11,0.12);color:#B8860B}.tgg{background:rgba(61,122,79,0.12);color:#3D7A4F}
.pbar{height:6px;background:#f0e8d8;border-radius:3px;overflow:hidden;flex:1}.pfill{height:100%;background:#C23B22}
.bl{border-left:3px solid #C23B22}.emp{text-align:center;padding:20px;color:#6E6E6E;font-size:12px}
@media(max-width:480px){body{font-size:14px}}
</style>
<script src="sri-track.js"></script>
<script src="sri-api.js"></script>
</head>
<body>

<h1 style="font-size:1.5em;color:var(--sri-red,#C23B22);padding:12px 16px 0;text-align:center">驾驶舱(清理版)</h1>


<div class="lo" id="gt"><div class="lb">
<div style="font-size:32px;margin-bottom:8px">🔐</div>
<h2>驾驶舱 · 授权访问</h2><p>请输入6位数字密码</p>
<div class="ld">
<input type="password" maxlength="1" id="g0"><input type="password" maxlength="1" id="g1">
<input type="password" maxlength="1" id="g2"><input type="password" maxlength="1" id="g3">
<input type="password" maxlength="1" id="g4"><input type="password" maxlength="1" id="g5">
</div>
<p id="ge" style="color:#C23B22;font-size:12px;min-height:18px"></p>
<button class="gbtn" onclick="gv()">验证 →</button>
</div></div>

<div class="hid" id="app" style="max-width:1100px;margin:0 auto;padding:4px 14px 40px">
<div class="tb">
<span style="font-weight:700;color:#2A2A2A;font-size:15px">📊 驾驶舱</span>
<input class="ts" id="gs" placeholder="🔍 全局搜索" oninput="sch()">
<span style="font-size:11px;color:#6E6E6E;white-space:nowrap" id="cd">夏至 <b style="color:#C23B22;font-size:15px">—</b></span>
<a href="index.html" style="font-size:11px;color:#B8860B;text-decoration:none">← 首页</a>
</div>
<div class="kv" id="kpi"></div>
<div class="tc" id="tabs"></div>
<div id="mc"></div>
</div>

<script>
// ===== GATE =====
var GH='123654';
(function(){
  if(localStorage.getItem('dash_ok')==='1'){init();return}
  document.getElementById('g0').focus();
  document.addEventListener('input',function(e){if(!e.target.closest('.ld'))return;e.target.value=e.target.value.replace(/[^0-9]/g,'');if(e.target.value&&e.target.nextElementSibling)e.target.nextElementSibling.focus()});
  document.addEventListener('keydown',function(e){if(!e.target.closest('.ld'))return;if(e.key==='Backspace'&&!e.target.value&&e.target.previousElementSibling)e.target.previousElementSibling.focus()});
})();
function gv(){var c='';for(var i=0;i<6;i++){var v=document.getElementById('g'+i).value;if(!v){document.getElementById('ge').textContent='请输入完整6位密码';return}c+=v}if(c===GH){localStorage.setItem('dash_ok','1');init()}else{document.getElementById('ge').textContent='密码错误'}}

// ===== INIT =====
function init(){
  document.getElementById('gt').style.display='none';
  document.getElementById('app').classList.remove('hid');
  renderAll();
}

// ===== DATA =====
function dg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d||[]}catch(e){return d||[]}}
var DB={
  ts:function(){return dg('dash_tasks')},
  cs:function(){return dg('dash_customers')},
  pr:function(){return dg('dash_products')},
  qu:function(){return dg('dash_quality')},
  gr:function(){return dg('dash_growth')},
  seed:function(){
    if(!this.qu().length)localStorage.setItem('dash_quality',JSON.stringify([{qm_id:'QM-001',standard:'L0提案审核',status:'待执行',priority:'P0'},{qm_id:'QM-002',standard:'L1方法论审核',status:'55%',priority:'P0'},{qm_id:'QM-009',standard:'四关通过率>=80%',status:'96%',priority:'P0'},{qm_id:'QM-026',standard:'商标注册',status:'未申请',priority:'P0'}]));
    if(!this.gr().length)localStorage.setItem('dash_growth',JSON.stringify([{m:'飞轮循环',c:0,t:100},{m:'线上产品',c:233,t:250},{m:'活跃客户30d',c:0,t:10}]));
  }
};

var MLS=[{n:'产品命名体系',d:'05-28',s:'完成'},{n:'233产品上线',d:'05-28',s:'完成'},{n:'产品标准体系',d:'05-28',s:'完成'},{n:'驾驶舱中枢',d:'05-29',s:'完成'},{n:'增长飞轮引擎',d:'05-28',s:'完成'},{n:'密码门控体系',d:'05-28',s:'完成'},{n:'来源标注补齐',d:'06-07',s:'进行中'},{n:'产品星级评定',d:'06-14',s:'待开始'},{n:'夏至路演准备',d:'06-21',s:'进行中'}];

var TAB=[{id:'overview',label:'🏠 概览'},{id:'tasks',label:'📋 任务'},{id:'project',label:'🗓️ 项目'},{id:'customers',label:'👤 客户'},{id:'products',label:'📦 产品'},{id:'quality',label:'✅ 质量'},{id:'finance',label:'💰 财务'},{id:'growth',label:'📈 增长'},{id:'system',label:'⚡ 系统'},{id:'avatars',label:'🎭 替身'},{id:'glossary',label:'📖 术语'}];
var CT='overview';

// ===== RENDER =====
function renderAll(){
  DB.seed();
  var d=Math.ceil((new Date(2026,5,21)-new Date())/86400000);
  document.getElementById('cd').innerHTML='夏至 <b>'+d+'天</b>';
  renderTabs();renderKPI();renderMC();
}
function renderTabs(){
  var h='';TAB.forEach(function(t){h+='<button class="tc-btn'+(CT===t.id?' on':'')+'" onclick="switchTab(\''+t.id+'\',this)">'+t.label+'</button>'});
  document.getElementById('tabs').innerHTML=h;
}
function switchTab(id,btn){CT=id;document.querySelectorAll('.tc-btn').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');renderKPI();renderMC()}
function renderKPI(){
  var ts=DB.ts(),dn=ts.filter(function(t){return(t.status||'').indexOf('完成')>=0}).length;
  var p0=ts.filter(function(t){return(t.priority||'').indexOf('P0')>=0&&(t.status||'').indexOf('完成')<0}).length;
  var h='<div class="ki" onclick="switchTab(\'tasks\',this)"><div class="v">'+ts.length+'</div><div class="l">📋 任务</div></div>';
  h+='<div class="ki" onclick="switchTab(\'tasks\',this)"><div class="v" style="color:'+(p0>0?'#C23B22':'#3D7A4F')+'">'+p0+'</div><div class="l">🔴 P0</div></div>';
  h+='<div class="ki" onclick="switchTab(\'customers\',this)"><div class="v">'+DB.cs().length+'</div><div class="l">👤 客户</div></div>';
  h+='<div class="ki" onclick="switchTab(\'products\',this)"><div class="v">'+DB.pr().length+'</div><div class="l">📦 产品</div></div>';
  h+='<div class="ki" onclick="switchTab(\'quality\',this)"><div class="v">'+DB.qu().length+'</div><div class="l">✅ 质量</div></div>';
  h+='<div class="ki"><div class="v">233</div><div class="l">🌐 线上</div></div>';
  h+='<div class="ki"><div class="v">12</div><div class="l">⚡ Cron</div></div>';
  h+='<div class="ki" onclick="switchTab(\'avatars\',this)"><div class="v">23</div><div class="l">🎭 替身</div></div>';
  document.getElementById('kpi').innerHTML=h;
}
function sch(){renderMC()}
function renderMC(){
  var h='',ts=DB.ts(),d=Math.ceil((new Date(2026,5,21)-new Date())/86400000);
  var dn=ts.filter(function(t){return(t.status||'').indexOf('完成')>=0}).length;
  var p0=ts.filter(function(t){return(t.priority||'').indexOf('P0')>=0&&(t.status||'').indexOf('完成')<0});
  var q=(document.getElementById('gs').value||'').trim().toLowerCase();
  
  if(q){h+=searchResults(q);}
  else if(CT==='overview'){
    h+='<div class="pn"><div class="pn-h">📊 概览 · 夏至 <b style="color:#C23B22;font-size:16px">'+d+'天</b></div>';
    h+='<div class="sg"><div class="si"><div class="v">'+(ts.length>0?Math.round(dn/ts.length*100):0)+'%</div><div class="l">完成率</div></div>';
    h+='<div class="si"><div class="v" style="color:'+(p0.length>0?'#C23B22':'#3D7A4F')+'">'+p0.length+'</div><div class="l">🔴 P0</div></div>';
    h+='<div class="si"><div class="v">233</div><div class="l">线上产品</div></div><div class="si"><div class="v">12</div><div class="l">Cron健康</div></div><div class="si"><div class="v">23</div><div class="l">替身就绪</div></div></div></div>';
    if(p0.length>0){h+='<div class="pn bl"><div class="pn-h" style="color:#C23B22">🔴 P0 待办 ('+p0.length+')</div>';p0.slice(0,8).forEach(function(t){h+='<div style="padding:4px 0;font-size:11px;border-bottom:1px solid #f0e8d8">'+t.task+'</div>'});h+='</div>'}
    var md=MLS.filter(function(m){return m.s==='完成'}).length;
    h+='<div class="pn"><div class="pn-h">🎯 里程碑 ('+md+'/'+MLS.length+')</div><div style="display:flex;align-items:center;gap:8px;font-size:10px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'%</span></div>';
    MLS.filter(function(m){return m.s!=='完成'}).forEach(function(m){h+='<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px solid #f0e8d8"><span>'+m.n+'</span><span><span class="tg '+(m.s==='进行中'?'tga':'tgr')+'">'+m.s+'</span> '+m.d+'</span></div>'});h+='</div>';
  }else if(CT==='tasks'){
    h+='<div class="pn"><div class="pn-h">📋 任务 ('+ts.length+')</div>';
    if(ts.length===0)h+='<div class="emp">暂无任务</div>';else{h+='<table class="tbl"><tr><th>任务</th><th>优先级</th><th>状态</th></tr>';ts.forEach(function(t){h+='<tr><td>'+t.task+'</td><td>'+t.priority+'</td><td><span class="dot '+(t.status.indexOf('完成')>=0?'dg':t.status.indexOf('进行')>=0?'da':'dr')+'"></span>'+t.status+'</td></tr>'});h+='</table>'}h+='</div>';
  }else if(CT==='project'){
    var md=MLS.filter(function(m){return m.s==='完成'}).length;
    h+='<div class="pn"><div class="pn-h">🗓️ 项目 · 里程碑</div><div style="display:flex;align-items:center;gap:8px;font-size:10px;margin-bottom:8px"><div class="pbar"><div class="pfill" style="width:'+Math.round(md/MLS.length*100)+'%"></div></div><span>'+Math.round(md/MLS.length*100)+'% ('+md+'/'+MLS.length+')</span></div>';
    h+='<table class="tbl"><tr><th>里程碑</th><th>截止</th><th>状态</th></tr>'+MLS.map(function(m){return'<tr><td>'+m.n+'</td><td>'+m.d+'</td><td><span class="tg '+(m.s==='完成'?'tgg':m.s==='进行中'?'tga':'tgr')+'">'+m.s+'</span></td></tr>'}).join('')+'</table></div>';
  }else if(CT==='customers'){var cs=DB.cs();h+='<div class="pn"><div class="pn-h">👤 客户 ('+cs.length+')</div>';if(cs.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>姓名</th><th>企业</th></tr>'+cs.map(function(c){return'<tr><td>'+c.name+'</td><td>'+(c.company||'')+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='products'){var pr=DB.pr();h+='<div class="pn"><div class="pn-h">📦 产品 ('+pr.length+')</div>';if(pr.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>名称</th><th>五族</th></tr>'+pr.map(function(p){return'<tr><td>'+p.name+'</td><td>'+(p.family||'')+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='quality'){var qu=DB.qu();h+='<div class="pn"><div class="pn-h">✅ 质量标准 ('+qu.length+')</div>';if(qu.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>编号</th><th>标准</th><th>状态</th></tr>'+qu.map(function(q){return'<tr><td>'+q.qm_id+'</td><td>'+q.standard+'</td><td>'+q.status+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='finance'){h+='<div class="pn"><div class="pn-h">💰 财务</div><div class="sg"><div class="si"><div class="v">~¥0</div><div class="l">月成本</div></div><div class="si"><div class="v">¥10-30K</div><div class="l">里程碑</div></div></div><table class="tbl" style="margin-top:8px"><tr><th>项目</th><th>年成本</th></tr><tr><td>GitHub Pages</td><td>¥0</td></tr><tr><td>商标注册</td><td>~¥3K</td></tr><tr><td>飞书认证</td><td>¥300</td></tr></table></div>'}
  else if(CT==='growth'){var g=DB.gr();h+='<div class="pn"><div class="pn-h">📈 增长</div>';if(g.length===0)h+='<div class="emp">暂无</div>';else{h+='<table class="tbl"><tr><th>指标</th><th>当前</th><th>目标</th></tr>'+g.map(function(x){return'<tr><td>'+x.m+'</td><td><b>'+x.c+'</b></td><td>'+x.t+'</td></tr>'}).join('')+'</table>'}h+='</div>'}
  else if(CT==='system'){h+='<div class="pn"><div class="pn-h">⚡ 系统</div><div class="sg"><div class="si"><div class="v">12</div><div class="l">Cron</div></div><div class="si"><div class="v">6</div><div class="l">脚本</div></div><div class="si"><div class="v">233</div><div class="l">线上</div></div></div><table class="tbl" style="margin-top:8px"><tr><th>cron任务</th></tr><tr><td>06:00 日起课</td></tr><tr><td>每2h Token压缩</td></tr><tr><td>22:00 日毕课</td></tr><tr><td>23:00 飞书同步</td></tr></table></div>'}
  else if(CT==='avatars'){h+='<div class="pn"><div class="pn-h">🎭 替身</div><table class="tbl"><tr><th>名称</th><th>维度</th></tr><tr><td>🪨 刘禹锡</td><td>土·时间轴</td></tr><tr><td>🪙 司马贺</td><td>金·可行域</td></tr><tr><td>💧 水月观音</td><td>水·身心流</td></tr><tr><td>🪵 孔子</td><td>木·信义观</td></tr><tr><td>🔥 六祖慧能</td><td>火·直觉阈</td></tr></table></div>'}
  else if(CT==='glossary'){h+='<div class="pn"><div class="pn-h">📖 术语</div><table class="tbl"><tr><th>概念</th><th>术语</th></tr><tr><td>产品体系</td><td>章·衡·镜·契·觉</td></tr><tr><td>品牌名</td><td>满意解研究所</td></tr><tr><td>决策框架</td><td>五维决策</td></tr><tr><td>核心理论</td><td>满意解</td></tr></table></div>'}
  document.getElementById('mc').innerHTML=h;
}

function searchResults(q){
  var h='<div class="pn"><div class="pn-h">🔍 搜索: <b>'+q+'</b></div>',rs=[];
  (DB.ts()||[]).filter(function(t){return(t.task||'').indexOf(q)>=0}).forEach(function(t){rs.push({ty:'📋',tx:t.task+' ['+t.priority+']',tb:'tasks'})});
  (DB.cs()||[]).filter(function(c){return(c.name||'').indexOf(q)>=0}).forEach(function(c){rs.push({ty:'👤',tx:c.name,tb:'customers'})});
  (DB.pr()||[]).filter(function(p){return(p.name||'').indexOf(q)>=0}).forEach(function(p){rs.push({ty:'📦',tx:p.name,tb:'products'})});
  MLS.filter(function(m){return m.n.indexOf(q)>=0}).forEach(function(m){rs.push({ty:'🎯',tx:m.n+' '+m.s,tb:'overview'})});
  if(rs.length===0)h+='<div class="emp">未找到匹配</div>';
  else rs.forEach(function(r){h+='<div onclick="CT=\''+r.tb+'\';renderTabs();renderMC()" style="padding:6px 10px;border-bottom:1px solid #f0e8d8;cursor:pointer;font-size:11px"><span style="font-size:10px;opacity:0.5">'+r.ty+'</span> <b>'+r.tx+'</b></div>'});
  return h+'</div>';
}
</script>
<p style="text-align:center;font-size:10px;opacity:0.35;padding:4px;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</p>

<div style="max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px">
  <div id="fbQ" style="color:#4A4A4A;font-weight:600;margin-bottom:10px">这个页面对你有用吗？</div>
  <div id="fbBtns" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px">
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'up');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">👍 有用</button>
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'text');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">💬 有建议</button>
