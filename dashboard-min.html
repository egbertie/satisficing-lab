<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱最小验证版</title>
<link rel="stylesheet" href="vi_quick_ref.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#F5F0E6;color:#4A4A4A;min-height:100vh;padding:20px}
.gate{position:fixed;top:0;left:0;width:100%;height:100%;background:#F5F0E6;z-index:9999;display:flex;align-items:center;justify-content:center}
.gb{background:#fff;border-radius:20px;padding:36px 28px;max-width:360px;width:90%;text-align:center;border:2px solid #C23B22}
.gb input{width:42px;height:52px;border:2px solid #D4C5A0;border-radius:10px;text-align:center;font-size:22px;font-weight:700;font-family:monospace;background:#F5F0E6}
.gd{display:flex;gap:6px;justify-content:center;margin:12px 0}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#C23B22;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.app{display:none;max-width:600px;margin:0 auto}
.tab{display:flex;gap:4px;margin:10px 0}
.tab button{padding:8px 16px;border-radius:16px;border:1px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px}
.tab button.on{background:#C23B22;color:#fff;border-color:#C23B22}
.panel{background:#fff;border-radius:12px;padding:16px;margin:8px 0;border:1px solid #e0d5c8}
</style>
</head>
<body>
<a href="index.html" style="display:inline-block;padding:6px 14px;margin:8px 0 0 12px;font-size:12px;color:#C23B22;text-decoration:none;border:1px solid #C23B22;border-radius:6px">← 返回首页</a>

<h1 style="font-size:1.5em;padding:16px">dashboard-min</h1>

<div class="gate" id="gate">
<div class="gb">
<h2 style="font-size:18px;color:#2A2A2A;margin-bottom:8px">驾驶舱 · 最小验证</h2>
<p style="font-size:12px;color:#6E6E6E;margin-bottom:14px">输入密码 123654</p>
<div class="gd">
<input type="password" maxlength="1" id="g0"><input type="password" maxlength="1" id="g1">
<input type="password" maxlength="1" id="g2"><input type="password" maxlength="1" id="g3">
<input type="password" maxlength="1" id="g4"><input type="password" maxlength="1" id="g5">
</div>
<p id="ge" style="color:#C23B22;font-size:12px;min-height:18px"></p>
<button class="btn" onclick="gv()">验证</button>
</div></div>

<div class="app" id="app">
<h1 style="font-size:20px;color:#2A2A2A">📊 驾驶舱 · 最小验证版</h1>
<p style="color:#6E6E6E;font-size:12px;margin:8px 0" id="diag">诊断信息...</p>

<div class="tab">
<button class="on" onclick="st('a')">Tab A</button>
<button onclick="st('b')">Tab B</button>
<button onclick="st('c')">Tab C</button>
</div>

<div class="panel" id="content" style="min-height:200px">
<p>点击上方tab或切换试试</p>
</div>

<hr style="margin:16px 0;border-color:#e0d5c8">
<h3 style="font-size:14px;color:#2A2A2A">🔧 localStorage测试</h3>
<div class="panel">
<p style="font-size:12px;margin:4px 0"><b>localStorage 可写:</b> <span id="lsWrite" style="color:#C23B22">测试中...</span></p>
<p style="font-size:12px;margin:4px 0"><b>localStorage 可读:</b> <span id="lsRead" style="color:#C23B22">测试中...</span></p>
<p style="font-size:12px;margin:4px 0"><b>密码验证状态:</b> <span id="authStatus" style="color:#C23B22">测试中...</span></p>
<p style="font-size:12px;margin:4px 0"><b>JS引擎:</b> <span id="jsEng" style="color:#3D7A4F">✅ 正在运行</span></p>
<p style="font-size:12px;margin:4px 0"><b>页面加载时间:</b> <span id="loadTime">—</span></p>
</div>
</div>

<script>
// 诊断记录
var diag = [];
function log(msg) { diag.push(new Date().toLocaleTimeString() + ' ' + msg); document.getElementById('diag').textContent = diag.join(' | '); }

log('JS引擎启动');

// localStorage 测试
try { localStorage.setItem('_dash_test_', 'ok'); document.getElementById('lsWrite').textContent = '✅ 可写'; log('LS写入OK'); }
catch(e) { document.getElementById('lsWrite').textContent = '❌ 不可写: '+e.message; log('LS写入FAIL'); }

try { var v = localStorage.getItem('_dash_test_'); document.getElementById('lsRead').textContent = v==='ok'?'✅ 可读':'❌ 值不匹配'; log('LS读取: '+v); }
catch(e) { document.getElementById('lsRead').textContent = '❌ 不可读'; log('LS读取FAIL'); }

document.getElementById('loadTime').textContent = new Date().toLocaleTimeString();

// 密码逻辑
var GH = '6460662e217c7a9f899208dd70a2c28abdea42f128666a9b78e6c0c064846493';
(function() {
  var cur = localStorage.getItem('sri_dash_hash') || GH;
  var sv = localStorage.getItem('sri_dash_auth_hash');
  if (localStorage.getItem('sri_dashboard_auth') === 'true' && sv === cur) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('authStatus').textContent = '✅ 已验证（免登）';
    openApp();
    return;
  }
  document.getElementById('authStatus').textContent = '⏳ 未验证';
  document.getElementById('g0').focus();

  // 键盘导航
  document.addEventListener('input', function(e) {
    if (!e.target.closest('.gd')) return;
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value && e.target.nextElementSibling && e.target.nextElementSibling.tagName === 'INPUT')
      e.target.nextElementSibling.focus();
  });
  document.addEventListener('keydown', function(e) {
    if (!e.target.closest('.gd')) return;
    if (e.key === 'Backspace' && !e.target.value && e.target.previousElementSibling && e.target.previousElementSibling.tagName === 'INPUT')
      e.target.previousElementSibling.focus();
  });

  window.gv = async function() {
    var c = '';
    for (var i = 0; i < 6; i++) {
      var v = document.getElementById('g' + i).value;
      if (!v) { document.getElementById('ge').textContent = '请输入完整6位密码'; return; }
      c += v;
    }
    var h = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(c))))
      .map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    if (h === cur) {
      localStorage.setItem('sri_dashboard_auth', 'true');
      localStorage.setItem('sri_dash_auth_hash', cur);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('authStatus').textContent = '✅ 刚刚验证通过';
      openApp();
    } else {
      document.getElementById('ge').textContent = '密码错误';
    }
  };
})();

// Tab切换
function st(id) {
  log('Tab切换: ' + id);
  var btns = document.querySelectorAll('.tab button');
  btns.forEach(function(b) { b.classList.remove('on'); });
  // 找对应按钮
  var map = { a: 0, b: 1, c: 2 };
  if (btns[map[id]]) btns[map[id]].classList.add('on');
  document.getElementById('content').innerHTML = '<h3 style="font-size:15px;color:#2A2A2A">✅ Tab ' + id.toUpperCase() + ' 已切换</h3><p style="font-size:12px;color:#6E6E6E;margin-top:8px">时间戳: ' + new Date().toLocaleTimeString() + '</p><p style="font-size:12px;color:#C23B22;margin-top:4px">切换成功！JS和DOM都正常工作。</p>';
}

// 打开应用
function openApp() {
  log('App开启');
  document.getElementById('app').style.display = 'block';
}
</script>
</body>
</html>
