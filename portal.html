<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>满意红</title>
<style>
:root {
  --bg: #F5F0E6;
  --ink: #4A3728;
  --ink-light: #8B7355;
  --ink-lighter: #B8A898;
  --accent-red: #C23B22;
  --accent-gold: #B8860B;
  --border: #E0D5C0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; align-items:center; justify-content:center;
}
#gate {
  display:flex; flex-direction:column; align-items:center;
  padding:40px 20px;
}
#gate .logo {
  width:88px; height:88px; background:var(--accent-red);
  color:#fff; border-radius:20px; display:flex;
  align-items:center; justify-content:center;
  font-size:44px; font-weight:700; margin-bottom:20px;
  box-shadow: 0 4px 24px rgba(194,59,34,0.25);
}
#gate h1 { font-size:1.6em; margin-bottom:4px; }
#gate .subtitle { color:var(--ink-light); font-size:0.9em; margin-bottom:28px; }
#gate input {
  width:260px; padding:12px 16px; border:1px solid var(--border);
  border-radius:8px; background:#fff; color:var(--ink);
  font-size:1em; outline:none; text-align:center;
  margin-bottom:14px; transition:border 0.2s;
}
#gate input:focus { border-color:var(--accent-gold); }
#gate button {
  padding:10px 40px; background:var(--accent-red); color:#fff;
  border:none; border-radius:8px; font-size:1em; cursor:pointer;
  font-weight:500; transition:opacity 0.2s;
}
#gate button:hover { opacity:0.85; }
#gate .hint { color:var(--ink-lighter); font-size:0.8em; margin-top:14px; }
</style>
</head>
<body>

<div id="gate">
  <div class="logo">红</div>
  <h1>满意红</h1>
  <p class="subtitle">知识体系</p>
  <input type="password" id="pw" placeholder="输入通行码" autofocus
    onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">进入</button>
  <p class="hint">请输入通行码以继续</p>
</div>

<script>
var PASS = '123654';
(function(){
  var saved = localStorage.getItem('portal_unlocked');
  if (saved && (Date.now() - parseInt(saved) < 86400000)) {
    window.location.href = 'dashboard-v3.html';
  }
})();
function unlock() {
  if (document.getElementById('pw').value === PASS) {
    localStorage.setItem('portal_unlocked', Date.now());
    window.location.href = 'dashboard-v3.html';
  } else {
    var inp = document.getElementById('pw');
    inp.value = ''; inp.style.borderColor = 'var(--accent-red)';
    inp.placeholder = '通行码错误';
    setTimeout(function(){ inp.style.borderColor = ''; inp.placeholder = '输入通行码'; }, 1500);
  }
}
</script>
</body>
</html>
