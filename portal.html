<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>满意解研究所</title>
<style>
:root {
  --bg: #F5F0E6;
  --ink: #4A3728;
  --ink-light: #8B7355;
  --ink-lighter: #B8A898;
  --accent-red: #C23B22;
  --accent-gold: #B8860B;
  --border: #E0D5C0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
#gate {
  display:flex; flex-direction:column; align-items:center;
  padding:32px 20px; max-width:320px; width:100%;
}
#gate .logo {
  width:88px; height:88px; background:var(--accent-red);
  color:#fff; border-radius:20px; display:flex;
  align-items:center; justify-content:center;
  font-size:44px; font-weight:700; margin-bottom:20px;
  box-shadow: 0 4px 24px rgba(194,59,34,0.25);
}
#gate h1 { font-size:1.6em; margin-bottom:4px; }
#gate .subtitle { color:var(--ink-light); font-size:0.9em; margin-bottom:28px; }
#gate input {
  width:100%; padding:12px 16px; border:1px solid var(--border);
  border-radius:8px; background:#fff; color:var(--ink);
  font-size:1em; outline:none; text-align:center; -webkit-appearance:none;
  margin-bottom:14px; transition:border 0.2s;
}
#gate input:focus { border-color:var(--accent-gold); }
#gate button {
  width:100%; padding:12px; background:var(--accent-red); color:#fff;
  border:none; border-radius:8px; font-size:1em; cursor:pointer;
  font-weight:500; transition:opacity 0.2s; -webkit-appearance:none;
}
#gate button:active { opacity:0.8; }
#gate .hint { color:var(--ink-lighter); font-size:0.8em; margin-top:14px; }
#gate .notice {
  margin-top:24px; padding:10px 14px; background:rgba(184,134,11,0.08);
  border:1px solid rgba(184,134,11,0.2); border-radius:6px;
  font-size:0.72em; color:var(--ink-light); text-align:center; line-height:1.5;
}
@media(max-width:480px){body{font-size:14px}}
</style>
</head>
<body>
<a href="index.html" style="display:inline-block;padding:6px 14px;margin:8px 0 0 12px;font-size:12px;color:#C23B22;text-decoration:none;border:1px solid #C23B22;border-radius:6px">← 返回首页</a>


<div id="gate">
  <div class="logo">红</div>
  <h1>满意解研究所</h1>
  <p class="subtitle">知识体系</p>
  <input type="password" id="pw" placeholder="输入通行码" inputmode="numeric" autofocus
    onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">进入</button>
  <p class="hint">请输入通行码以继续</p>
  <div class="notice">首次加载约需3-5秒<br>需等待 GitHub Pages 渲染</div>
</div>

<script>
var DASHBOARD = 'https://htmlpreview.github.io/?https://raw.githubusercontent.com/egbertie/satisficing-lab/main/dashboard-v3.html';

(function(){
  // 24小时内访问过，直接跳过
  if (localStorage.getItem('portal_visited') &&
      Date.now() - parseInt(localStorage.getItem('portal_visited')) < 86400000) {
    window.location.href = DASHBOARD;
  }
})();

function unlock() {
  localStorage.setItem('portal_visited', Date.now());
  window.location.href = DASHBOARD;
}
</script>

<div style="text-align:center;padding:8px 0;font-size:10px;opacity:0.25;letter-spacing:1px">火承土印·鼎玉契晋·三脉两翼·五维相生</div>

<div style="max-width:600px;margin:24px auto;padding:0 16px;text-align:center;font-size:13px;border-top:1px solid #D4C5A0;padding-top:20px">
  <div id="fbQ" style="color:#4A4A4A;font-weight:600;margin-bottom:10px">这个页面对你有用吗？</div>
  <div id="fbBtns" style="display:flex;gap:8px;justify-content:center;margin-bottom:6px">
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'up');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">👍 有用</button>
    <button onclick="(function(){var k='fb_'+location.pathname.split('/').pop();localStorage.setItem(k,'text');document.getElementById('fbBtns').style.display='none';document.getElementById('fbQ').textContent='感谢反馈！'})()" style="padding:8px 18px;border-radius:20px;border:1.5px solid #D4C5A0;background:#fff;cursor:pointer;font-size:13px">💬 有建议</button>
  </div>
</div>

</body>
</html>
